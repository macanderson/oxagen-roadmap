<title>Sixty Seconds to Governed</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Oxagen Mission Control — W1 "Sixty seconds to governed"
   House system: /Projects/oxagen-house-brand/tokens/house-tokens.css
   Dark-first. Gold is identity and never encodes a state.
   ============================================================ */

/* --- tokens: full dark palette on bare :root ---------------- */
:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C;
  --border:#292722; --rule:#34322D;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A;
  --accent-text:#D6962C;
  --gold-ink:#10100F;                 /* text sitting on gold */
  --gold-wash:rgba(214,150,44,.10);
  --gold-edge:rgba(214,150,44,.34);

  /* semantic state colours — separate from gold, consistent everywhere */
  --s-allow:#5FA37A;   --s-allow-w:rgba(95,163,122,.13);
  --s-approve:#5B8DBE; --s-approve-w:rgba(91,141,190,.14);
  --s-deny:#B4695C;    --s-deny-w:rgba(180,105,92,.14);
  --s-proven:#4C9E97;  --s-proven-w:rgba(76,158,151,.14);
  --s-fail:#C0483A;    --s-fail-w:rgba(192,72,58,.14);
  --s-crit:#D8453A;    --s-crit-w:rgba(216,69,58,.16);

  --skel:rgba(242,238,229,.055);
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 18px 44px rgba(0,0,0,.5);
  --shadow-sm:0 1px 0 rgba(255,255,255,.02), 0 6px 18px rgba(0,0,0,.35);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --r-lg:14px; --r-md:12px; --r-sm:10px; --r-xs:6px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
    --border:#D8CDBD; --rule:#C9BFAE;
    --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
    --accent-text:#8B5E1A;
    --gold-wash:rgba(139,94,26,.09); --gold-edge:rgba(139,94,26,.30);
    --s-allow:#33714D;   --s-allow-w:rgba(51,113,77,.11);
    --s-approve:#2E5C88; --s-approve-w:rgba(46,92,136,.11);
    --s-deny:#9C4B3D;    --s-deny-w:rgba(156,75,61,.11);
    --s-proven:#2F6E69;  --s-proven-w:rgba(47,110,105,.11);
    --s-fail:#9C3A2D;    --s-fail-w:rgba(156,58,45,.11);
    --s-crit:#A8352A;    --s-crit-w:rgba(168,53,42,.13);
    --skel:rgba(16,16,15,.06);
    --shadow:0 1px 0 rgba(255,255,255,.7), 0 18px 44px rgba(16,16,15,.09);
    --shadow-sm:0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(16,16,15,.07);
  }
}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
  --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A;
  --gold-wash:rgba(139,94,26,.09); --gold-edge:rgba(139,94,26,.30);
  --s-allow:#33714D;   --s-allow-w:rgba(51,113,77,.11);
  --s-approve:#2E5C88; --s-approve-w:rgba(46,92,136,.11);
  --s-deny:#9C4B3D;    --s-deny-w:rgba(156,75,61,.11);
  --s-proven:#2F6E69;  --s-proven-w:rgba(47,110,105,.11);
  --s-fail:#9C3A2D;    --s-fail-w:rgba(156,58,45,.11);
  --s-crit:#A8352A;    --s-crit-w:rgba(168,53,42,.13);
  --skel:rgba(16,16,15,.06);
  --shadow:0 1px 0 rgba(255,255,255,.7), 0 18px 44px rgba(16,16,15,.09);
  --shadow-sm:0 1px 0 rgba(255,255,255,.6), 0 6px 18px rgba(16,16,15,.07);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--fg);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; padding-block:0;
}
::selection{background:var(--gold-wash); color:var(--fg)}
:focus-visible{outline:2px solid var(--accent-text); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
}

/* --- the app frame: the container queries key off this ------ */
#frame{
  container-type:inline-size; container-name:app;
  min-height:100dvh; background:var(--ink); position:relative;
  transition:max-width .22s ease;
}
body[data-phone="1"] #frame{
  max-width:400px; margin:20px auto 96px; min-height:812px;
  border:1px solid var(--rule); border-radius:22px; overflow:hidden;
  box-shadow:var(--shadow);
}
body[data-phone="1"]{background:var(--void); padding-block:0}

/* --- primitives -------------------------------------------- */
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-text); font-weight:600; margin:0 0 10px}
.eyebrow.q{color:var(--muted)}
.mono{font-family:var(--mono); font-size:.9em; font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0; letter-spacing:-.015em; text-wrap:balance}
h1{font-size:30px; font-weight:700; line-height:1.12}
h2{font-size:21px; font-weight:600; line-height:1.2}
h3{font-size:16px; font-weight:600}
h4{font-size:13px; font-weight:600; letter-spacing:.01em}
p{margin:0; color:var(--body)}
a{color:var(--accent-text); text-decoration:none; border-bottom:1px solid transparent}
a:hover{border-bottom-color:currentColor}
hr.rule{border:0; border-top:1px solid var(--border); margin:0}
.stack{display:flex; flex-direction:column}
.row{display:flex; align-items:center}
.wrapx{flex-wrap:wrap}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}
.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}.g28{gap:28px}.g32{gap:32px}
.push{margin-left:auto}
.muted{color:var(--muted)} .dim{color:var(--dim)} .fgc{color:var(--fg)} .bodyc{color:var(--body)}
.f12{font-size:12px}.f13{font-size:13px}.f14{font-size:14px}.f16{font-size:16px}.f18{font-size:18px}
.w500{font-weight:500}.w600{font-weight:600}.w700{font-weight:700}
.lead{font-size:16px; line-height:1.55; color:var(--body); max-width:62ch}
.cap{font-size:12.5px; color:var(--muted); line-height:1.5}
.ctr{text-align:center}

.panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-lg)}
.panel.flat{background:transparent}
.pad{padding:20px 22px}
.pad-s{padding:14px 16px}
.logo{height:19px; width:auto; display:block; color:var(--fg)}
.logo.sm{height:16px}
.logo.lg{height:26px}

/* --- buttons ------------------------------------------------ */
.btn{
  font-family:inherit; font-size:13.5px; font-weight:500; letter-spacing:.005em;
  padding:9px 15px; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--hl); color:var(--fg); cursor:pointer; display:inline-flex;
  align-items:center; justify-content:center; gap:8px; line-height:1.3;
  transition:background .13s ease, border-color .13s ease, color .13s ease;
  text-align:center; white-space:nowrap;
}
.btn:hover{background:var(--panel); border-color:var(--rule)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--hl)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:var(--gold-ink); font-weight:600}
.btn.gold:hover{background:var(--gold-bright); border-color:var(--gold-bright)}
.btn.wide{width:100%}
.btn.sm{font-size:12.5px; padding:6px 11px; border-radius:var(--r-xs)}
.btn.lg{font-size:14.5px; padding:12px 20px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.42; cursor:not-allowed}
.btn.danger{color:var(--s-fail); border-color:var(--s-fail)}
.btn.danger:hover{background:var(--s-fail-w)}
.linkbtn{background:none; border:0; padding:0; font:inherit; color:var(--accent-text); cursor:pointer; border-bottom:1px solid transparent}
.linkbtn:hover{border-bottom-color:currentColor}
.linkbtn.q{color:var(--muted)}

/* --- form --------------------------------------------------- */
.field{display:flex; flex-direction:column; gap:6px}
label.lab{font-size:12.5px; font-weight:500; color:var(--muted); letter-spacing:.01em}
.input{
  font-family:inherit; font-size:14.5px; color:var(--fg); background:var(--ink);
  border:1px solid var(--border); border-radius:var(--r-sm); padding:10px 12px; width:100%;
  transition:border-color .13s ease, background .13s ease;
}
.input::placeholder{color:var(--dim)}
.input:focus{border-color:var(--accent-text); outline:none; background:var(--hl)}
.input.err{border-color:var(--s-fail)}
.input.mono{font-family:var(--mono); font-size:13.5px}
textarea.input{resize:vertical; min-height:88px; line-height:1.5}
.hint{font-size:12px; color:var(--dim); line-height:1.45}
.errline{font-size:12.5px; color:var(--s-fail); display:flex; gap:6px; align-items:flex-start; line-height:1.45}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:62px}
.pw-toggle{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; padding:4px 6px; border-radius:4px}
.pw-toggle:hover{color:var(--fg); background:var(--hl)}
.meter{display:flex; gap:4px; margin-top:2px}
.meter i{height:3px; flex:1; background:var(--skel); border-radius:2px}
.meter i.on{background:var(--s-allow)}
.reqs{display:grid; gap:3px; margin-top:2px}
.reqs span{font-size:11.5px; color:var(--dim); display:flex; gap:6px; align-items:center}
.reqs span.ok{color:var(--s-allow)}
.codes{display:flex; gap:8px}
.codes input{
  width:46px; height:54px; text-align:center; font-family:var(--mono); font-size:21px;
  background:var(--ink); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--fg);
}
.codes input:focus{border-color:var(--accent-text); outline:none; background:var(--hl)}
.check{display:flex; gap:9px; align-items:flex-start; font-size:13px; color:var(--body); cursor:pointer}
.check input{margin:2px 0 0; accent-color:var(--gold)}

/* --- chips / badges ----------------------------------------- */
.chip{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
  font-size:11px; letter-spacing:.04em; text-transform:uppercase; font-weight:500;
  padding:3px 8px; border-radius:var(--r-xs); border:1px solid var(--border);
  color:var(--muted); background:var(--hl); white-space:nowrap;
}
.chip.allow{color:var(--s-allow); border-color:var(--s-allow); background:var(--s-allow-w)}
.chip.approve{color:var(--s-approve); border-color:var(--s-approve); background:var(--s-approve-w)}
.chip.deny{color:var(--s-deny); border-color:var(--s-deny); background:var(--s-deny-w)}
.chip.proven{color:var(--s-proven); border-color:var(--s-proven); background:var(--s-proven-w)}
.chip.fail{color:var(--s-fail); border-color:var(--s-fail); background:var(--s-fail-w)}
.chip.crit{color:var(--s-crit); border-color:var(--s-crit); background:var(--s-crit-w)}
.chip.idn{text-transform:none; letter-spacing:0; color:var(--body)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.dot.live{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}

/* --- tables -------------------------------------------------- */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:0}
th,td{text-align:left; padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
th{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{font-variant-numeric:tabular-nums; text-align:right}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--hl)}

/* --- code ---------------------------------------------------- */
pre.code{
  background:var(--ink); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:14px 16px; overflow-x:auto; font-family:var(--mono); font-size:12.5px;
  line-height:1.65; color:var(--body); margin:0;
}
pre.code .k{color:var(--accent-text)} pre.code .s{color:var(--s-proven)} pre.code .c{color:var(--dim)}
code.inl{font-family:var(--mono); font-size:.88em; background:var(--hl); padding:.1em .38em; border-radius:4px; color:var(--body)}
.copy{position:relative; min-width:0}
.copy .copybtn{position:absolute; top:8px; right:8px}
/* a scroll container only zeroes its automatic minimum as a flex/grid ITEM;
   inside a plain block its text width still propagates up and blows out the track */
.stack > *, .wp-main > *, .wp-act > *, .wp-full > *, .cols > *, .sect, .panel{min-width:0}

/* ============================================================
   AUTH SHELL
   ============================================================ */
.auth{
  min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  padding:0 20px 56px; position:relative; isolation:isolate;
}
.auth::before{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(760px 420px at 50% -6%, var(--gold-wash), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 47px, var(--border) 47px 48px),
    repeating-linear-gradient(90deg, transparent 0 47px, var(--border) 47px 48px);
  opacity:.5; mask-image:linear-gradient(180deg, #000 0%, transparent 78%);
}
.auth-top{width:100%; max-width:1180px; padding:26px 0 0; display:flex; align-items:center; gap:16px}
.auth-card{width:100%; max-width:448px; margin-top:44px}
.auth-h{margin-bottom:22px}
.auth-foot{margin-top:22px; font-size:13px; color:var(--muted); text-align:center}
.sso{display:grid; gap:9px}
.sso .btn{justify-content:flex-start; padding-left:14px}
.sso .btn svg{flex:none}
.or{display:flex; align-items:center; gap:12px; color:var(--dim); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase}
.or::before,.or::after{content:""; height:1px; background:var(--border); flex:1}
.tagstrip{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:26px}

/* ============================================================
   ONBOARDING GATE
   ============================================================ */
.gate{min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:0 20px 72px; position:relative; isolation:isolate}
.gate::before{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(900px 460px at 50% -10%, var(--gold-wash), transparent 72%);
}
.gate-in{width:100%; max-width:772px}
.steps{display:flex; gap:0; margin:30px 0 30px; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--panel)}
.steps a{
  flex:1; padding:12px 14px; display:flex; gap:10px; align-items:center;
  border-right:1px solid var(--border); color:var(--muted); font-size:13px; border-bottom:0;
  background:transparent; transition:background .13s ease;
}
.steps a:last-child{border-right:0}
.steps a:hover{background:var(--hl); border-bottom:0}
.steps a[aria-current="step"]{color:var(--fg); background:var(--hl)}
.steps a.done{color:var(--s-allow)}
.steps .sn{
  width:21px; height:21px; border-radius:50%; border:1px solid currentColor; flex:none;
  display:grid; place-items:center; font-family:var(--mono); font-size:11px;
}
.steps a[aria-current="step"] .sn{border-color:var(--gold); color:var(--gold)}
.switchwrap{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden}
.swtabs{display:grid; grid-template-columns:repeat(3,1fr); position:relative; border-bottom:1px solid var(--border)}
.swtabs button{
  font:inherit; background:transparent; border:0; border-right:1px solid var(--border); cursor:pointer;
  padding:12px 14px; display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left;
  color:var(--muted); transition:background .13s ease, color .13s ease; min-width:0;
}
.swtabs button:last-of-type{border-right:0}
.swtabs button:hover{background:var(--hl); color:var(--fg)}
.swtabs button .n{font-size:14px; font-weight:600; letter-spacing:-.01em; white-space:nowrap}
.swtabs button .s{font-size:11px; color:var(--dim); font-family:var(--mono); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:100%}
.swtabs button[aria-selected="true"]{color:var(--fg); background:var(--hl)}
.swtabs button[aria-selected="true"] .s{color:var(--accent-text)}
.swind{position:absolute; left:0; bottom:-1px; height:2px; width:calc(100%/3); background:var(--accent-text);
  transform:translateX(calc(var(--i,0) * 100%)); transition:transform .34s cubic-bezier(.4,0,.2,1); pointer-events:none}
.swview{overflow:hidden; transition:height .3s cubic-bezier(.4,0,.2,1)}
.swtrack{display:grid; grid-auto-flow:column; grid-auto-columns:100%; align-items:start;
  transition:transform .34s cubic-bezier(.4,0,.2,1)}
.wpanel{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,344px); gap:16px;
  padding:18px; align-content:start; align-items:start; min-width:0}
.wp-main{display:flex; flex-direction:column; gap:12px; min-width:0}
.wp-main h3{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.wp-act{background:var(--ink); border:1px solid var(--border); border-radius:var(--r-md);
  padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0}
.wp-full{grid-column:1/-1; display:flex; flex-direction:column; gap:10px; min-width:0}
.earn{display:grid; border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden}
.earn > div{display:flex; align-items:center; gap:10px; padding:8px 11px; border-bottom:1px solid var(--border);
  font-size:12.5px; color:var(--body); min-width:0}
.earn > div:last-child{border-bottom:0}
.earn > div > span:first-child{flex:1; min-width:0}
@media (prefers-reduced-motion: reduce){.swtrack,.swind,.swview{transition:none}}
.ostabs{display:flex; gap:4px; background:var(--ink); border:1px solid var(--border); border-radius:var(--r-xs); padding:3px}
.ostabs button{
  flex:1; font:inherit; font-size:12px; padding:5px 4px; border:0; border-radius:4px;
  background:transparent; color:var(--muted); cursor:pointer;
}
.ostabs button[aria-selected="true"]{background:var(--hl); color:var(--fg)}
.tokbox{
  font-family:var(--mono); font-size:11.5px; color:var(--body); background:var(--ink);
  border:1px dashed var(--border); border-radius:var(--r-xs); padding:8px 10px; overflow-wrap:anywhere;
}
.tokbox b{word-break:break-all}   /* only the key itself may break mid-word */

/* --- waiting log -------------------------------------------- */
.log{font-family:var(--mono); font-size:12px; line-height:1.85; color:var(--muted); display:grid; gap:0}
.log div{display:flex; gap:12px; align-items:baseline}
.log .t{color:var(--dim); flex:none}
.log div.hit{color:var(--s-allow)}
.log div.new{animation:slidein .34s ease}
@keyframes slidein{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.spin{width:13px; height:13px; border-radius:50%; border:1.5px solid var(--border); border-top-color:var(--accent-text); animation:sp .7s linear infinite; flex:none; display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.bigspin{width:22px; height:22px; border-width:2px}

/* ============================================================
   INSTALLER WINDOW (native, not the web app)
   ============================================================ */
.instwrap{min-height:100dvh; display:grid; place-items:center; padding:40px 20px 80px; background:var(--void)}
.instcol{width:100%; max-width:640px; display:flex; flex-direction:column; gap:18px}
.win{background:var(--panel); border:1px solid var(--rule); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow)}
.win-bar{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--hl)}
.win-bar .lights{display:flex; gap:6px}
.win-bar .lights i{width:10px; height:10px; border-radius:50%; background:var(--rule); display:block}
.win-bar .ttl{font-size:12.5px; color:var(--muted); margin:0 auto; padding-right:44px}
.win-body{padding:26px 26px 22px; display:flex; flex-direction:column; gap:18px}
.instep{display:flex; gap:11px; align-items:flex-start; font-size:13px; color:var(--dim)}
.instep .mark{width:16px; height:16px; flex:none; margin-top:2px; display:grid; place-items:center; font-size:11px; font-family:var(--mono)}
.instep.done{color:var(--body)} .instep.done .mark{color:var(--s-allow)}
.instep.now{color:var(--fg)}
.bar-track{height:4px; background:var(--ink); border:1px solid var(--border); border-radius:3px; overflow:hidden}
.bar-fill{height:100%; background:var(--gold); width:0; transition:width .4s ease}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:grid; grid-template-columns:242px 1fr; min-height:100dvh}
.rail{
  background:var(--void); border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding:14px 0 10px; gap:12px; position:sticky; top:0; height:100dvh; overflow-y:auto;
}
.rail-brand{padding:4px 16px 0; display:flex; align-items:center; gap:10px}
.switcher{margin:0 10px; display:grid; gap:6px}
.sw{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--border);
  border-radius:var(--r-sm); background:var(--panel); cursor:pointer; font:inherit; text-align:left; width:100%;
  color:var(--fg); transition:border-color .13s ease;
}
.sw:hover{border-color:var(--rule)}
.sw .av{width:22px; height:22px; border-radius:var(--r-xs); background:var(--hl); border:1px solid var(--border); display:grid; place-items:center; font-size:10.5px; font-weight:600; color:var(--accent-text); flex:none; font-family:var(--mono)}
.sw .tx{min-width:0; flex:1}
.sw .tx b{display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sw .tx span{display:block; font-size:11px; color:var(--dim); font-family:var(--mono)}
.sw .car{color:var(--dim); font-size:10px; flex:none}
.navsec{padding:0 10px}
.navsec > h5{margin:14px 8px 6px; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); font-weight:600}
.nav a{
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--r-sm);
  color:var(--muted); font-size:13.5px; border-bottom:0; transition:background .12s ease, color .12s ease;
}
.nav a:hover{background:var(--hl); color:var(--fg); border-bottom:0}
.nav a[aria-current="page"]{background:var(--hl); color:var(--fg); font-weight:500}
.nav a[aria-current="page"] .ic{color:var(--accent-text)}
.nav .ic{width:15px; flex:none; display:grid; place-items:center; color:var(--dim)}
.nav .tail{margin-left:auto; font-size:10.5px; font-family:var(--mono); color:var(--dim)}
.rail-foot{margin-top:auto; padding:10px 16px 2px; border-top:1px solid var(--border)}

.main{display:flex; flex-direction:column; min-width:0}
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:11px 22px; border-bottom:1px solid var(--border); background:var(--ink); min-height:53px;
}
.crumbs{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); min-width:0; overflow:hidden}
.crumbs a{color:var(--muted); white-space:nowrap}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--dim)}
.crumbs b{color:var(--fg); font-weight:500; white-space:nowrap}
.kbar{
  display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:5px 9px; color:var(--dim); font-size:12.5px; cursor:pointer;
  font-family:inherit; min-width:190px;
}
.kbar:hover{border-color:var(--rule); color:var(--muted)}
.kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--dim); background:var(--hl)}
.iconbtn{
  width:32px; height:32px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--panel);
  color:var(--muted); cursor:pointer; display:grid; place-items:center; padding:0; flex:none;
}
.iconbtn:hover{color:var(--fg); border-color:var(--rule)}
.iconbtn[aria-pressed="true"]{color:var(--accent-text); border-color:var(--gold-edge); background:var(--gold-wash)}
.avatar{width:30px; height:30px; border-radius:50%; background:var(--hl); border:1px solid var(--border); display:grid; place-items:center; font-size:11px; font-weight:600; font-family:var(--mono); color:var(--body); cursor:pointer; flex:none}

.content{padding:24px 22px 72px; min-width:0; flex:1}
.pagehead{display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap}
.pagehead .lead{max-width:58ch}
.stats{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; background:var(--border); margin-bottom:20px}
.stat{padding:13px 16px; background:var(--panel); display:flex; flex-direction:column; gap:3px; min-width:0}
.stat .k{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:600; white-space:nowrap}
.stat .v{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em; display:flex; align-items:baseline; gap:6px}
.stat .v small{font-size:11px; font-weight:400; color:var(--dim); font-family:var(--mono)}

.cols{display:grid; grid-template-columns:minmax(0,1fr) 328px; gap:18px; align-items:start}
.sect{border:1px solid var(--border); border-radius:var(--r-lg); background:var(--panel); overflow:hidden}
.sect > header{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border)}
.sect > header h3{font-size:13.5px}
.sect .empt{padding:34px 22px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center}

/* offer card — the one gold moment on Fleet */
.offer{
  border:1px solid var(--gold-edge); border-radius:var(--r-lg); padding:16px 17px;
  background:linear-gradient(var(--gold-wash),var(--gold-wash)), var(--panel);
  display:flex; flex-direction:column; gap:11px; position:relative;
}
.offer .x{position:absolute; top:9px; right:9px; background:none; border:0; color:var(--dim); cursor:pointer; font-size:15px; line-height:1; padding:4px; border-radius:4px}
.offer .x:hover{color:var(--fg); background:var(--hl)}
.offer .price{display:flex; align-items:baseline; gap:8px; padding:9px 11px; background:var(--ink); border:1px solid var(--border); border-radius:var(--r-sm)}
.offer .price b{font-size:19px; font-weight:600; font-family:var(--mono); letter-spacing:-.01em}

.banner{
  display:flex; gap:12px; align-items:flex-start; padding:12px 15px; border-radius:var(--r-md);
  border:1px solid var(--s-approve); background:var(--s-approve-w); margin-bottom:18px; font-size:13px; color:var(--body);
}
.banner .ib{color:var(--s-approve); flex:none; margin-top:1px}
.banner.warn{border-color:var(--s-deny); background:var(--s-deny-w)} .banner.warn .ib{color:var(--s-deny)}

.skel{background:var(--skel); border-radius:5px; height:11px; display:block; animation:sh 1.5s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:1}50%{opacity:.45}}

.statepane{display:flex; flex-direction:column; align-items:center; gap:13px; padding:56px 24px; text-align:center; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--panel)}
.statepane .glyph{width:44px; height:44px; border-radius:var(--r-md); display:grid; place-items:center; border:1px solid var(--border); background:var(--hl); color:var(--muted)}
.statepane.err .glyph{color:var(--s-fail); border-color:var(--s-fail); background:var(--s-fail-w)}
.statepane.den .glyph{color:var(--s-deny); border-color:var(--s-deny); background:var(--s-deny-w)}
.statepane p{max-width:52ch}

/* --- run view ------------------------------------------------ */
.coststrip{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:1px; border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; background:var(--border)}
.coststrip .c{padding:12px 15px; background:var(--panel)}
.coststrip .c .k{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); font-weight:600}
.coststrip .c .v{font-family:var(--mono); font-size:15px; font-weight:500; margin-top:3px; font-variant-numeric:tabular-nums}
.frames{font-family:var(--mono); font-size:12.5px}
.frame-row{display:grid; grid-template-columns:44px 92px 168px 1fr; gap:12px; padding:9px 16px; border-bottom:1px solid var(--border); align-items:baseline}
.frame-row:last-child{border-bottom:0}
.frame-row .sq{color:var(--dim)} .frame-row .ts{color:var(--dim)}
.frame-row .kd{color:var(--accent-text)}
.frame-row .bd{color:var(--muted); overflow-wrap:anywhere}
.frame-row.new{animation:slidein .3s ease}

/* --- dialogs -------------------------------------------------- */
.scrim{position:fixed; inset:0; background:rgba(10,10,9,.62); backdrop-filter:blur(3px); z-index:80; display:grid; place-items:start center; padding:12vh 20px 20px; animation:fade .14s ease}
body[data-phone="1"] .scrim{position:absolute; padding:60px 14px 20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{width:100%; max-width:520px; background:var(--panel); border:1px solid var(--rule); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden}
.dlg > header{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px}
.dlg .bd{padding:18px}
.dlg .ft{padding:13px 18px; border-top:1px solid var(--border); display:flex; gap:9px; justify-content:flex-end; background:var(--hl)}
.cmdlist{max-height:340px; overflow-y:auto}
.cmditem{display:flex; align-items:center; gap:11px; padding:9px 18px; cursor:pointer; font-size:13.5px; color:var(--body); border:0; background:none; width:100%; text-align:left; font-family:inherit}
.cmditem:hover,.cmditem:focus-visible{background:var(--hl); color:var(--fg)}
.cmditem .g{margin-left:auto; font-size:11px; color:var(--dim); font-family:var(--mono)}

/* --- assistant drawer ----------------------------------------- */
.drawer{
  position:fixed; top:0; right:0; height:100dvh; width:352px; background:var(--panel);
  border-left:1px solid var(--border); z-index:60; display:flex; flex-direction:column;
  box-shadow:var(--shadow); animation:slidel .2s ease;
}
body[data-phone="1"] .drawer{position:absolute; width:100%; border-left:0}
@keyframes slidel{from{transform:translateX(14px); opacity:0}to{transform:none; opacity:1}}
.drawer > header{padding:12px 15px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:9px}
.drawer .body{flex:1; overflow-y:auto; padding:16px 15px; display:flex; flex-direction:column; gap:14px}
.msg{font-size:13.5px; line-height:1.55}
.msg.a{color:var(--body)}
.msg .who{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:600; margin-bottom:5px}
.msg.u{background:var(--hl); border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 11px; color:var(--fg)}
.drawer .foot{padding:12px 15px; border-top:1px solid var(--border)}

/* --- unbuilt-page notice (mockup chrome inside the app) -------- */
.unbuilt{
  border:1px dashed var(--gold-edge); border-radius:var(--r-lg); padding:26px 24px;
  font-family:var(--mono); font-size:12.5px; color:var(--muted); line-height:1.75;
  background:repeating-linear-gradient(135deg, transparent 0 9px, var(--gold-wash) 9px 10px);
}
.unbuilt b{color:var(--accent-text); font-weight:600}

/* ============================================================
   MOCKUP CHROME — never product UI
   ============================================================ */
#chrome{
  position:fixed; right:14px; bottom:14px; z-index:200; width:264px;
  font-family:var(--mono); font-size:11.5px; color:var(--muted);
  background:var(--void); border:1px dashed var(--gold-edge); border-radius:var(--r-sm);
  box-shadow:var(--shadow); line-height:1.5;
}
#chrome header{
  display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px dashed var(--border);
  color:var(--accent-text); letter-spacing:.1em; font-size:10px; text-transform:uppercase; font-weight:600;
}
#chrome header button{margin-left:auto; background:none; border:0; color:var(--dim); cursor:pointer; font:inherit; padding:2px 4px}
#chrome header button:hover{color:var(--fg)}
#chrome .cbody{padding:9px 10px; display:grid; gap:9px; max-height:min(62vh,520px); overflow-y:auto}
#chrome.min .cbody{display:none}
#chrome .grp{display:grid; gap:4px}
#chrome .glab{color:var(--dim); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase}
#chrome .seg{display:flex; flex-wrap:wrap; gap:3px}
#chrome .seg button{
  font:inherit; font-size:10.5px; padding:3px 7px; border:1px solid var(--border); background:var(--ink);
  color:var(--muted); border-radius:4px; cursor:pointer;
}
#chrome .seg button:hover:not([disabled]){color:var(--fg); border-color:var(--rule)}
#chrome .seg button[aria-pressed="true"]{background:var(--gold-wash); border-color:var(--gold-edge); color:var(--accent-text)}
#chrome .seg button[disabled]{opacity:.3; cursor:not-allowed}
#chrome select{
  font-family:inherit; font-size:11px; width:100%; background:var(--ink); color:var(--body);
  border:1px solid var(--border); border-radius:4px; padding:4px 6px;
}
#chrome .note{color:var(--dim); font-size:10px; border-top:1px dashed var(--border); padding-top:7px}

/* ============================================================
   CONTAINER QUERIES — one set of rules for phone toggle + real phone
   ============================================================ */
@container app (max-width: 900px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .wpanel{grid-template-columns:minmax(0,1fr)}
  .wp-act{order:-1}
}
@container app (max-width: 720px){
  .app{grid-template-columns:1fr}
  .rail{
    position:static; height:auto; border-right:0; border-bottom:1px solid var(--border);
    flex-direction:column; padding:12px 0 8px;
  }
  .rail .switcher{grid-template-columns:1fr 1fr; display:grid}
  .nav{display:flex; flex-wrap:wrap; gap:3px}
  .nav a{padding:6px 9px; font-size:12.5px}
  .nav .tail{display:none}
  .navsec > h5{margin:10px 8px 4px}
  .rail-foot{border-top:1px solid var(--border); margin-top:8px}
  .content{padding:18px 14px 64px}
  .topbar{padding:10px 14px; gap:8px}
  .kbar{min-width:0; flex:1}
  .kbar .kbd{display:none}
  .crumbs{display:none}
  .frame-row{grid-template-columns:36px 1fr; row-gap:2px}
  .frame-row .ts{grid-column:2}
  .frame-row .kd{grid-column:2}
  .frame-row .bd{grid-column:2}
  .steps a span.slab{display:none}
  .auth-card{margin-top:26px}
  .pagehead{gap:10px}
  h1{font-size:24px}
  .codes input{width:40px; height:48px; font-size:18px}
  .drawer{width:100%}
}
@container app (max-width: 460px){
  .swtabs button .s{display:none}
  .swtabs button{padding:10px 9px}
  .swtabs button .n{font-size:12.5px}
  .wpanel{padding:14px}
  .stats{grid-template-columns:1fr}
  .codes{gap:5px}
  .codes input{width:calc((100% - 25px)/6)}
  .win-body{padding:20px 18px}
  .content{padding:16px 12px 60px}
}
@media (max-width: 640px){
  #chrome{right:8px; bottom:8px; width:calc(100% - 16px); max-width:280px}
}

/* ---------- tool grammar (shared with mc.html) ----------
   Three orthogonal axes, three visual grammars, never mixed:
     category = what the tool ACTS ON   → icon badge, one hue per category (never gold, never a state hue)
     hazard   = how bad a wrong call is → risk mark (circle · diamond · triangle · filled triangle) + side-effect glyph
     gate     = what the belt decided   → badge; a dashed border means a person still stands in the way */
:root{--tg-ok:#57A97C;--tg-appr:#5B93D6;--tg-deny:#C66A4A;--tg-crit:#D6455E;
  --tg-read:#6FB1DA;--tg-query:#5FBFB0;--tg-record:#E08BA6;--tg-message:#E39A6E;--tg-file:#9FBE62;--tg-exec:#B48EE0;--tg-vcs:#8A96E8;--tg-infra:#6E9E8F;--tg-access:#A3B1C6;--tg-finance:#C97AD0}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--tg-ok:#2F7D52;--tg-appr:#2E6BA8;--tg-deny:#9B4526;--tg-crit:#AE2540;
  --tg-read:#1E6F99;--tg-query:#1E7A6E;--tg-record:#A63F62;--tg-message:#A8532A;--tg-file:#5A7A1C;--tg-exec:#6A46B5;--tg-vcs:#4553B0;--tg-infra:#2F6656;--tg-access:#4F6075;--tg-finance:#8B3E96}}
:root[data-theme="light"]{--tg-ok:#2F7D52;--tg-appr:#2E6BA8;--tg-deny:#9B4526;--tg-crit:#AE2540;
  --tg-read:#1E6F99;--tg-query:#1E7A6E;--tg-record:#A63F62;--tg-message:#A8532A;--tg-file:#5A7A1C;--tg-exec:#6A46B5;--tg-vcs:#4553B0;--tg-infra:#2F6656;--tg-access:#4F6075;--tg-finance:#8B3E96}
.tg-read{--tc:var(--tg-read)} .tg-query{--tc:var(--tg-query)} .tg-record{--tc:var(--tg-record)} .tg-message{--tc:var(--tg-message)} .tg-file{--tc:var(--tg-file)}
.tg-exec{--tc:var(--tg-exec)} .tg-vcs{--tc:var(--tg-vcs)} .tg-infra{--tc:var(--tg-infra)} .tg-access{--tc:var(--tg-access)} .tg-finance{--tc:var(--tg-finance)}
.tg{display:inline-grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;min-width:0;max-width:100%;text-align:left;vertical-align:middle;font-family:var(--font,inherit)}
.tg .i{grid-row:1/3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 34%,transparent)}
.tg .i svg{width:15px;height:15px}
.tg .l{font-weight:600;font-size:13px;color:var(--fg,inherit);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tg .a{font-family:var(--mono,ui-monospace,monospace);font-size:11px;color:var(--muted,#9B958A);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tg .a .v{color:var(--dim,#6E6A62)}
table .tg:not(.sm){min-width:220px}
.tg.sm{column-gap:8px}.tg.sm .i{width:22px;height:22px;border-radius:6px}.tg.sm .i svg{width:12px;height:12px}.tg.sm .l{font-size:12.5px}.tg.sm .a{font-size:10.5px}
.tg.lg{column-gap:12px}.tg.lg .i{width:42px;height:42px;border-radius:11px}.tg.lg .i svg{width:21px;height:21px}.tg.lg .l{font-size:18px;letter-spacing:-.015em}.tg.lg .a{font-size:12px}
.tg.api .l{font-family:var(--mono,ui-monospace,monospace);font-weight:500;font-size:12.5px}.tg.api .a{font-family:var(--font,inherit);font-weight:500}
.tg.lg.api .l{font-size:15px}
.tg-cat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5;color:var(--tc);border-color:color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.tg-cat svg{width:12px;height:12px;flex:none}
.tg-hz{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5;letter-spacing:.02em}
.tg-hz svg{width:14px;height:14px;flex:none}
.tg-hz+.tg-hz{margin-left:10px}
.tg-hz.r-low{color:var(--muted,#9B958A)} .tg-hz.r-medium{color:var(--tg-appr)} .tg-hz.r-high{color:var(--tg-deny)} .tg-hz.r-critical{color:var(--tg-crit)}
.tg-hz.e-read{color:var(--muted,#9B958A)} .tg-hz.e-write{color:var(--tg-appr)} .tg-hz.e-irreversible{color:var(--tg-deny)}
.tg-gt{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5}
.tg-gt svg{width:12px;height:12px;flex:none}
.tg-gt.g-allow{color:var(--tg-ok);border-color:color-mix(in srgb,var(--tg-ok) 42%,transparent);background:color-mix(in srgb,var(--tg-ok) 11%,transparent)}
.tg-gt.g-require_approval,.tg-gt.g-mandate{color:var(--tg-appr);border-style:dashed;border-color:color-mix(in srgb,var(--tg-appr) 65%,transparent);background:color-mix(in srgb,var(--tg-appr) 11%,transparent)}
.tg-gt.g-deny{color:var(--tg-deny);border-color:color-mix(in srgb,var(--tg-deny) 42%,transparent);background:color-mix(in srgb,var(--tg-deny) 11%,transparent)}
.tg-gt.g-killed{color:var(--tg-crit);border-color:color-mix(in srgb,var(--tg-crit) 65%,transparent);background:color-mix(in srgb,var(--tg-crit) 14%,transparent)}
tr.tg-row-critical>td:first-child{box-shadow:inset 3px 0 0 var(--tg-crit)}
tr.tg-row-high>td:first-child{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--tg-deny) 65%,transparent)}
tr.tg-grp td{background:var(--hl,rgba(127,127,127,.08));padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--border,rgba(127,127,127,.25))}

<script>
/* ---------- Tool grammar (shared with mc.html) ----------
   TG.cell(id,{sz:"sm"|"lg",sub})  label + API name in a category-hued tile; TG.names="api" leads with the API name
   TG.cat(cat)                     category badge          TG.hazard(risk,effect)   risk mark + side-effect glyph
   TG.gate(g,note)                 allow · require_approval · deny · killed · mandate
   TG.legend()                     the ten categories with examples, plus the risk / effect / gate scales
   TG.chips(counts,sel,pick,total) category filter chips; `pick` is an onclick with %s where the category goes
   TG.seg(items)                   segmented control: [[label,pressed,onclick],…]
   A category says what a tool ACTS ON; it is orthogonal to hazard (how bad a wrong call is) and gate (what the belt decided). */
var TG=(function(){
 function h(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
 var ORDER=["read","query","record","message","file","exec","vcs","infra","access","finance"];
 var CAT={
  read:{l:"Read-only",s:"Observes and returns. Changes nothing anywhere.",eg:"github__get_file_contents · slack__get_thread · search_graph",
    i:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/>'},
  query:{l:"Data query",s:"Bulk read from a store. Read-only, but the result set is the exfiltration and the cost.",eg:"snowflake__run_query · aws_billing__get_cost_and_usage",
    i:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'},
  record:{l:"Record write",s:"Creates or updates a record in a system of work. Reversible by another write.",eg:"linear__update_issue · calendar__create_event · notion__update_page",
    i:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'},
  message:{l:"Messaging & authoring",s:"Speaks to people on the organization’s behalf. A sent message cannot be unsent.",eg:"slack__post_message · slack__upload_file · gmail__send_message",
    i:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/>'},
  file:{l:"File mutation",s:"Writes, edits, moves or deletes files in a workspace or a drive.",eg:"write__file · edit__file · drive__trash_file",
    i:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 15l2 2 4-4"/>'},
  exec:{l:"Code execution",s:"Runs a command or a program. Its effect is whatever the sandbox allows.",eg:"claude_code__Bash · bash__run · sandbox__run_python",
    i:'<path d="m4 17 6-5-6-5M12 19h8"/>'},
  vcs:{l:"Source control",s:"Changes code history: branches, pull requests, merges, releases, repositories.",eg:"github__create_pull_request · github__merge_pull_request · github__delete_repository",
    i:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-12 2-12 6"/>'},
  infra:{l:"Infrastructure",s:"Deploys, scales, pauses or reconfigures a running system.",eg:"vercel__deploy_to_vercel · vercel__pause_project · k8s__scale_deployment",
    i:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>'},
  access:{l:"Access & identity",s:"Grants, shares, rotates or revokes access. Widens what every later call can reach.",eg:"drive__share_file · iam__rotate_key · oxagen__grant_role",
    i:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/>'},
  finance:{l:"Financial control",s:"Moves funds or commits spend. Never callable without a mandate.",eg:"stripe__create_payment · stripe__create_refund · aws_billing__purchase_savings_plan",
    i:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>'}
 };
 var META={
  github__create_pull_request:["Create pull request","vcs"], github__merge_pull_request:["Merge pull request","vcs"],
  github__delete_repository:["Delete repository","vcs"], github__create_release:["Create release","vcs"], github__push_files:["Push files","vcs"],
  github__get_file_contents:["Get file contents","read"], github__list_pull_requests:["List pull requests","read"], github__get_pull_request:["Get pull request","read"],
  stripe__create_payment:["Create payment","finance"], stripe__create_refund:["Create refund","finance"], stripe__create_payout:["Create payout","finance"],
  aws_billing__purchase_savings_plan:["Purchase savings plan","finance"], aws_billing__get_cost_and_usage:["Get cost and usage","query"],
  linear__update_issue:["Update issue","record"], linear__get_issue:["Get issue","read"], linear__create_issue:["Create issue","record"],
  slack__post_message:["Post message","message"], slack__upload_file:["Upload file","message"],
  slack__list_channels:["List channels","read"], slack__get_thread:["Get thread","read"],
  snowflake__run_query:["Run SQL query","query"], claude_code__Bash:["Run shell command","exec"], bash__run:["Run shell command","exec"],
  write__file:["Write file","file"], edit__file:["Edit file","file"], read__file:["Read file","read"],
  search_graph:["Search the graph","read"], recall_context:["Recall context","read"]
 };
 function parts(id){var s=String(id||""),i=s.lastIndexOf("@");return i>0?{n:s.slice(0,i),v:s.slice(i+1)}:{n:s,v:""};}
 function meta(id){
  var p=parts(id), m=META[p.n];
  if(m) return {n:p.n,v:p.v,l:m[0],cat:m[1]};
  var local=p.n.split("__").pop(), verb=local.split("_")[0].toLowerCase(), cat="record";
  if(/^(get|list|search|read|fetch|find|recall|describe|show)$/.test(verb)) cat="read";
  else if(/^(query|select|aggregate|export)$/.test(verb)) cat="query";
  else if(/^(write|edit|move|copy|trash|mkdir)$/.test(verb)) cat="file";
  else if(/^(bash|run|exec|execute|eval)$/.test(verb)) cat="exec";
  else if(/^(post|send|reply|forward|publish|upload)$/.test(verb)) cat="message";
  else if(/^(pay|refund|purchase|charge|transfer|buy|payout)$/.test(verb)) cat="finance";
  else if(/^(deploy|scale|pause|restart|provision)$/.test(verb)) cat="infra";
  else if(/^(grant|share|rotate|revoke|invite)$/.test(verb)) cat="access";
  else if(/^(merge|rebase|tag|release|push|fork)$/.test(verb)) cat="vcs";
  return {n:p.n,v:p.v,l:local.replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase();}),cat:cat};
 }
 var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
 var SV2='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
 function svg(c){var d=CAT[c]||CAT.record;return SV+d.i+'</svg>';}
 function cat(c){var d=CAT[c]||CAT.record;return '<span class="tg-cat tg-'+h(c)+'" title="'+h(d.s)+'">'+svg(c)+h(d.l)+'</span>';}
 function cell(id,o){
  o=o||{}; var m=meta(id), api=TG.names==="api", d=CAT[m.cat];
  var apiHtml=h(m.n)+(m.v?'<span class="v">@'+h(m.v)+'</span>':''), sub=o.sub?' · '+h(o.sub):'';
  return '<span class="tg tg-'+m.cat+(o.sz?' '+o.sz:'')+(api?' api':'')+'" title="'+h(m.n+(m.v?'@'+m.v:''))+' — '+h(m.l)+' · '+h(d.l)+'">'+
   '<span class="i">'+svg(m.cat)+'</span>'+
   (api?'<span class="l">'+apiHtml+'</span><span class="a">'+h(m.l)+sub+'</span>'
       :'<span class="l">'+h(m.l)+'</span><span class="a">'+apiHtml+sub+'</span>')+'</span>';
 }
 function riskSvg(r){
  if(r==="critical") return SV2+'<path d="M12 3 2 20h20L12 3z" fill="currentColor"/><path d="M12 10v4M12 17.5v.5" style="stroke:var(--ink,#10100F)"/></svg>';
  if(r==="high") return SV2+'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>';
  if(r==="medium") return SV2+'<path d="M12 3l9 9-9 9-9-9z"/><path d="M12 12h.01"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M12 12h.01"/></svg>';
 }
 function effSvg(e){
  if(e==="irreversible") return SV2+'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  if(e==="write") return SV2+'<path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M12 8l4 4"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg>';
 }
 function hazard(r,e){
  return '<span class="tg-hz r-'+h(r)+'" title="risk '+h(r)+'">'+riskSvg(r)+'<span>'+h(r)+'</span></span>'+
   (e?'<span class="tg-hz e-'+h(e)+'" title="side effect '+h(e)+'">'+effSvg(e)+'<span>'+h(e)+'</span></span>':'');
 }
 var GL={allow:"allowed",require_approval:"needs approval",deny:"denied",killed:"kill switch",mandate:"mandate + approval"};
 function gateSvg(g){
  var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  if(g==="allow") return s+'<path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  if(g==="require_approval") return s+'<path d="M12 3l8 3.5v5c0 4.6-3.2 8.6-8 9.5-4.8-.9-8-4.9-8-9.5v-5z"/><path d="M12 8v4l2.5 1.5"/></svg>';
  if(g==="deny") return s+'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>';
  if(g==="killed") return s+'<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>';
  if(g==="mandate") return s+'<path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3S7.5 5.8 7.5 7.5s2 2.7 4.5 3.3 4.5 1.6 4.5 3.5-2 3.2-4.5 3.2-4.5-1.3-4.5-3"/></svg>';
  return s+'<path d="M5 12h14"/></svg>';
 }
 function gate(g,note){g=({allowed:"allow",approval:"require_approval",denied:"deny"})[g]||g;return '<span class="tg-gt g-'+h(g)+'"'+(note?' title="'+h(note)+'"':'')+'>'+gateSvg(g)+h(GL[g]||g)+'</span>';}
 function seg(items){return '<span class="tg-seg" role="group">'+items.map(function(it){return '<button type="button" aria-pressed="'+(!!it[1])+'" onclick="'+h(it[2])+'">'+h(it[0])+'</button>';}).join("")+'</span>';}
 function chips(counts,sel,pick,total){
  var out='<button type="button" aria-pressed="'+(!sel)+'" onclick="'+h(pick.replace("%s",""))+'">All <span class="n">'+total+'</span></button>';
  ORDER.forEach(function(c){ if(!counts[c])return;
   out+='<button type="button" class="tg-'+c+'" aria-pressed="'+(sel===c)+'" title="'+h(CAT[c].s)+'" onclick="'+h(pick.replace("%s",c))+'">'+svg(c)+h(CAT[c].l)+'<span class="n">'+counts[c]+'</span></button>';});
  return '<div class="tg-chips">'+out+'</div>';
 }
 function legend(){
  return '<div class="tg-leg">'+ORDER.map(function(c){var d=CAT[c];
    return '<div class="c tg-'+c+'"><div class="i">'+svg(c)+'</div><div style="min-width:0"><div class="l">'+h(d.l)+'</div><div class="s">'+h(d.s)+'</div><div class="eg">'+h(d.eg)+'</div></div></div>';}).join("")+'</div>'+
   '<div class="tg-axes">'+
   '<div><span class="k">Risk</span>'+hazard("low")+hazard("medium")+hazard("high")+hazard("critical")+'</div>'+
   '<div><span class="k">Side effect</span><span class="tg-hz e-read">'+effSvg("read")+'<span>read</span></span><span class="tg-hz e-write">'+effSvg("write")+'<span>write</span></span><span class="tg-hz e-irreversible">'+effSvg("irreversible")+'<span>irreversible</span></span></div>'+
   '<div><span class="k">Gate</span>'+gate("allow")+gate("require_approval")+gate("mandate")+gate("deny")+gate("killed")+'<span class="note">dashed = a person still stands in the way</span></div></div>';
 }
 return {names:"label",ORDER:ORDER,CAT:CAT,META:META,h:h,meta:meta,svg:svg,cat:cat,cell:cell,riskSvg:riskSvg,effSvg:effSvg,hazard:hazard,gate:gate,seg:seg,chips:chips,legend:legend};
})();
</script>

/* A tool_requested frame leads with the tool itself: label, API name, hazard. */
function fbody(f){
  if(f[2]!=="tool_requested") return f[3];
  const parts=String(f[3]).split(" · "), kv={}, rest=[];
  parts.slice(1).forEach(p=>{const m=/^(\w+)=(.+)$/.exec(p); if(m) kv[m[1]]=m[2]; else rest.push(p);});
  return '<span style="display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;vertical-align:middle">'+TG.cell(parts[0],{sz:"sm"})
    +(kv.risk?TG.hazard(kv.risk,kv.side_effect):"")+(kv.egress?'<span class="cap">egress '+kv.egress+'</span>':"")+rest.join(" · ")+'</span>';
}

            every tool call brokered a per-call credential and returned a signed receipt.</p></div>

}

/* =========================================================================
   DIALOGS
   ========================================================================= */
function dialog(){
  if (S.cmdOpen) return `<div class="scrim" data-scrim>
    <div class="dlg" role="dialog" aria-modal="true" aria-label="Command menu">
      <header>${I.search}<input class="input" id="cmd-input" placeholder="Search runs, agents, tools, or type a command…"
        style="border:0;background:transparent;padding:0;font-size:15px" autofocus></header>

           ["Tools","#/acme/core-platform/tools","G then T"],

  if (!S.dlg) return "";

        <p class="cap">Soft cancel is guaranteed while any seam is in path. Killing the process is best effort and is
          recorded as such. The run seals with outcome <span class="mono">cancelled</span> and keeps every frame
          written so far — ${D.run.frames} of them, costing ${usd(D.run.cost)}.</p>
      </div>
      <div class="ft"><button type="button" class="btn ghost" data-close>Keep running</button>
        <button type="button" class="btn danger" data-close>Cancel the run</button></div>
    </div></div>`;
  if (S.dlg === "account") return `<div class="scrim" data-scrim>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="acc-h">
      <header><div class="avatar">${D.operator.initials}</div><div class="stack">
        <h3 id="acc-h" style="font-size:14px">${D.operator.name}</h3>
        <span class="cap mono">${D.operator.email}</span></div></header>
      <div class="bd stack g12">
        <div class="stack g8 f13">
          ${[["Organization role","member"],["Workspace role",D.ws.name+" · owner"],
             ["Two-factor","authenticator app · enabled"],["Sessions","2 devices"],
             ["Notifications","approvals and budget breaches, by email"]].map(([k,v])=>
            `<div class="row g12"><span class="muted" style="width:146px;flex:none">${k}</span><span>${v}</span></div>`).join("")}

/* =========================================================================
   RENDER
   ========================================================================= */
const VIEWS = {signup:vSignup, verify:vVerify, login:vLogin, twofactor:vTwoFactor, forgot:vForgot,
  reset:vReset, invite:vInvite, ob1:vOb1, ob2:vOb2, ob3:vOb3, installer:vInstaller,
  fleet:vFleet, run:vRun, other:vOther};

function render(){
  const r = routeFor();
  if (!r.states.includes(S.state)) S.state = "loaded";
  document.getElementById("frame").innerHTML = VIEWS[r.id]() + dialog();
  syncChrome(r);
  wire(r);
  applyWrapTab(false);
  const f = document.querySelector("[autofocus]"); if (f) f.focus();
}

function syncChrome(r){
  const sel = document.getElementById("cScreen");
  if (sel.options.length !== ROUTES.length){
    sel.innerHTML = ROUTES.map(x=>`<option value="${x.hash}">${x.label}</option>`).join("");
  }
  sel.value = r.hash === sel.value ? sel.value : r.hash;
  if (![...sel.options].some(o=>o.value===sel.value)) sel.value = r.hash;
  const all = ["loaded","empty","loading","error","denied"];
  document.getElementById("cState").innerHTML = all.map(s=>{
    const ok = r.states.includes(s);
    return `<button type="button" data-v="${s}" ${ok?"":"disabled"} aria-pressed="${S.state===s}">${s}</button>`;
  }).join("");
  document.querySelectorAll("#cPhone button").forEach(b=>b.setAttribute("aria-pressed", String(S.phone) === (b.dataset.v==="1"?"true":"false")));
  document.querySelectorAll("#cTheme button").forEach(b=>b.setAttribute("aria-pressed", S.theme===b.dataset.v));
}

/* ---------- per-view wiring --------------------------------------------- */
function wire(r){
  const root = document.getElementById("frame");

  root.querySelectorAll("[data-nav]").forEach(el => el.addEventListener("click", e=>{
    if (e.target.closest("[data-pause],[data-dismiss]")) return;
    const pick = el.dataset.pick; if (pick) S.agentPicked = pick;
    if (el.dataset.frame) S.firstFrame = true;
    S.dlg = null; S.cmdOpen = false;
    go(el.dataset.nav);
  }));
  root.querySelectorAll("[data-submit]").forEach(f => f.addEventListener("submit", e=>{
    e.preventDefault();
    const t = f.dataset.submit;
    if (t === "forgot-sent"){ S.forgotSent = true; render(); return; }
    if (S.state === "error"){ S.state = "loaded"; }
    const map = {verify:"#/verify", ob1:"#/new-organization", ob2:"#/new-organization/wrap",
                 twofactor:"#/two-factor", login:"#/login"};
    S.state = "loading"; render();
    later(()=>{ S.state = "loaded"; go(map[t] || "#/acme/core-platform"); }, 620);
  }));
  root.querySelectorAll("[data-pwtoggle]").forEach(b=>b.addEventListener("click",()=>{ S.pwShown = !S.pwShown; render(); }));
  root.querySelectorAll("[data-os]").forEach(b=>b.addEventListener("click",()=>{ S.os = b.dataset.os; render(); }));
  const wtabs = [...root.querySelectorAll("[data-wraptab]")];
  wtabs.forEach((b, n) => {
    b.addEventListener("click", () => { S.wrapTab = b.dataset.wraptab; applyWrapTab(true); });
    b.addEventListener("keydown", e => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      let t = null;
      if (d) t = wtabs[(n + d + wtabs.length) % wtabs.length];
      else if (e.key === "Home") t = wtabs[0];
      else if (e.key === "End") t = wtabs[wtabs.length - 1];
      if (!t) return;
      e.preventDefault(); S.wrapTab = t.dataset.wraptab; applyWrapTab(true); t.focus();
    });
  });
  root.querySelectorAll("[data-sdk]").forEach(b=>b.addEventListener("click",()=>{ S.sdkLang = b.dataset.sdk; render(); }));
  root.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    navigator.clipboard?.writeText(b.dataset.copy).catch(()=>{});
    const s = b.querySelector("span"); if (s){ const o = s.textContent; s.textContent = "Copied"; later(()=>{ s.textContent = o; }, 1200); }
  }));
  root.querySelectorAll("[data-noop]").forEach(b=>b.addEventListener("click", e=>e.preventDefault()));
  root.querySelectorAll("[data-retry]").forEach(b=>b.addEventListener("click",()=>{
    S.state = "loading"; render(); later(()=>{ S.state = "loaded"; render(); }, 700);
  }));

  /* onboarding */
  root.querySelectorAll("[data-bind]").forEach(b=>b.addEventListener("click",()=>{
    S.repoBound = true; S.repoSkipped = false; render();
  }));
  root.querySelectorAll("[data-skip]").forEach(b=>b.addEventListener("click",()=>{ S.repoSkipped = true; render(); }));
  root.querySelectorAll("[data-unlock]").forEach(b=>b.addEventListener("click",()=>{ S.unlocked = true; go("#/acme/core-platform"); }));

  /* installer */
  root.querySelectorAll("[data-install]").forEach(b=>b.addEventListener("click",()=>{
    S.installerStep = 1; S.installerPct = 0; render(); runInstaller();
  }));
  root.querySelectorAll("[data-instep]").forEach(b=>b.addEventListener("click",()=>{
    clearTimers(); S.installerStep = +b.dataset.instep;
    S.installerPct = S.installerStep === 2 ? 100 : S.installerStep === 1 ? 38 : 0;
    render(); if (S.installerStep === 1) runInstaller();
  }));

  /* fleet + run */
  root.querySelectorAll("[data-dismiss]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation(); S.offerDismissed = true; render();
  }));
  root.querySelectorAll("[data-pause]").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation(); S.runPaused = !S.runPaused; render();
  }));
  root.querySelectorAll("[data-steer]").forEach(b=>b.addEventListener("click",()=>{ S.steerSent = true; S.dlg = null; render(); }));

  /* chrome-in-app */
  root.querySelectorAll("[data-assistant]").forEach(b=>b.addEventListener("click",()=>{ S.assistant = !S.assistant; render(); }));
  root.querySelectorAll("[data-cmd]").forEach(b=>b.addEventListener("click",()=>{ S.cmdOpen = true; render(); }));
  root.querySelectorAll("[data-dlg]").forEach(b=>b.addEventListener("click",()=>{ S.dlg = b.dataset.dlg; render(); }));
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>{ S.dlg = null; S.cmdOpen = false; render(); }));
  const scrim = root.querySelector("[data-scrim]");
  if (scrim) scrim.addEventListener("mousedown", e=>{ if (e.target === scrim){ S.dlg = null; S.cmdOpen = false; render(); } });

  /* six-box code inputs */
  root.querySelectorAll("[data-codes]").forEach(g=>{
    const ins = [...g.querySelectorAll("input")];
    ins.forEach((inp,i)=>inp.addEventListener("input",()=>{ if (inp.value && ins[i+1]) ins[i+1].focus(); }));
    ins.forEach((inp,i)=>inp.addEventListener("keydown",e=>{ if (e.key==="Backspace" && !inp.value && ins[i-1]) ins[i-1].focus(); }));
  });

  /* the onboarding poll that flips on the first frame */
  if (r.id === "ob3" && S.state === "loaded" && !S.firstFrame && !S.polling){
    S.polling = true;
    const tick = () => {
      if (routeFor().id !== "ob3" || S.state !== "loaded"){ S.polling = false; return; }
      S.logLines++;
      if (S.logLines >= 6){ S.polling = false; S.firstFrame = true; render(); startUnlockCountdown(); return; }
      render();
      later(tick, 780);
    };
    later(tick, 520);
  }
  if (r.id === "ob3" && S.firstFrame && S.state === "loaded" && !S.countdownRan) startUnlockCountdown();
}

function applyWrapTab(animate){
  const wrap = document.querySelector(".switchwrap");
  if (!wrap) return;
  const i = Math.max(0, WRAPTABS.findIndex(t => t.id === S.wrapTab));
  const track = wrap.querySelector(".swtrack");
  const view = wrap.querySelector(".swview");
  const ind = wrap.querySelector(".swind");
  const panels = [...wrap.querySelectorAll(".wpanel")];
  const tabs = [...wrap.querySelectorAll('[role="tab"][data-wraptab]')];

  if (!animate){ track.style.transition = "none"; view.style.transition = "none"; ind.style.transition = "none"; }
  track.style.transform = "translateX(" + (-i * 100) + "%)";
  ind.style.setProperty("--i", i);
  tabs.forEach((t, n) => { t.setAttribute("aria-selected", String(n === i)); t.tabIndex = n === i ? 0 : -1; });
  panels.forEach((pnl, n) => {
    /* inert keeps focus and the accessibility tree out of the panels that slid away */
    if (n === i){ pnl.removeAttribute("inert"); pnl.removeAttribute("aria-hidden"); }
    else { pnl.setAttribute("inert", ""); pnl.setAttribute("aria-hidden", "true"); }
    /* exactly one gold action on screen: it belongs to whichever panel is showing */
    pnl.querySelectorAll("[data-primary]").forEach(b => b.classList.toggle("gold", n === i));
  });
  view.style.height = panels[i].offsetHeight + "px";
  if (!animate) requestAnimationFrame(() => {
    track.style.transition = ""; view.style.transition = ""; ind.style.transition = "";
  });
}

function startUnlockCountdown(){
  S.countdownRan = true;
  let n = 6;
  const note = () => document.getElementById("autoNote");
  const t = setInterval(()=>{
    const el = note();
    if (!el){ clearInterval(t); return; }
    n--;
    if (n <= 0){ clearInterval(t); S.unlocked = true; go("#/acme/core-platform"); return; }
    el.textContent = "Opening automatically in " + n + "…";
  }, 1000);
  timers.push(t);
}

function runInstaller(){
  const step = () => {
    S.installerPct = Math.min(100, S.installerPct + 100/INSTALL_STEPS.length);
    const fill = document.querySelector(".bar-fill");
    if (fill) fill.style.width = S.installerPct + "%";
    if (S.installerPct >= 100){ later(()=>{ S.installerStep = 2; S.firstFrame = true; render(); }, 500); return; }
    render(); later(step, 430);
  };
  later(step, 430);
}

/* =========================================================================
   CHROME (mockup only)
   ========================================================================= */
document.getElementById("chromeToggle").addEventListener("click", e=>{
  const c = document.getElementById("chrome");
  c.classList.toggle("min");
  const min = c.classList.contains("min");
  e.target.textContent = min ? "+" : "–";
  e.target.setAttribute("aria-expanded", String(!min));
});
document.getElementById("cScreen").addEventListener("change", e=>{
  clearTimers(); S.logLines = 0; S.countdownRan = false;
  if (e.target.value === "#/new-organization/run"){ S.firstFrame = false; S.polling = false; }
  if (e.target.value === "#/installer") { S.installerStep = 0; S.installerPct = 0; }
  go(e.target.value);
});
document.getElementById("cState").addEventListener("click", e=>{
  const b = e.target.closest("button[data-v]"); if (!b || b.disabled) return;
  clearTimers(); S.state = b.dataset.v; S.logLines = 0; S.countdownRan = false; S.polling = false; render();
});
document.getElementById("cPhone").addEventListener("click", e=>{
  const b = e.target.closest("button[data-v]"); if (!b) return;
  S.phone = b.dataset.v === "1";
  document.body.dataset.phone = S.phone ? "1" : "0";
  render();
});
document.getElementById("cTheme").addEventListener("click", e=>{
  const b = e.target.closest("button[data-v]"); if (!b) return;
  S.theme = b.dataset.v;
  if (S.theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
  render();
});

/* global keys */
addEventListener("keydown", e=>{
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    if (/^#\/acme/.test(location.hash)){ S.cmdOpen = !S.cmdOpen; S.dlg = null; render(); }
  }
  if (e.key === "Escape" && (S.cmdOpen || S.dlg)){ S.cmdOpen = false; S.dlg = null; render(); }
});

addEventListener("resize", () => applyWrapTab(false));
document.fonts && document.fonts.ready.then(() => applyWrapTab(false));

addEventListener("hashchange", ()=>{
  clearTimers();
  S.dlg = null; S.cmdOpen = false;
  if (routeFor().id !== "ob3"){ S.logLines = 0; S.countdownRan = false; S.polling = false; }
  render();
});

if (!location.hash) location.hash = "#/signup";
document.body.dataset.phone = "0";
render();
</script>

<script>
/* ============================== List controls ============================== */
/* Self-contained: every table with a thead gets a search box, sortable column
   headers, a filter select for each column that is a small enumeration, a
   rows-per-page select and a pager. Installs itself through a DOM observer so
   it works with any render path; state is keyed by page + column signature so
   a full re-render lands back on the same page, sort and query. */
(function(){
"use strict";
if(window.__ltInstalled)return; window.__ltInstalled=true;
var STORE={}, PER=[5,10,25,50,0], BUSY=false, TIMER=null;
var FACET=/status|state|tier|kind|role|risk|severity|result|health|effect|mode|side|level|verdict|decision|origin|scope|period|basis|algorithm|trend|position|governance|two-factor|sso|replay|grade|outcome/i;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(s){
  s=String(s==null?"":s).trim();
  if(!s||/^\d{4}-\d{2}/.test(s))return null;
  var c=s.replace(/[$,%×]/g,""), m=c.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);
  if(!m)return null;
  var n=parseFloat(m[0]), u=c.slice(m[0].length).match(/^\s*([kKMB])(?![A-Za-z])/);
  if(u){ if(u[1]==="k"||u[1]==="K")n*=1e3; else if(u[1]==="M")n*=1e6; else n*=1e9; }
  return n;
}
function cmp(a,b,isNum,dir){
  if(isNum){var x=a.n,y=b.n; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; if(x!==y)return (x-y)*dir;}
  return a.t.localeCompare(b.t,undefined,{numeric:true,sensitivity:"base"})*dir;
}
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function pageCtx(){var h1=document.querySelector("main h1, .page h1, h1"); return location.hash+"|"+(h1?h1.textContent.trim().slice(0,40):"");}
function state(sig,ord){var key=pageCtx()+"|"+sig+"#"+ord; return STORE[key]||(STORE[key]={q:"",sort:null,dir:1,per:10,page:1,f:{}});}

function pager(st,total,onPage){
  var per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  var from=total?((st.page-1)*per+1):0, to=Math.min(total,st.page*per);
  var html='<div class="lp"><span class="lp-n">'+(total?from+'–'+to+' of '+total:'0 of 0')+'</span><span class="lp-pg">'+
   '<button type="button" class="lp-b" data-p="prev" aria-label="Previous page"'+(st.page<=1?' disabled':'')+'>‹</button>';
  var nums=[]; if(pages<=7){for(var i=1;i<=pages;i++)nums.push(i);} else {
    nums=[1]; var lo=Math.max(2,st.page-1), hi=Math.min(pages-1,st.page+1);
    if(lo>2)nums.push("…"); for(var j=lo;j<=hi;j++)nums.push(j); if(hi<pages-1)nums.push("…"); nums.push(pages);}
  nums.forEach(function(p){html+= p==="…"?'<span class="el">…</span>':'<button type="button" class="lp-b" data-p="'+p+'"'+(p===st.page?' aria-current="page"':'')+'>'+p+'</button>';});
  html+='<button type="button" class="lp-b" data-p="next" aria-label="Next page"'+(st.page>=pages?' disabled':'')+'>›</button></span></div>';
  var lp=el(html);
  lp.addEventListener("click",function(e){var b=e.target.closest("button[data-p]"); if(!b||b.disabled)return; e.stopPropagation(); var p=b.getAttribute("data-p");
    st.page = p==="prev"?st.page-1 : p==="next"?st.page+1 : +p; onPage();});
  return lp;
}
function bar(st,opts,apply){
  var html='<div class="lt"><input class="lt-q" type="search" placeholder="'+esc(opts.ph)+'" aria-label="'+esc(opts.ph)+'" value="'+esc(st.q)+'">';
  (opts.filters||[]).forEach(function(f){
    html+='<select class="lt-f" data-k="'+esc(f.key)+'" aria-label="Filter by '+esc(f.label)+'"><option value="">All · '+esc(f.label)+'</option>'+
      f.values.map(function(v){return '<option value="'+esc(v)+'"'+(st.f[f.key]===v?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';});
  html+='<label class="lt-rows">Rows<select class="lt-per">'+PER.map(function(p){return '<option value="'+p+'"'+(st.per===p?' selected':'')+'>'+(p||"All")+'</option>';}).join("")+'</select></label></div>';
  var b=el(html);
  b.addEventListener("click",function(e){e.stopPropagation();});
  b.querySelector(".lt-q").addEventListener("input",function(e){st.q=e.target.value;st.page=1;apply();});
  b.querySelectorAll(".lt-f").forEach(function(s){s.addEventListener("change",function(e){st.f[s.getAttribute("data-k")]=e.target.value;st.page=1;apply();});});
  b.querySelector(".lt-per").addEventListener("change",function(e){st.per=+e.target.value;st.page=1;apply();});
  return b;
}
/* A column earns a filter when it is a small enumeration: 2–8 distinct short
   values across at least 4 rows, and not unique per row. At most three per list. */
function facets(cols,vals,rows){
  if(rows<4)return [];
  var c=cols.filter(function(col){ if(!col.name||col.num)return false;
    var set={},n=0,ok=true; vals.forEach(function(v){var t=v[col.i].t; if(!t)return; if(t.length>28)ok=false; if(!set[t]){set[t]=1;n++;}});
    if(!ok||n<2||n>8||n>=rows)return false; col.values=Object.keys(set).sort(); return true;});
  c.sort(function(a,b){var pa=FACET.test(a.name)?0:1,pb=FACET.test(b.name)?0:1; return pa-pb||a.values.length-b.values.length;});
  return c.slice(0,3).map(function(col){return {key:String(col.i),label:col.name,values:col.values};});
}
function sigOf(table){return [].slice.call(table.tHead.rows[0].cells).map(function(c){return c.textContent.trim();}).join("/");}
function enhance(table,ord){
  var tbody=table.tBodies[0], rows=[].slice.call(tbody.rows);
  var ths=[].slice.call(table.tHead.rows[0].cells);
  var cols=ths.map(function(th,i){return {i:i,name:th.textContent.trim(),num:th.classList.contains("num")};});
  var st=state(sigOf(table),ord);
  var vals=rows.map(function(r){return cols.map(function(c){var cell=r.cells[c.i]; var t=cell?cell.textContent.replace(/\s+/g," ").trim():""; return {t:t,n:num(t)};});});
  cols.forEach(function(c){ if(c.num)return; var k=0,tot=0; vals.forEach(function(v){if(v[c.i].t){tot++; if(v[c.i].n!=null)k++;}}); if(tot&&k/tot>=.6)c.num=true; });
  var texts=rows.map(function(r){return r.textContent.replace(/\s+/g," ").toLowerCase();});
  var fs=facets(cols,vals,rows.length);
  var wrap=table.parentNode, host=wrap.parentNode, ph="Search this list";
  if(!host||wrap===document.body){wrap=table;host=table.parentNode;}
  /* A lone search box sitting directly above the table becomes the list's search. */
  var prev=wrap.previousElementSibling;
  if(prev&&!prev.matches("table,thead,tbody")){
    var ins=prev.querySelectorAll("input,select,button,a,textarea");
    var inp=prev.matches("input")?prev:prev.querySelector("input[placeholder^='Search']");
    if(inp&&inp.placeholder&&/^Search/.test(inp.placeholder)&&ins.length<=1&&!prev.textContent.trim()){ph=inp.placeholder;prev.remove();}
  }
  var free=!/panel|card|box/.test(host.className||"");
  var b=bar(st,{ph:ph,filters:fs},apply), lp=document.createElement("div");
  if(free)b.classList.add("free");
  host.insertBefore(b,wrap); host.insertBefore(lp,wrap.nextSibling);
  ths.forEach(function(th,i){ if(!cols[i].name)return; th.classList.add("sortable"); th.tabIndex=0; th.setAttribute("role","button");
    function tog(e){ if(e)e.stopPropagation(); if(st.sort===i){ if(st.dir===1)st.dir=-1; else {st.sort=null;st.dir=1;} } else {st.sort=i;st.dir=1;} st.page=1; apply(); }
    th.addEventListener("click",tog); th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog(e);}}); });
  function apply(){
    ths.forEach(function(th,i){ if(!cols[i].name)return; th.setAttribute("aria-sort",st.sort===i?(st.dir===1?"ascending":"descending"):"none"); });
    var q=st.q.trim().toLowerCase();
    var idx=rows.map(function(_,i){return i;}).filter(function(i){
      if(q&&texts[i].indexOf(q)<0)return false;
      for(var k in st.f){ if(st.f[k]&&vals[i][+k]&&vals[i][+k].t!==st.f[k])return false; } return true; });
    if(st.sort!=null&&cols[st.sort]){var c=cols[st.sort]; idx.sort(function(a,b){return cmp(vals[a][c.i],vals[b][c.i],c.num,st.dir)||(a-b);});}
    var total=idx.length, per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per)); if(st.page>pages)st.page=pages;
    var slice=st.per?idx.slice((st.page-1)*st.per,st.page*st.per):idx;
    BUSY=true;
    while(tbody.firstChild)tbody.removeChild(tbody.firstChild);
    if(!slice.length){var tr=document.createElement("tr"),td=document.createElement("td");tr.className="lt-empty";td.colSpan=cols.length;td.textContent="No rows match.";tr.appendChild(td);tbody.appendChild(tr);}
    slice.forEach(function(i){tbody.appendChild(rows[i]);});
    var nlp=pager(st,total,apply); lp.replaceWith(nlp); lp=nlp; if(free)lp.classList.add("free");
    BUSY=false;
  }
  apply();
}
function run(){
  BUSY=true;
  try{
    var ords={};
    [].slice.call(document.querySelectorAll("table")).forEach(function(t){
      if(!t.tHead||!t.tHead.rows[0]||!t.tBodies[0]||t.closest("[data-lt-skip]"))return;
      if([].slice.call(t.tHead.rows[0].cells).some(function(c){return c.colSpan>1;}))return;
      var sig=sigOf(t), ord=ords[sig]||0; ords[sig]=ord+1;
      if(t.getAttribute("data-lt"))return;
      t.setAttribute("data-lt","1"); enhance(t,ord);
    });
  } finally { BUSY=false; }
}
new MutationObserver(function(muts){
  if(BUSY)return;
  for(var i=0;i<muts.length;i++){ if(muts[i].addedNodes.length){ clearTimeout(TIMER); TIMER=setTimeout(run,0); return; } }
}).observe(document.documentElement,{childList:true,subtree:true});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run); else run();
window.listify=run;
})();
</script>
