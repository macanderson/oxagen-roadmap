<title>Every Dollar, Every Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Oxagen house system — dark-first. Tokens: /tokens/house-tokens.css
   Gold is identity and at most one primary action per screen.
   It never encodes a state. State hues below are separate.
   ============================================================ */
:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --panel-2:#1D1C19;
  --hl:#201F1C; --border:#292722; --rule:#34322D;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A; --accent-text:#D6962C;
  --gold-wash:rgba(214,150,44,.12); --gold-edge:rgba(214,150,44,.34);

  /* semantic state — separate from gold, never gold */
  --st-allowed:#5BA97C;  --st-allowed-wash:rgba(91,169,124,.14);
  --st-proven:#4FB3A3;   --st-proven-wash:rgba(79,179,163,.14);
  --st-approval:#6E9BD6; --st-approval-wash:rgba(110,155,214,.14);
  --st-denied:#C4646F;   --st-denied-wash:rgba(196,100,111,.14);
  --st-failed:#CF6A3C;   --st-failed-wash:rgba(207,106,60,.14);
  --st-critical:#E0483F; --st-critical-wash:rgba(224,72,63,.15);
  --st-neutral:#8B857A;  --st-neutral-wash:rgba(139,133,122,.13);

  --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 36px rgba(0,0,0,.46);
  --shadow-sm:0 1px 0 rgba(255,255,255,.02),0 4px 14px rgba(0,0,0,.34);
  --focus:#F1C364;
  --sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:14px; --r-md:12px; --r-sm:10px; --r-xs:6px;
  --sidebar:232px; --topbar:56px;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --panel-2:#FBF9F4;
  --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --gold-wash:rgba(139,94,26,.10); --gold-edge:rgba(139,94,26,.30);
  --st-allowed:#2F7A52;  --st-allowed-wash:rgba(47,122,82,.12);
  --st-proven:#20776B;   --st-proven-wash:rgba(32,119,107,.12);
  --st-approval:#2E5C96; --st-approval-wash:rgba(46,92,150,.12);
  --st-denied:#9B2F41;   --st-denied-wash:rgba(155,47,65,.11);
  --st-failed:#A34418;   --st-failed-wash:rgba(163,68,24,.11);
  --st-critical:#B01A12; --st-critical-wash:rgba(176,26,18,.12);
  --st-neutral:#6B665C;  --st-neutral-wash:rgba(107,102,92,.11);
  --shadow:0 1px 0 rgba(255,255,255,.7),0 14px 36px rgba(16,16,15,.09);
  --shadow-sm:0 1px 0 rgba(255,255,255,.6),0 3px 10px rgba(16,16,15,.07);
  --focus:#8B5E1A;
}}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --panel-2:#FBF9F4;
  --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --gold-wash:rgba(139,94,26,.10); --gold-edge:rgba(139,94,26,.30);
  --st-allowed:#2F7A52;  --st-allowed-wash:rgba(47,122,82,.12);
  --st-proven:#20776B;   --st-proven-wash:rgba(32,119,107,.12);
  --st-approval:#2E5C96; --st-approval-wash:rgba(46,92,150,.12);
  --st-denied:#9B2F41;   --st-denied-wash:rgba(155,47,65,.11);
  --st-failed:#A34418;   --st-failed-wash:rgba(163,68,24,.11);
  --st-critical:#B01A12; --st-critical-wash:rgba(176,26,18,.12);
  --st-neutral:#6B665C;  --st-neutral-wash:rgba(107,102,92,.11);
  --shadow:0 1px 0 rgba(255,255,255,.7),0 14px 36px rgba(16,16,15,.09);
  --shadow-sm:0 1px 0 rgba(255,255,255,.6),0 3px 10px rgba(16,16,15,.07);
  --focus:#8B5E1A;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-weight:400;overflow-x:hidden}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent-text)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
<style>
/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
#app[data-assistant="open"]{grid-template-columns:var(--sidebar) 1fr 348px}

/* sidebar */
.side{background:var(--void);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{padding:16px 18px 14px;border-bottom:1px solid var(--border)}
.ox-lockup{height:19px;width:auto;display:block;color:var(--fg)}
.orgsw{margin:12px 12px 4px;position:relative}
.sw{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--panel);text-align:left;transition:border-color .15s}
.sw:hover{border-color:var(--rule)}
.sw-mark{width:22px;height:22px;border-radius:var(--r-xs);background:var(--hl);border:1px solid var(--border);
  display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent-text);flex:none}
.sw-txt{min-width:0;flex:1}
.sw-k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600;line-height:1.3}
.sw-v{font-size:12.5px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.sw-car{color:var(--dim);flex:none}
.navsec{padding:14px 12px 4px}
.navsec-h{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:600;padding:0 10px 7px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);
  color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;position:relative;transition:background .12s,color .12s}
.nav a:hover{background:var(--hl);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--gold-wash);color:var(--gold-bright);font-weight:600}
:root[data-theme="light"] .nav a[aria-current="page"],
:root:not([data-theme="dark"]) .nav a[aria-current="page"]{color:var(--gold-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav a[aria-current="page"]{color:var(--gold-bright)}}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:2px;
  background:var(--gold);border-radius:0 2px 2px 0}
.nav svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.who{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r-sm);transition:background .12s}
.who:hover{background:var(--hl)}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:10.5px;font-weight:600;background:var(--hl);border:1px solid var(--border);color:var(--body)}
.who-t{min-width:0;text-align:left}
.who-n{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-r{font-size:10.5px;color:var(--dim);line-height:1.3}

/* main column + top bar */
.main{min-width:0;display:flex;flex-direction:column;background:var(--ink)}
.top{height:var(--topbar);flex:none;position:sticky;top:0;z-index:40;display:flex;align-items:center;
  gap:14px;padding:0 22px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--ink) 90%,transparent);backdrop-filter:blur(12px)}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--fg)}
.crumb .sep{color:var(--dim)}
.crumb .cur{color:var(--fg);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.kbtn{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:12px;transition:border-color .15s,color .15s}
.kbtn:hover{border-color:var(--rule);color:var(--fg)}
kbd{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:4px;background:var(--hl);
  border:1px solid var(--border);color:var(--dim)}
.ibtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
  display:grid;place-items:center;color:var(--muted);transition:border-color .15s,color .15s}
.ibtn:hover{border-color:var(--rule);color:var(--fg)}
.ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibtn[aria-pressed="true"]{border-color:var(--gold-edge);color:var(--accent-text);background:var(--gold-wash)}

.canvas{flex:1;min-width:0;padding:22px 24px 72px;max-width:1320px;width:100%}
</style>
<style>
/* ---------- typography + primitives ---------- */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);font-weight:600;margin:0 0 8px}
.eyebrow.q{color:var(--dim)}
h1{font-size:26px;line-height:1.12;letter-spacing:-.018em;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:16.5px;line-height:1.2;letter-spacing:-.01em;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:13.5px;font-weight:600;margin:0;letter-spacing:-.005em}
p{margin:0;color:var(--body)}
.lede{font-size:14.5px;color:var(--body);max-width:70ch;line-height:1.6}
.q{color:var(--muted)}
.qq{color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.wrapr{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.mla{margin-left:auto}

/* panels */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg)}
.panel-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-b{padding:16px}
.panel-b.flush{padding:0}
.panel-f{padding:11px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--muted)}
.sub{font-size:12px;color:var(--muted);margin-top:2px;max-width:76ch}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:999px;font-size:10.5px;
  font-weight:600;letter-spacing:.03em;border:1px solid var(--border);background:var(--hl);color:var(--muted);white-space:nowrap}
.chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.chip.allowed{color:var(--st-allowed);background:var(--st-allowed-wash);border-color:color-mix(in srgb,var(--st-allowed) 34%,transparent)}
.chip.proven{color:var(--st-proven);background:var(--st-proven-wash);border-color:color-mix(in srgb,var(--st-proven) 34%,transparent)}
.chip.approval{color:var(--st-approval);background:var(--st-approval-wash);border-color:color-mix(in srgb,var(--st-approval) 34%,transparent)}
.chip.denied{color:var(--st-denied);background:var(--st-denied-wash);border-color:color-mix(in srgb,var(--st-denied) 34%,transparent)}
.chip.failed{color:var(--st-failed);background:var(--st-failed-wash);border-color:color-mix(in srgb,var(--st-failed) 34%,transparent)}
.chip.critical{color:var(--st-critical);background:var(--st-critical-wash);border-color:color-mix(in srgb,var(--st-critical) 36%,transparent)}
.chip.neutral{color:var(--st-neutral);background:var(--st-neutral-wash);border-color:color-mix(in srgb,var(--st-neutral) 30%,transparent)}
.chip.mono{font-family:var(--mono);letter-spacing:0;font-weight:500}
.basis{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.01em;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--body);font-size:12.5px;font-weight:500;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--rule);color:var(--fg);background:var(--hl)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
/* exactly one gold action per screen */
.btn.primary{background:var(--gold);border-color:var(--gold);color:#10100F;font-weight:600}
.btn.primary:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#10100F}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hl);color:var(--fg);border-color:var(--border)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* segmented control */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;border:1px solid var(--border);background:var(--void);flex-wrap:wrap}
.seg button{padding:4px 10px;border-radius:7px;font-size:11.5px;font-weight:500;color:var(--muted);transition:background .12s,color .12s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow-sm)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px;font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .12s}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);font-weight:600;border-bottom-color:var(--gold)}
.tabs .cnt{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:5px}
</style>
<style>
/* ---------- tiles (the figures are the point of this page) ---------- */
.tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
  grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.tile{background:var(--panel);padding:13px 15px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile-k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tile-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:21px;font-weight:500;
  letter-spacing:-.025em;color:var(--fg);line-height:1.15}
.tile-v.sm{font-size:18px}
.tile-m{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:17px}
.delta{font-family:var(--mono);font-size:11px;font-weight:600}
.delta.dn{color:var(--st-failed)}.delta.up{color:var(--st-allowed)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel)}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--body);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-bottom:0;border-top:1px solid var(--rule);color:var(--fg);font-weight:500}
tbody tr.clickable{cursor:pointer;transition:background .1s}
tbody tr.clickable:hover{background:var(--hl)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.money{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--fg);white-space:nowrap;letter-spacing:-.01em}
td.strong{color:var(--fg);font-weight:500}
.cellsub{font-size:11px;color:var(--dim);margin-top:1px}
.rank{font-family:var(--mono);font-size:11px;color:var(--dim);width:1%}

/* bar inside a table cell */
.bar{height:6px;border-radius:3px;background:var(--hl);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--st-approval)}
.bar.gold>i{background:var(--gold)}
.bar.proven>i{background:var(--st-proven)}

/* meters (budgets) */
.meter{height:8px;border-radius:4px;background:var(--hl);overflow:hidden;position:relative;border:1px solid var(--border)}
.meter>i{display:block;height:100%;background:var(--st-approval);transition:width .3s}
.meter.warn>i{background:var(--st-failed)}
.meter.crit>i{background:var(--st-critical)}
.meter .notch{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--rule)}

/* stacked value bar */
.stack-bar{display:flex;height:34px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
.stack-bar>span{display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:#10100F;min-width:0;overflow:hidden;white-space:nowrap;padding:0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:9.5px;fill:var(--dim)}
.chart .glabel{font-family:var(--sans);font-size:10.5px;font-weight:600;fill:var(--muted)}
.chart .grid{stroke:var(--border);stroke-width:1}
.chartwrap{overflow-x:auto;padding:4px 2px 0}

/* note / callout */
.note{border:1px solid var(--border);border-left:2px solid var(--st-approval);background:var(--hl);
  border-radius:var(--r-sm);padding:11px 13px;font-size:12.5px;color:var(--body)}
.note.gold{border-left-color:var(--gold)}
.note.warn{border-left-color:var(--st-failed)}
.note.ok{border-left-color:var(--st-allowed)}
.note b{color:var(--fg);font-weight:600}

/* kv list */
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.kv dd{margin:0;color:var(--body);min-width:0;overflow-wrap:anywhere}
</style>
<style>
/* ---------- findings ---------- */
.lead-band{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:16px 18px;
  border:1px solid var(--gold-edge);background:linear-gradient(100deg,var(--gold-wash),transparent 62%);
  border-radius:var(--r-lg)}
.lead-n{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em;color:var(--fg);line-height:1}
.find-t td:first-child{width:1%}
.find-money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;
  color:var(--fg);letter-spacing:-.015em;white-space:nowrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,9,.62);backdrop-filter:blur(2px);z-index:80;
  opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="1"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);
  border-left:1px solid var(--border);z-index:81;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow)}
.drawer[data-open="1"]{transform:none}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.drawer-b{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;background:var(--void)}
.xbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.xbtn:hover{background:var(--hl);color:var(--fg)}
.xbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

/* spend findings: savings hero, ranked cards, evidence drawer, fix dialog */
.sv-hero{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.5fr);gap:18px 30px;align-items:end;padding:18px 20px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg)}
.sv-hero>*{min-width:0}
.sv-amt{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.sv-sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.sv-strip{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:9px}
.sv-strip i{display:block;height:100%;background:var(--st-approval);min-width:3px}
.sv-legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--muted)}
.sv-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--st-approval);margin-right:5px;vertical-align:-1px}
.sv-facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.sv-facts b{color:var(--fg)}
.fnd{display:grid;grid-template-columns:30px minmax(0,1fr) 220px;gap:14px;padding:14px 16px;border:1px solid var(--border);
  border-radius:var(--r-lg);background:var(--panel);transition:border-color .15s}
.fnd>*{min-width:0}
.fnd:hover{border-color:var(--rule)}
.fnd .rank{font-family:var(--mono);font-size:12px;color:var(--dim);padding-top:4px}
.fnd .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--fg)}
.fnd .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:6px 0 8px;flex-wrap:wrap}
.fnd .who a{color:var(--body);text-decoration:none}
.fnd .who a:hover{color:var(--fg);text-decoration:underline}
.av{width:20px;height:20px;border-radius:50%;background:var(--hl);border:1px solid var(--border);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--body);flex:none}
.fnd .why{margin:0 0 8px;font-size:12.5px;color:var(--body)}
.fnd .why code{font-family:var(--mono);font-size:.92em;background:var(--hl);padding:.1em .35em;border-radius:4px}
.fnd .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.fnd .amt{text-align:right;display:grid;gap:5px;align-content:start}
.fnd .amt .v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--fg)}
.fnd .amt .s{font-size:11px;color:var(--muted)}
.fnd .amt .bar{min-width:0}
.fnd .acts{display:flex;gap:7px;justify-content:flex-end;margin-top:4px}
@media(max-width:640px){.fnd{grid-template-columns:minmax(0,1fr)}.fnd .rank{display:none}.fnd .amt{text-align:left}.fnd .acts{justify-content:flex-start}.sv-hero{grid-template-columns:minmax(0,1fr)}.sv-amt{font-size:32px}}
.ev-runs th{font-size:10px}
.ev-chain{list-style:none;margin:0;padding:0;display:grid;gap:0}
.ev-chain li{position:relative;padding:0 0 12px 20px;border-left:1px solid var(--rule);margin-left:5px;font-size:12.5px;color:var(--body)}
.ev-chain li:last-child{border-left-color:transparent;padding-bottom:0}
.ev-chain li::before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--gold)}
.ev-chain .h{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:2px}

.ev-who .av{width:36px;height:36px;font-size:12.5px}
.ev-who a{text-decoration:none}
.ev-who a:hover{text-decoration:underline}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-text);font:inherit;cursor:pointer;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
pre.code{background:var(--void);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;overflow-x:auto;font-size:11.5px;line-height:1.55;color:var(--body);font-family:var(--mono);margin:0}
pre.code .c{color:var(--dim)}
pre.code .k{color:var(--gold)}

.fix-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.fix-two>*{min-width:0}
.fix-two .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px}
.dlg.wide{width:min(860px,calc(100vw - 32px))}
.drawer{width:min(760px,100%)}
.dlg-h .sub{margin-top:3px}

/* dialog */
.dlg{position:fixed;z-index:82;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);
  width:min(620px,calc(100vw - 32px));max-height:min(80vh,720px);background:var(--panel);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.dlg[data-open="1"]{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dlg-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}
.dlg-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dlg-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cmdinput{width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--border);background:none;
  font-size:14px;outline:none;color:var(--fg)}
.cmdlist{max-height:340px;overflow-y:auto;padding:6px}
.cmdrow{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);
  text-align:left;font-size:12.5px;color:var(--body);text-decoration:none}
.cmdrow:hover,.cmdrow:focus-visible{background:var(--hl);color:var(--fg)}
.cmdrow .grp{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}

/* assistant rail */
.asst{background:var(--void);border-left:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden}
.asst-h{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.asst-b{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:14px}
.msg{font-size:12.5px;line-height:1.55}
.msg .who-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:5px}
.msg.op .bubble{background:var(--hl);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;color:var(--body)}
.msg.ag .bubble{color:var(--body)}
.receipt{border:1px solid var(--border);background:var(--panel);border-radius:var(--r-sm);padding:10px 11px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.receipt b{color:var(--st-allowed);font-weight:600}
.asst-f{padding:12px;border-top:1px solid var(--border)}
.asst-in{width:100%;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--panel);font-size:12.5px;outline:none}
.asst-in:focus{border-color:var(--gold-edge)}

/* states: empty / loading / error / denied */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
  padding:64px 24px;max-width:520px;margin:0 auto}
.state-ico{width:46px;height:46px;border-radius:var(--r-md);display:grid;place-items:center;
  border:1px solid var(--border);background:var(--panel);color:var(--muted)}
.state-ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.state-ico.warn{color:var(--st-failed);border-color:color-mix(in srgb,var(--st-failed) 32%,transparent);background:var(--st-failed-wash)}
.state-ico.deny{color:var(--st-denied);border-color:color-mix(in srgb,var(--st-denied) 32%,transparent);background:var(--st-denied-wash)}
.state p{font-size:13px;color:var(--muted);max-width:56ch}
.sk{background:linear-gradient(90deg,var(--hl) 25%,var(--panel-2) 50%,var(--hl) 75%);
  background-size:240% 100%;animation:shim 1.5s linear infinite;border-radius:5px}
@keyframes shim{to{background-position:-240% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none;background:var(--hl)}}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* money: micro-USD -> display currency, rounded to cents once, half-even */
function money(micros,opts){
  const o = opts||{}, f = FX[CUR];
  const v = (micros/1e6)*f.rate;
  const dp = (CUR==="JPY")?0:2;
  const s = v.toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
  return (o.bare?"":f.sym)+s+(o.code?" "+f.code:"");
}
const money0 = m => money(m,{});
const mc = m => money(m,{code:true});               // with currency code
const pct = (n,d) => (n*100).toFixed(d===undefined?1:d)+"%";
const int = n => n.toLocaleString("en-US");
const tok = n => n>=1e9 ? (n/1e9).toFixed(2)+"B" : n>=1e6 ? (n/1e6).toFixed(1)+"M" : int(n);

function chip(text,cls){ return `<span class="chip ${cls||""}"><span class="dot"></span>${esc(text)}</span>`; }
function basis(b){ return `<span class="basis" title="How this number was measured">${esc(b)}</span>`; }
function barCell(v,max,cls){ const w=Math.max(1.2,(v/max)*100); return `<div class="bar ${cls||""}"><i style="width:${w.toFixed(2)}%"></i></div>`; }
function sevOf(s){ return s||"neutral"; }
const sum = a => a.reduce((x,y)=>x+y,0);

/* the currency banner, shown whenever display currency is not the ledger's */
function fxBanner(){
  if(CUR==="USD") return "";
  const f=FX[CUR];
  return `<div class="note"><b>Displayed in ${f.code}.</b> The ledger of record is USD micro-USD; conversion is display only and is
    never written back. Rate 1 USD = ${f.rate} ${f.code} · source <span class="mono">${esc(f.src)}</span> ·
    effective <span class="mono">${FX_AT}</span> from <span class="mono">cost.fx_rates</span>.</div>`;
}

/* ==================== router ==================== */
const ROUTES = {
  spend:["findings","attribution","value","operators","agents","tools","waste","reconciliation","budgets"]
};
let STATE = "loaded";            // loaded | empty | loading | error | denied
let ROUTE = {page:"spend",tab:"findings",sub:null};

function parseHash(){
  const h = (location.hash||"").replace(/^#\/?/,"").split("/").filter(Boolean);
  // acme / core-platform / spend / <tab> / <sub>   |   acme / billing
  if(h[1]==="billing") return {page:"billing"};
  if(h[1]==="organization") return {page:"organization"};
  if(h[1]==="audit") return {page:"audit"};
  const p = h[2]||"spend";
  if(p==="spend") return {page:"spend",tab:ROUTES.spend.includes(h[3])?h[3]:"findings",sub:h[4]||null};
  return {page:p,tab:null,sub:h[3]||null};
}
function go(hash){ location.hash = hash; }

window.addEventListener("hashchange",()=>{ ROUTE=parseHash(); render(); closeAll(); });

/* ==================== page titles ==================== */
const PAGE_TITLE = {spend:"Spend",billing:"Billing",fleet:"Fleet",run:"Run",agents:"Agents",
  tools:"Tools",ontology:"Ontology",steering:"Steering",organization:"Organization",audit:"Audit",runs:"Run"};

function crumbs(){
  const r=ROUTE, out=[];
  out.push(`<a href="#/acme/organization">Acme Robotics</a>`);
  const orgPage = ["billing","organization","audit"].includes(r.page);
  if(!orgPage){ out.push(`<span class="sep">/</span><a class="hide-s" href="#/acme/core-platform/fleet">core-platform</a>`); }
  const t = PAGE_TITLE[r.page]||r.page;
  out.push(`<span class="sep">/</span><span class="cur">${esc(t)}</span>`);
  if(r.page==="spend" && r.tab && r.tab!=="findings"){
    const lbl = {attribution:"Attribution",value:"Value",operators:"Operators",agents:"Agents",
      tools:"By tool",waste:"Wasted spend",reconciliation:"Reconciliation",budgets:"Budgets"}[r.tab];
    out.push(`<span class="sep">/</span><span class="cur hide-s">${esc(lbl)}</span>`);
  }
  return out.join("");
}

function setNav(){
  document.querySelectorAll(".nav a").forEach(a=>{
    const k=a.dataset.nav;
    const on = (k===ROUTE.page) || (k==="run"&&ROUTE.page==="runs");
    if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  $("#crumb").innerHTML = crumbs();
}

<script>
/* ==================== charts (inline SVG, one scale each) ==================== */

/* area+line over an index axis; optional vertical mark */
function lineChart(vals,o){
  o = Object.assign({w:820,h:190,pad:{t:14,r:16,b:26,l:40},min:null,max:null,
    fmt:v=>v.toFixed(0),ticks:4,color:"var(--st-approval)",fill:true,xlab:[],mark:null,markLabel:""},o||{});
  const {w,h,pad}=o, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const lo = o.min!==null?o.min:Math.min(...vals), hi = o.max!==null?o.max:Math.max(...vals);
  const span = (hi-lo)||1;
  const X = i => pad.l + (vals.length===1?iw/2:(i/(vals.length-1))*iw);
  const Y = v => pad.t + ih - ((v-lo)/span)*ih;
  const pts = vals.map((v,i)=>`${X(i).toFixed(2)},${Y(v).toFixed(2)}`);
  const line = "M"+pts.join("L");
  const area = `${line}L${X(vals.length-1).toFixed(2)},${(pad.t+ih).toFixed(2)}L${X(0).toFixed(2)},${(pad.t+ih).toFixed(2)}Z`;
  let g="",tl="";
  for(let i=0;i<=o.ticks;i++){
    const v = lo + (span*i/o.ticks), y=Y(v);
    g += `<line class="grid" x1="${pad.l}" y1="${y.toFixed(2)}" x2="${w-pad.r}" y2="${y.toFixed(2)}"/>`;
    tl += `<text x="${pad.l-7}" y="${(y+3.2).toFixed(2)}" text-anchor="end">${esc(o.fmt(v))}</text>`;
  }
  let xt="";
  o.xlab.forEach(([i,t])=>{ xt += `<text x="${X(i).toFixed(2)}" y="${h-8}" text-anchor="middle">${esc(t)}</text>`; });
  let mk="";
  if(o.mark!==null&&o.mark!==undefined){
    const mx=X(o.mark);
    mk = `<line x1="${mx.toFixed(2)}" y1="${pad.t-4}" x2="${mx.toFixed(2)}" y2="${pad.t+ih}"
            stroke="var(--st-failed)" stroke-width="1.25" stroke-dasharray="3 3"/>
          <circle cx="${mx.toFixed(2)}" cy="${Y(vals[o.mark]).toFixed(2)}" r="3.4" fill="var(--st-failed)" stroke="var(--panel)" stroke-width="1.5"/>`;
  }
  const last = vals.length-1;
  const end = `<circle cx="${X(last).toFixed(2)}" cy="${Y(vals[last]).toFixed(2)}" r="3.6"
      fill="${o.color}" stroke="var(--panel)" stroke-width="1.6"/>`;
  const gid = "g"+Math.random().toString(36).slice(2,8);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(o.aria||"trend")}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${o.color}" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="${o.color}" stop-opacity="0.02"/></linearGradient></defs>
    ${g}${tl}
    ${o.fill?`<path d="${area}" fill="url(#${gid})"/>`:""}
    <path d="${line}" fill="none" stroke="${o.color}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    ${mk}${end}${xt}</svg>`;
}

/* run waterfall: turn bars with a cumulative cost line */
function waterfall(run){
  const w=840,h=250,pad={t:18,r:52,b:52,l:52}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const n=run.t.length, bw=Math.min(62,(iw/n)*0.6), gap=iw/n;
  const maxTurn=Math.max(...run.t.map(t=>t.c)), total=run.t.reduce((a,b)=>a+b.c,0);
  const X=i=>pad.l+gap*i+gap/2, Yb=v=>pad.t+ih-(v/maxTurn)*ih, Yc=v=>pad.t+ih-(v/total)*ih;
  let g="",tl="";
  for(let i=0;i<=4;i++){ const v=maxTurn*i/4,y=Yb(v);
    g+=`<line class="grid" x1="${pad.l}" y1="${y.toFixed(2)}" x2="${w-pad.r}" y2="${y.toFixed(2)}"/>`;
    tl+=`<text x="${pad.l-7}" y="${(y+3.2).toFixed(2)}" text-anchor="end">${money(M(v),{}).replace(/,/g,"")}</text>`; }
  let bars="",labs="",cum=0;const cpts=[];
  run.t.forEach((t,i)=>{
    const x=X(i)-bw/2, y=Yb(t.c), bh=pad.t+ih-y;
    const fill = t.proof? "var(--st-proven)" : t.find? "var(--st-failed)" : "var(--st-approval)";
    bars+=`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(2,bh).toFixed(2)}"
      rx="3" fill="${fill}" opacity="${t.proof||t.find?".95":".78"}"><title>Turn ${t.n} · ${money0(M(t.c))} · cache ${t.cache.toFixed(1)}%</title></rect>`;
    labs+=`<text x="${X(i).toFixed(2)}" y="${(y-6).toFixed(2)}" text-anchor="middle" fill="var(--muted)">${t.cache.toFixed(0)}%</text>`;
    labs+=`<text x="${X(i).toFixed(2)}" y="${h-32}" text-anchor="middle" class="glabel">T${t.n}</text>`;
    labs+=`<text x="${X(i).toFixed(2)}" y="${h-18}" text-anchor="middle">${money(M(t.c),{}).replace(/,/g,"")}</text>`;
    cum+=t.c; cpts.push(`${X(i).toFixed(2)},${Yc(cum).toFixed(2)}`);
  });
  const cline=`<path d="M${cpts.join("L")}" fill="none" stroke="var(--gold)" stroke-width="1.8"
    stroke-dasharray="4 3" stroke-linejoin="round"/>`;
  const cdots=cpts.map(p=>{const[a,b]=p.split(",");return `<circle cx="${a}" cy="${b}" r="2.6" fill="var(--gold)"/>`}).join("");
  const rt=`<text x="${w-pad.r+8}" y="${(Yc(total)+3.2).toFixed(2)}" text-anchor="start" fill="var(--accent-text)">${money0(M(total))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Cost by turn with cumulative cost; turn 7 carries the proof frame">
    ${g}${tl}${bars}${cline}${cdots}${labs}${rt}</svg>`;
}

/* horizontal proportion bar */
function stackBar(parts){
  const tot=sum(parts.map(p=>p.v))||1;
  return `<div class="stack-bar">${parts.map(p=>{
    const s=(p.v/tot)*100;
    return `<span style="flex:${s} 0 0;background:${p.c};color:${p.fg||"#10100F"}" title="${esc(p.n)} — ${money0(p.v)}">${s>8?s.toFixed(1)+"%":""}</span>`;
  }).join("")}</div>`;
}
function legend(parts){
  return `<div class="legend">${parts.map(p=>`<span><i style="background:${p.c}"></i>${esc(p.n)} · <span class="mono m" data-micros="${p.v}"></span></span>`).join("")}</div>`;
}

<script>

      <div class="panel-b flush"><div class="tiles" style="border:0;border-radius:0">

        <div class="tile"><span class="tile-k">Verdict</span><span class="tile-v sm" style="color:var(--st-proven)">flipped</span><span class="tile-m">oracle <span class="mono">${r.oracle}</span></span></div>
        <div class="tile"><span class="tile-k">Productive ratio</span><span class="tile-v sm">${r.productive.toFixed(2)}</span><span class="tile-m">32 of 41 steps kept</span></div>
        <div class="tile"><span class="tile-k">Pull request</span><span class="tile-v sm" style="font-size:15px">${esc(r.pr.split("#")[1])}</span><span class="tile-m mono" style="font-size:11px">${esc(r.pr)}</span></div>
      </div></div>
    </div>

    <div class="panel">
      <div class="panel-h"><div class="stack"><h2>Cost by turn, accumulating</h2>
        <p class="sub">Bars are the turn's cost against the left scale; the gold line is cost accumulating to
          ${money0(r.total)}. The number above each bar is that turn's cache hit rate.</p></div></div>
      <div class="panel-b"><div class="chartwrap">${waterfall(r)}</div>
        <div class="legend" style="margin-top:10px">
          <span><i style="background:var(--st-approval)"></i>turn cost</span>
          <span><i style="background:var(--st-failed)"></i>turn carrying a finding</span>
          <span><i style="background:var(--st-proven)"></i>turn carrying the proof frame</span>

      </div>
      <div class="panel-b flush" style="border-top:1px solid var(--border)"><div class="tw"><table>
        <thead><tr><th>Turn</th><th>What happened</th><th class="r">Steps</th><th class="r">Cost</th><th class="r">Cumulative</th><th class="r">Cache</th><th>Pinned</th></tr></thead>
        <tbody>${r.t.map(t=>{cum+=t.c;return `<tr${t.proof||t.find?' style="background:var(--hl)"':""}>
          <td class="mono strong">T${t.n}</td><td class="q">${esc(t.note)}</td>
          <td class="r mono qq">${t.steps}</td><td class="money">${money0(M(t.c))}</td>
          <td class="money qq">${money0(M(cum))}</td><td class="r mono qq">${t.cache.toFixed(1)}%</td>

      ${money0(r.total)} of this run proven spend rather than unverified.</div>

  {t:"graph.search@1",        srv:"oxagen",    calls:9204, runs:2806, spend:M(2118.40), perCall:M(0.23), perRun:M(0.75),  note:"cheapest call on the belt; prefix cache hit 94%"},

function viewTools(){
  const rows=DB.tools, tools=rows.filter(r=>r.perCall!==null), total=sum(rows.map(r=>r.spend));
  const mxC=Math.max(...rows.map(r=>r.spend)), mxA=Math.max(...tools.map(r=>r.perCall)), mxR=Math.max(...tools.map(r=>r.perRun));
  const bar=(label,v,mx,text,cls,col)=>`<div class="stack g6" style="min-width:0">
      <div class="row g8" style="font-size:11.5px"><span class="mono q" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>
        <span class="mla mono" style="color:var(--fg);white-space:nowrap">${text}</span></div>
      <div class="bar ${cls||""}"><i style="width:${Math.max(1,Math.round(v/mx*100))}%${col?";background:"+col:""}"></i></div></div>`;
  const cum=[...rows].sort((a,b)=>b.spend-a.spend).map(r=>bar(r.t,r.spend,mxC,`${money0(r.spend)} <span class="qq">· ${pct(r.spend/total,0)}</span>`,"gold",r.perCall===null?"var(--st-neutral)":null)).join("");
  const avg=[...tools].sort((a,b)=>b.perCall-a.perCall).map(r=>bar(r.t,r.perCall,mxA,`${money0(r.perCall)} <span class="qq">per call</span>`,"proven")).join("");
  const run=[...tools].sort((a,b)=>b.perRun-a.perRun).map(r=>bar(r.t,r.perRun,mxR,`${money0(r.perRun)} <span class="qq">per run</span>`,"",`var(--st-approval)`)).join("");
  return `
  <div class="stack g16" style="margin-top:18px">
    <div class="split">
      <div class="panel"><div class="panel-h"><div class="stack"><h2>Cumulative · ${PERIOD}</h2><p class="sub">share of ${money0(total)}</p></div></div>
        <div class="panel-b stack g12">${cum}</div></div>
      <div class="panel"><div class="panel-h"><div class="stack"><h2>Average per call</h2><p class="sub">spend ÷ calls</p></div></div>
        <div class="panel-b stack g12">${avg}</div></div>
      <div class="panel"><div class="panel-h"><div class="stack"><h2>Average per run that used it</h2><p class="sub">spend ÷ runs</p></div></div>
        <div class="panel-b stack g12">${run}</div></div>
    </div>
    <div class="panel">
      <div class="panel-h"><div class="stack"><h2>By tool</h2><p class="sub">attributed per frame · ${basis("gateway_observed")}</p></div></div>
      <div class="panel-b flush"><div class="tw"><table>
        <thead><tr><th>Tool</th><th>Server</th><th class="r">Calls</th><th class="r">Runs</th><th class="r">Cumulative</th><th class="r">Share</th><th class="r">Avg per call</th><th class="r">Avg per run</th><th>What the frames say</th></tr></thead>
        <tbody>${rows.map(r=>{const hot=r.perCall!==null&&(r.perCall>=M(1.5)||r.perRun>=M(10));return `<tr>
          <td class="mono strong" style="font-size:12px">${esc(r.t)}</td><td class="mono qq" style="font-size:11px">${esc(r.srv)}</td>
          <td class="r mono qq">${r.calls===null?"—":int(r.calls)}</td><td class="r mono qq">${int(r.runs)}</td>
          <td class="money">${money0(r.spend)}</td><td class="r mono qq">${pct(r.spend/total,0)}</td>
          <td class="money">${r.perCall===null?'<span class="qq">—</span>':money0(r.perCall)}</td>
          <td class="money"${hot?' style="color:var(--st-approval);font-weight:600"':""}>${money0(r.perRun)}</td>
          <td class="q" style="font-size:12px;min-width:220px">${esc(r.note)}</td></tr>`;}).join("")}</tbody>
      </table></div></div>
      <div class="panel-f"><span class="q">A tool's spend is the turn that called it plus the turn that read its result, so a cheap-to-price tool with a large result body is an expensive tool. Registry prices are billed at zero here; this is what the model paid to use them.</span></div>
    </div>
  </div>`;
}

      `<button class="cmdrow" data-cmd="${CMDS.indexOf(c)}">${esc(c.t)}<span class="grp">${c.g}</span></button>`).join("")
      : `<div class="cmdrow" style="cursor:default;color:var(--dim)">Nothing matches “${esc(q)}”.</div>`;
  };
  paint("");
  $("#cmdIn").addEventListener("input",e=>paint(e.target.value));
}
function runCmd(i){
  const c=CMDS[+i]; closeAll();
  setTimeout(()=>{
    if(c.h) go(c.h);
    else if(c.f) openFinding(c.f);
    else if(c.d) openDlg(c.d);
    else if(c.c){ CUR=c.c; render(); }
    else if(c.a) toggleAsst(true);
  },180);
}

/* ==================== wiring ==================== */
document.addEventListener("click",e=>{
  const t=e.target;
  const close=t.closest("[data-close]"); if(close){ closeAll(); if(close.dataset.toast) toast(close.dataset.toast); return; }
  const cmd=t.closest("[data-cmd]"); if(cmd){ runCmd(cmd.dataset.cmd); return; }
  const find=t.closest("[data-find]"); if(find){ e.preventDefault(); const dg=$("#dlg"); dg.dataset.open="0"; dg.hidden=true; openFinding(find.dataset.find); return; }
  const fix=t.closest("[data-fix]"); if(fix){ e.preventDefault(); openDlg("fix",fix.dataset.fix); return; }
  const dlg=t.closest("[data-dlg]"); if(dlg){ e.preventDefault(); openDlg(dlg.dataset.dlg,dlg.dataset.inv); return; }
  const href=t.closest("[data-href]"); if(href){ go(href.dataset.href); return; }
  const dim=t.closest("[data-dim]"); if(dim){ ATTR_DIM=dim.dataset.dim; render(); return; }
  const op=t.closest("[data-op]"); if(op){ go("#/acme/core-platform/spend/operators/"+op.dataset.op); return; }
  const ag=t.closest("[data-ag]"); if(ag){ go("#/acme/core-platform/spend/agents/"+ag.dataset.ag); return; }
  const cur=t.closest("[data-cur]"); if(cur){ CUR=cur.dataset.cur; render(); return; }
  const act=t.closest("[data-act]"); if(act){ act.textContent="✓ "+act.dataset.act; act.disabled=true; return; }
  if(t.closest("#scrim")) closeAll();
  if(t.closest("#orgSw")||t.closest("#wsSw")||t.closest("#acctBtn")){ e.preventDefault(); openDlg("plan"); }
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); return; }
  if(e.key==="Escape"){ closeAll(); document.body.removeAttribute("data-nav"); return; }
  if(e.key==="Enter"||e.key===" "){
    const r=e.target.closest("tr.clickable,[role=button]");
    if(r&&r.tagName!=="BUTTON"&&r.tagName!=="A"){ e.preventDefault(); r.click(); }
  }
});
$("#cmdBtn").onclick=openCmd;
$("#asstBtn").onclick=()=>toggleAsst();
$("#navToggle").onclick=()=>{ const b=document.body;
  b.hasAttribute("data-nav")?b.removeAttribute("data-nav"):b.setAttribute("data-nav","open"); };
document.querySelectorAll(".nav a").forEach(a=>a.addEventListener("click",()=>document.body.removeAttribute("data-nav")));

/* mockup chrome */
$("#mockH").onclick=()=>{ const m=$("#mock"); const min=m.dataset.min==="1";
  m.dataset.min=min?"0":"1"; $("#mockCar").textContent=min?"▾":"▸"; $("#mockH").setAttribute("aria-expanded",String(min)); };
$("#mgState").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setState(b.dataset.state); });
$("#mgWidth").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#mgWidth button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  if(b.dataset.width==="phone") document.body.dataset.width="phone"; else delete document.body.dataset.width; });
$("#mgTheme").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#mgTheme button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  const v=b.dataset.theme;
  if(v==="system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",v); });

/* boot — at rest on the flow's first screen */
if(!location.hash) location.replace("#/acme/core-platform/spend/findings");
ROUTE=parseHash();
render();
</script>

<!-- list-controls: search · sort · column filters · rows per page · pager -->
<style>
/* List controls: search, column filters, rows per page, sortable headers, pager.
   Colors derive from the page's own text color so the block reads correctly in
   every mockup theme; only the accent leans on --gold. */
.lt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));font-family:inherit;font-size:12.5px}
.lt.free{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:10px;margin-bottom:10px}
.lt .lt-q{flex:1 1 200px;min-width:140px;background:color-mix(in srgb,currentColor 5%,transparent);border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:8px;padding:6px 10px;font-size:12.5px;color:inherit;outline:none;font-family:inherit;transition:border-color .12s}
.lt .lt-q:focus{border-color:var(--gold,#D6962C)}
.lt .lt-q::placeholder{color:inherit;opacity:.5}
.lt select{appearance:auto;background:color-mix(in srgb,currentColor 5%,transparent);border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:8px;padding:5px 8px;font-size:12px;color:inherit;outline:none;font-family:inherit;max-width:220px;transition:border-color .12s}
.lt select:focus{border-color:var(--gold,#D6962C)}
.lt .lt-rows{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted,inherit);white-space:nowrap;margin-left:auto}
.lp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;font-size:11.5px;color:var(--muted,inherit);font-family:inherit}
.lp.free{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:10px;margin-top:10px}
.lp .lp-n{font-family:var(--mono,ui-monospace,monospace);font-variant-numeric:tabular-nums;opacity:.85}
.lp .lp-pg{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lp .lp-b{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));background:color-mix(in srgb,currentColor 5%,transparent);color:inherit;border-radius:7px;padding:2px 8px;min-width:28px;font-size:12px;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.5;transition:border-color .12s}
.lp .lp-b:hover{border-color:color-mix(in srgb,currentColor 35%,transparent)}
.lp .lp-b[aria-current="page"]{border-color:var(--gold,#D6962C);color:var(--gold,#D6962C)}
.lp .lp-b:disabled{opacity:.4;cursor:default}
.lp .lp-pg .el{padding:0 4px;opacity:.6}
th.sortable{cursor:pointer;user-select:none}
th.sortable::after{content:"↕";margin-left:5px;opacity:.35;font-size:10px}
th.sortable[aria-sort="ascending"]::after{content:"↑";color:var(--gold,#D6962C);opacity:1}
th.sortable[aria-sort="descending"]::after{content:"↓";color:var(--gold,#D6962C);opacity:1}
.lt-empty td{opacity:.6;text-align:center;padding:18px}
@media (max-width:520px){.lt .lt-q{flex-basis:100%}.lt .lt-rows{margin-left:0}}
</style>
<script>
/* ============================== List controls ============================== */
/* Self-contained: every table with a thead gets a search box, sortable column
   headers, a filter select for each column that is a small enumeration, a
   rows-per-page select and a pager. Installs itself through a DOM observer so
   it works with any render path; state is keyed by page + column signature so
   a full re-render lands back on the same page, sort and query. */
(function(){
"use strict";
if(window.__ltInstalled)return; window.__ltInstalled=true;
var STORE={}, PER=[5,10,25,50,0], BUSY=false, TIMER=null;
var FACET=/status|state|tier|kind|role|risk|severity|result|health|effect|mode|side|level|verdict|decision|origin|scope|period|basis|algorithm|trend|position|governance|two-factor|sso|replay|grade|outcome/i;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(s){
  s=String(s==null?"":s).trim();
  if(!s||/^\d{4}-\d{2}/.test(s))return null;
  var c=s.replace(/[$,%×]/g,""), m=c.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);
  if(!m)return null;
  var n=parseFloat(m[0]), u=c.slice(m[0].length).match(/^\s*([kKMB])(?![A-Za-z])/);
  if(u){ if(u[1]==="k"||u[1]==="K")n*=1e3; else if(u[1]==="M")n*=1e6; else n*=1e9; }
  return n;
}
function cmp(a,b,isNum,dir){
  if(isNum){var x=a.n,y=b.n; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; if(x!==y)return (x-y)*dir;}
  return a.t.localeCompare(b.t,undefined,{numeric:true,sensitivity:"base"})*dir;
}
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function pageCtx(){var h1=document.querySelector("main h1, .page h1, h1"); return location.hash+"|"+(h1?h1.textContent.trim().slice(0,40):"");}
function state(sig,ord){var key=pageCtx()+"|"+sig+"#"+ord; return STORE[key]||(STORE[key]={q:"",sort:null,dir:1,per:10,page:1,f:{}});}

function pager(st,total,onPage){
  var per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  var from=total?((st.page-1)*per+1):0, to=Math.min(total,st.page*per);
  var html='<div class="lp"><span class="lp-n">'+(total?from+'–'+to+' of '+total:'0 of 0')+'</span><span class="lp-pg">'+
   '<button type="button" class="lp-b" data-p="prev" aria-label="Previous page"'+(st.page<=1?' disabled':'')+'>‹</button>';
  var nums=[]; if(pages<=7){for(var i=1;i<=pages;i++)nums.push(i);} else {
    nums=[1]; var lo=Math.max(2,st.page-1), hi=Math.min(pages-1,st.page+1);
    if(lo>2)nums.push("…"); for(var j=lo;j<=hi;j++)nums.push(j); if(hi<pages-1)nums.push("…"); nums.push(pages);}
  nums.forEach(function(p){html+= p==="…"?'<span class="el">…</span>':'<button type="button" class="lp-b" data-p="'+p+'"'+(p===st.page?' aria-current="page"':'')+'>'+p+'</button>';});
  html+='<button type="button" class="lp-b" data-p="next" aria-label="Next page"'+(st.page>=pages?' disabled':'')+'>›</button></span></div>';
  var lp=el(html);
  lp.addEventListener("click",function(e){var b=e.target.closest("button[data-p]"); if(!b||b.disabled)return; e.stopPropagation(); var p=b.getAttribute("data-p");
    st.page = p==="prev"?st.page-1 : p==="next"?st.page+1 : +p; onPage();});
  return lp;
}
function bar(st,opts,apply){
  var html='<div class="lt"><input class="lt-q" type="search" placeholder="'+esc(opts.ph)+'" aria-label="'+esc(opts.ph)+'" value="'+esc(st.q)+'">';
  (opts.filters||[]).forEach(function(f){
    html+='<select class="lt-f" data-k="'+esc(f.key)+'" aria-label="Filter by '+esc(f.label)+'"><option value="">All · '+esc(f.label)+'</option>'+
      f.values.map(function(v){return '<option value="'+esc(v)+'"'+(st.f[f.key]===v?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';});
  html+='<label class="lt-rows">Rows<select class="lt-per">'+PER.map(function(p){return '<option value="'+p+'"'+(st.per===p?' selected':'')+'>'+(p||"All")+'</option>';}).join("")+'</select></label></div>';
  var b=el(html);
  b.addEventListener("click",function(e){e.stopPropagation();});
  b.querySelector(".lt-q").addEventListener("input",function(e){st.q=e.target.value;st.page=1;apply();});
  b.querySelectorAll(".lt-f").forEach(function(s){s.addEventListener("change",function(e){st.f[s.getAttribute("data-k")]=e.target.value;st.page=1;apply();});});
  b.querySelector(".lt-per").addEventListener("change",function(e){st.per=+e.target.value;st.page=1;apply();});
  return b;
}
/* A column earns a filter when it is a small enumeration: 2–8 distinct short
   values across at least 4 rows, and not unique per row. At most three per list. */
function facets(cols,vals,rows){
  if(rows<4)return [];
  var c=cols.filter(function(col){ if(!col.name||col.num)return false;
    var set={},n=0,ok=true; vals.forEach(function(v){var t=v[col.i].t; if(!t)return; if(t.length>28)ok=false; if(!set[t]){set[t]=1;n++;}});
    if(!ok||n<2||n>8||n>=rows)return false; col.values=Object.keys(set).sort(); return true;});
  c.sort(function(a,b){var pa=FACET.test(a.name)?0:1,pb=FACET.test(b.name)?0:1; return pa-pb||a.values.length-b.values.length;});
  return c.slice(0,3).map(function(col){return {key:String(col.i),label:col.name,values:col.values};});
}
function sigOf(table){return [].slice.call(table.tHead.rows[0].cells).map(function(c){return c.textContent.trim();}).join("/");}
function enhance(table,ord){
  var tbody=table.tBodies[0], rows=[].slice.call(tbody.rows);
  var ths=[].slice.call(table.tHead.rows[0].cells);
  var cols=ths.map(function(th,i){return {i:i,name:th.textContent.trim(),num:th.classList.contains("num")};});
  var st=state(sigOf(table),ord);
  var vals=rows.map(function(r){return cols.map(function(c){var cell=r.cells[c.i]; var t=cell?cell.textContent.replace(/\s+/g," ").trim():""; return {t:t,n:num(t)};});});
  cols.forEach(function(c){ if(c.num)return; var k=0,tot=0; vals.forEach(function(v){if(v[c.i].t){tot++; if(v[c.i].n!=null)k++;}}); if(tot&&k/tot>=.6)c.num=true; });
  var texts=rows.map(function(r){return r.textContent.replace(/\s+/g," ").toLowerCase();});
  var fs=facets(cols,vals,rows.length);
  var wrap=table.parentNode, host=wrap.parentNode, ph="Search this list";
  if(!host||wrap===document.body){wrap=table;host=table.parentNode;}
  /* A lone search box sitting directly above the table becomes the list's search. */
  var prev=wrap.previousElementSibling;
  if(prev&&!prev.matches("table,thead,tbody")){
    var ins=prev.querySelectorAll("input,select,button,a,textarea");
    var inp=prev.matches("input")?prev:prev.querySelector("input[placeholder^='Search']");
    if(inp&&inp.placeholder&&/^Search/.test(inp.placeholder)&&ins.length<=1&&!prev.textContent.trim()){ph=inp.placeholder;prev.remove();}
  }
  var free=!/panel|card|box/.test(host.className||"");
  var b=bar(st,{ph:ph,filters:fs},apply), lp=document.createElement("div");
  if(free)b.classList.add("free");
  host.insertBefore(b,wrap); host.insertBefore(lp,wrap.nextSibling);
  ths.forEach(function(th,i){ if(!cols[i].name)return; th.classList.add("sortable"); th.tabIndex=0; th.setAttribute("role","button");
    function tog(e){ if(e)e.stopPropagation(); if(st.sort===i){ if(st.dir===1)st.dir=-1; else {st.sort=null;st.dir=1;} } else {st.sort=i;st.dir=1;} st.page=1; apply(); }
    th.addEventListener("click",tog); th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog(e);}}); });
  function apply(){
    ths.forEach(function(th,i){ if(!cols[i].name)return; th.setAttribute("aria-sort",st.sort===i?(st.dir===1?"ascending":"descending"):"none"); });
    var q=st.q.trim().toLowerCase();
    var idx=rows.map(function(_,i){return i;}).filter(function(i){
      if(q&&texts[i].indexOf(q)<0)return false;
      for(var k in st.f){ if(st.f[k]&&vals[i][+k]&&vals[i][+k].t!==st.f[k])return false; } return true; });
    if(st.sort!=null&&cols[st.sort]){var c=cols[st.sort]; idx.sort(function(a,b){return cmp(vals[a][c.i],vals[b][c.i],c.num,st.dir)||(a-b);});}
    var total=idx.length, per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per)); if(st.page>pages)st.page=pages;
    var slice=st.per?idx.slice((st.page-1)*st.per,st.page*st.per):idx;
    BUSY=true;
    while(tbody.firstChild)tbody.removeChild(tbody.firstChild);
    if(!slice.length){var tr=document.createElement("tr"),td=document.createElement("td");tr.className="lt-empty";td.colSpan=cols.length;td.textContent="No rows match.";tr.appendChild(td);tbody.appendChild(tr);}
    slice.forEach(function(i){tbody.appendChild(rows[i]);});
    var nlp=pager(st,total,apply); lp.replaceWith(nlp); lp=nlp; if(free)lp.classList.add("free");
    BUSY=false;
  }
  apply();
}
function run(){
  BUSY=true;
  try{
    var ords={};
    [].slice.call(document.querySelectorAll("table")).forEach(function(t){
      if(!t.tHead||!t.tHead.rows[0]||!t.tBodies[0]||t.closest("[data-lt-skip]"))return;
      if([].slice.call(t.tHead.rows[0].cells).some(function(c){return c.colSpan>1;}))return;
      var sig=sigOf(t), ord=ords[sig]||0; ords[sig]=ord+1;
      if(t.getAttribute("data-lt"))return;
      t.setAttribute("data-lt","1"); enhance(t,ord);
    });
  } finally { BUSY=false; }
}
new MutationObserver(function(muts){
  if(BUSY)return;
  for(var i=0;i<muts.length;i++){ if(muts[i].addedNodes.length){ clearTimeout(TIMER); TIMER=setTimeout(run,0); return; } }
}).observe(document.documentElement,{childList:true,subtree:true});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run); else run();
window.listify=run;
})();
</script>
