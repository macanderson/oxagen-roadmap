<title>It learned, you approved, it changed</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

/* ── Oxagen house tokens · dark is the default ───────────────────────── */
:root{
  color-scheme: dark light;
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C;
  --border:#292722; --rule:#34322D;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A;
  --accent-text:#D6962C; --on-gold:#10100F;
  --gold-sheen:linear-gradient(45deg,#8B5E1A 0%,#D6962C 38%,#F1C364 56%,#D6962C 74%,#8B5E1A 100%);
  --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 44px rgba(0,0,0,.5);
  --shadow-sm:0 1px 0 rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.35);
  /* semantic state scale — never gold, never overlapping identity */
  --s-allowed:#66A77B; --s-approval:#6C9BD2; --s-denied:#C96A4E;
  --s-proven:#4FA88C; --s-failed:#D0574B; --s-critical:#E0483A;
  --s-queued:#7C776E; --s-running:#8E86D8;
  --add-bg:rgba(102,167,123,.11); --del-bg:rgba(201,106,78,.11);
  --new-bg:rgba(214,150,44,.10);
  --font:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
  --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(16,16,15,.06);
  --s-allowed:#2F6B45; --s-approval:#2C5C8F; --s-denied:#9B4426;
  --s-proven:#1F6B58; --s-failed:#A83428; --s-critical:#B02D1E;
  --s-queued:#6B665C; --s-running:#5A51A8;
  --add-bg:rgba(47,107,69,.10); --del-bg:rgba(155,68,38,.10);
  --new-bg:rgba(139,94,26,.10);
}}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
  --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(16,16,15,.06);
  --s-allowed:#2F6B45; --s-approval:#2C5C8F; --s-denied:#9B4426;
  --s-proven:#1F6B58; --s-failed:#A83428; --s-critical:#B02D1E;
  --s-queued:#6B665C; --s-running:#5A51A8;
  --add-bg:rgba(47,107,69,.10); --del-bg:rgba(155,68,38,.10);
  --new-bg:rgba(139,94,26,.10);
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--ink);color:var(--body);font-family:var(--font);font-weight:400;
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,h4{font-weight:600;color:var(--fg);margin:0;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}
code{font-family:var(--mono);font-size:.88em;background:var(--hl);padding:.1em .35em;
     border-radius:4px;color:var(--fg);border:1px solid var(--border)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
     color:var(--accent-text);margin:0 0 10px}
.eyebrow.q{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ── frame + shell ──────────────────────────────────────────────────── */
#stage{min-height:100vh;background:var(--ink);transition:background .2s}
.frame{container-type:inline-size;width:100%;background:var(--ink)}
body.phone #stage{background:var(--void);padding:26px 12px 90px;display:flex;justify-content:center;align-items:flex-start}
body.phone .frame{width:400px;max-width:100%;height:840px;overflow:auto;border:1px solid var(--rule);
  border-radius:20px;box-shadow:var(--shadow);scrollbar-width:thin}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh;align-items:start}
body.phone .app{min-height:838px}

/* ── sidebar ────────────────────────────────────────────────────────── */
.side{border-right:1px solid var(--border);background:var(--void);min-height:100vh;
  position:sticky;top:0;display:flex;flex-direction:column;padding:14px 0 10px}
body.phone .side{min-height:0}
.brand{padding:2px 16px 16px;display:flex;align-items:center}
.brand svg{height:19px;width:auto;color:var(--fg)}
.switcher{margin:0 10px 4px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
.sw{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;text-align:left}
.sw+.sw{border-top:1px solid var(--border)}
.sw:hover{background:var(--hl)}
.sw-av{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;letter-spacing:.02em}
.sw-av.org{background:var(--gold-sheen);color:#10100F}
.sw-av.ws{background:var(--hl);border:1px solid var(--rule);color:var(--muted);font-family:var(--mono)}
.sw-t{min-width:0;flex:1;display:block}
.sw-k{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);line-height:1.35}
.sw-v{display:block;font-size:12.5px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.sw-c{color:var(--dim);flex:0 0 auto}
.nav{padding:12px 10px 0;overflow-y:auto;flex:1}
.nav-h{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  padding:10px 8px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:9px;padding:6.5px 9px;border-radius:8px;
  color:var(--muted);font-size:13px;font-weight:500;margin-bottom:1px}
.nav a:hover{background:var(--hl);color:var(--fg)}
.nav a.on{background:var(--hl);color:var(--fg)}
.nav a.on .ni{color:var(--gold)}
.ni{width:15px;height:15px;flex:0 0 auto;color:var(--dim)}
.nav a .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);
  background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.nav a.on .cnt{color:var(--body)}
.side-foot{padding:10px 16px 2px;border-top:1px solid var(--border);margin:8px 10px 0}
.side-foot .ln{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
  font-family:var(--mono);padding:2px 0}
.side-foot .ln b{color:var(--muted);font-weight:500}

/* ── topbar ─────────────────────────────────────────────────────────── */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ink) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:9px 18px;min-height:49px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
  min-width:0;overflow:hidden;white-space:nowrap}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--dim)}
.crumbs .cur{color:var(--fg);font-weight:500}
.top-sp{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
  border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted);font-weight:500}
.tbtn:hover{background:var(--hl);color:var(--fg)}
.tbtn.on{color:var(--fg);border-color:var(--rule)}
.tbtn kbd{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--border);
  border-radius:4px;padding:0 3px;background:var(--ink)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;
  font-weight:700;background:var(--hl);border:1px solid var(--rule);color:var(--body);flex:0 0 auto}

/* ── page ───────────────────────────────────────────────────────────── */
.page{padding:22px 26px 90px;max-width:1280px;width:100%}
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:4px}
.phead h1{font-size:23px;line-height:1.2}
.phead .sub{color:var(--muted);font-size:13px;margin-top:5px;max-width:74ch}
.phead-a{margin-left:auto;display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:18px 0 20px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 12px;font-size:13px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs a:hover{color:var(--fg)}
.tabs a.on{color:var(--fg);border-bottom-color:var(--gold)}
.tabs .n{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--panel);
  border:1px solid var(--border);border-radius:5px;padding:0 4px}

/* ── buttons ────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel);
  border-radius:9px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--body);white-space:nowrap}
.btn:hover{background:var(--hl);color:var(--fg);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.gold:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#10100F}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn[disabled]:hover{background:var(--panel);color:var(--body);border-color:var(--border)}
.btn .ni{color:currentColor;width:14px;height:14px}

/* ── panels + tables ───────────────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.panel+.panel{margin-top:16px}
.ph{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border);background:var(--hl)}
.ph h3{font-size:13.5px}
.ph .sp{flex:1}
.ph .note{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.pb{padding:15px}
.pb.flush{padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:16px;align-items:start}
.split.rev{grid-template-columns:356px minmax(0,1fr)}
.tw{overflow-x:auto;scrollbar-width:thin}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--hl)}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hl)}
td .t1{color:var(--fg);font-weight:500}
td .t2{color:var(--muted);font-size:12px;margin-top:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── badges ─────────────────────────────────────────────────────────── */
.b{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.02em;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap;
  background:var(--panel);color:var(--muted);border-color:var(--border)}
.b.dot::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.b.allowed{color:var(--s-allowed);border-color:color-mix(in srgb,var(--s-allowed) 40%,transparent);background:color-mix(in srgb,var(--s-allowed) 12%,transparent)}
.b.proven {color:var(--s-proven); border-color:color-mix(in srgb,var(--s-proven) 40%,transparent); background:color-mix(in srgb,var(--s-proven) 12%,transparent)}
.b.approval{color:var(--s-approval);border-color:color-mix(in srgb,var(--s-approval) 40%,transparent);background:color-mix(in srgb,var(--s-approval) 12%,transparent)}
.b.denied{color:var(--s-denied);border-color:color-mix(in srgb,var(--s-denied) 40%,transparent);background:color-mix(in srgb,var(--s-denied) 12%,transparent)}
.b.failed{color:var(--s-failed);border-color:color-mix(in srgb,var(--s-failed) 40%,transparent);background:color-mix(in srgb,var(--s-failed) 12%,transparent)}
.b.critical{color:var(--s-critical);border-color:color-mix(in srgb,var(--s-critical) 52%,transparent);background:color-mix(in srgb,var(--s-critical) 14%,transparent);font-weight:600}
.b.running{color:var(--s-running);border-color:color-mix(in srgb,var(--s-running) 40%,transparent);background:color-mix(in srgb,var(--s-running) 12%,transparent)}
.b.queued{color:var(--s-queued);border-color:var(--border)}
.b.new{color:var(--accent-text);border-color:color-mix(in srgb,var(--gold) 46%,transparent);background:var(--new-bg);font-weight:600}
.b.lg{font-size:11.5px;padding:3px 9px}

/* ── record statement blocks ───────────────────────────────────────── */
.stmt{color:var(--fg);font-size:13.5px;line-height:1.55}
.lin{font-family:var(--mono);font-size:11.5px;color:var(--accent-text)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:7px}
.meta b{color:var(--muted);font-weight:500}
.effect{display:flex;gap:14px;flex-wrap:wrap;min-width:196px}
.ef{min-width:62px}
.ef .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.ef .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--fg);margin-top:2px}
.ef .v.up{color:var(--s-proven)} .ef .v.down{color:var(--s-failed)} .ef .v.flat{color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--hl);overflow:hidden;margin-top:6px;min-width:110px}
.bar i{display:block;height:100%;background:var(--s-proven);border-radius:2px}
.bar i.pre{background:var(--s-queued)}

/* ── code / diff ────────────────────────────────────────────────────── */
pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--body);
  overflow-x:auto;scrollbar-width:thin}
.code{background:var(--ink);border:1px solid var(--border);border-radius:10px;padding:13px 15px;overflow-x:auto}
.diff{background:var(--ink);border-top:1px solid var(--border);font-family:var(--mono);font-size:12px;line-height:1.62}
.diff .fl{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--hl);
  border-bottom:1px solid var(--border);font-size:12px}
.diff .fl .p{color:var(--fg);font-weight:500}
.diff .rows{overflow-x:auto;scrollbar-width:thin}
.dl{display:flex;min-width:max-content}
.dl .g{flex:0 0 46px;text-align:right;padding:0 9px;color:var(--dim);user-select:none;
  font-variant-numeric:tabular-nums;border-right:1px solid var(--border)}
.dl .c{padding:0 14px;white-space:pre;color:var(--body)}
.dl.add{background:var(--add-bg)} .dl.add .c{color:var(--fg)}
.dl.add .c::first-letter{color:var(--s-allowed)}
.dl.del{background:var(--del-bg)}
.dl.hunk{background:var(--hl)} .dl.hunk .c{color:var(--muted)}

/* ── check runs ─────────────────────────────────────────────────────── */
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border)}
.chk:last-child{border-bottom:none}
.chk .ic{width:17px;height:17px;flex:0 0 auto;margin-top:1px;display:grid;place-items:center;border-radius:50%}
.chk .ic svg{width:17px;height:17px}
.chk .nm{color:var(--fg);font-weight:500;font-size:13px;font-family:var(--mono)}
.chk .ds{color:var(--muted);font-size:12px;margin-top:3px}
.chk .tm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 auto}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid color-mix(in srgb,var(--s-running) 30%,transparent);
  border-top-color:var(--s-running);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mergebar{display:flex;align-items:center;gap:12px;padding:14px 15px;border-top:1px solid var(--border);background:var(--hl)}
.mergebar .ttl{font-weight:600;color:var(--fg);font-size:13.5px}
.mergebar .ds{font-size:12px;color:var(--muted);margin-top:2px}

/* ── timeline / frames ──────────────────────────────────────────────── */
.frames{max-height:560px;overflow-y:auto;scrollbar-width:thin}
.fr{display:flex;gap:10px;padding:8px 13px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.fr:hover{background:var(--hl)}
.fr.on{background:var(--hl);box-shadow:inset 2px 0 0 var(--gold)}
.fr .sq{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 26px;text-align:right;padding-top:1px}
.fr .kd{font-family:var(--mono);font-size:11.5px;color:var(--fg)}
.fr .sm{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:12.5px}
.kv dt{color:var(--dim);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.kv dd{margin:0;color:var(--body);font-family:var(--mono);font-size:11.5px;word-break:break-word}
.kv dd b{color:var(--fg);font-weight:500}
.steerblk{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--ink)}
.steerblk .r{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.steerblk .r:last-child{border-bottom:none}
.steerblk .r.hit{background:var(--new-bg);box-shadow:inset 2px 0 0 var(--gold)}
.steerblk .r .lin{flex:1;min-width:160px}

/* ── callout ────────────────────────────────────────────────────────── */
.call{border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--new-bg);
  border-radius:11px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.call .ni{color:var(--gold);margin-top:1px}
.call .tx{font-size:12.5px;color:var(--body);line-height:1.55}
.call .tx b{color:var(--fg);font-weight:600}
.note-i{border:1px solid var(--border);background:var(--ink);border-radius:10px;padding:11px 13px;
  font-size:12px;color:var(--muted);line-height:1.55}
.note-i b{color:var(--fg);font-weight:500}

/* ── flow rail ──────────────────────────────────────────────────────── */
.rail{display:flex;align-items:center;gap:0;padding:10px 14px;background:var(--panel);
  border:1px solid var(--border);border-radius:11px;overflow-x:auto;scrollbar-width:thin;margin-bottom:18px}
.rail .st{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:7px;white-space:nowrap;
  font-size:12px;color:var(--dim);font-weight:500}
.rail .st .d{width:7px;height:7px;border-radius:50%;background:var(--rule);flex:0 0 auto}
.rail .st.done{color:var(--muted)} .rail .st.done .d{background:var(--s-proven)}
.rail .st.now{color:var(--fg);background:var(--hl)} .rail .st.now .d{background:var(--gold)}
.rail .ar{color:var(--rule);flex:0 0 auto;padding:0 1px}

/* ── dialog ─────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,10,9,.66);backdrop-filter:blur(3px);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 16px;overflow-y:auto}
.dlg{background:var(--panel);border:1px solid var(--rule);border-radius:14px;width:100%;max-width:640px;
  box-shadow:var(--shadow);overflow:hidden}
.dlg.wide{max-width:760px}

.dlg-b{padding:17px;max-height:min(58vh,540px);overflow-y:auto;scrollbar-width:thin}
.dlg-f{display:flex;gap:9px;align-items:center;padding:13px 17px;border-top:1px solid var(--border);background:var(--hl)}
.dlg-f .sp{flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--dim);margin-top:5px}
.inp{width:100%;background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 11px;
  color:var(--fg);font-family:var(--mono);font-size:12.5px}
.inp:focus{outline:2px solid var(--gold-bright);outline-offset:-1px;border-color:var(--gold)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--ink);
  border:1px solid var(--border);color:var(--body)}
.chip.deny{color:var(--s-denied);border-color:color-mix(in srgb,var(--s-denied) 36%,transparent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--ink)}
.seg button{padding:6px 12px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--hl);color:var(--fg);font-weight:500}
.seg button[disabled]{opacity:.4;cursor:not-allowed}

/* ── command menu ───────────────────────────────────────────────────── */
.cmd{background:var(--panel);border:1px solid var(--rule);border-radius:13px;width:100%;max-width:560px;
  box-shadow:var(--shadow);overflow:hidden}
.cmd-i{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.cmd-i input{flex:1;background:none;border:none;color:var(--fg);font-size:15px;font-family:var(--font)}
.cmd-i input:focus{outline:none}
.cmd-l{max-height:340px;overflow-y:auto;padding:6px}
.cmd-g{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:9px 10px 5px;font-weight:600}
.cmd-r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;width:100%;text-align:left;font-size:13px}
.cmd-r:hover,.cmd-r.on{background:var(--hl)}
.cmd-r .ni{color:var(--dim)}
.cmd-r .h{color:var(--fg)}
.cmd-r .sub{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

/* ── assistant panel ────────────────────────────────────────────────── */
.asst{position:fixed;top:0;right:0;bottom:0;width:352px;max-width:100%;background:var(--panel);
  border-left:1px solid var(--rule);z-index:60;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.asst-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--border)}
.asst-b{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.msg{font-size:13px;line-height:1.6}
.msg.u{background:var(--hl);border:1px solid var(--border);border-radius:10px;padding:9px 11px;color:var(--fg)}
.msg.a .who{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);
  font-weight:600;margin-bottom:5px}
.msg.a p{margin:0 0 9px}
.asst-f{padding:12px 14px;border-top:1px solid var(--border)}
.asst-rec{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--ink);
  font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6}
.asst-rec b{color:var(--muted);font-weight:500}

/* ── states ─────────────────────────────────────────────────────────── */
.sk{background:linear-gradient(90deg,var(--hl) 25%,var(--panel) 50%,var(--hl) 75%);
  background-size:400% 100%;animation:shim 1.5s ease-in-out infinite;border-radius:6px;height:13px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.blank{border:1px dashed var(--rule);border-radius:13px;padding:44px 28px;text-align:center;background:var(--panel)}
.blank .ic{width:40px;height:40px;border-radius:11px;background:var(--hl);border:1px solid var(--border);
  display:grid;place-items:center;margin:0 auto 15px;color:var(--dim)}
.blank h3{font-size:16px;margin-bottom:7px}
.blank p{color:var(--muted);font-size:13px;max-width:52ch;margin:0 auto 17px;line-height:1.6}
.blank.err .ic{color:var(--s-failed);border-color:color-mix(in srgb,var(--s-failed) 34%,transparent);
  background:color-mix(in srgb,var(--s-failed) 10%,transparent)}
.blank.den .ic{color:var(--s-denied);border-color:color-mix(in srgb,var(--s-denied) 34%,transparent);
  background:color-mix(in srgb,var(--s-denied) 10%,transparent)}
.hop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;text-align:left;max-width:520px;
  margin:0 auto;font-family:var(--mono);font-size:12px;background:var(--ink);border:1px solid var(--border);
  border-radius:10px;padding:13px 15px}
.hop dt{color:var(--dim);white-space:nowrap} .hop dd{margin:0;color:var(--body)}
.hop dd b{color:var(--fg);font-weight:500}

/* ── mockup chrome — deliberately not product UI ────────────────────── */

<script>
/* ---------- Tool grammar (shared with mc.html) ----------
   TG.cell(id,{sz:"sm"|"lg",sub})  label + API name in a category-hued tile; TG.names="api" leads with the API name
   TG.cat(cat)                     category badge          TG.hazard(risk,effect)   risk mark + side-effect glyph
   TG.gate(g,note)                 allow · require_approval · deny · killed · mandate
   TG.legend()                     the ten categories with examples, plus the risk / effect / gate scales
   TG.chips(counts,sel,pick,total) category filter chips; `pick` is an onclick with %s where the category goes
   TG.seg(items)                   segmented control: [[label,pressed,onclick],…]
   A category says what a tool ACTS ON; it is orthogonal to hazard (how bad a wrong call is) and gate (what the belt decided). */
var TG=(function(){
 function h(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
 var ORDER=["read","query","record","message","file","exec","vcs","infra","access","finance"];
 var CAT={
  read:{l:"Read-only",s:"Observes and returns. Changes nothing anywhere.",eg:"github__get_file_contents · slack__get_thread · search_graph",
    i:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/>'},
  query:{l:"Data query",s:"Bulk read from a store. Read-only, but the result set is the exfiltration and the cost.",eg:"snowflake__run_query · aws_billing__get_cost_and_usage",
    i:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'},
  record:{l:"Record write",s:"Creates or updates a record in a system of work. Reversible by another write.",eg:"linear__update_issue · calendar__create_event · notion__update_page",
    i:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'},
  message:{l:"Messaging & authoring",s:"Speaks to people on the organization’s behalf. A sent message cannot be unsent.",eg:"slack__post_message · slack__upload_file · gmail__send_message",
    i:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/>'},
  file:{l:"File mutation",s:"Writes, edits, moves or deletes files in a workspace or a drive.",eg:"write__file · edit__file · drive__trash_file",
    i:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 15l2 2 4-4"/>'},
  exec:{l:"Code execution",s:"Runs a command or a program. Its effect is whatever the sandbox allows.",eg:"claude_code__Bash · bash__run · sandbox__run_python",
    i:'<path d="m4 17 6-5-6-5M12 19h8"/>'},
  vcs:{l:"Source control",s:"Changes code history: branches, pull requests, merges, releases, repositories.",eg:"github__create_pull_request · github__merge_pull_request · github__delete_repository",
    i:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-12 2-12 6"/>'},
  infra:{l:"Infrastructure",s:"Deploys, scales, pauses or reconfigures a running system.",eg:"vercel__deploy_to_vercel · vercel__pause_project · k8s__scale_deployment",
    i:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>'},
  access:{l:"Access & identity",s:"Grants, shares, rotates or revokes access. Widens what every later call can reach.",eg:"drive__share_file · iam__rotate_key · oxagen__grant_role",
    i:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/>'},
  finance:{l:"Financial control",s:"Moves funds or commits spend. Never callable without a mandate.",eg:"stripe__create_payment · stripe__create_refund · aws_billing__purchase_savings_plan",
    i:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>'}
 };
 var META={
  github__create_pull_request:["Create pull request","vcs"], github__merge_pull_request:["Merge pull request","vcs"],
  github__delete_repository:["Delete repository","vcs"], github__create_release:["Create release","vcs"], github__push_files:["Push files","vcs"],
  github__get_file_contents:["Get file contents","read"], github__list_pull_requests:["List pull requests","read"], github__get_pull_request:["Get pull request","read"],
  stripe__create_payment:["Create payment","finance"], stripe__create_refund:["Create refund","finance"], stripe__create_payout:["Create payout","finance"],
  aws_billing__purchase_savings_plan:["Purchase savings plan","finance"], aws_billing__get_cost_and_usage:["Get cost and usage","query"],
  linear__update_issue:["Update issue","record"], linear__get_issue:["Get issue","read"], linear__create_issue:["Create issue","record"],
  slack__post_message:["Post message","message"], slack__upload_file:["Upload file","message"],
  slack__list_channels:["List channels","read"], slack__get_thread:["Get thread","read"],
  snowflake__run_query:["Run SQL query","query"], claude_code__Bash:["Run shell command","exec"], bash__run:["Run shell command","exec"],
  write__file:["Write file","file"], edit__file:["Edit file","file"], read__file:["Read file","read"],
  search_graph:["Search the graph","read"], recall_context:["Recall context","read"]
 };
 function parts(id){var s=String(id||""),i=s.lastIndexOf("@");return i>0?{n:s.slice(0,i),v:s.slice(i+1)}:{n:s,v:""};}
 function meta(id){
  var p=parts(id), m=META[p.n];
  if(m) return {n:p.n,v:p.v,l:m[0],cat:m[1]};
  var local=p.n.split("__").pop(), verb=local.split("_")[0].toLowerCase(), cat="record";
  if(/^(get|list|search|read|fetch|find|recall|describe|show)$/.test(verb)) cat="read";
  else if(/^(query|select|aggregate|export)$/.test(verb)) cat="query";
  else if(/^(write|edit|move|copy|trash|mkdir)$/.test(verb)) cat="file";
  else if(/^(bash|run|exec|execute|eval)$/.test(verb)) cat="exec";
  else if(/^(post|send|reply|forward|publish|upload)$/.test(verb)) cat="message";
  else if(/^(pay|refund|purchase|charge|transfer|buy|payout)$/.test(verb)) cat="finance";
  else if(/^(deploy|scale|pause|restart|provision)$/.test(verb)) cat="infra";
  else if(/^(grant|share|rotate|revoke|invite)$/.test(verb)) cat="access";
  else if(/^(merge|rebase|tag|release|push|fork)$/.test(verb)) cat="vcs";
  return {n:p.n,v:p.v,l:local.replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase();}),cat:cat};
 }
 var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
 var SV2='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
 function svg(c){var d=CAT[c]||CAT.record;return SV+d.i+'</svg>';}
 function cat(c){var d=CAT[c]||CAT.record;return '<span class="tg-cat tg-'+h(c)+'" title="'+h(d.s)+'">'+svg(c)+h(d.l)+'</span>';}
 function cell(id,o){
  o=o||{}; var m=meta(id), api=TG.names==="api", d=CAT[m.cat];
  var apiHtml=h(m.n)+(m.v?'<span class="v">@'+h(m.v)+'</span>':''), sub=o.sub?' · '+h(o.sub):'';
  return '<span class="tg tg-'+m.cat+(o.sz?' '+o.sz:'')+(api?' api':'')+'" title="'+h(m.n+(m.v?'@'+m.v:''))+' — '+h(m.l)+' · '+h(d.l)+'">'+
   '<span class="i">'+svg(m.cat)+'</span>'+
   (api?'<span class="l">'+apiHtml+'</span><span class="a">'+h(m.l)+sub+'</span>'
       :'<span class="l">'+h(m.l)+'</span><span class="a">'+apiHtml+sub+'</span>')+'</span>';
 }
 function riskSvg(r){
  if(r==="critical") return SV2+'<path d="M12 3 2 20h20L12 3z" fill="currentColor"/><path d="M12 10v4M12 17.5v.5" style="stroke:var(--ink,#10100F)"/></svg>';
  if(r==="high") return SV2+'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>';
  if(r==="medium") return SV2+'<path d="M12 3l9 9-9 9-9-9z"/><path d="M12 12h.01"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M12 12h.01"/></svg>';
 }
 function effSvg(e){
  if(e==="irreversible") return SV2+'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  if(e==="write") return SV2+'<path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M12 8l4 4"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg>';
 }
 function hazard(r,e){
  return '<span class="tg-hz r-'+h(r)+'" title="risk '+h(r)+'">'+riskSvg(r)+'<span>'+h(r)+'</span></span>'+
   (e?'<span class="tg-hz e-'+h(e)+'" title="side effect '+h(e)+'">'+effSvg(e)+'<span>'+h(e)+'</span></span>':'');
 }
 var GL={allow:"allowed",require_approval:"needs approval",deny:"denied",killed:"kill switch",mandate:"mandate + approval"};
 function gateSvg(g){
  var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  if(g==="allow") return s+'<path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  if(g==="require_approval") return s+'<path d="M12 3l8 3.5v5c0 4.6-3.2 8.6-8 9.5-4.8-.9-8-4.9-8-9.5v-5z"/><path d="M12 8v4l2.5 1.5"/></svg>';
  if(g==="deny") return s+'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>';
  if(g==="killed") return s+'<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>';
  if(g==="mandate") return s+'<path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3S7.5 5.8 7.5 7.5s2 2.7 4.5 3.3 4.5 1.6 4.5 3.5-2 3.2-4.5 3.2-4.5-1.3-4.5-3"/></svg>';
  return s+'<path d="M5 12h14"/></svg>';
 }
 function gate(g,note){g=({allowed:"allow",approval:"require_approval",denied:"deny"})[g]||g;return '<span class="tg-gt g-'+h(g)+'"'+(note?' title="'+h(note)+'"':'')+'>'+gateSvg(g)+h(GL[g]||g)+'</span>';}
 function seg(items){return '<span class="tg-seg" role="group">'+items.map(function(it){return '<button type="button" aria-pressed="'+(!!it[1])+'" onclick="'+h(it[2])+'">'+h(it[0])+'</button>';}).join("")+'</span>';}
 function chips(counts,sel,pick,total){
  var out='<button type="button" aria-pressed="'+(!sel)+'" onclick="'+h(pick.replace("%s",""))+'">All <span class="n">'+total+'</span></button>';
  ORDER.forEach(function(c){ if(!counts[c])return;
   out+='<button type="button" class="tg-'+c+'" aria-pressed="'+(sel===c)+'" title="'+h(CAT[c].s)+'" onclick="'+h(pick.replace("%s",c))+'">'+svg(c)+h(CAT[c].l)+'<span class="n">'+counts[c]+'</span></button>';});
  return '<div class="tg-chips">'+out+'</div>';
 }

function crumbs(parts){
  $("#crumbs").innerHTML = parts.map((p,i) => {
    const last = i === parts.length - 1;
    const cls = last ? "cur" : (i < parts.length-2 ? "hide-sm" : "");
    const el = p.r && !last ? `<a href="${p.r}" class="${cls}">${h(p.t)}</a>`
                            : `<span class="${cls}">${h(p.t)}</span>`;
    return (i ? `<span class="sep ${i<parts.length-1?"hide-sm":""}">${ic("chev","ni")}</span>` : "") + el;
  }).join("").replace(/<svg class="ni"/g,'<svg class="ni" style="width:11px;height:11px"');
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : null) : (sysDark ? "light" : "dark");
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  toast("Theme: " + (next || "follow system"));
}

let toastT;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = "none", 3200);
}

      Context PR on <b>a-intel/platform</b>. An agent may propose a directive; only a merge publishes one.
    </div>` + list;
}

  const body = `

                 in its body, and attaches the Oxagen check runs. Nothing steers a run until a person merges it.</p>`
            : `<button class="btn" style="width:100%;justify-content:center" disabled>${ic("pr")}Open Context PR</button>

                 Blocked: support is ${p.runs} runs across ${p.agents} agent${p.agents===1?"":"s"} and confidence
                 ${p.confidence.toFixed(2)}. This workspace requires ${p.needRuns} runs, ${p.needAgents} agents and
                 ${p.floor.toFixed(2)}.</p>`}

      </div>
      <div class="panel"><div class="ph"><h3>If it publishes</h3></div><div class="pb">
        <dl class="kv">

          <dt>measured by</dt><dd>rendered, cited, violated, and proof rate before and after</dd>
          <dt>baseline</dt><dd>proof rate <b>61.9 %</b> on runs touching apps/api/src/routes/</dd>

    </div><div class="phead-a">

/* ── tab: Context PRs ───────────────────────────────────────────────── */
function tabPRs(){

/* ── tab: retirement ────────────────────────────────────────────────── */
function tabRetirement(){
  const cands = PUBLISHED.filter(r => r.retire);
  return `<div class="note-i" style="margin-bottom:16px">
      A record that is rendered and never cited still costs tokens on every turn. Effect is measured for every
      published record; these two stopped earning their place. Retirement is a Context PR that sets
      <code>status = "archived"</code> in place — files are never deleted, so the lineage keeps its history.
    </div>` + cands.map(r => {

        <div style="flex:1;min-width:260px">

        <div class="ef"><div class="k">proof before</div><div class="v flat">${pct(r.before)}</div></div>
        <div class="ef"><div class="k">proof after</div><div class="v ${d<0?"down":"flat"}">${pct(r.after)}</div></div>
        <div class="ef"><div class="k">delta</div><div class="v ${d<0?"down":"flat"}">${d>0?"+":""}${d.toFixed(1)}</div></div>
      </div>
      <div class="note-i" style="margin-top:13px">${h(r.retireWhy)}</div>

  }).join("");

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   The Context PR: branch, diff, body, checks, merge
   ══════════════════════════════════════════════════════════════════════ */
function openContextPR(){
  S.pr = "checking";
  S.checks = PR_CHECKS.map(c => ({ ...c, state:"queued" }));
  location.hash = BASE + "/steering/prs/412";
  runChecks("pr");
  toast("Branch context/ctx.core.openapi-regen-on-route-change pushed. Pull request a-intel/platform#412 opened.");
}

function runChecks(which){
  const list  = which === "pr" ? S.checks : S.agentChecks;
  const specs = which === "pr" ? PR_CHECKS : AGENT_CHECKS;
  S.timers.forEach(clearTimeout); S.timers = [];
  specs.forEach((c, i) => {
    const startAt = i === 0 ? 250 : specs[i-1].ms;
    S.timers.push(setTimeout(() => { list[i].state = "running"; route(); }, startAt));
    S.timers.push(setTimeout(() => {
      list[i].state = "success";
      if (i === specs.length - 1){
        if (which === "pr") S.pr = "passed"; else S.agentPr = "passed";
      }
      route();
    }, c.ms));
  });
}

function mergePR(){
  S.pr = "merged";
  route();
  toast("Merged. promotion_event written, bundle_v215 signed, steering_published audited.");
}
function mergeAgentPR(){
  S.agentPr = "merged";
  route();
  toast("Merged. Principal created for a-intel.core.docs-writer. Status: unenrolled until credentials are issued.");
}

function checkRow(c){
  const st = c.state || "success";
  const ic_ = st === "success"
    ? `<span class="ic" style="color:var(--s-allowed)">${ic("check","")}</span>`
    : st === "running" ? `<span class="ic"><span class="spin"></span></span>`
    : `<span class="ic" style="color:var(--s-queued)">${ic("clock","")}</span>`;
  return `<div class="chk">${ic_}
    <div style="min-width:0">
      <div class="nm">${h(c.name)}</div>
      <div class="ds">${h(st === "success" ? c.ok : st === "running" ? c.run : "Queued")}</div>
    </div>
    <span class="tm">${st === "success" ? c.dur : st === "running" ? "running" : "queued"}</span>
  </div>`;
}

function diffLines(text){
  return text.split("\n").map((l,i) =>
    `<div class="dl add"><span class="g">${i+1}</span><span class="c">+${h(l)}</span></div>`).join("");
}

function renderPR(num){
  crumbs([{t:"Anderson Intelligence Corp.",r:"#/a-intel"},{t:"core-platform",r:BASE},{t:"Steering",r:BASE+"/steering"},
          {t:"Context PRs",r:BASE+"/steering/prs"},{t:"#"+num}]);

  if (num === "413") return renderAgentPR();

  const stat = { "409":{repo:"a-intel/mobile", branch:"context/ctx.mobile.snapshot-baseline",
      title:"Record the snapshot baseline convention for a-intel/mobile", by:"Oxagen promoter",
      opened:"2026-09-09 10:14 UTC", base:"main · 8d40c11", kind:"steering" },
    "407":{repo:"a-intel/platform", branch:"context/ctx.core.test-file-naming",
      title:"Retire ctx.core.test-file-naming", by:"Marcus Bell",
      opened:"2026-09-08 17:40 UTC", base:"main · e91b2d7", kind:"retirement" } }[num];

  if (stat) return renderStaticPR(num, stat);

  if (S.pr === "none"){ location.replace(BASE+"/steering/proposals/"+PROPOSALS[0].id); return; }

  const p = PROPOSALS[0];
  const merged = S.pr === "merged";
  const passed = S.pr === "passed" || merged;
  const done = S.checks.filter(c => c.state === "success").length;

  const state = merged ? `<span class="b proven dot lg">merged</span>`
    : passed ? `<span class="b allowed dot lg">checks passed</span>`
    : `<span class="b running dot lg">checks running · ${done} / 5</span>`;

  const body = `
  <div class="rail">

    <span class="st ${merged?"done":""}"><span class="d"></span>review</span>${ic("arrow","ar ni")}
    <span class="st ${merged?"done":""}"><span class="d"></span>merge</span>${ic("arrow","ar ni")}
    <span class="st ${merged?"done":""}"><span class="d"></span>promotion_event</span>${ic("arrow","ar ni")}
    <span class="st ${merged?"done":""}"><span class="d"></span>published</span>${ic("arrow","ar ni")}
    <span class="st ${merged?"now":""}"><span class="d"></span>delivered</span>
  </div>

  <div class="split">
    <div>
      <div class="panel">
        <div class="ph">${ic("branch")}<h3 class="mono" style="font-weight:500;font-size:12.5px">${h("context/"+p.lin)}</h3>
          <span class="sp"></span><span class="note">base main · e91b2d7</span></div>
        <div class="pb">
          <dl class="kv">
            <dt>repository</dt><dd><b>a-intel/platform</b> — main repo of core-platform</dd>
            <dt>head</dt><dd>4c1f9ab · 1 commit · 1 file changed, 47 insertions</dd>
            <dt>author</dt><dd>Oxagen promoter (service principal svc_promoter)</dd>
            <dt>one concern</dt><dd>1 record, 1 lineage — the checks refuse a second</dd>
          </dl>
        </div>
        <div class="diff">
          <div class="fl">${ic("file")}<span class="p mono">.oxagen/rules/${h(p.lin)}.toml</span>
            <span class="b allowed" style="margin-left:auto">new file · +47</span></div>
          <div class="rows">${diffLines(RECORD_TOML)}</div>
        </div>
      </div>

      <div class="panel"><div class="ph"><h3>Pull request body</h3><span class="sp"></span>
        <span class="note">written by the promoter</span></div>
        <div class="pb"><pre class="code" style="background:var(--ink)">${h(PR_BODY)}</pre></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="ph">${ic("pr")}<h3>Checks</h3><span class="sp"></span>${state}</div>
        <div>${S.checks.map(checkRow).join("")}</div>
        <div class="mergebar">
          ${merged ? `<div style="flex:1"><div class="ttl" style="color:var(--s-proven)">Merged by Marcus Bell</div>
              <div class="ds">2026-09-11 14:21:06 UTC · squashed into main as 4c1f9ab</div></div>`
            : passed ? `<div style="flex:1"><div class="ttl">Five checks passed</div>
              <div class="ds">Governance <b>team</b>: a code-owner review is required. Marcus Bell owns
                <code>.oxagen/rules/</code>.</div></div>
              <button class="btn gold" onclick="mergePR()">${ic("merge")}Merge pull request</button>`
            : `<div style="flex:1"><div class="ttl">Checks are running</div>
              <div class="ds">Merge is blocked until schema, hash, conflicts, secrets and probes all report.</div></div>
              <button class="btn" disabled>${ic("merge")}Merge pull request</button>`}
        </div>
      </div>

      ${merged ? `
      <div class="panel"><div class="ph">${ic("spark")}<h3>promotion_event</h3><span class="sp"></span>
        <span class="note">written by the promoter, never by an agent</span></div>
        <div class="pb"><dl class="kv">
          <dt>record_id</dt><dd><b>rec_01K52H8XQ4M7VYB3NDCF0P</b></dd>
          <dt>kind</dt><dd>promotion_event</dd>
          <dt>lineage_id</dt><dd>${h(p.lin)}</dd>
          <dt>from → to</dt><dd>proposed <span style="color:var(--dim)">→</span> <b>published</b></dd>
          <dt>approver</dt><dd><b>Marcus Bell</b> · workspace owner, core-platform</dd>
          <dt>pr_url</dt><dd>github.com/a-intel/platform/pull/412</dd>
          <dt>commit_sha</dt><dd>4c1f9ab</dd>
          <dt>merged_at</dt><dd>2026-09-11 14:21:06 UTC</dd>
          <dt>re-indexed</dt><dd>from the merged commit · record_hash verified against the file</dd>

<!-- list-controls: search · sort · column filters · rows per page · pager -->
<style>
/* List controls: search, column filters, rows per page, sortable headers, pager.
   Colors derive from the page's own text color so the block reads correctly in
   every mockup theme; only the accent leans on --gold. */
.lt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));font-family:inherit;font-size:12.5px}
.lt.free{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:10px;margin-bottom:10px}
.lt .lt-q{flex:1 1 200px;min-width:140px;background:color-mix(in srgb,currentColor 5%,transparent);border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:8px;padding:6px 10px;font-size:12.5px;color:inherit;outline:none;font-family:inherit;transition:border-color .12s}
.lt .lt-q:focus{border-color:var(--gold,#D6962C)}
.lt .lt-q::placeholder{color:inherit;opacity:.5}
.lt select{appearance:auto;background:color-mix(in srgb,currentColor 5%,transparent);border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:8px;padding:5px 8px;font-size:12px;color:inherit;outline:none;font-family:inherit;max-width:220px;transition:border-color .12s}
.lt select:focus{border-color:var(--gold,#D6962C)}
.lt .lt-rows{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted,inherit);white-space:nowrap;margin-left:auto}
.lp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;font-size:11.5px;color:var(--muted,inherit);font-family:inherit}
.lp.free{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:10px;margin-top:10px}
.lp .lp-n{font-family:var(--mono,ui-monospace,monospace);font-variant-numeric:tabular-nums;opacity:.85}
.lp .lp-pg{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lp .lp-b{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));background:color-mix(in srgb,currentColor 5%,transparent);color:inherit;border-radius:7px;padding:2px 8px;min-width:28px;font-size:12px;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.5;transition:border-color .12s}
.lp .lp-b:hover{border-color:color-mix(in srgb,currentColor 35%,transparent)}
.lp .lp-b[aria-current="page"]{border-color:var(--gold,#D6962C);color:var(--gold,#D6962C)}
.lp .lp-b:disabled{opacity:.4;cursor:default}
.lp .lp-pg .el{padding:0 4px;opacity:.6}
th.sortable{cursor:pointer;user-select:none}
th.sortable::after{content:"↕";margin-left:5px;opacity:.35;font-size:10px}
th.sortable[aria-sort="ascending"]::after{content:"↑";color:var(--gold,#D6962C);opacity:1}
th.sortable[aria-sort="descending"]::after{content:"↓";color:var(--gold,#D6962C);opacity:1}
.lt-empty td{opacity:.6;text-align:center;padding:18px}
@media (max-width:520px){.lt .lt-q{flex-basis:100%}.lt .lt-rows{margin-left:0}}
</style>
<script>
/* ============================== List controls ============================== */
/* Self-contained: every table with a thead gets a search box, sortable column
   headers, a filter select for each column that is a small enumeration, a
   rows-per-page select and a pager. Installs itself through a DOM observer so
   it works with any render path; state is keyed by page + column signature so
   a full re-render lands back on the same page, sort and query. */
(function(){
"use strict";
if(window.__ltInstalled)return; window.__ltInstalled=true;
var STORE={}, PER=[5,10,25,50,0], BUSY=false, TIMER=null;
var FACET=/status|state|tier|kind|role|risk|severity|result|health|effect|mode|side|level|verdict|decision|origin|scope|period|basis|algorithm|trend|position|governance|two-factor|sso|replay|grade|outcome/i;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(s){
  s=String(s==null?"":s).trim();
  if(!s||/^\d{4}-\d{2}/.test(s))return null;
  var c=s.replace(/[$,%×]/g,""), m=c.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);
  if(!m)return null;
  var n=parseFloat(m[0]), u=c.slice(m[0].length).match(/^\s*([kKMB])(?![A-Za-z])/);
  if(u){ if(u[1]==="k"||u[1]==="K")n*=1e3; else if(u[1]==="M")n*=1e6; else n*=1e9; }
  return n;
}
function cmp(a,b,isNum,dir){
  if(isNum){var x=a.n,y=b.n; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; if(x!==y)return (x-y)*dir;}
  return a.t.localeCompare(b.t,undefined,{numeric:true,sensitivity:"base"})*dir;
}
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function pageCtx(){var h1=document.querySelector("main h1, .page h1, h1"); return location.hash+"|"+(h1?h1.textContent.trim().slice(0,40):"");}
function state(sig,ord){var key=pageCtx()+"|"+sig+"#"+ord; return STORE[key]||(STORE[key]={q:"",sort:null,dir:1,per:10,page:1,f:{}});}

function pager(st,total,onPage){
  var per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  var from=total?((st.page-1)*per+1):0, to=Math.min(total,st.page*per);
  var html='<div class="lp"><span class="lp-n">'+(total?from+'–'+to+' of '+total:'0 of 0')+'</span><span class="lp-pg">'+
   '<button type="button" class="lp-b" data-p="prev" aria-label="Previous page"'+(st.page<=1?' disabled':'')+'>‹</button>';
  var nums=[]; if(pages<=7){for(var i=1;i<=pages;i++)nums.push(i);} else {
    nums=[1]; var lo=Math.max(2,st.page-1), hi=Math.min(pages-1,st.page+1);
    if(lo>2)nums.push("…"); for(var j=lo;j<=hi;j++)nums.push(j); if(hi<pages-1)nums.push("…"); nums.push(pages);}
  nums.forEach(function(p){html+= p==="…"?'<span class="el">…</span>':'<button type="button" class="lp-b" data-p="'+p+'"'+(p===st.page?' aria-current="page"':'')+'>'+p+'</button>';});
  html+='<button type="button" class="lp-b" data-p="next" aria-label="Next page"'+(st.page>=pages?' disabled':'')+'>›</button></span></div>';
  var lp=el(html);
  lp.addEventListener("click",function(e){var b=e.target.closest("button[data-p]"); if(!b||b.disabled)return; e.stopPropagation(); var p=b.getAttribute("data-p");
    st.page = p==="prev"?st.page-1 : p==="next"?st.page+1 : +p; onPage();});
  return lp;
}
function bar(st,opts,apply){
  var html='<div class="lt"><input class="lt-q" type="search" placeholder="'+esc(opts.ph)+'" aria-label="'+esc(opts.ph)+'" value="'+esc(st.q)+'">';
  (opts.filters||[]).forEach(function(f){
    html+='<select class="lt-f" data-k="'+esc(f.key)+'" aria-label="Filter by '+esc(f.label)+'"><option value="">All · '+esc(f.label)+'</option>'+
      f.values.map(function(v){return '<option value="'+esc(v)+'"'+(st.f[f.key]===v?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';});
  html+='<label class="lt-rows">Rows<select class="lt-per">'+PER.map(function(p){return '<option value="'+p+'"'+(st.per===p?' selected':'')+'>'+(p||"All")+'</option>';}).join("")+'</select></label></div>';
  var b=el(html);
  b.addEventListener("click",function(e){e.stopPropagation();});
  b.querySelector(".lt-q").addEventListener("input",function(e){st.q=e.target.value;st.page=1;apply();});
  b.querySelectorAll(".lt-f").forEach(function(s){s.addEventListener("change",function(e){st.f[s.getAttribute("data-k")]=e.target.value;st.page=1;apply();});});
  b.querySelector(".lt-per").addEventListener("change",function(e){st.per=+e.target.value;st.page=1;apply();});
  return b;
}
/* A column earns a filter when it is a small enumeration: 2–8 distinct short
   values across at least 4 rows, and not unique per row. At most three per list. */
function facets(cols,vals,rows){
  if(rows<4)return [];
  var c=cols.filter(function(col){ if(!col.name||col.num)return false;
    var set={},n=0,ok=true; vals.forEach(function(v){var t=v[col.i].t; if(!t)return; if(t.length>28)ok=false; if(!set[t]){set[t]=1;n++;}});
    if(!ok||n<2||n>8||n>=rows)return false; col.values=Object.keys(set).sort(); return true;});
  c.sort(function(a,b){var pa=FACET.test(a.name)?0:1,pb=FACET.test(b.name)?0:1; return pa-pb||a.values.length-b.values.length;});
  return c.slice(0,3).map(function(col){return {key:String(col.i),label:col.name,values:col.values};});
}
function sigOf(table){return [].slice.call(table.tHead.rows[0].cells).map(function(c){return c.textContent.trim();}).join("/");}
function enhance(table,ord){
  var tbody=table.tBodies[0], rows=[].slice.call(tbody.rows);
  var ths=[].slice.call(table.tHead.rows[0].cells);
  var cols=ths.map(function(th,i){return {i:i,name:th.textContent.trim(),num:th.classList.contains("num")};});
  var st=state(sigOf(table),ord);
  var vals=rows.map(function(r){return cols.map(function(c){var cell=r.cells[c.i]; var t=cell?cell.textContent.replace(/\s+/g," ").trim():""; return {t:t,n:num(t)};});});
  cols.forEach(function(c){ if(c.num)return; var k=0,tot=0; vals.forEach(function(v){if(v[c.i].t){tot++; if(v[c.i].n!=null)k++;}}); if(tot&&k/tot>=.6)c.num=true; });
  var texts=rows.map(function(r){return r.textContent.replace(/\s+/g," ").toLowerCase();});
  var fs=facets(cols,vals,rows.length);
  var wrap=table.parentNode, host=wrap.parentNode, ph="Search this list";
  if(!host||wrap===document.body){wrap=table;host=table.parentNode;}
  /* A lone search box sitting directly above the table becomes the list's search. */
  var prev=wrap.previousElementSibling;
  if(prev&&!prev.matches("table,thead,tbody")){
    var ins=prev.querySelectorAll("input,select,button,a,textarea");
    var inp=prev.matches("input")?prev:prev.querySelector("input[placeholder^='Search']");
    if(inp&&inp.placeholder&&/^Search/.test(inp.placeholder)&&ins.length<=1&&!prev.textContent.trim()){ph=inp.placeholder;prev.remove();}
  }
  var free=!/panel|card|box/.test(host.className||"");
  var b=bar(st,{ph:ph,filters:fs},apply), lp=document.createElement("div");
  if(free)b.classList.add("free");
  host.insertBefore(b,wrap); host.insertBefore(lp,wrap.nextSibling);
  ths.forEach(function(th,i){ if(!cols[i].name)return; th.classList.add("sortable"); th.tabIndex=0; th.setAttribute("role","button");
    function tog(e){ if(e)e.stopPropagation(); if(st.sort===i){ if(st.dir===1)st.dir=-1; else {st.sort=null;st.dir=1;} } else {st.sort=i;st.dir=1;} st.page=1; apply(); }
    th.addEventListener("click",tog); th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog(e);}}); });
  function apply(){
    ths.forEach(function(th,i){ if(!cols[i].name)return; th.setAttribute("aria-sort",st.sort===i?(st.dir===1?"ascending":"descending"):"none"); });
    var q=st.q.trim().toLowerCase();
    var idx=rows.map(function(_,i){return i;}).filter(function(i){
      if(q&&texts[i].indexOf(q)<0)return false;
      for(var k in st.f){ if(st.f[k]&&vals[i][+k]&&vals[i][+k].t!==st.f[k])return false; } return true; });
    if(st.sort!=null&&cols[st.sort]){var c=cols[st.sort]; idx.sort(function(a,b){return cmp(vals[a][c.i],vals[b][c.i],c.num,st.dir)||(a-b);});}
    var total=idx.length, per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per)); if(st.page>pages)st.page=pages;
    var slice=st.per?idx.slice((st.page-1)*st.per,st.page*st.per):idx;
    BUSY=true;
    while(tbody.firstChild)tbody.removeChild(tbody.firstChild);
    if(!slice.length){var tr=document.createElement("tr"),td=document.createElement("td");tr.className="lt-empty";td.colSpan=cols.length;td.textContent="No rows match.";tr.appendChild(td);tbody.appendChild(tr);}
    slice.forEach(function(i){tbody.appendChild(rows[i]);});
    var nlp=pager(st,total,apply); lp.replaceWith(nlp); lp=nlp; if(free)lp.classList.add("free");
    BUSY=false;
  }
  apply();
}
function run(){
  BUSY=true;
  try{
    var ords={};
    [].slice.call(document.querySelectorAll("table")).forEach(function(t){
      if(!t.tHead||!t.tHead.rows[0]||!t.tBodies[0]||t.closest("[data-lt-skip]"))return;
      if([].slice.call(t.tHead.rows[0].cells).some(function(c){return c.colSpan>1;}))return;
      var sig=sigOf(t), ord=ords[sig]||0; ords[sig]=ord+1;
      if(t.getAttribute("data-lt"))return;
      t.setAttribute("data-lt","1"); enhance(t,ord);
    });
  } finally { BUSY=false; }
}
new MutationObserver(function(muts){
  if(BUSY)return;
  for(var i=0;i<muts.length;i++){ if(muts[i].addedNodes.length){ clearTimeout(TIMER); TIMER=setTimeout(run,0); return; } }
}).observe(document.documentElement,{childList:true,subtree:true});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run); else run();
window.listify=run;
})();
</script>
