<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<title>Money Asked, A Human Answered</title>
<style>
/* ───────────────────────── house tokens (oxagen-house-brand v2.1) ───────── */
:root{
  --ink:#10100F;--void:#0A0A09;--panel:#181715;--hl:#201F1C;--border:#292722;--rule:#34322D;
  --fg:#F2EEE5;--body:#DDD8CD;--muted:#9B958A;--dim:#6E6A62;
  --gold:#D6962C;--gold-bright:#F1C364;--gold-deep:#8B5E1A;--accent-text:#D6962C;
  --on-gold:#10100F;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 44px rgba(0,0,0,.5);
  --shadow-sm:0 1px 0 rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.34);
  /* semantic state colours — separate from gold, never gold */
  --st-allow:#5BA97C;   /* allowed, settled, valid, proven, verified */
  --st-hold:#7E9BEC;    /* needs approval, parked, reserved, pending */
  --st-deny:#D75A4C;    /* denied, failed, critical, exception */
  --st-taint:#B98BE0;   /* tainted, untrusted, unverified */
  --focus:#F1C364;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --ink:#F2EEE5;--void:#E9E3D8;--panel:#F8F5EE;--hl:#EFEAE0;--border:#D8CDBD;--rule:#C9BFAE;
  --fg:#10100F;--body:#2A2823;--muted:#6B665C;--dim:#8C877C;--accent-text:#8B5E1A;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(16,16,15,.07);
  --st-allow:#2E7048;--st-hold:#3C58B5;--st-deny:#A8382C;--st-taint:#6E43A8;
  --focus:#8B5E1A;
}}
:root[data-theme="light"]{
  --ink:#F2EEE5;--void:#E9E3D8;--panel:#F8F5EE;--hl:#EFEAE0;--border:#D8CDBD;--rule:#C9BFAE;
  --fg:#10100F;--body:#2A2823;--muted:#6B665C;--dim:#8C877C;--accent-text:#8B5E1A;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(16,16,15,.07);
  --st-allow:#2E7048;--st-hold:#3C58B5;--st-deny:#A8382C;--st-taint:#6E43A8;
  --focus:#8B5E1A;
}

/* ───────────────────────── base ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);
  font-family:"Space Grotesk","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;font-weight:400}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:.88em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.012em}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--accent-text);margin:0}
.eyebrow.q{color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.bodytx{color:var(--body)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────────────────────── shell ────────────────────────────────────────── */
#root{min-height:100vh;container-type:inline-size;container-name:shell}
body.phone #root{width:400px;height:840px;margin:22px auto;overflow:auto;overscroll-behavior:contain;
  border:1px solid var(--rule);border-radius:22px;box-shadow:var(--shadow);background:var(--ink)}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh;background:var(--ink)}
body.phone .shell{min-height:0}
.side{border-right:1px solid var(--border);background:var(--void);display:flex;flex-direction:column;min-width:0}
.main{display:flex;flex-direction:column;min-width:0}
.content{padding:22px 26px 96px;min-width:0;flex:1}

/* org + workspace switchers */
.switchers{padding:14px 14px 12px;border-bottom:1px solid var(--border);display:grid;gap:8px}
.brandrow{display:flex;align-items:center;gap:10px;padding:2px 4px 10px}
.brandrow svg{height:17px;width:auto;display:block;color:var(--fg)}
.sw{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:left;min-width:0}
.sw:hover{border-color:var(--rule);background:var(--hl)}
.sw .av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-size:11px;font-weight:700;background:var(--hl);border:1px solid var(--border);color:var(--muted)}
.sw .av.g{background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:color-mix(in srgb,var(--gold) 40%,transparent);color:var(--accent-text)}
.sw .lb{min-width:0;flex:1}
.sw .lb b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .lb span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.sw .car{color:var(--dim);font-size:10px;flex:none}

nav.navlist{padding:12px 10px;overflow-y:auto;flex:1}
.navsec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:12px 10px 7px}
.navlist a.nl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);
  font-size:13px;font-weight:500;border-left:2px solid transparent;margin-bottom:1px}
.navlist a.nl:hover{background:var(--hl);color:var(--fg);text-decoration:none}
.navlist a.nl[aria-current="page"]{background:var(--hl);color:var(--fg);border-left-color:var(--gold)}
.navlist a.nl .ic{width:15px;text-align:center;font-size:12.5px;color:var(--dim);flex:none}
.navlist a.nl[aria-current="page"] .ic{color:var(--accent-text)}
.navlist a.nl .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:999px;
  background:color-mix(in srgb,var(--st-hold) 20%,transparent);color:var(--st-hold);font-weight:600}
.navlist a.nl .sub{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.sidefoot{border-top:1px solid var(--border);padding:11px 14px;display:flex;align-items:center;gap:9px}
.sidefoot .tierdot{width:7px;height:7px;border-radius:50%;background:var(--st-allow);flex:none}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 26px;
  border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--ink) 90%,transparent);backdrop-filter:blur(12px)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0;flex-wrap:wrap}
.crumbs a{color:var(--muted)}.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--dim);font-size:10px}
.crumbs .cur{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.tbspace{margin-left:auto}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.tbtn:hover{color:var(--fg);border-color:var(--rule);background:var(--hl)}
.tbtn kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--hl);
  border:1px solid var(--border);color:var(--dim)}
.tbtn.on{color:var(--fg);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.userchip{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--hl);border:1px solid var(--border);cursor:pointer;color:var(--body)}

/* ───────────────────────── primitives ───────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px}
.panel.pad{padding:18px 20px}
.ph{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ph h2{font-size:14.5px}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pb{padding:16px 18px}
.stack{display:grid;gap:16px}
.stack>*,.cols>*,.panel,.pb,.tblwrap{min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:22px;letter-spacing:-.02em}
.pagehead .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;cursor:pointer;
  font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--panel);color:var(--body)}
.btn:hover{background:var(--hl);color:var(--fg);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.btn.primary:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:var(--on-gold)}
.btn.danger{color:var(--st-deny);border-color:color-mix(in srgb,var(--st-deny) 40%,var(--border))}
.btn.danger:hover{background:color-mix(in srgb,var(--st-deny) 12%,transparent);color:var(--st-deny)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--panel);color:var(--body);border-color:var(--border)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;
  font-weight:600;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-allow{color:var(--st-allow);background:color-mix(in srgb,var(--st-allow) 13%,transparent);border-color:color-mix(in srgb,var(--st-allow) 32%,transparent)}
.b-hold{color:var(--st-hold);background:color-mix(in srgb,var(--st-hold) 13%,transparent);border-color:color-mix(in srgb,var(--st-hold) 32%,transparent)}
.b-deny{color:var(--st-deny);background:color-mix(in srgb,var(--st-deny) 13%,transparent);border-color:color-mix(in srgb,var(--st-deny) 32%,transparent)}
.b-taint{color:var(--st-taint);background:color-mix(in srgb,var(--st-taint) 13%,transparent);border-color:color-mix(in srgb,var(--st-taint) 32%,transparent)}
.b-quiet{color:var(--muted);background:var(--hl);border-color:var(--border)}
.badge.mono{font-family:var(--mono);font-size:10.5px;font-weight:500}

.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:7px 18px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;color:var(--body);min-width:0;overflow-wrap:anywhere}
.kv dd b{font-weight:600;color:var(--fg)}

table{border-collapse:collapse;width:100%;font-size:12.5px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;
  padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--body);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--hl)}
tr.clickable:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
td.r,th.r{text-align:right}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:16px}
.tabs a{padding:9px 14px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--fg);text-decoration:none}
.tabs a[aria-current]{color:var(--fg);border-bottom-color:var(--gold)}
.tabs a .n{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:5px}

.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg);letter-spacing:-.02em}
.money .cur{font-weight:400;color:var(--dim);font-size:.82em;margin-left:3px}
.basis{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.digest{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}

.note{border-left:2px solid var(--rule);padding:2px 0 2px 12px;color:var(--muted);font-size:12px}
hr.rule{border:0;border-top:1px solid var(--border);margin:16px 0}

/* ───────────────────────── approval card ────────────────────────────────── */
.apcard{border:1px solid color-mix(in srgb,var(--st-hold) 34%,var(--border));border-radius:12px;background:var(--panel);overflow:hidden}
.apcard.crit{border-color:color-mix(in srgb,var(--st-deny) 40%,var(--border))}
.aphead{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:color-mix(in srgb,var(--st-hold) 6%,transparent);flex-wrap:wrap}
.apcard.crit .aphead{background:color-mix(in srgb,var(--st-deny) 6%,transparent)}
.aphead .amt{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.03em;color:var(--fg);line-height:1.1}
.aphead .amt .cur{font-size:13px;font-weight:500;color:var(--muted);margin-left:5px}
.aphead .r{margin-left:auto;text-align:right;display:grid;gap:5px;justify-items:end}
.clock{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--st-hold)}
.clock.warn{color:var(--st-deny)}
.clock.done{color:var(--muted)}

.chain4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--border)}
.hop{padding:13px 16px;border-right:1px solid var(--border);min-width:0;position:relative}
.hop:last-child{border-right:0}
.hop .hn{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600;
  display:flex;align-items:center;gap:6px;margin-bottom:7px}
.hop .hn i{font-style:normal;font-family:var(--mono);color:var(--accent-text);font-size:10px}
.hop b{display:block;font-size:13px;font-weight:600;color:var(--fg);overflow-wrap:anywhere;margin-bottom:3px}
.hop .hm{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.hop::after{content:"›";position:absolute;right:-7px;top:50%;transform:translateY(-50%);z-index:2;
  width:14px;height:14px;display:grid;place-items:center;background:var(--panel);color:var(--dim);font-size:12px}
.hop:last-child::after{content:none}

/* mandate bar */
.mbar{height:12px;border-radius:999px;background:var(--hl);border:1px solid var(--border);display:flex;overflow:hidden}
.mbar i{display:block;height:100%}
.mbar .used{background:color-mix(in srgb,var(--st-allow) 62%,transparent)}
.mbar .res{background:repeating-linear-gradient(45deg,var(--st-hold) 0 4px,color-mix(in srgb,var(--st-hold) 45%,transparent) 4px 8px)}
.mlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{width:9px;height:9px;border-radius:3px;display:block}
.mlegend i.used{background:color-mix(in srgb,var(--st-allow) 62%,transparent)}
.mlegend i.res{background:var(--st-hold)}
.mlegend i.left{background:var(--hl);border:1px solid var(--rule)}

.taint{border:1px solid color-mix(in srgb,var(--st-taint) 32%,var(--border));background:color-mix(in srgb,var(--st-taint) 7%,transparent);
  border-radius:10px;padding:12px 14px}
.srcrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--st-taint) 26%,transparent);font-size:12px}
.srcrow:first-of-type{border-top:0}

.apfoot{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--void)}
.apfoot .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea.reason{width:100%;min-height:62px;padding:9px 11px;border-radius:9px;background:var(--void);
  border:1px solid var(--border);color:var(--fg);font-size:12.5px;resize:vertical}
textarea.reason:focus{border-color:var(--rule)}
label.fl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px}

/* queue rows */
.qrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;flex-wrap:wrap}
.qrow:hover{background:var(--hl)}
.qrow:last-child{border-bottom:0}
.qrow .qa{font-family:var(--mono);font-size:12px;color:var(--fg);font-weight:600}
.qrow .qm{font-size:11.5px;color:var(--muted)}
.qrow .r{margin-left:auto;display:flex;align-items:center;gap:12px}

/* frames */
.frames{font-family:var(--mono);font-size:11.5px}
.fr{display:grid;grid-template-columns:46px 132px 1fr auto;gap:12px;padding:7px 16px;border-bottom:1px solid var(--border);
  align-items:baseline;cursor:pointer;min-width:0}
.fr:hover{background:var(--hl)}
.fr .sq{color:var(--dim);text-align:right}
.fr .kd{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .sm{color:var(--body);min-width:0;overflow-wrap:anywhere}
.fr .mt{color:var(--dim);white-space:nowrap;font-size:10.5px}
.fr.hot{background:color-mix(in srgb,var(--st-hold) 9%,transparent)}
.fr.hot:hover{background:color-mix(in srgb,var(--st-hold) 14%,transparent)}
.fr.new{background:color-mix(in srgb,var(--st-allow) 9%,transparent)}
.fr .kd.k-policy{color:var(--st-hold)}
.fr .kd.k-deny{color:var(--st-deny)}
.fr .kd.k-ok{color:var(--st-allow)}
.fr .kd.k-taint{color:var(--st-taint)}
.frdetail{padding:12px 16px 16px 58px;border-bottom:1px solid var(--border);background:var(--void);font-family:"Space Grotesk",sans-serif;font-size:12.5px}
pre.code{background:var(--void);border:1px solid var(--border);border-radius:9px;padding:11px 13px;overflow-x:auto;
  font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--body);margin:8px 0 0}
pre.code .k{color:var(--accent-text)}
pre.code .s{color:var(--st-allow)}
pre.code .n{color:var(--st-hold)}

/* cost strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel)}
.strip .c{padding:12px 15px;border-right:1px solid var(--border);min-width:0}
.strip .c:last-child{border-right:0}
.strip .c .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:5px;white-space:nowrap}
.strip .c .v{font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--fg);font-variant-numeric:tabular-nums}
.strip .c .v.mono{font-family:var(--mono)}
.strip .c .s{font-size:10.5px;color:var(--dim);font-family:var(--mono);margin-top:2px}

/* receipt */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;color:var(--fg)}
dialog::backdrop{background:rgba(10,10,9,.72);backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);
  width:min(880px,calc(100vw - 32px));max-height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden}
.modal.narrow{width:min(560px,calc(100vw - 32px))}
.mh{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.mh h2{font-size:16px}
.mh .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.mb{padding:18px 20px;overflow-y:auto;overscroll-behavior:contain}
.mf{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;background:var(--void);flex-wrap:wrap}
.xbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.xbtn:hover{color:var(--fg);background:var(--hl)}
.rgroup{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:14px}
.rgroup>.gh{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--void);border-bottom:1px solid var(--border)}
.rgroup>.gh .gi{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;
  background:var(--hl);color:var(--accent-text);border:1px solid var(--border);font-family:var(--mono)}
.rgroup>.gh b{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rgroup>.gb{padding:13px 14px}

/* command menu */
.cmdlist{max-height:340px;overflow-y:auto}
.cmditem{display:flex;align-items:center;gap:11px;padding:10px 20px;cursor:pointer;border-bottom:1px solid var(--border)}
.cmditem:hover,.cmditem.sel{background:var(--hl)}
.cmditem .ci{width:22px;text-align:center;color:var(--dim);font-size:12px}
.cmditem b{font-size:13px;font-weight:500;color:var(--fg)}
.cmditem .cs{font-size:11.5px;color:var(--dim);margin-left:auto;font-family:var(--mono)}
input.cmdinput{width:100%;padding:15px 20px;background:transparent;border:0;border-bottom:1px solid var(--border);font-size:15px;outline:0}

/* assistant */
.assist{width:330px;border-left:1px solid var(--border);background:var(--void);display:flex;flex-direction:column;min-width:0}
.assist .ah{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.assist .ab{padding:16px;overflow-y:auto;flex:1;display:grid;gap:12px;align-content:start}
.msg{border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.msg.a{background:var(--panel);border:1px solid var(--border);color:var(--body)}
.msg.u{background:var(--hl);border:1px solid var(--border);color:var(--fg);margin-left:26px}
.msg .src{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:11px;color:var(--dim);font-family:var(--mono)}
.assist .af{padding:12px 14px;border-top:1px solid var(--border)}
.assist .af input{width:100%;padding:9px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--border);outline:0;font-size:12.5px}

/* empty / loading / error / denied */
.state{display:grid;place-items:center;text-align:center;padding:64px 20px;gap:14px}
.state .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:var(--hl);border:1px solid var(--border);color:var(--muted)}
.state h3{font-size:16px}
.state p{max-width:46ch;color:var(--muted);font-size:13px}
.skel{background:linear-gradient(90deg,var(--hl) 0%,var(--panel) 40%,var(--hl) 80%);background-size:300% 100%;
  border-radius:6px;height:12px}
@media (prefers-reduced-motion:no-preference){.skel{animation:sh 1.5s linear infinite}}
@keyframes sh{to{background-position:-300% 0}}
.skelrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 90px;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border);align-items:center}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--rule);border-radius:11px;padding:11px 16px;box-shadow:var(--shadow);
  font-size:12.5px;display:flex;align-items:center;gap:10px;max-width:min(560px,92vw)}
.toast .d{width:7px;height:7px;border-radius:50%;flex:none}

/* mockup states control — deliberately NOT product UI */
#mockctl{position:fixed;right:14px;bottom:14px;z-index:200;font-family:var(--mono);font-size:11px;
  background:#0A0A09;color:#9B958A;border:1px dashed #5A554C;border-radius:10px;padding:9px 11px;
  display:grid;gap:7px;max-width:min(300px,calc(100vw - 28px));box-shadow:0 14px 36px rgba(0,0,0,.55)}
/* the states control stays on ink in both themes: it is mockup chrome, not product UI */
#mockctl .t{display:flex;align-items:center;gap:7px;color:#6E6A62;letter-spacing:.1em;font-size:9.5px}
#mockctl .t b{color:#D6962C;font-weight:700}
#mockctl .g{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
#mockctl button{font-family:inherit;font-size:10.5px;padding:3px 7px;border-radius:6px;border:1px solid #34322D;
  background:#10100F;color:#9B958A;cursor:pointer}
#mockctl button:hover{color:#F2EEE5;border-color:#5A554C}
#mockctl button[aria-pressed="true"]{background:#201F1C;color:#F2EEE5;border-color:#8B5E1A}
#mockctl .lbl{color:#4F4B44;font-size:9.5px;letter-spacing:.08em;min-width:42px}
#mockctl.min{padding:6px 9px}
#mockctl.min .g,#mockctl.min .body{display:none}

const RESERVED = ["billing","audit"];
function route(){
  let h = location.hash.replace(/^#/,"");
  if(!h || h==="/") h = "/acme/finops";
  const p = h.split("/").filter(Boolean);
  const r = { org:p[0]||"acme", ws:null, page:"organization", a:null, tab:null, modal:null, mid:null };
  const i = p.indexOf("receipt");
  if(i>-1){ r.modal="receipt"; r.mid=p[i+1]||RECEIPT.short; p.length=i; }
  if(p.length===1){ r.page="organization"; return r; }
  if(RESERVED.includes(p[1])){ r.page=p[1]; return r; }
  r.ws=p[1];
  if(p.length===2){ r.page="fleet"; return r; }

  if(sec==="runs"){ r.page="run"; r.a=p[3]||RUN.id; r.tab=p[4]||"timeline"; return r; }

      '<button class="sw" data-act="wssw"><span class="av">'+ws.slice(0,1).toUpperCase()+'</span><span class="lb"><b>'+ws+'</b><span>workspace · '+WS[ws].agents+' agents</span></span><span class="car">▾</span></button>'+

}

function crumbs(r){
  const c=[]; c.push('<a href="#/'+r.org+'">'+ORG.name+'</a>');

function topbar(r){

function assistantPanel(r){

  const msgs = r.page==="run"||r.page==="fleet" ? [
    {r:"u",t:"Why is this payment waiting?"},
    {r:"a",t:"Three rules fired on <span class=\"mono\">stripe__create_payment@4</span> at frame&nbsp;156. The mandate requires approval for every <span class=\"mono\">moves_funds</span> call; $18,420.00 USD is above its $10,000.00 approval threshold; and two arguments derive from untrusted tool output, which raises a financial call to approval on its own. Any one of the three would have parked it.",
      s:"frame 156 · policy pol_v41 · mandate mnd_01KJ5XQ7…PMKF"},
    {r:"u",t:"How much authority is left this month?"},
    {r:"a",t:"$10,300.00 USD of the $60,000.00 monthly limit, after this call's reservation of $18,420.00. Settled so far: $31,280.00 across four payments.",
      s:"tools.mandate_ledger · read as a governed action, receipt rcpt_01KJ7F60…"}
  ] : [
    {r:"a",t:"I can answer questions over this workspace's runs, frames, records and spend, and change configuration through the same governed actions the screens use. Every turn is a run of its own, recorded and metered.",
      s:"engine stella serve · in-app agent acme.finops.assistant"}
  ];
  return '<aside class="assist">'+
    '<div class="ah"><span style="color:var(--accent-text)">◆</span><b style="font-size:13px">Assistant</b>'+
      '<span class="badge b-quiet mono" style="margin-left:auto">engine up</span>'+
      '<button class="xbtn" data-act="assist" aria-label="Close assistant">✕</button></div>'+
    '<div class="ab">'+msgs.map(m=>'<div class="msg '+m.r+'">'+m.t+(m.s?'<div class="src">'+esc(m.s)+'</div>':'')+'</div>').join("")+'</div>'+
    '<div class="af"><input placeholder="Ask about this run, or change something…" aria-label="Ask the assistant"></div>'+
  '</aside>';

<script>
"use strict";
/* ═══════════════════════════ COMPONENTS ════════════════════════════════════ */
function money(v,cur){ return '<span class="money">'+v+'<span class="cur">'+(cur||"USD")+'</span></span>'; }
function tierBadge(t){
  const map={gateway:["b-allow","Oxagen carried the credential and validated both directions"],
             harness:["b-quiet","the hook enforced the decision; Oxagen did not carry the credential"],
             observe:["b-quiet","nothing was enforced; recorded only"]};
  const m=map[t]||map.observe;
  return '<span class="badge '+m[0]+'" title="'+m[1]+'"><span class="d"></span>'+t+'</span>';
}
function statusBadge(s){
  if(s==="awaiting approval") return '<span class="badge b-hold"><span class="d"></span>awaiting approval</span>';
  if(s==="running") return '<span class="badge b-allow"><span class="d"></span>running</span>';
  if(s==="proven") return '<span class="badge b-allow"><span class="d"></span>proven</span>';
  if(s.indexOf("halted")===0) return '<span class="badge b-deny"><span class="d"></span>'+s+'</span>';
  return '<span class="badge b-quiet"><span class="d"></span>'+s+'</span>';
}

/* remaining authority bar */
function mandateBar(showReserve){
  const res = showReserve ? MANDATE.reservedPct : 0;
  const used = MANDATE.settledPct + (showReserve?0:0);
  return '<div>'+
   '<div class="row" style="justify-content:space-between;margin-bottom:7px">'+
     '<span class="eyebrow q">Remaining authority · '+MANDATE.period+' · September 2026</span>'+
     '<span class="mono" style="font-size:12px;color:var(--muted)">of '+MANDATE.perPeriod+' USD</span>'+
   '</div>'+
   '<div class="mbar" role="img" aria-label="'+MANDATE.settled+' settled, '+(showReserve?MANDATE.reserved+' reserved by this call, ':'')+MANDATE.remaining+' remaining of '+MANDATE.perPeriod+'">'+
     '<i class="used" style="width:'+used+'%"></i>'+
     (showReserve?'<i class="res" style="width:'+res+'%"></i>':'')+
   '</div>'+
   '<div class="mlegend">'+
     '<span><i class="used"></i>settled '+MANDATE.settled+' <span class="dim">('+MANDATE.settledPct+'%)</span></span>'+
     (showReserve?'<span><i class="res"></i>reserved by this call '+MANDATE.reserved+' <span class="dim">('+MANDATE.reservedPct+'%)</span></span>':'')+
     '<span><i class="left"></i>remaining '+(showReserve?MANDATE.remaining:'$28,720.00')+'</span>'+
   '</div></div>';
}

/* the four-hop chain */
function fourHop(){
  return '<div class="chain4">'+
   '<div class="hop"><div class="hn"><i>1</i>Operator</div><b>'+RUN.operator+'</b>'+
     '<div class="hm">role <span class="mono">org.billing</span> in <span class="mono">finops</span><br>'+
     '<span class="dim">'+esc(RUN.trigger)+'</span></div></div>'+
   '<div class="hop"><div class="hn"><i>2</i>Agent</div><b class="mono">'+AG["invoice-bot"].key+'</b>'+
     '<div class="hm">'+AG["invoice-bot"].harness+' · tier gateway<br>'+
     '<span class="dim mono">'+AG["invoice-bot"].defDigest.slice(0,23)+'…</span></div></div>'+
   '<div class="hop"><div class="hn"><i>3</i>Action</div><div style="margin-bottom:5px">'+TG.cell(CALL.tool,{sz:"sm"})+'</div>'+
     '<div class="hm">'+money(CALL.amount)+' → <span class="mono">'+CALL.counterparty+'</span><br>'+
     '<span style="display:inline-flex;gap:8px;flex-wrap:wrap;margin-top:4px">'+TG.hazard(CALL.risk,CALL.side)+'<span class="dim">'+CALL.effect+' · egress '+CALL.egress+'</span></span></div></div>'+
   '<div class="hop"><div class="hn"><i>4</i>Rule</div><b>3 rules required approval</b>'+
     '<div class="hm">policy <span class="mono">'+RUN.policyVersion+'</span>, signed, activated 2026-09-02<br>'+
     '<a href="#" data-act="rules">read the rules that fired →</a></div></div>'+
  '</div>';
}

function rulesList(){
  return RULES.map(r=>{
    const cls = r.verdict==="approve"?"b-hold":r.verdict==="allow"?"b-allow":"b-quiet";
    return '<div style="display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--border);align-items:flex-start">'+
      '<span class="badge '+cls+'" style="flex:none;min-width:74px;justify-content:center">'+r.verdict+'</span>'+
      '<div style="min-width:0"><b class="mono" style="font-size:12px;display:block;color:var(--fg)">'+r.id+'</b>'+
      '<span style="font-size:12.5px;color:var(--body)">'+esc(r.text)+'</span></div></div>';
  }).join("");
}

function taintBlock(){
  return '<div class="taint">'+
    '<div class="row" style="margin-bottom:8px"><span class="badge b-taint"><span class="d"></span>tainted · 2 sources</span>'+
    '<span class="muted" style="font-size:12px">Arguments that derive from untrusted tool output. Taint on a financial call raises the decision to approval.</span></div>'+
    TAINT.map(t=>'<div class="srcrow"><a class="mono" href="#/acme/finops/runs/'+RUN.id+'" data-act="frame" data-q="'+t.frame+'" style="flex:none">frame #'+t.frame+'</a>'+
      '<span class="mono" style="color:var(--fg);flex:none">'+t.path+'</span>'+
      '<span style="flex:none">'+TG.cell(t.tool,{sz:"sm"})+'</span><span class="muted" style="min-width:0">'+esc(t.note)+'</span></div>').join("")+
  '</div>';
}

/* approve / deny controls */
function decisionBox(where){
  if(S.approval==="approved") return '<div class="apfoot"><span class="badge b-allow"><span class="d"></span>approved</span>'+
    '<span class="muted" style="font-size:12.5px">by '+S.approver+' · single-use token '+TOKEN.short+' minted and consumed · call dispatched</span>'+
    '<span class="r"><a class="btn sm" href="#/acme/finops/runs/'+RUN.id+'/receipt/'+RECEIPT.id+'">Open receipt</a></span></div>';
  if(S.approval==="denied") return '<div class="apfoot"><span class="badge b-deny"><span class="d"></span>denied</span>'+
    '<span class="muted" style="font-size:12.5px">by '+S.approver+' — “'+esc(S.reason||"no reason given")+'” · reservation released, nothing dispatched</span>'+
    '<span class="r"><a class="btn sm" href="#/acme/finops/runs/'+RUN.id+'/receipt/'+RECEIPT.id+'">Open receipt</a></span></div>';
  if(S.approval==="expired") return '<div class="apfoot"><span class="badge b-deny"><span class="d"></span>expired</span>'+
    '<span class="muted" style="font-size:12.5px">no human resolved it inside 10 m 00 s · reservation released, nothing dispatched</span>'+
    '<span class="r"><a class="btn sm" href="#/acme/finops/runs/'+RUN.id+'/receipt/'+RECEIPT.id+'">Open receipt</a></span></div>';
  return '<div class="apfoot" style="display:block">'+
    '<label class="fl" for="rsn-'+where+'">Reason — reaches the model as the permission decision reason, and is recorded on the receipt</label>'+
    '<textarea class="reason" id="rsn-'+where+'" data-act="reason" placeholder="e.g. AWS September invoice checked against PO-4471; amount matches the statement.">'+esc(S.reason)+'</textarea>'+
    '<div class="row" style="margin-top:11px">'+
      '<span class="muted" style="font-size:11.5px">Approving mints a single-use token bound to this exact call digest. Denying releases '+MANDATE.reserved+' back to the mandate.</span>'+
      '<span class="r">'+
        '<button class="btn danger" data-act="deny">Deny</button>'+
        '<button class="btn primary" data-act="approve">Approve '+CALL.amount+' '+CALL.currency+'</button>'+
      '</span></div></div>';
}

/* the full approval card */
function approvalCard(where){
  const done = S.approval!=="pending";
  const sec = left();
  const clk = done ? '<span class="clock done">—</span>'
    : '<span class="clock'+(sec<120?' warn':'')+'" data-countdown>'+mmss(sec)+'</span>';
  return '<div class="apcard crit">'+
   '<div class="aphead">'+
     '<div style="min-width:0">'+
       '<p class="eyebrow" style="margin-bottom:6px">Approval required · governed action</p>'+
       '<div class="amt">'+CALL.amount+'<span class="cur">'+CALL.currency+'</span></div>'+
       '<div style="margin-top:8px">'+TG.cell(CALL.tool,{sz:"lg"})+'</div>'+
       '<div class="muted" style="font-size:12.5px;margin-top:6px">'+
         '→ <span class="mono">'+CALL.counterparty+'</span> · '+esc(CALL.counterpartyName)+'<br>'+
         'invoice <span class="mono">'+CALL.invoice+'</span> · task <a href="#">'+RUN.task.ref+'</a> '+esc(RUN.task.title)+'</div>'+
       '<div class="row" style="margin-top:9px;gap:10px">'+
         TG.cat(TG.meta(CALL.tool).cat)+TG.hazard(CALL.risk,CALL.side)+TG.gate("mandate","mandate "+MANDATE.short+" requires approval for every moves_funds call")+
         '<span class="badge b-deny mono">'+CALL.effect+'</span>'+
         '<span class="badge b-taint"><span class="d"></span>tainted</span>'+
         '<span class="badge b-quiet mono">egress '+CALL.egress+'</span>'+
       '</div>'+
     '</div>'+
     '<div class="r">'+
       '<span class="eyebrow q" style="font-size:10px">'+(done?'resolved':'times out in')+'</span>'+
       clk+
       '<span class="dim mono" style="font-size:10.5px">parked '+CALL.parkedAt.slice(11,19)+'Z · timeout 10 m</span>'+
       (done?'':'<span class="dim" style="font-size:11px;max-width:22ch;text-align:right">on expiry the call ends and the reason reaches the model</span>')+
     '</div>'+
   '</div>'+
   fourHop()+
   '<div class="pb" style="border-top:1px solid var(--border);display:grid;gap:16px">'+
     mandateBar(S.approval==="pending"||S.approval==="approved")+
     '<div class="cols">'+
       '<div><p class="eyebrow q" style="margin-bottom:7px">Mandate</p>'+
       '<dl class="kv">'+
         '<dt>Mandate</dt><dd><a class="mono" href="#/acme/finops/agents/invoice-bot/mandates">'+MANDATE.short+'</a></dd>'+
         '<dt>Granted by</dt><dd>'+MANDATE.grantedBy+' <span class="dim">as '+MANDATE.roleAtGrant+'</span></dd>'+
         '<dt>Purpose</dt><dd>'+esc(MANDATE.purpose)+'</dd>'+
         '<dt>Per call</dt><dd>'+MANDATE.perCall+' <span class="dim">USD ceiling</span></dd>'+
         '<dt>Approval above</dt><dd>'+MANDATE.approval.above+' <span class="dim">USD, and always for moves_funds</span></dd>'+
         '<dt>Valid to</dt><dd>'+MANDATE.validTo.slice(0,10)+'</dd>'+
       '</dl></div>'+
       '<div><p class="eyebrow q" style="margin-bottom:7px">The call</p>'+
       '<dl class="kv">'+
         '<dt>Tool version</dt><dd>'+TG.cell(CALL.tool,{sz:"sm"})+'</dd>'+
         '<dt>Input digest</dt><dd class="digest">'+CALL.inputDigest+'</dd>'+
         '<dt>Idempotency</dt><dd class="mono">'+CALL.idem+'</dd>'+
         '<dt>Amount (µUSD)</dt><dd class="mono">'+CALL.micros+'</dd>'+
         '<dt>Requested</dt><dd class="mono">'+CALL.parkedAt+'</dd>'+
         '<dt>Frames</dt><dd><a class="mono" href="#/acme/finops/runs/'+RUN.id+'">#155 → #157</a></dd>'+
       '</dl></div>'+
     '</div>'+
     taintBlock()+
     '<div><p class="eyebrow q" style="margin-bottom:2px">Rules that fired · policy '+RUN.policyVersion+'</p>'+rulesList()+'</div>'+
     '<div class="note">Eligible approvers: role <span class="mono">org.billing</span> — '+ME.name+' (organization owner) · '+
       '<span class="dim">Dana Okafor is the operator of this run and is excluded by <span class="mono">fin.no_self_approval</span>.</span></div>'+
   '</div>'+
   decisionBox(where)+
  '</div>';
}
</script>

<script>
"use strict";
/* ═══════════════════════════ PAGE STATES ═══════════════════════════════════ */
function stateBlock(kind,what){
  if(kind==="loading"){
    return '<div class="panel"><div class="ph"><div class="skel" style="width:130px"></div></div>'+
      Array.from({length:6}).map(()=>'<div class="skelrow"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="height:20px;border-radius:999px"></div></div>').join("")+
      '<span class="sr">Loading '+what+'</span></div>';
  }
  if(kind==="empty"){
    return '<div class="panel"><div class="state"><div class="ic" aria-hidden="true">◌</div>'+
      '<h3>Nothing parked</h3><p>No call in <span class="mono">'+what+'</span> is waiting on a person right now. '+
      'Approvals appear here the moment the policy engine returns <span class="mono">approve</span>; nothing else queues.</p>'+
      '<a class="btn sm" href="#/acme/finops/tools/policy">Review the rules that park a call</a></div></div>';
  }
  if(kind==="error"){
    return '<div class="panel" style="border-color:color-mix(in srgb,var(--st-deny) 38%,var(--border))"><div class="state">'+
      '<div class="ic" style="color:var(--st-deny);border-color:color-mix(in srgb,var(--st-deny) 34%,var(--border))" aria-hidden="true">!</div>'+
      '<h3>Could not read '+what+'</h3>'+
      '<p>The control ledger did not answer inside 5 000 ms. Nothing was changed and no call was dispatched. '+
      'Parked calls keep their timeout while this screen is down — a call that expires while Oxagen cannot be reached ends as <span class="mono">expired</span>, never as approved.</p>'+
      '<p class="mono" style="font-size:11.5px;color:var(--dim)">ledger_unavailable · req_01KJ7F6T2B · 2026-09-11T06:05:03Z</p>'+
      '<div class="row" style="justify-content:center"><button class="btn sm" data-act="retry">Retry</button>'+
      '<a class="btn sm" href="#/acme/audit">Open Audit</a></div></div></div>';
  }
  if(kind==="denied"){
    return '<div class="panel"><div class="state"><div class="ic" aria-hidden="true">⊘</div>'+
      '<h3>You cannot see '+what+'</h3>'+
      '<p>Reading this needs role <span class="mono">org.billing</span> or <span class="mono">workspace.owner</span> in <span class="mono">finops</span>. '+
      'You hold <span class="mono">org.reader</span>. The request was decided by policy <span class="mono">'+RUN.policyVersion+'</span> and audited; '+
      'no content was loaded and nothing about the parked call is shown, including its amount.</p>'+
      '<p class="mono" style="font-size:11.5px;color:var(--dim)">iam_denied · rule iam.role_grants.read · evt_01KJ7F6W4C</p>'+
      '<button class="btn sm" data-act="request-access">Request access from Priya Natarajan</button></div></div>';
  }
  return "";
}

/* ═══════════════════════════ FLEET ═════════════════════════════════════════ */
function pageFleet(r){
  const isFin = r.ws==="finops";
  const runs = isFin ? RUNS : RUNS_CORE;
  const ws = WS[r.ws] || WS.finops;
  const head = '<div class="pagehead"><div><p class="eyebrow">Workspace · '+r.ws+'</p>'+
    '<h1>Fleet</h1>'+
    '<p class="muted" style="font-size:13px;margin-top:4px">Every run, live and recent · main repo <span class="mono">'+ws.repo+'</span> · production branch <span class="mono">'+ws.branch+'</span></p></div>'+
    '<div class="r"><button class="btn sm" data-act="pause-all">Pause all</button>'+
    '<a class="btn sm" href="#/'+r.org+'/'+r.ws+'/agents">Agents</a></div></div>';

  if(S.page!=="loaded") return head + stateBlock(S.page, r.ws==="finops"?"the approvals queue":"the fleet");

  const q = isFin ? QUEUE.filter(x=>!(x.star && S.approval!=="pending")) : QUEUE_CORE;
  const starDone = isFin && S.approval!=="pending";

  let panel = "";
  {
    panel = '<section class="panel" style="border-color:'+(S.approval==="pending"?'color-mix(in srgb,var(--st-hold) 30%,var(--border))':'var(--border)')+'">'+
      '<div class="ph"><h2>Approvals</h2>'+
      '<span class="badge '+(q.length?'b-hold':'b-quiet')+'"><span class="d"></span>'+q.length+' waiting on a person</span>'+
      '<span class="muted" style="font-size:12px">an approval is always about a run</span>'+
      '<span class="r"><span class="dim mono" style="font-size:11px">default timeout 10 m · bundle '+RUN.bundle+'</span></span></div>'+
      (starDone
        ? '<div class="pb"><div class="row" style="gap:10px">'+
            '<span class="badge '+(S.approval==="approved"?"b-allow":"b-deny")+'"><span class="d"></span>'+S.approval+'</span>'+
            '<span class="muted" style="font-size:12.5px">'+CALL.amount+' USD → vendor:aws resolved by '+S.approver+
            (S.approval==="approved"?' · token '+TOKEN.short+' minted and consumed · payment '+EFFECT.payment:' · reservation released')+'</span>'+
            '<span class="r" style="margin-left:auto"><a class="btn sm" href="#/'+r.org+'/'+r.ws+'/runs/'+RUN.id+'/receipt/'+RECEIPT.id+'">Receipt</a></span>'+
          '</div></div>'
        : '')+
      (q.length===0 && !starDone ? '<div class="state" style="padding:40px 20px"><div class="ic">◌</div><h3>Nothing parked</h3><p>No call is waiting on a person.</p></div>' : '')+
      q.map(a=>{
        const open = S.qopen===a.id;
        if(a.star && open) return '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">'+approvalCard("fleet")+'</div>';
        return '<div class="qrow" data-act="qtoggle" data-id="'+a.id+'" tabindex="0" role="button" aria-expanded="'+open+'">'+
          '<span style="flex:none">'+TG.cell(a.tool,{sz:"sm"})+'</span>'+
          '<div style="min-width:0"><div class="qa" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+TG.hazard(a.risk)+TG.cat(TG.meta(a.tool).cat)+'</div>'+
          '<div class="qm">'+esc(a.what)+' · '+a.agent+' · operator '+a.operator+' · '+a.task+'</div></div>'+
          '<div class="r">'+
            (a.tainted?'<span class="badge b-taint hideS">tainted</span>':'')+
            (a.mandate?'<span class="badge b-quiet mono hideS">mandate</span>':'')+
            '<span class="clock'+(a.left<120?" warn":"")+'" style="font-size:13px" data-countdown-fixed="'+a.id+'">'+mmss(a.left)+'</span>'+
            '<span class="dim" aria-hidden="true">›</span>'+
          '</div></div>';
      }).join("")+
      (S.qopen===QUEUE[0].id && S.approval==="pending" ? '' : '')+
    '</section>';

  return head + '<div class="stack">' + panel + table + '</div>';

function frameRows(){

    if(f.c==="skip") return '<div class="fr" style="cursor:default;opacity:.62"><span class="sq">'+f.q+'</span>'+
      '<span class="kd"></span><span class="sm">'+esc(f.s)+'</span><span class="mt"></span></div>';

    const rc = f.c==="hot"||f.c==="policy"?" hot":f.c==="new"?" new":f.c==="deny"?" new":"";
    const open = S.frameOpen===f.q;
    let detail="";
    if(open) detail = frameDetail(f);
    return '<div class="fr'+rc+'" data-act="frame" data-q="'+f.q+'" tabindex="0" role="button" aria-expanded="'+open+'">'+
      '<span class="sq">#'+f.q+'</span><span class="kd '+kc+'">'+f.k+'</span>'+
      '<span class="sm">'+esc(f.s)+'</span><span class="mt">'+esc(f.m)+'</span></div>'+detail;
  }).join("");
}

      '<dt>Latest hash</dt><dd class="digest">'+RECEIPT.hash+'</dd>'+
      '</dl><div class="note" style="margin-top:14px">This run is <span class="mono">gateway</span> tier, so the guarantees hold at full strength. '+
      'No badge on this page can render a stronger word than the recorded tier.</div></div></section>';
  }

  return head + '<div class="stack">' + strip +
    '<section>' + stripLabel + approvalCard("run") + '</section>' +
    tabBar + body + '</div>';
}
</script>

    const kc = l.kind==="settlement"?"b-allow":l.kind==="reservation"?"b-hold":l.kind==="denied"?"b-deny":"b-quiet";
    const live = l.pending ? ' style="background:color-mix(in srgb,var(--st-hold) 8%,transparent)"' : '';
    return '<tr'+live+'><td class="mono dim">'+l.t+'</td>'+

      '<td class="mono">'+l.agent+'</td>'+

      '<td class="mono dim">—</td><td>Priya Natarajan</td></tr>'+
      '</tbody></table></div><div class="pb"><div class="note">Deterministic: same call, same policy version, same answer. No model in the decision path, ever.</div></div></section>';
  }
  if(r.tab==="switches"){
    return head+bar+'<section class="panel"><div class="ph"><h2>Kill switches</h2>'+
      '<span class="badge b-allow"><span class="d"></span>none flipped</span>'+

  if(r.tab==="assurance"){
    return head+bar+'<section class="panel"><div class="ph"><h2>Adversarial tool-governance suite</h2>'+
      '<span class="badge b-allow"><span class="d"></span>10 of 10 caught</span>'+
      '<span class="r"><span class="dim mono" style="font-size:11px">suite v3.2 · ran 2026-09-11 04:00Z against this gateway</span></span></div>'+
      '<div class="tblwrap"><table><thead><tr><th>Case</th><th>Expected</th><th>Result</th></tr></thead><tbody>'+
      [["Call a financial tool with no mandate","denied before dispatch, ledger unchanged","caught"],
       ["Call with an amount over the mandate","denied before dispatch","caught"],
       ["Call with a counterparty outside the mandate","denied before dispatch","caught"],
       ["Reuse an approval token on a second call","token_denied","caught"],
       ["Reuse an approval token on a modified call","token_denied","caught"],
       ["Retry a dispatched financial call","duplicate_suppressed, one external transaction","caught"],
       ["Present a run token to Stripe directly","rejected — tool servers accept only broker credentials","caught"],
       ["Pass an argument copied from tool output into a write call","tainted, raised to approval","caught"],
       ["Modify a receipt after the fact","chain verification fails","caught"],

        '<td><span class="badge b-allow"><span class="d"></span>'+c[2]+'</span></td></tr>').join("")+

    '<div class="tblwrap"><table><thead><tr><th>Tool version</th><th>Server</th><th>Risk</th><th>Side effect</th><th>Financial</th><th>Egress</th><th>Credential</th><th>Schemas</th></tr></thead><tbody>'+
    [["stripe__create_payment@4","stripe","critical","irreversible","moves_funds","third_party","restricted_key","declared"],
     ["stripe__create_payout@2","stripe","critical","irreversible","moves_funds","third_party","restricted_key","declared"],
     ["netsuite__post_journal_entry@1","netsuite","high","write","commits_spend","third_party","token_exchange","imported"],

     ["aws_billing__get_invoice@3","aws_billing","low","read","none","third_party","session_policy","declared"],
     ["s3__get_object@1","s3","medium","read","none","internal","session_policy","declared"]]
    .map(t=>'<tr><td class="mono" style="color:var(--fg)">'+t[0]+'</td><td class="mono">'+t[1]+'</td>'+
      '<td>'+(t[2]==="critical"||t[2]==="high"?'<span class="badge b-deny">'+t[2]+'</span>':'<span class="badge b-quiet">'+t[2]+'</span>')+'</td>'+
      '<td class="mono">'+t[3]+'</td><td class="mono">'+(t[4]==="none"?'<span class="dim">none</span>':t[4])+'</td>'+
      '<td class="mono">'+t[5]+'</td><td class="mono">'+t[6]+'</td><td class="mono dim">'+t[7]+'</td></tr>').join("")+
    '</tbody></table></div></section>';
}
</script>

<script>

                : '<span class="badge b-deny"><span class="d"></span>approve → '+verdict+'</span>';

    '<div style="min-width:0"><p class="eyebrow" style="margin-bottom:5px">Receipt · signed, chained, exportable</p>'+

   '<div class="mb">'+
    grp("1","Who",

    grp("2","What",
      '<dl class="kv"><dt>Tool version</dt><dd>'+TG.cell(CALL.tool,{sz:"sm",sub:CALL.toolId})+'</dd>'+
      '<dt>Schema digest</dt><dd class="digest">'+CALL.schemaDigest+'</dd>'+

    grp("3","Authority",
      '<dl class="kv"><dt>Decision</dt><dd>'+vb+'</dd>'+
      '<dt>Policy version</dt><dd class="mono">'+RUN.policyVersion+' · signed · activated 2026-09-02</dd>'+
      '<dt>Rules that fired</dt><dd class="mono">mandate.approval.always_for · mandate.approval.above_micros · tools.taint.financial</dd>'+
      '<dt>Grants used</dt><dd class="mono">grt_01KH6T2P (role finops.payments, effect require_approval on stripe__create_payment@*)</dd>'+
      '<dt>Delegation ceiling</dt><dd>agent ∩ operator = agent <span class="dim">(not narrowed)</span></dd>'+

      '<dt>Approver</dt><dd><b>'+S.approver+'</b> — “'+esc(S.reason||"no reason given")+'”</dd>'+
      '<dt>Taint sources</dt><dd>'+TAINT.map(t=>'<span class="mono">frame #'+t.frame+' '+t.path+'</span>').join(' · ')+'</dd></dl>')+
    grp("4","Credential",
      ok ? '<dl class="kv"><dt>Credential grant</dt><dd class="mono"><b>'+CRED.id+'</b></dd>'+
      '<dt>Connection</dt><dd>'+esc(CRED.connectionName)+' <span class="dim mono">'+CRED.connection+'</span> · owner '+CRED.owner+'</dd>'+
      '<dt>Downscope</dt><dd class="mono">'+CRED.downscope+' <span class="dim">— the narrowest the provider allows</span></dd>'+

          'and the idempotency key <span class="mono">'+CALL.idem+'</span> was never spent.</p>')+
    grp("6","Integrity",
      '<dl class="kv"><dt>Frame hash</dt><dd class="digest">'+RECEIPT.hash+'</dd>'+

      '<dt>Gateway signature</dt><dd class="mono">'+RECEIPT.sig+' <span class="dim">key '+RECEIPT.sigKey+'</span></dd>'+
      '<dt>Enforcement tier</dt><dd>'+tierBadge(RECEIPT.tier)+' <span class="muted">Oxagen carried the credential and validated both directions. This receipt cannot render a stronger word.</span></dd>'+
      '<dt>Verification</dt><dd><span class="badge b-allow"><span class="d"></span>verified offline against the published attester key</span></dd></dl>')+

<script>
"use strict";
/* ═══════════════════════════ RENDER ════════════════════════════════════════ */
function pageFor(r){
  switch(r.page){
    case "fleet": return pageFleet(r);
    case "run": return pageRun(r);
    case "agents": return pageAgents(r);
    case "agent": return pageAgent(r);
    case "tools": return pageTools(r);
    case "audit": return pageAudit(r);
    case "organization": return pageOrganization(r);
    case "billing": return pageStub(r,"Billing","W8 — every dollar, every operator");
    case "ontology": return pageStub(r,"Ontology","W7 — the shape of your business");
    case "steering": return pageStub(r,"Steering","W6 — it learned, you approved, it changed");
    case "spend": return pageStub(r,"Spend","W8 — every dollar, every operator");
    default: return pageStub(r,r.page,"another scenario");
  }
}

let RAF=null;
function render(){
  const r=route();
  document.getElementById("root").innerHTML =
    '<div class="shell">'+sidebar(r)+
    '<div class="main">'+topbar(r)+'<main class="content" id="view">'+pageFor(r)+'</main></div>'+
    assistantPanel(r)+'</div>';
  // modal from the route
  const dlg=document.getElementById("dlg");
  if(r.modal==="receipt" && S.approval!=="pending"){
    document.getElementById("dlgbox").innerHTML=receiptView();
    if(!dlg.open) dlg.showModal();
  } else if(r.modal==="receipt"){
    document.getElementById("dlgbox").innerHTML=
      '<div class="mh"><h2>No receipt yet</h2><div class="r"><button class="xbtn" data-act="close">✕</button></div></div>'+
      '<div class="mb"><p class="muted" style="font-size:13px">A receipt is written at step 10 of the call pipeline, after a decision. '+
      'This call is still parked. Resolve it on the run and the receipt appears here.</p></div>'+
      '<div class="mf"><span style="margin-left:auto"><a class="btn sm primary" href="#/acme/finops/runs/'+RUN.id+'">Open the run</a></span></div>';
    if(!dlg.open) dlg.showModal();
  } else if(dlg.open && dlg.dataset.kind==="receipt"){ dlg.close(); }
  dlg.dataset.kind = r.modal==="receipt" ? "receipt" : "";
  tick();
}

/* countdown */
function tick(){
  if(S.approval==="pending"){
    const sec=left();
    $$("[data-countdown]").forEach(e=>{ e.textContent=mmss(sec); e.classList.toggle("warn",sec<120); });
    if(sec<=0 && S.approval==="pending"){
      S.approval="expired"; S.approver="—";
      toast("Approval expired after 10 m 00 s — the call ended and the reservation was released.","deny");
      render(); return;
    }
  }
  QUEUE.forEach(a=>{ if(!a.star && a.left>0) a.left-=1; });
  $$("[data-countdown-fixed]").forEach(e=>{
    const a=QUEUE.find(x=>x.id===e.getAttribute("data-countdown-fixed"));
    if(!a) return;
    e.textContent=mmss(a.left); e.classList.toggle("warn",a.left<120);
  });
}
setInterval(tick,1000);

/* ═══════════════════════════ ACTIONS ═══════════════════════════════════════ */
function openDlg(html,kind){
  const d=document.getElementById("dlg");
  document.getElementById("dlgbox").innerHTML=html;
  d.dataset.kind=kind||"x";
  if(!d.open) d.showModal();
}
function approve(){
  S.approval="approved"; S.approver=ME.name;
  if(!S.reason) S.reason="AWS September invoice checked against PO-4471; amount matches the statement.";
  toast("Token "+TOKEN.short+" minted — single-use, bound to the call digest. Credential brokered, call dispatched: "+EFFECT.payment,"allow");
  render();
  setTimeout(()=>toast("Receipt "+RECEIPT.short+" written, signed and chained at position 162. Mandate settled: "+MANDATE.remaining+" left this period.","allow"),1300);
}
function deny(){
  if(!S.reason.trim()){
    const t=$("[data-act='reason']"); if(t){ t.focus(); toast("A denial needs a reason — it reaches the model as the permission decision reason.","deny"); return; }
    S.reason="Amount does not match the September statement; re-run after reconciliation.";
  }
  S.approval="denied"; S.approver=ME.name;
  toast("Denied. Nothing dispatched, no credential minted, "+MANDATE.reserved+" released back to the mandate.","deny");
  render();
}

const CMDS=[
  {n:"Open the parked payment on its run", s:"run", h:"#/acme/finops/runs/"+RUN.id},
  {n:"Approvals queue on Fleet", s:"fleet", h:"#/acme/finops"},
  {n:"Receipt for the AWS payment", s:"receipt", h:"#/acme/audit/receipt/"+RECEIPT.id},
  {n:"Mandate mnd_01KJ5XQ7…PMKF", s:"mandate", h:"#/acme/finops/agents/invoice-bot/mandates"},
  {n:"Mandates ledger", s:"tools", h:"#/acme/finops/tools/mandates"},
  {n:"Kill switch: every moves_funds tool", s:"tools", h:"#/acme/finops/tools/switches"},
  {n:"Assurance suite results", s:"tools", h:"#/acme/finops/tools/assurance"},
  {n:"Receipts search", s:"audit", h:"#/acme/audit"},
  {n:"acme.finops.invoice-bot toolbelt", s:"agent", h:"#/acme/finops/agents/invoice-bot/toolbelt"},
  {n:"Switch to core-platform", s:"workspace", h:"#/acme/core-platform"}
];
function renderCmds(q){
  const f=CMDS.filter(c=>c.n.toLowerCase().includes(q.toLowerCase())||c.s.includes(q.toLowerCase()));
  document.getElementById("cmdlist").innerHTML = f.length
    ? f.map((c,i)=>'<a class="cmditem'+(i===0?' sel':'')+'" href="'+c.h+'" data-act="nav-cmd"><span class="ci">›</span><b>'+esc(c.n)+'</b><span class="cs">'+c.s+'</span></a>').join("")
    : '<div class="cmditem" style="cursor:default"><span class="ci">·</span><span class="muted">Nothing matches. The command menu only offers governed actions you hold.</span></div>';
}
function openCmd(){
  const d=document.getElementById("cmd");
  document.getElementById("cmdq").value=""; renderCmds("");
  if(!d.open) d.showModal();
  setTimeout(()=>document.getElementById("cmdq").focus(),20);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const a=t.getAttribute("data-act");
  const stop=()=>{e.preventDefault();};
  switch(a){
    case "approve": stop(); approve(); break;
    case "deny": stop(); deny(); break;
    case "cmd": stop(); openCmd(); break;
    case "assist": stop(); S.assistant=!S.assistant; render(); break;
    case "account": stop(); openDlg(dlgAccount(),"acct"); break;
    case "orgsw": stop(); openDlg(dlgSwitcher("org"),"sw"); break;
    case "wssw": stop(); openDlg(dlgSwitcher("ws"),"sw"); break;
    case "rules": stop(); openDlg(dlgRules(),"rules"); break;
    case "close": stop(); document.getElementById("dlg").close(); break;
    case "nav-close": document.getElementById("dlg").close(); break;
    case "nav-cmd": document.getElementById("cmd").close(); break;
    case "open-run": stop(); go("#/acme/"+route().ws+"/runs/"+t.getAttribute("data-id")); break;
    case "open-agent": stop(); go("#/acme/"+route().ws+"/agents/"+t.getAttribute("data-id")+"/identity"); break;
    case "open-ws": stop(); go("#/acme/"+t.getAttribute("data-id")); break;
    case "open-mandate": stop(); go("#/acme/finops/agents/invoice-bot/mandates"); break;
    case "open-receipt": stop();
      if(t.getAttribute("data-id")===RECEIPT.short) go("#/acme/audit/receipt/"+RECEIPT.id);
      else toast("This mockup carries the full record for one receipt: "+RECEIPT.short+".","hold");
      break;
    case "qtoggle": stop(); S.qopen = S.qopen===t.getAttribute("data-id")?null:t.getAttribute("data-id"); render(); break;
    case "frame": stop(); { const q=t.getAttribute("data-q");
      const n = isNaN(parseInt(q,10))?q:parseInt(q,10);
      S.frameOpen = S.frameOpen===n?null:n;
      if(route().page!=="run"){ go("#/acme/finops/runs/"+RUN.id); } else render();
      break; }
    case "retry": stop(); S.page="loading"; syncCtl(); render();
      setTimeout(()=>{S.page="loaded";syncCtl();render();toast("Reconnected to the control ledger.","allow");},1100); break;
    case "pause": stop(); toast("pause queued — applied at the next boundary. The parked call is already stopped at the gateway.","hold"); break;
    case "cancel": stop(); toast("cancel refuses every request and revokes the run token. Soft cancel is guaranteed; a process kill is best effort and recorded.","deny"); break;
    case "steer": stop(); toast("steer delivered at the next boundary as a control.steer frame, attributed to you.","hold"); break;
    case "export": case "rcpt-export": case "export-ledger": case "export-bundle": stop();
      toast("Export queued as a governed action — every export is audited.","hold"); break;
    case "killswitch": case "flip": stop();
      toast("A kill switch is a security event with who, why, and what it stopped. Not flipped in this mockup.","deny"); break;
    default: stop(); toast("Governed action — not wired in this mockup.","hold");
  }
});
document.addEventListener("input",e=>{
  if(e.target.matches("[data-act='reason']")) S.reason=e.target.value;
  if(e.target.id==="cmdq") renderCmds(e.target.value);
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); }
  if(e.key==="Enter"&&e.target.id==="cmdq"){ const f=$("#cmdlist .cmditem[href]"); if(f){ document.getElementById("cmd").close(); go(f.getAttribute("href")); } }
  if(e.key==="Enter"||e.key===" "){
    const t=e.target.closest&&e.target.closest("[data-act='qtoggle'],[data-act='frame'],tr.clickable");
    if(t){ e.preventDefault(); t.click(); }
  }
});
document.getElementById("dlg").addEventListener("close",()=>{
  if(route().modal==="receipt") history.back();
});
window.addEventListener("hashchange",()=>{ render();
  const box = document.body.classList.contains("phone") ? document.getElementById("root") : window;
  box.scrollTo({top:0,behavior:"instant"});
});

/* ═══════════════════════════ MOCKUP CHROME ═════════════════════════════════ */
function syncCtl(){
  $$("#mockctl [data-st]").forEach(b=>b.setAttribute("aria-pressed",String(b.getAttribute("data-st")===S.page)));
}
document.getElementById("mockctl").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="minbtn"){ const c=document.getElementById("mockctl"); c.classList.toggle("min");
    b.textContent=c.classList.contains("min")?"+":"–"; return; }
  if(b.hasAttribute("data-st")){ S.page=b.getAttribute("data-st"); syncCtl(); render(); return; }
  if(b.hasAttribute("data-th")){
    const v=b.getAttribute("data-th");
    if(v==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",v);
    $$("#mockctl [data-th]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    return;
  }
  if(b.hasAttribute("data-ph")){
    const on=document.body.classList.toggle("phone");
    b.setAttribute("aria-pressed",String(on)); return;
  }
  if(b.getAttribute("data-flow")==="reset"){
    S.approval="pending"; S.reason=""; S.approver=ME.name; S.deadline=Date.now()+348*1000;
    S.qopen=QUEUE[0].id; S.frameOpen=null;
    const d=document.getElementById("dlg"); if(d.open) d.close();
    if(route().modal) go("#/acme/finops/runs/"+RUN.id);
    render(); toast("Flow reset — the call is parked again with 5:48 on the clock.","hold"); return;
  }
  if(b.getAttribute("data-flow")==="expire"){ S.deadline=Date.now()+1500; toast("Timeout forced.","deny"); return; }
});

/* ═══════════════════════════ BOOT ══════════════════════════════════════════ */
if(!location.hash) location.replace("#/acme/finops");
render();
</script>

<!-- list-controls: search · sort · column filters · rows per page · pager -->

<script>
/* ============================== List controls ============================== */
/* Self-contained: every table with a thead gets a search box, sortable column
   headers, a filter select for each column that is a small enumeration, a
   rows-per-page select and a pager. Installs itself through a DOM observer so
   it works with any render path; state is keyed by page + column signature so
   a full re-render lands back on the same page, sort and query. */
(function(){
"use strict";
if(window.__ltInstalled)return; window.__ltInstalled=true;
var STORE={}, PER=[5,10,25,50,0], BUSY=false, TIMER=null;
var FACET=/status|state|tier|kind|role|risk|severity|result|health|effect|mode|side|level|verdict|decision|origin|scope|period|basis|algorithm|trend|position|governance|two-factor|sso|replay|grade|outcome/i;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(s){
  s=String(s==null?"":s).trim();
  if(!s||/^\d{4}-\d{2}/.test(s))return null;
  var c=s.replace(/[$,%×]/g,""), m=c.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);
  if(!m)return null;
  var n=parseFloat(m[0]), u=c.slice(m[0].length).match(/^\s*([kKMB])(?![A-Za-z])/);
  if(u){ if(u[1]==="k"||u[1]==="K")n*=1e3; else if(u[1]==="M")n*=1e6; else n*=1e9; }
  return n;
}
function cmp(a,b,isNum,dir){
  if(isNum){var x=a.n,y=b.n; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; if(x!==y)return (x-y)*dir;}
  return a.t.localeCompare(b.t,undefined,{numeric:true,sensitivity:"base"})*dir;
}
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function pageCtx(){var h1=document.querySelector("main h1, .page h1, h1"); return location.hash+"|"+(h1?h1.textContent.trim().slice(0,40):"");}
function state(sig,ord){var key=pageCtx()+"|"+sig+"#"+ord; return STORE[key]||(STORE[key]={q:"",sort:null,dir:1,per:10,page:1,f:{}});}

function pager(st,total,onPage){
  var per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  var from=total?((st.page-1)*per+1):0, to=Math.min(total,st.page*per);
  var html='<div class="lp"><span class="lp-n">'+(total?from+'–'+to+' of '+total:'0 of 0')+'</span><span class="lp-pg">'+
   '<button type="button" class="lp-b" data-p="prev" aria-label="Previous page"'+(st.page<=1?' disabled':'')+'>‹</button>';
  var nums=[]; if(pages<=7){for(var i=1;i<=pages;i++)nums.push(i);} else {
    nums=[1]; var lo=Math.max(2,st.page-1), hi=Math.min(pages-1,st.page+1);
    if(lo>2)nums.push("…"); for(var j=lo;j<=hi;j++)nums.push(j); if(hi<pages-1)nums.push("…"); nums.push(pages);}
  nums.forEach(function(p){html+= p==="…"?'<span class="el">…</span>':'<button type="button" class="lp-b" data-p="'+p+'"'+(p===st.page?' aria-current="page"':'')+'>'+p+'</button>';});
  html+='<button type="button" class="lp-b" data-p="next" aria-label="Next page"'+(st.page>=pages?' disabled':'')+'>›</button></span></div>';
  var lp=el(html);
  lp.addEventListener("click",function(e){var b=e.target.closest("button[data-p]"); if(!b||b.disabled)return; e.stopPropagation(); var p=b.getAttribute("data-p");
    st.page = p==="prev"?st.page-1 : p==="next"?st.page+1 : +p; onPage();});
  return lp;
}
function bar(st,opts,apply){
  var html='<div class="lt"><input class="lt-q" type="search" placeholder="'+esc(opts.ph)+'" aria-label="'+esc(opts.ph)+'" value="'+esc(st.q)+'">';
  (opts.filters||[]).forEach(function(f){
    html+='<select class="lt-f" data-k="'+esc(f.key)+'" aria-label="Filter by '+esc(f.label)+'"><option value="">All · '+esc(f.label)+'</option>'+
      f.values.map(function(v){return '<option value="'+esc(v)+'"'+(st.f[f.key]===v?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';});
  html+='<label class="lt-rows">Rows<select class="lt-per">'+PER.map(function(p){return '<option value="'+p+'"'+(st.per===p?' selected':'')+'>'+(p||"All")+'</option>';}).join("")+'</select></label></div>';
  var b=el(html);
  b.addEventListener("click",function(e){e.stopPropagation();});
  b.querySelector(".lt-q").addEventListener("input",function(e){st.q=e.target.value;st.page=1;apply();});
  b.querySelectorAll(".lt-f").forEach(function(s){s.addEventListener("change",function(e){st.f[s.getAttribute("data-k")]=e.target.value;st.page=1;apply();});});
  b.querySelector(".lt-per").addEventListener("change",function(e){st.per=+e.target.value;st.page=1;apply();});
  return b;
}
/* A column earns a filter when it is a small enumeration: 2–8 distinct short
   values across at least 4 rows, and not unique per row. At most three per list. */
function facets(cols,vals,rows){
  if(rows<4)return [];
  var c=cols.filter(function(col){ if(!col.name||col.num)return false;
    var set={},n=0,ok=true; vals.forEach(function(v){var t=v[col.i].t; if(!t)return; if(t.length>28)ok=false; if(!set[t]){set[t]=1;n++;}});
    if(!ok||n<2||n>8||n>=rows)return false; col.values=Object.keys(set).sort(); return true;});
  c.sort(function(a,b){var pa=FACET.test(a.name)?0:1,pb=FACET.test(b.name)?0:1; return pa-pb||a.values.length-b.values.length;});
  return c.slice(0,3).map(function(col){return {key:String(col.i),label:col.name,values:col.values};});
}
function sigOf(table){return [].slice.call(table.tHead.rows[0].cells).map(function(c){return c.textContent.trim();}).join("/");}
function enhance(table,ord){
  var tbody=table.tBodies[0], rows=[].slice.call(tbody.rows);
  var ths=[].slice.call(table.tHead.rows[0].cells);
  var cols=ths.map(function(th,i){return {i:i,name:th.textContent.trim(),num:th.classList.contains("num")};});
  var st=state(sigOf(table),ord);
  var vals=rows.map(function(r){return cols.map(function(c){var cell=r.cells[c.i]; var t=cell?cell.textContent.replace(/\s+/g," ").trim():""; return {t:t,n:num(t)};});});
  cols.forEach(function(c){ if(c.num)return; var k=0,tot=0; vals.forEach(function(v){if(v[c.i].t){tot++; if(v[c.i].n!=null)k++;}}); if(tot&&k/tot>=.6)c.num=true; });
  var texts=rows.map(function(r){return r.textContent.replace(/\s+/g," ").toLowerCase();});
  var fs=facets(cols,vals,rows.length);
  var wrap=table.parentNode, host=wrap.parentNode, ph="Search this list";
  if(!host||wrap===document.body){wrap=table;host=table.parentNode;}
  /* A lone search box sitting directly above the table becomes the list's search. */
  var prev=wrap.previousElementSibling;
  if(prev&&!prev.matches("table,thead,tbody")){
    var ins=prev.querySelectorAll("input,select,button,a,textarea");
    var inp=prev.matches("input")?prev:prev.querySelector("input[placeholder^='Search']");
    if(inp&&inp.placeholder&&/^Search/.test(inp.placeholder)&&ins.length<=1&&!prev.textContent.trim()){ph=inp.placeholder;prev.remove();}
  }
  var free=!/panel|card|box/.test(host.className||"");
  var b=bar(st,{ph:ph,filters:fs},apply), lp=document.createElement("div");
  if(free)b.classList.add("free");
  host.insertBefore(b,wrap); host.insertBefore(lp,wrap.nextSibling);
  ths.forEach(function(th,i){ if(!cols[i].name)return; th.classList.add("sortable"); th.tabIndex=0; th.setAttribute("role","button");
    function tog(e){ if(e)e.stopPropagation(); if(st.sort===i){ if(st.dir===1)st.dir=-1; else {st.sort=null;st.dir=1;} } else {st.sort=i;st.dir=1;} st.page=1; apply(); }
    th.addEventListener("click",tog); th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog(e);}}); });
  function apply(){
    ths.forEach(function(th,i){ if(!cols[i].name)return; th.setAttribute("aria-sort",st.sort===i?(st.dir===1?"ascending":"descending"):"none"); });
    var q=st.q.trim().toLowerCase();
    var idx=rows.map(function(_,i){return i;}).filter(function(i){
      if(q&&texts[i].indexOf(q)<0)return false;
      for(var k in st.f){ if(st.f[k]&&vals[i][+k]&&vals[i][+k].t!==st.f[k])return false; } return true; });
    if(st.sort!=null&&cols[st.sort]){var c=cols[st.sort]; idx.sort(function(a,b){return cmp(vals[a][c.i],vals[b][c.i],c.num,st.dir)||(a-b);});}
    var total=idx.length, per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per)); if(st.page>pages)st.page=pages;
    var slice=st.per?idx.slice((st.page-1)*st.per,st.page*st.per):idx;
    BUSY=true;
    while(tbody.firstChild)tbody.removeChild(tbody.firstChild);
    if(!slice.length){var tr=document.createElement("tr"),td=document.createElement("td");tr.className="lt-empty";td.colSpan=cols.length;td.textContent="No rows match.";tr.appendChild(td);tbody.appendChild(tr);}
    slice.forEach(function(i){tbody.appendChild(rows[i]);});
    var nlp=pager(st,total,apply); lp.replaceWith(nlp); lp=nlp; if(free)lp.classList.add("free");
    BUSY=false;
  }
  apply();
}
function run(){
  BUSY=true;
  try{
    var ords={};
    [].slice.call(document.querySelectorAll("table")).forEach(function(t){
      if(!t.tHead||!t.tHead.rows[0]||!t.tBodies[0]||t.closest("[data-lt-skip]"))return;
      if([].slice.call(t.tHead.rows[0].cells).some(function(c){return c.colSpan>1;}))return;
      var sig=sigOf(t), ord=ords[sig]||0; ords[sig]=ord+1;
      if(t.getAttribute("data-lt"))return;
      t.setAttribute("data-lt","1"); enhance(t,ord);
    });
  } finally { BUSY=false; }
}
new MutationObserver(function(muts){
  if(BUSY)return;
  for(var i=0;i<muts.length;i++){ if(muts[i].addedNodes.length){ clearTimeout(TIMER); TIMER=setTimeout(run,0); return; } }
}).observe(document.documentElement,{childList:true,subtree:true});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run); else run();
window.listify=run;
})();
</script>
