  if (id === "btnPause"){
    state.runState = "paused";
    appendFrame({ seq:state.frames.length, kind:"control.command", node:"control", cost:0,
      sum:"pause · issued by Marcus Bell · delivered · the next model request returns a paused response",
      command:{ cmd:"pause", outcome:"delivered", receipt:"rcp_01K6QX8A1B",
        guarantee:"At the next boundary. The in-flight model call finishes and is billed." } });
    state.selFrame = state.frames.length - 1;
    render(); toast("Paused. The next model request returns a paused response; the tool gateway denies with a reason."); return;
  }
  if (id === "btnResume"){
    state.runState = "running";
    appendFrame({ seq:state.frames.length, kind:"control.command", node:"control", cost:0,
      sum:"resume · issued by Marcus Bell · applied immediately",
      command:{ cmd:"resume", outcome:"applied", receipt:"rcp_01K6QX8B7C",
        guarantee:"Immediate. The paused response clears on the next request." } });
    state.selFrame = state.frames.length - 1;
    render();
    toast(state.pendingSteer ? "Resumed. The queued steer lands on the next model call." : "Resumed.");
    return;
  }
  if (id === "btnCancel"){
    state.runState = "cancelled";
    appendFrame({ seq:state.frames.length, kind:"control.command", node:"control", cost:0,
      sum:"cancel · issued by Marcus Bell · run token revoked · process kill best effort",
      command:{ cmd:"cancel", outcome:"applied", receipt:"rcp_01K6QX8C2D",
        guarantee:"Soft cancel guaranteed. The collector sends SIGTERM where it owns the process; that part is best effort and recorded." } });
    state.selFrame = state.frames.length - 1;
    render(); toast("Cancelled. Every further request is refused and the run token is dead."); return;
  }
  if (id === "btnRevoke"){
    state.runState = "revoked";
    appendFrame({ seq:state.frames.length, kind:"control.command", node:"control", cost:0,
      sum:"revoke · acme.core.release-manager · credential dead · every run token dead",
      command:{ cmd:"revoke", outcome:"applied", receipt:"rcp_01K6QX8D9E",
        guarantee:"Guaranteed while any seam is in path. If the hooks were stripped, this shows as hooks_removed on the host." } });
    state.selFrame = state.frames.length - 1;
    render(); toast("Agent revoked. The host is suspended in the bundle and denies even if the daemon is down."); return;
  }
  if (id === "btnSteer"){
    const txt = (state.steerText || "").trim() ||
      "Stop cherry-picking. Branch from 9f3c2ab and take the eleven pull requests in merge order instead.";
    const requested = state.steerMode;
    let mode = requested, interrupted = false, interruptedStep = null, degraded = null;
    const last = state.frames[state.frames.length - 1];
    if (requested === "interrupt"){
      if (last && last.live){
        last.live = false;
        last.sum = "stopped by interrupt · 604 partial output tokens · $0.19 · billed";
        last.usage.cost = "$0.19"; last.usage.latency = "stopped at 2,104 ms";
        state.cost = Math.round((state.cost + 0.19) * 100) / 100;
        interrupted = true; interruptedStep = { kind:"model.response", seq:last.seq };
      } else if (last && last.tool && last.kind === "tool_requested" && last.tool.side_effect === "irreversible"){
        degraded = "irreversible_tool_in_flight"; mode = "next_step";
      } else if (last && last.kind === "tool_requested"){
        interrupted = true; interruptedStep = { kind:"tool_requested", seq:last.seq };
      }
    }
    const label = { next_step:"next step", interrupt:"interrupt", turn_boundary:"turn boundary" }[mode];
    const f = appendFrame({ seq:state.frames.length, kind:"control.steer", node:"control", cost:0,
      sum:"steer by Marcus Bell · mode " + mode + (interrupted ? " · cut the in-flight step short" : "") +
          (degraded ? " · degraded from interrupt, irreversible tool in flight" : "") + " · status queued",
      steer:{ text:txt, digest:"sha256:c71a9f2e4d80…", requested_mode:requested, delivery_mode:mode,
        interrupted:interrupted, interrupted_step:interruptedStep, degraded_reason:degraded,
        status:"queued", delivery:"queued · " + label + " · expires in 10m" } });
    state.pendingSteer = { text:txt, seq:f.seq, mode:mode, interrupted:interrupted };
    state.steerText = "";
    state.selFrame = f.seq;
    state.pos = f.seq; state.following = true;
    revealAt(f.seq);
    render();
    toast(state.runState === "paused"
      ? "Steer queued at seq " + f.seq + " (" + label + "). Resume the run to see the frame that receives it."
      : (interrupted ? "Interrupted. The in-flight model call was stopped and billed; the steer lands on the next request."
                     : "Steer queued at seq " + f.seq + ". It lands on the " + label + "."));
    return;
  }
  if (id === "btnSend"){
    const a = ADDRESSES[state.addr];
    state.delivery = {
      label:a.label,
      sent:(state.msgText || "").trim() ||
        "main is red on payments-e2e since 9f3c2ab. Do not open release PRs against it until the fix lands.",
      recipients:a.recipients, cost:a.cost
    };
    state.msgText = "";
    state.modal = "delivery";
    renderModal();
    return;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "steerText"){ state.steerText = el.value; return; }
  if (el.id === "massText"){ state.msgText = el.value; return; }
  if (el.id === "fQ"){ state.filters.q = el.value; render(); return; }
});
document.addEventListener("change", ev => {
  const el = ev.target, map = { fOperator:"operator", fAgent:"agent", fTier:"tier", fVerdict:"verdict", fTask:"task" };
  if (map[el.id]){ state.filters[map[el.id]] = el.value; render(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && state.modal){ state.modal = null; renderModal(); }
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k"){ ev.preventDefault(); state.modal = "cmdk"; renderModal(); }
  if (ev.key === "Enter" && ev.target.closest && ev.target.closest("tr[data-open]")){
    ev.preventDefault(); go("#/acme/core-platform/runs/" + HERO);
  }
});
$("#drawerScrim").addEventListener("click", () => {
  $("#side").classList.remove("open");
  const s = $("#drawerScrim"); s.classList.remove("on"); s.hidden = true;
});
$("#sideNav").addEventListener("click", () => {
  $("#side").classList.remove("open");
  const s = $("#drawerScrim"); s.classList.remove("on"); s.hidden = true;
});

/* =========================================================================
   Mockup chrome
   ========================================================================= */
const CHROME_STATES = [
  ["loaded","loaded"], ["empty","empty"], ["loading","loading"], ["error","error"], ["denied","denied"]
];
function renderChrome(){
  const onRun = state.route.indexOf("/runs/") > -1;
  const states = CHROME_STATES.map(s =>
    '<button type="button" data-state="' + s[0] + '" class="' + (state.view === s[0] ? "on" : "") + '">' + s[1] + '</button>').join("");
  $("#chromeBody").innerHTML =
    states +
    '<button type="button" data-chrome="phone" id="chPhone" class="' + (document.body.classList.contains("phone") ? "on" : "") + '">phone 400</button>' +
    '<button type="button" data-chrome="theme" id="chTheme">theme</button>' +
    '<button type="button" data-chrome="reset" id="chReset">reset run</button>' +
    '<button type="button" data-chrome="page" id="chPage">' + (onRun ? "→ fleet" : "→ run") + '</button>';
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("#chrome [data-chrome]");
  if (!b) return;
  const k = b.dataset.chrome;
  if (k === "phone"){ document.body.classList.toggle("phone"); render(); return; }
  if (k === "theme"){
    const cur = document.documentElement.getAttribute("data-theme");
    const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark"));
    return;
  }
  if (k === "reset"){
    state.frames = JSON.parse(JSON.stringify(FRAMES));
    state.frames[state.frames.length - 1].live = true;
    state.runState = "running"; state.pendingSteer = null; state.selFrame = 26;
    state.cost = 2.41; cursor = 0; clock = { h:14, m:3, s:26, ms:115 };
    state.pos = 26; state.following = true; state.playing = false; stopPlay();
    seedZoom(); revealAt(state.pos);
    render(); return;
  }
  if (k === "page"){ go(state.route.indexOf("/runs/") > -1 ? "#/acme/core-platform" : "#/acme/core-platform/runs/" + HERO); return; }
});

/* =========================================================================
   Boot
   ========================================================================= */
const _renderFleet = renderFleet;
renderFleet = function(){ return OTHER[state.route] ? renderOther() : _renderFleet(); };

if (!location.hash) location.replace("#/acme/core-platform");
state.route = location.hash || "#/acme/core-platform";
seedZoom();
revealAt(state.pos);
render();
startStream();
</script>
