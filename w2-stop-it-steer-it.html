<title>Stop It. Steer It.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Oxagen house system. Dark-first: the bare :root carries the
   dark palette; light overrides come in under both the media
   query and the explicit [data-theme] stamp.
   ============================================================ */
:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C;
  --border:#292722; --rule:#34322D;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A;
  --accent-text:#D6962C;
  --on-gold:#10100F;

  /* Semantic state colours. Deliberately no gold in this set. */
  --s-allowed:#5FA97F;   --s-allowed-bg:rgba(95,169,127,.13);
  --s-approval:#6E9BD2;  --s-approval-bg:rgba(110,155,210,.14);
  --s-denied:#C2705E;    --s-denied-bg:rgba(194,112,94,.14);
  --s-failed:#D25548;    --s-failed-bg:rgba(210,85,72,.14);
  --s-critical:#E1483A;  --s-critical-bg:rgba(225,72,58,.16);
  --s-proven:#5FA97F;    --s-proven-bg:rgba(95,169,127,.13);
  --s-neutral:#8D877C;   --s-neutral-bg:rgba(141,135,124,.12);

  --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 44px rgba(0,0,0,.5);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --r:12px; --r-sm:8px;
  --sidebar:236px; --topbar:52px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
  --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --s-allowed:#357E57;   --s-allowed-bg:rgba(53,126,87,.12);
  --s-approval:#2F6299;  --s-approval-bg:rgba(47,98,153,.12);
  --s-denied:#9C4632;    --s-denied-bg:rgba(156,70,50,.12);
  --s-failed:#A93225;    --s-failed-bg:rgba(169,50,37,.12);
  --s-critical:#B32B1C;  --s-critical-bg:rgba(179,43,28,.14);
  --s-proven:#357E57;    --s-proven-bg:rgba(53,126,87,.12);
  --s-neutral:#6B665C;   --s-neutral-bg:rgba(107,102,92,.11);
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
}}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
  --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --s-allowed:#357E57;   --s-allowed-bg:rgba(53,126,87,.12);
  --s-approval:#2F6299;  --s-approval-bg:rgba(47,98,153,.12);
  --s-denied:#9C4632;    --s-denied-bg:rgba(156,70,50,.12);
  --s-failed:#A93225;    --s-failed-bg:rgba(169,50,37,.12);
  --s-critical:#B32B1C;  --s-critical-bg:rgba(179,43,28,.14);
  --s-proven:#357E57;    --s-proven-bg:rgba(53,126,87,.12);
  --s-neutral:#6B665C;   --s-neutral-bg:rgba(107,102,92,.11);
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--fg);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);font-weight:600;margin:0}
.eyebrow-q{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------------- app shell ---------------- */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;height:100dvh}

.side{
  background:var(--void);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
.side-logo{padding:16px 18px 14px;border-bottom:1px solid var(--border)}
.side-logo svg{height:19px;width:auto;display:block;color:var(--fg)}
.switcher{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);
  text-align:left;transition:border-color .15s;
}
.switcher:hover{border-color:var(--rule)}
.switcher .sw-mark{
  width:22px;height:22px;border-radius:5px;background:var(--hl);border:1px solid var(--border);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent-text);flex:0 0 auto;
}
.switcher .sw-t{min-width:0;flex:1}
.switcher .sw-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;line-height:1.3}
.switcher .sw-v{font-size:13px;font-weight:500;color:var(--fg);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher .sw-c{color:var(--dim);flex:0 0 auto}
.side-switchers{padding:14px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.side-nav{flex:1;overflow-y:auto;padding:14px 10px 10px;min-height:0}
.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:0 8px 8px}
.nav-label.second{padding-top:20px}
.nav-a{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;
  color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;width:100%;
  border-left:2px solid transparent;
}
.nav-a:hover{background:var(--hl);color:var(--fg)}
.nav-a.on{background:var(--hl);color:var(--fg);border-left-color:var(--accent-text)}
.nav-a .ni{width:15px;height:15px;flex:0 0 auto;opacity:.85}
.nav-a .nct{
  margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);
  background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:0 6px;
}
.side-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:9px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--hl);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--body);flex:0 0 auto}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--ink)}
.topbar{
  height:var(--topbar);flex:0 0 auto;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--ink);
}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0;overflow:hidden}
.crumbs a{color:var(--muted);text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--dim)}
.crumbs .cur{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.cmdk{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border);
  border-radius:7px;background:var(--panel);color:var(--muted);font-size:12.5px;min-width:190px;
}
.cmdk:hover{border-color:var(--rule);color:var(--body)}
.cmdk kbd{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);
  border-radius:4px;padding:1px 5px;color:var(--dim);background:var(--ink);
}
.icon-btn{
  width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--panel);
  display:grid;place-items:center;color:var(--muted);
}
.icon-btn:hover{color:var(--fg);border-color:var(--rule)}
.icon-btn.on{color:var(--accent-text);border-color:var(--rule)}

.scroll{flex:1;overflow:auto;min-height:0}
.page{padding:22px 20px 90px;max-width:1560px}

/* ---------------- primitives ---------------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:7px;
  border:1px solid var(--border);background:var(--panel);color:var(--body);
  font-size:13px;font-weight:500;white-space:nowrap;transition:border-color .14s,color .14s;
}
.btn:hover:not(:disabled){color:var(--fg);border-color:var(--rule)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.gold:hover:not(:disabled){background:var(--gold-bright);border-color:var(--gold-bright);color:#10100F}
.btn.sm{padding:4px 9px;font-size:12px}
.btn svg{width:14px;height:14px}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:1.5px 7px;border-radius:20px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:-.01em;
  border:1px solid transparent;white-space:nowrap;
}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.p-allowed{color:var(--s-allowed);background:var(--s-allowed-bg);border-color:var(--s-allowed-bg)}
.p-proven{color:var(--s-proven);background:var(--s-proven-bg);border-color:var(--s-proven-bg)}
.p-approval{color:var(--s-approval);background:var(--s-approval-bg);border-color:var(--s-approval-bg)}
.p-denied{color:var(--s-denied);background:var(--s-denied-bg);border-color:var(--s-denied-bg)}
.p-failed{color:var(--s-failed);background:var(--s-failed-bg);border-color:var(--s-failed-bg)}
.p-critical{color:var(--s-critical);background:var(--s-critical-bg);border-color:var(--s-critical-bg)}
.p-neutral{color:var(--s-neutral);background:var(--s-neutral-bg);border-color:var(--s-neutral-bg)}
.p-plain{color:var(--muted);background:var(--hl);border-color:var(--border)}

.tier{font-family:var(--mono);font-size:11px;padding:1.5px 6px;border-radius:4px;border:1px solid var(--border);white-space:nowrap}
.tier-gateway{color:var(--fg);background:var(--hl);border-color:var(--rule)}
.tier-harness{color:var(--muted);background:var(--hl)}
.tier-observe{color:var(--dim);background:transparent}

.kv{display:flex;flex-direction:column;gap:2px}
.kv dt{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kv dd{margin:0;font-size:13px;color:var(--fg)}
.basis{font-size:11px;color:var(--dim);font-family:var(--mono)}

/* ---------------- page header ---------------- */
.ph{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:26px;line-height:1.1;letter-spacing:-.015em;font-weight:700;margin:2px 0 6px}
.ph p{margin:0;color:var(--muted);font-size:13.5px;max-width:62ch}
.ph-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.stats{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r);
  background:var(--panel);overflow:hidden;margin-bottom:16px}
.stat{padding:11px 16px;border-right:1px solid var(--border);flex:1 1 auto;min-width:132px}
.stat:last-child{border-right:0}
.stat .sv{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .sk{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:2px}
.stat .sb{font-size:10.5px;color:var(--dim);font-family:var(--mono);margin-top:3px}

/* ---------------- filters ---------------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fsel{position:relative;display:inline-flex}
.fsel select{
  appearance:none;background:var(--panel);border:1px solid var(--border);border-radius:7px;
  padding:6px 26px 6px 10px;font-size:12.5px;color:var(--body);cursor:pointer;
}
.fsel select:hover{border-color:var(--rule)}
.fsel::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;
  border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);
  transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fsearch{
  display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);
  border-radius:7px;padding:0 10px;min-width:210px;flex:1 1 210px;max-width:320px;
}
.fsearch input{background:none;border:0;outline:none;padding:6px 0;font-size:12.5px;width:100%;color:var(--fg)}
.fsearch input::placeholder{color:var(--dim)}
.fclear{font-size:12px;color:var(--accent-text);font-weight:500;padding:6px 4px}
.fcount{margin-left:auto;font-size:12px;color:var(--dim);font-family:var(--mono)}

/* ---------------- fleet layout ---------------- */
.fleet-wrap{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:14px;align-items:start}
.fleet-wrap.rail-open{grid-template-columns:minmax(0,1fr) 336px}

.tablebox{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);overflow:hidden}
.tscroll{overflow-x:auto}
table.runs{width:100%;border-collapse:collapse;min-width:1080px}
table.runs th{
  text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--hl);
  position:sticky;top:0;z-index:1;white-space:nowrap;
}
table.runs td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
table.runs tr:last-child td{border-bottom:0}
table.runs tbody tr{cursor:pointer}
table.runs tbody tr:hover{background:var(--hl)}
table.runs tbody tr.sel{background:var(--hl);box-shadow:inset 2px 0 0 var(--accent-text)}
.cell-run{display:flex;flex-direction:column;gap:1px;min-width:0}
.cell-run .rid{font-family:var(--mono);font-size:12px;color:var(--fg)}
.cell-run .task{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.agent-id{font-family:var(--mono);font-size:12px;color:var(--body)}
.op{display:flex;align-items:center;gap:7px;white-space:nowrap}
.op .avatar{width:20px;height:20px;font-size:9px}
.step{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12.5px;color:var(--body)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--s-allowed);flex:0 0 auto;
  box-shadow:0 0 0 0 var(--s-allowed-bg);animation:pulse 2.4s infinite}
.live-dot.paused{background:var(--s-approval);animation:none}
.live-dot.sealed{background:var(--dim);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,169,127,.5)}70%{box-shadow:0 0 0 6px rgba(95,169,127,0)}100%{box-shadow:0 0 0 0 rgba(95,169,127,0)}}
.rowacts{display:flex;gap:5px;justify-content:flex-end;white-space:nowrap}
.money{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;color:var(--fg)}

/* ---------------- approvals rail ---------------- */
.rail{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);overflow:hidden;position:sticky;top:0}
.rail.closed{width:52px}
.rail-tab{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;color:var(--muted);
}
.rail-tab:hover{color:var(--fg);background:var(--hl)}
.rail-tab .vtxt{writing-mode:vertical-rl;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.rail-tab .cnt{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--s-approval);
  background:var(--s-approval-bg);border-radius:20px;padding:1px 6px;
}
.rail-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border);background:var(--hl)}
.rail-head h2{margin:0;font-size:13px;font-weight:600}
.rail-body{max-height:calc(100vh - 210px);overflow-y:auto}
.appr{padding:12px 13px;border-bottom:1px solid var(--border)}
.appr:last-child{border-bottom:0}
.appr-top{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.appr-amt{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.chain{list-style:none;margin:0 0 9px;padding:0;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:5px}
.chain li{padding-left:11px;position:relative;font-size:12px;color:var(--body);line-height:1.4}
.chain li::before{content:"";position:absolute;left:-3.5px;top:6px;width:6px;height:6px;border-radius:50%;
  background:var(--panel);border:1px solid var(--rule)}
.chain li b{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600}
.appr-acts{display:flex;gap:6px;align-items:center}
.appr-acts .grow{flex:1}

/* ---------------- run page ---------------- */
.runhead{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.runhead .rh-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.runhead h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em;font-weight:600;font-family:var(--mono)}
.runmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.runmeta .sep{color:var(--rule)}
.coststrip{display:flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r);background:var(--panel);overflow:hidden}
.coststrip .cs{padding:9px 14px;border-right:1px solid var(--border);flex:1 1 auto;min-width:118px}
.coststrip .cs:last-child{border-right:0}
.coststrip .csv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.coststrip .csk{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:1px}

.controlbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--panel);margin-bottom:14px;
}
.controlbar .status{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding-right:6px;
  border-right:1px solid var(--border);margin-right:4px}
.controlbar .spacer{flex:1}

.run-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:14px;align-items:start}

/* timeline */
.tl{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);overflow:hidden}
.tl-head{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--hl)}
.tl-head h2{margin:0;font-size:13px;font-weight:600}
.tl-body{max-height:min(64vh,720px);overflow-y:auto;padding:4px 0}
.fr{
  display:grid;grid-template-columns:46px 18px 1fr auto;gap:9px;align-items:start;
  padding:7px 13px 7px 10px;width:100%;text-align:left;border-left:2px solid transparent;
}
.fr:hover{background:var(--hl)}
.fr.sel{background:var(--hl);border-left-color:var(--accent-text)}
.fr.injected{background:var(--hl)}
.fr .seq{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:2px;text-align:right;font-variant-numeric:tabular-nums}
.fr .spine{display:flex;flex-direction:column;align-items:center;height:100%;padding-top:4px}
.fr .node{width:7px;height:7px;border-radius:2px;border:1px solid var(--rule);background:var(--panel);flex:0 0 auto}
.fr .node.model{background:var(--s-approval);border-color:var(--s-approval)}
.fr .node.tool{background:var(--s-neutral);border-color:var(--s-neutral)}
.fr .node.policy{background:var(--s-allowed);border-color:var(--s-allowed)}
.fr .node.control{background:var(--gold);border-color:var(--gold);border-radius:50%}
.fr .node.deny{background:var(--s-denied);border-color:var(--s-denied)}
.fr .line{width:1px;flex:1;background:var(--border);margin-top:3px;min-height:6px}
.fr .kind{font-family:var(--mono);font-size:11.5px;color:var(--fg);line-height:1.35}
.fr .sum{font-size:12px;color:var(--muted);line-height:1.4;margin-top:1px;overflow-wrap:anywhere}
.fr .t{font-family:var(--mono);font-size:10.5px;color:var(--dim);padding-top:2px;font-variant-numeric:tabular-nums}
.fr-new{animation:slidein .34s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.tl-foot{padding:9px 13px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);
  display:flex;align-items:center;gap:8px;background:var(--hl)}

/* inspector */
.insp{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);overflow:hidden;position:sticky;top:0}
.insp-head{padding:11px 13px;border-bottom:1px solid var(--border);background:var(--hl)}
.insp-head .ik{font-family:var(--mono);font-size:13px;color:var(--fg)}
.insp-head .im{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--hl);overflow-x:auto}
.tabs button{padding:8px 13px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent-text);font-weight:500}
.insp-body{padding:13px;max-height:min(58vh,660px);overflow-y:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.sect{margin-top:15px}
.sect:first-child{margin-top:0}
.sect > h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600}
pre.code{
  margin:0;background:var(--ink);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 11px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--body);
}
pre.code .k{color:var(--accent-text)}
pre.code .s{color:var(--s-allowed)}
.msg{border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:8px;background:var(--ink)}
.msg .role{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:4px}
.msg .txt{font-size:12.5px;color:var(--body);line-height:1.5}
.msg.inj{border-color:var(--gold);background:var(--hl);box-shadow:inset 3px 0 0 var(--gold)}
.msg.inj .role{color:var(--accent-text)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:120px 1fr 78px;gap:9px;align-items:center;font-size:12px}
.bar .btrack{height:7px;border-radius:4px;background:var(--hl);overflow:hidden;border:1px solid var(--border)}
.bar .bfill{height:100%;background:var(--s-neutral);border-radius:3px}
.bar .bfill.a{background:var(--s-approval)}
.bar .bfill.b{background:var(--s-allowed)}
.bar .bfill.c{background:var(--s-neutral)}
.bar .bfill.d{background:var(--rule)}
.bar .bv{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--body);font-variant-numeric:tabular-nums}
.bar .bl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------------- steer composer ---------------- */
.steerbox{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);margin-bottom:14px;overflow:hidden}
.steerbox-head{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--hl)}
.steerbox-head h2{margin:0;font-size:13px;font-weight:600}
.steerbox-body{padding:12px 13px}
textarea.steer{
  width:100%;min-height:74px;resize:vertical;background:var(--ink);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:10px 11px;font-size:13px;line-height:1.5;color:var(--fg);outline:none;
}
textarea.steer:focus{border-color:var(--rule)}
textarea.steer::placeholder{color:var(--dim)}
.steer-foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px}
.steer-note{font-size:11.5px;color:var(--dim);max-width:52ch;line-height:1.45}
.steer-foot .grow{flex:1}

/* ---------------- dialog ---------------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,9,.62);backdrop-filter:blur(2px);z-index:60;
  display:grid;place-items:center;padding:20px;overflow:auto}
.dlg{
  width:min(720px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;max-height:calc(100vh - 40px);display:flex;flex-direction:column;
}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:15px 17px;border-bottom:1px solid var(--border)}
.dlg-head h2{margin:2px 0 3px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.dlg-head p{margin:0;font-size:12.5px;color:var(--muted);max-width:58ch}
.dlg-body{padding:15px 17px;overflow-y:auto}
.dlg-foot{padding:12px 17px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--hl)}
.dlg-foot .grow{flex:1}

.addr{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.addr button{
  font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--border);background:var(--ink);color:var(--muted);
}
.addr button:hover{color:var(--fg);border-color:var(--rule)}
.addr button.on{color:var(--fg);border-color:var(--rule);background:var(--hl);font-weight:600}
.addr button .n{color:var(--dim);font-weight:400}
.grantcheck{
  display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:var(--r-sm);
  border:1px solid var(--s-allowed-bg);background:var(--s-allowed-bg);margin-bottom:11px;font-size:12.5px;
  color:var(--body);line-height:1.45;
}
.grantcheck.deny{border-color:var(--s-denied-bg);background:var(--s-denied-bg)}
.grantcheck svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px}
.grantcheck .g-ok{color:var(--s-allowed)}
.grantcheck .g-no{color:var(--s-denied)}
.grantcheck b{display:block;font-weight:600;color:var(--fg);margin-bottom:1px}

table.deliv{width:100%;border-collapse:collapse;font-size:12.5px}
table.deliv th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:600;padding:7px 10px;border-bottom:1px solid var(--border)}
table.deliv td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.deliv tr:last-child td{border-bottom:0}
table.deliv .why{color:var(--muted);font-size:11.5px}
.delivsum{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--ink);margin-bottom:12px}
.delivsum div{display:flex;flex-direction:column;gap:1px}
.delivsum .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.delivsum .k{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600}

/* ---------------- alternate states ---------------- */
.slab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  padding:56px 24px;text-align:center;border:1px solid var(--border);border-radius:var(--r);
  background:var(--panel);
}
.slab .glyph{width:38px;height:38px;color:var(--dim)}
.slab h2{margin:0;font-size:18px;font-weight:600}
.slab p{margin:0;color:var(--muted);font-size:13.5px;max-width:52ch;line-height:1.55}
.slab .acts{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;justify-content:center}
.slab.err{border-color:var(--s-failed-bg)}
.slab.err .glyph{color:var(--s-failed)}
.slab.deny .glyph{color:var(--s-denied)}
.skel{background:linear-gradient(90deg,var(--hl) 8%,var(--border) 20%,var(--hl) 34%);
  background-size:600px 100%;animation:shim 1.5s linear infinite;border-radius:5px;height:11px}
@keyframes shim{0%{background-position:-300px 0}100%{background-position:300px 0}}
.skel.w1{width:72%}.skel.w2{width:44%}.skel.w3{width:88%}.skel.w4{width:30%}
.skelrow{display:grid;grid-template-columns:200px 1fr 90px 90px 80px;gap:14px;padding:11px 12px;
  border-bottom:1px solid var(--border);align-items:center}

/* ---------------- mockup chrome (NOT product UI) ---------------- */
#chrome{
  position:fixed;right:12px;bottom:12px;z-index:90;font-family:var(--mono);font-size:11px;
  background:#0A0A09;border:1px dashed #4a4740;border-radius:8px;color:#9B958A;
  box-shadow:0 12px 34px rgba(0,0,0,.55);max-width:calc(100vw - 24px);
}
#chrome .ch-head{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px dashed #33312c}
#chrome .ch-head b{color:#D6962C;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
#chrome .ch-head button{margin-left:auto;color:#6E6A62;font-family:inherit;font-size:11px}
#chrome .ch-head button:hover{color:#F2EEE5}
#chrome .ch-body{padding:7px 9px;display:flex;flex-wrap:wrap;gap:5px;max-width:430px}
#chrome .ch-body button{
  font-family:inherit;font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid #33312c;
  color:#9B958A;background:#10100F;
}
#chrome .ch-body button:hover{color:#F2EEE5;border-color:#4a4740}
#chrome .ch-body button.on{color:#10100F;background:#D6962C;border-color:#D6962C;font-weight:600}
#chrome .ch-note{padding:0 9px 7px;color:#55524b;font-size:10px;max-width:430px;line-height:1.4}
#chrome.min .ch-body,#chrome.min .ch-note{display:none}

/* ---------------- phone ---------------- */
.mobile-only{display:none}
.drawer-scrim{display:none}
body.phone #app{grid-template-columns:1fr;max-width:400px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
body.phone{background:var(--void)}
body.phone .side{
  position:fixed;inset:0 auto 0 0;width:264px;z-index:70;transform:translateX(-100%);
  transition:transform .2s ease-out;
}
body.phone .side.open{transform:none}
body.phone .drawer-scrim.on{display:block;position:fixed;inset:0;background:rgba(10,10,9,.6);z-index:65}
body.phone .mobile-only{display:inline-flex}
body.phone .cmdk{min-width:0;width:34px;padding:5px;justify-content:center}
body.phone .cmdk span,body.phone .cmdk kbd{display:none}
body.phone .page{padding:14px 14px 110px}
body.phone .fleet-wrap,body.phone .fleet-wrap.rail-open{grid-template-columns:minmax(0,1fr)}
body.phone .rail.closed{width:auto}
body.phone .rail-tab{flex-direction:row;padding:11px 13px;justify-content:flex-start}
body.phone .rail-tab .vtxt{writing-mode:horizontal-tb}
body.phone .run-cols{grid-template-columns:minmax(0,1fr)}
body.phone .insp,body.phone .rail{position:static}
body.phone .ph h1{font-size:21px}
body.phone .stat{min-width:50%;border-right:0;border-bottom:1px solid var(--border)}
body.phone .crumbs .hide-sm{display:none}
body.phone #chrome{right:8px;bottom:8px;left:8px}
body.phone #chrome .ch-body,body.phone #chrome .ch-note{max-width:none}
body.phone .dlg{max-height:calc(100vh - 24px)}
body.phone .grid2{grid-template-columns:1fr}

@media (max-width: 1100px){
  .run-cols{grid-template-columns:minmax(0,1fr)}
  .insp{position:static}
  .fleet-wrap.rail-open{grid-template-columns:minmax(0,1fr)}
  .rail.closed{width:auto}
  .rail-tab{flex-direction:row;padding:11px 13px;justify-content:flex-start}
  .rail-tab .vtxt{writing-mode:horizontal-tb}
}
@media (max-width: 860px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:264px;z-index:70;transform:translateX(-100%);transition:transform .2s ease-out}
  .side.open{transform:none}
  .drawer-scrim.on{display:block;position:fixed;inset:0;background:rgba(10,10,9,.6);z-index:65}
  .mobile-only{display:inline-flex}
  .crumbs .hide-sm{display:none}
}

/* ---------------- transcript and transport ---------------- */
.tx{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);overflow:hidden}

.tp{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--border);background:var(--hl);flex-wrap:wrap}
.tp-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--panel);
  display:grid;place-items:center;color:var(--body);flex:0 0 auto}
.tp-btn:hover:not(:disabled){color:var(--fg);border-color:var(--rule)}
.tp-btn:disabled{opacity:.35;cursor:not-allowed}
.tp-btn svg{width:13px;height:13px}
.tp-btn.play{width:34px;height:34px;border-color:var(--rule)}
.tp-scrub{flex:1 1 190px;min-width:130px;display:flex;align-items:center}
input.scrub{width:100%;accent-color:var(--fg);height:4px;cursor:pointer}
.tp-read{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tp-read b{color:var(--fg);font-weight:500}
.seg{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex:0 0 auto}
.seg button{padding:4px 8px;font-size:11px;color:var(--muted);border-right:1px solid var(--border);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:600}
.seg.speed button{font-family:var(--mono)}
.livebadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:20px;
  color:var(--s-allowed);background:var(--s-allowed-bg);flex:0 0 auto}
.livebadge.off{color:var(--dim);background:var(--hl);border:1px solid var(--border)}
.tp-note{flex:1 1 100%;font-size:11px;color:var(--dim);line-height:1.45;margin:0}

.tx-body{max-height:min(66vh,760px);overflow-y:auto}
.tx-body details{display:block}
.tx-body summary{list-style:none;cursor:pointer;user-select:none}
.tx-body summary::-webkit-details-marker{display:none}
.chev{color:var(--dim);font-size:8px;display:inline-block;width:10px;transition:transform .12s;flex:0 0 auto}
details[open] > summary .chev{transform:rotate(90deg)}

.turn > summary{padding:10px 13px;background:var(--hl);border-bottom:1px solid var(--border)}
.turn > summary:hover{background:var(--panel)}
.turnline{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.turnname{color:var(--fg);font-weight:600;font-size:13px}
.turnname .bar{color:var(--accent-text)}
.turnok{font-size:11px;letter-spacing:.06em;color:var(--s-allowed)}
.turnok.run{color:var(--s-approval)}
.chips{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--panel);
  border:1px solid var(--border);padding:0 7px;border-radius:99px;line-height:1.8;white-space:nowrap}
.chip.cost{color:var(--fg)}
.chip.warn{color:var(--s-denied)}

.role{display:grid;grid-template-columns:74px 1fr;padding:11px 13px 11px 0;border-bottom:1px solid var(--border)}
.rolegut{text-align:right;padding-right:13px}
.roletag{font-size:9.5px;font-weight:700;letter-spacing:.13em;padding:2px 7px;border-radius:4px;display:inline-block}
.role.you .roletag{color:var(--on-gold);background:var(--s-approval)}
.role.agent .roletag{color:var(--on-gold);background:var(--s-neutral)}
.role .prose{max-width:70ch;color:var(--body);font-size:13px;line-height:1.6}
.role.agent .prose{border-left:2px solid var(--border);padding-left:13px}

.step{border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:0}
.step > summary{padding:7px 13px 7px 0}
.step > summary:hover{background:var(--hl)}
.step.now > summary{background:var(--hl);box-shadow:inset 3px 0 0 var(--accent-text)}
.step.future{opacity:.34}
.stepgrid{display:grid;grid-template-columns:46px 30px 1fr;align-items:baseline}
.stepgrid .t{color:var(--dim);font-size:10.5px;text-align:right;padding-right:9px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.stepgrid .node{position:relative;text-align:center}
.stepgrid .node::before{content:"";position:absolute;left:50%;top:-12px;bottom:-12px;width:1px;background:var(--border)}
.dot{position:relative;z-index:1;display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--panel);border:2px solid var(--s-neutral)}
.dot.model{border-color:var(--s-approval)}
.dot.tool{border-color:var(--s-neutral)}
.dot.policy{border-color:var(--s-allowed)}
.dot.control{border-color:var(--gold);border-radius:2px}
.dot.deny{border-color:var(--s-denied);background:var(--s-denied)}
.digest{display:flex;gap:8px;align-items:baseline;min-width:0;flex-wrap:wrap;padding-right:13px}
.dname{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--fg)}
.dname.model{color:var(--s-approval)}
.dname.control{color:var(--accent-text)}
.darg{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.sbody{padding:2px 13px 11px 0}
.sbody-inner{margin-left:76px;background:var(--ink);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.fhead{display:flex;gap:8px;align-items:center;padding:6px 11px;border-bottom:1px solid var(--border);background:var(--hl)}
.fhead .fk{font-family:var(--mono);font-size:11px;color:var(--fg)}
.fhead .fs{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto}
.fbody{padding:9px 11px}
.fbody .msg{background:var(--panel)}
.fbody pre.code{background:var(--panel)}
.more > summary{color:var(--accent-text);font-size:11px;padding:5px 11px 9px}
.more > summary:hover{text-decoration:underline}

.tx-foot{padding:9px 13px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);
  display:flex;align-items:center;gap:8px;background:var(--hl);flex-wrap:wrap}
body.phone .sbody-inner{margin-left:0}
body.phone .role{grid-template-columns:1fr;padding-left:13px}
body.phone .rolegut{text-align:left;padding:0 0 6px}
body.phone .darg{max-width:26ch}
@media (max-width:860px){ .sbody-inner{margin-left:0} }

/* ---------- tool grammar (shared with mc.html) ----------
   Three orthogonal axes, three visual grammars, never mixed:
     category = what the tool ACTS ON   → icon badge, one hue per category (never gold, never a state hue)
     hazard   = how bad a wrong call is → risk mark (circle · diamond · triangle · filled triangle) + side-effect glyph
     gate     = what the belt decided   → badge; a dashed border means a person still stands in the way */
:root{--tg-ok:#57A97C;--tg-appr:#5B93D6;--tg-deny:#C66A4A;--tg-crit:#D6455E;
  --tg-read:#6FB1DA;--tg-query:#5FBFB0;--tg-record:#E08BA6;--tg-message:#E39A6E;--tg-file:#9FBE62;--tg-exec:#B48EE0;--tg-vcs:#8A96E8;--tg-infra:#6E9E8F;--tg-access:#A3B1C6;--tg-finance:#C97AD0}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--tg-ok:#2F7D52;--tg-appr:#2E6BA8;--tg-deny:#9B4526;--tg-crit:#AE2540;
  --tg-read:#1E6F99;--tg-query:#1E7A6E;--tg-record:#A63F62;--tg-message:#A8532A;--tg-file:#5A7A1C;--tg-exec:#6A46B5;--tg-vcs:#4553B0;--tg-infra:#2F6656;--tg-access:#4F6075;--tg-finance:#8B3E96}}
:root[data-theme="light"]{--tg-ok:#2F7D52;--tg-appr:#2E6BA8;--tg-deny:#9B4526;--tg-crit:#AE2540;
  --tg-read:#1E6F99;--tg-query:#1E7A6E;--tg-record:#A63F62;--tg-message:#A8532A;--tg-file:#5A7A1C;--tg-exec:#6A46B5;--tg-vcs:#4553B0;--tg-infra:#2F6656;--tg-access:#4F6075;--tg-finance:#8B3E96}
.tg-read{--tc:var(--tg-read)} .tg-query{--tc:var(--tg-query)} .tg-record{--tc:var(--tg-record)} .tg-message{--tc:var(--tg-message)} .tg-file{--tc:var(--tg-file)}
.tg-exec{--tc:var(--tg-exec)} .tg-vcs{--tc:var(--tg-vcs)} .tg-infra{--tc:var(--tg-infra)} .tg-access{--tc:var(--tg-access)} .tg-finance{--tc:var(--tg-finance)}
.tg{display:inline-grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;min-width:0;max-width:100%;text-align:left;vertical-align:middle;font-family:var(--font,inherit)}
.tg .i{grid-row:1/3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 34%,transparent)}
.tg .i svg{width:15px;height:15px}

function filteredRuns(){
  const f = state.filters, q = f.q.trim().toLowerCase();
  return RUNS.filter(r => {
    if (f.operator !== "all" && r.op !== f.operator) return false;
    if (f.agent !== "all" && r.agent !== f.agent) return false;
    if (f.tier !== "all" && r.tier !== f.tier) return false;
    if (f.verdict !== "all" && r.verdict !== f.verdict) return false;
    if (f.task === "live" && r.state === "sealed") return false;
    if (f.task === "issues" && r.task.indexOf("#") === -1) return false;
    if (q && (r.id + " " + r.agent + " " + r.task + " " + r.harness).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

  const f = state.filters;
  return f.operator !== "all" || f.agent !== "all" || f.tier !== "all" || f.verdict !== "all" || f.task !== "all" || f.q !== "";
}

function runRow(r){
  const o = OPS[r.op];
  const acts = r.state === "sealed"
    ? '<button class="btn sm" type="button" data-open="' + r.id + '">Open</button>'
    : (r.state === "paused"
        ? '<button class="btn sm" type="button" data-toast="resume dispatched to ' + r.id + ' · applied at the next boundary">Resume</button>' +
          '<button class="btn sm" type="button" data-open="' + r.id + '">Open</button>'
        : '<button class="btn sm" type="button" data-pause="' + r.id + '">Pause</button>' +
          '<button class="btn sm" type="button" data-open="' + r.id + '">Open</button>');
  return '<tr data-open="' + r.id + '" tabindex="0"' + (r.id === HERO ? ' class="sel"' : '') + '>' +
    '<td><span class="cell-run"><span class="rid">' + r.id + '</span>' +
      '<span class="task">' + esc(r.task) + '</span></span></td>' +
    '<td><span class="agent-id">' + r.agent + '</span></td>' +
    '<td><span class="op"><span class="avatar">' + o.initials + '</span>' + o.name + '</span></td>' +
    '<td style="white-space:nowrap;color:var(--muted);font-size:12.5px">' + r.harness + '</td>' +
    '<td><span class="tier tier-' + r.tier + '">' + r.tier + '</span></td>' +
    '<td><span class="step">' + dotFor(r) + esc(r.step) + '</span></td>' +
    '<td class="money">' + money(r.id === HERO ? state.cost : r.cost) + '</td>' +
    '<td><span class="pill p-plain">' + r.grade + '</span></td>' +
    '<td><span class="pill ' + verdictClass(r.verdict) + '">' + r.verdict + '</span></td>' +
    '<td><span class="rowacts">' + acts + '</span></td>' +
  '</tr>';
}

function approvalsRail(){
  if (!state.railOpen){
    return '<aside class="rail closed"><button class="rail-tab" type="button" id="railToggle" aria-expanded="false">' +
      '<span class="cnt num">' + APPROVALS.length + '</span>' +
      '<span class="vtxt">Approvals</span></button></aside>';
  }
  const items = APPROVALS.map(a =>
    '<div class="appr">' +
      '<div class="appr-top"><span class="appr-amt">' + a.amount + '</span>' +
        '<span class="pill p-approval"><span class="dot"></span>waiting ' + a.waited + '</span></div>' +
      '<ol class="chain">' +
        '<li><b>Who asked</b>' + esc(a.asked) + '</li>' +
        '<li><b>Which agent</b><span class="mono">' + a.agent + '</span> · <span class="mono">' + a.run + '</span></li>' +
        '<li><b>Which action</b><span style="display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 4px">' + TG.cell(a.tool, {sz:"sm"}) + TG.cat(TG.meta(a.tool).cat) + TG.gate("require_approval") + '</span><br>' + esc(a.detail) + '</li>' +
        '<li><b>Which rule</b>' + esc(a.rule) + '</li>' +
      '</ol>' +
      '<div class="appr-acts">' +
        '<button class="btn sm" type="button" data-approve="' + a.id + '">Approve</button>' +
        '<button class="btn sm" type="button" data-toast="Denied. The reason reaches the model as the permission decision reason.">Deny</button>' +
        '<span class="grow"></span>' +
        '<button class="btn sm" type="button" data-open="' + a.run + '">Open run</button>' +
      '</div>' +
    '</div>').join("");
  return '<aside class="rail"><div class="rail-head">' +
    '<h2>Approvals</h2><span class="pill p-approval num">' + APPROVALS.length + ' waiting</span>' +
    '<button class="btn sm" type="button" id="railToggle" style="margin-left:auto" aria-expanded="true">Collapse</button></div>' +
    '<div class="rail-body">' + items + '</div>' +
    '<div class="tl-foot">Parked at the gateway. Default timeout 10 minutes, then the call is denied.</div></aside>';
}

function renderFleet(){
  const rows = filteredRuns();
  const live = RUNS.filter(r => r.state !== "sealed").length;
  const head =
    '<div class="ph"><div>' +
      '<p class="eyebrow">Workspace · core-platform</p>' +
      '<h1>Fleet</h1>' +
      '<p>Every run in core-platform, live and recent, with what Oxagen could actually enforce on it. Pause, resume and cancel apply at the next boundary.</p>' +
    '</div><div class="ph-actions">' +
      '<button class="btn gold" type="button" id="massBtn">' +
        '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3.4 2.6V10.5H2.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>' +
        'Message the fleet</button>' +
      '<button class="btn" type="button" data-toast="Exported 16 runs to a signed bundle with the offline verifier.">Export</button>' +
    '</div></div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="sv">50</div><div class="sk">Agents in the fleet</div><div class="sb">44 gateway · 4 harness · 2 observe</div></div>' +
      '<div class="stat"><div class="sv num">' + live + '</div><div class="sk">Live runs</div><div class="sb">4 sealed in the last hour</div></div>' +
      '<div class="stat"><div class="sv num">$402.86</div><div class="sk">Spent today</div><div class="sb">gateway_observed · USD</div></div>' +
      '<div class="stat"><div class="sv num">81.4%</div><div class="sk">Cache hit rate</div><div class="sb">cache_read ÷ input, mixed fleet</div></div>' +
      '<div class="stat"><div class="sv num">3</div><div class="sk">Approvals waiting</div><div class="sb">oldest 4m 12s</div></div>' +
    '</div>';

  const headNoActions = () => head.replace(/<div class="ph-actions">[\s\S]*?<\/div><\/div>/, "</div>");
  if (state.view === "loading") return head + fleetFilters(0) + slabLoading("runs");
  if (state.view === "error")   return head + fleetFilters(0) + slabError("The fleet");
  if (state.view === "denied")  return head + slabDenied("core-platform runs");
  if (state.view === "empty")   return headNoActions().replace(/<div class="sv num">\d+<\/div><div class="sk">Live runs<\/div><div class="sb">4 sealed in the last hour<\/div>/, '<div class="sv num">0</div><div class="sk">Live runs</div><div class="sb">nothing recorded yet</div>') + slabEmptyFleet();

  const table = rows.length
    ? '<div class="tablebox"><div class="tscroll"><table class="runs">' +
        '<thead><tr><th>Run</th><th>Agent</th><th>Operator</th><th>Harness</th><th>Tier</th>' +
        '<th>Current step</th><th>Cost so far</th><th>Replay</th><th>Verdict</th><th></th></tr></thead>' +
        '<tbody>' + rows.map(runRow).join("") + '</tbody></table></div>' +
        '<div class="tl-foot">Cost is gateway-observed to the cent where the tier allows it; observe-tier rows are client-attested and labelled.</div></div>'
    : '<div class="slab"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M15.4 15.4 21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '<h2>No runs match these filters</h2><p>Widen the operator, agent, tier or verdict filter to see the rest of the fleet.</p>' +
      '<div class="acts"><button class="btn" type="button" id="fClear2">Clear filters</button></div></div>';

  return head + fleetFilters(rows.length) +
    '<div class="fleet-wrap' + (state.railOpen ? " rail-open" : "") + '">' + table + approvalsRail() + '</div>';
}

function inspectorBody(f){
  if (state.inspTab === "envelope"){
    const b = f.body || f.model || f.usage || f.tool || f.policy || f.steer || f.command;
    const e = env(f, b ? { body:b } : {});
    e.content = { digest:"sha256:" + (f.seq * 7919).toString(16).padStart(12,"0") + "e4b1", bytes_ref:"blob://org_acme/sha256/…", redactions:[] };
    e.prev_hash = "sha256:" + ((f.seq - 1) * 104729).toString(16).padStart(12,"0") + "a7c2";
    e.hash = "sha256:" + (f.seq * 104729).toString(16).padStart(12,"0") + "a7c2";
    return '<pre class="code">' + esc(JSON.stringify(e, null, 2)) + '</pre>';
  }
  if (state.inspTab === "chain"){
    return '<div class="sect"><h3>Chain</h3><dl class="grid2">' +
      '<div class="kv"><dt>Sequence</dt><dd class="mono num">' + f.seq + ' · dense, no gaps</dd></div>' +
      '<div class="kv"><dt>Fidelity</dt><dd class="mono">gateway · Oxagen-attested</dd></div>' +
      '<div class="kv"><dt>prev_hash</dt><dd class="mono" style="overflow-wrap:anywhere">sha256:' + ((f.seq-1)*104729).toString(16).padStart(12,"0") + 'a7c2…</dd></div>' +
      '<div class="kv"><dt>hash</dt><dd class="mono" style="overflow-wrap:anywhere">sha256:' + (f.seq*104729).toString(16).padStart(12,"0") + 'a7c2…</dd></div>' +
      '</dl></div>' +
      '<div class="sect"><h3>Checkpoint</h3><p style="margin:0;font-size:12.5px;color:var(--body);line-height:1.55">' +
      'Frames 0–' + Math.min(24, state.frames.length - 1) + ' are inside checkpoint <span class="mono">ckpt_01K6QX7T3</span>, ' +
      'signed by the host device key <span class="mono">dev_4KQZ81</span> and countersigned by Oxagen on ingest. ' +
      'The run seals at stop; the Merkle root is computed then, not now.</p></div>' +
      '<div class="sect"><h3>Verify</h3><div style="display:flex;gap:7px;flex-wrap:wrap">' +
      '<button class="btn sm" type="button" data-toast="Chain intact: 27 frames, 0 gaps, 0 refused writes.">Recompute the chain</button>' +
      '<button class="btn sm" type="button" data-toast="Export queued. The bundle carries segments, attestations, key ids and a verifier script.">Export this run</button>' +
      '</div></div>';
  }

  // Detail tab, by kind
  let out = "";
  if (f.model){
    out += '<div class="sect"><h3>Request</h3><dl class="grid2">' +
      '<div class="kv"><dt>Provider</dt><dd class="mono">' + f.model.provider + '</dd></div>' +
      '<div class="kv"><dt>Model</dt><dd class="mono">' + f.model.model + '</dd></div>' +
      '<div class="kv"><dt>Toolbelt</dt><dd class="mono num">' + f.model.tools + ' tool versions</dd></div>' +
      '<div class="kv"><dt>Input tokens</dt><dd class="mono num">' + f.model.input.toLocaleString() + '</dd></div>' +
      '</dl></div>';
    out += '<div class="sect"><h3>What the agent was told</h3>' +
      f.model.messages.map(m => '<div class="msg' + (m.injected ? " inj" : "") + '">' +
        '<div class="role">' + esc(m.role) + '</div><div class="txt">' + esc(m.txt).replace(/\n/g, "<br>") + '</div></div>').join("") +
      '</div>';
  }
  if (f.usage){
    const u = f.usage, tot = u.input_uncached + u.cache_read;
    const hit = tot ? (u.cache_read / tot * 100).toFixed(1) : "0.0";
    out += '<div class="sect"><h3>Usage by token class</h3><div class="bars">' +
      bar("input_uncached", u.input_uncached, 30000, "a") +
      bar("cache_read", u.cache_read, 30000, "b") +
      bar("output", u.output, 30000, "c") +
      bar("reasoning", u.reasoning, 30000, "d") +
      '</div></div>' +
      '<div class="sect"><h3>Prompt composition</h3><div class="bars">' +
      bar("tool definitions", u.tool_definition_tokens, 30000, "d") +
      bar("context frames", u.context_frame_tokens, 30000, "d") +
      bar("steering", u.steering_tokens, 30000, "d") +
      '</div></div>' +
      '<div class="sect"><h3>Cost and provenance</h3><dl class="grid2">' +
      '<div class="kv"><dt>Cost</dt><dd class="mono">' + u.cost + ' <span class="basis">USD</span></dd></div>' +
      '<div class="kv"><dt>Cost basis</dt><dd class="mono">' + u.basis + '</dd></div>' +
      '<div class="kv"><dt>Cache hit rate</dt><dd class="mono num">' + hit + '%</dd></div>' +
      '<div class="kv"><dt>Time to first token</dt><dd class="mono">' + u.ttft + '</dd></div>' +
      '<div class="kv"><dt>Latency</dt><dd class="mono">' + u.latency + '</dd></div>' +
      '<div class="kv"><dt>Provider request</dt><dd class="mono">' + u.req + '</dd></div>' +
      '</dl><p style="margin:9px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5">' +
      'Priced from price entries pe_ant_fable51_in, pe_ant_fable51_cr and pe_ant_fable51_out, effective 2026-08-01. ' +
      'Reconciles by provider request id at level 1.</p></div>';
  }
  if (f.tool){
    const t = f.tool;
    out += '<div class="sect"><h3>Tool call</h3><dl class="grid2">' +
      '<div class="kv"><dt>Tool version</dt><dd>' + TG.cell(t.pattern, {sz:"sm"}) + '</dd></div>' +
      '<div class="kv"><dt>Category</dt><dd>' + TG.cat(TG.meta(t.pattern).cat) + '</dd></div>' +
      (t.risk || t.side_effect ? '<div class="kv"><dt>Hazard</dt><dd>' + TG.hazard(t.risk || "low", t.side_effect) + '</dd></div>' : '') +
      (t.egress ? '<div class="kv"><dt>Egress class</dt><dd class="mono">' + t.egress + '</dd></div>' : '') +
      (t.result ? '<div class="kv"><dt>Result</dt><dd class="mono">' + t.result + ' · ' + t.bytes + '</dd></div>' : '') +
      (t.duration ? '<div class="kv"><dt>Duration</dt><dd class="mono">' + t.duration + '</dd></div>' : '') +
      (t.output_schema ? '<div class="kv"><dt>Output schema</dt><dd class="mono">' + t.output_schema + '</dd></div>' : '') +
      (t.receipt ? '<div class="kv"><dt>Receipt</dt><dd class="mono">' + t.receipt + '</dd></div>' : '') +
      '</dl>' +
      (t.input ? '<div style="margin-top:10px"><pre class="code">' + esc(t.input) + '</pre></div>' : '') +
      (t.connection ? '<p style="margin:9px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5">Credential brokered per call from ' + esc(t.connection) + '. The agent never held it.</p>' : '') +
      '</div>';
  }
  if (f.policy){
    const p = f.policy;
    out += '<div class="sect"><h3>Decision</h3>' +
      '<div style="margin-bottom:10px"><span class="pill p-allowed"><span class="dot"></span>' + p.outcome + '</span></div>' +
      '<ol class="chain">' + p.rules.map(r => '<li>' + esc(r) + '</li>').join("") + '</ol>' +
      '<dl class="grid2" style="margin-top:10px">' +
      '<div class="kv"><dt>Policy version</dt><dd class="mono">' + p.policy_version + '</dd></div>' +
      '<div class="kv"><dt>Taint</dt><dd class="mono">' + p.taint + '</dd></div>' +
      '<div class="kv"><dt>Deny generation</dt><dd class="mono num">' + p.deny_generation + '</dd></div>' +
      '</dl><p style="margin:9px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5">Deterministic, versioned, replayable. No model participates in this decision.</p></div>';
  }
  if (f.steer){
    const st = f.steer;
    out += '<div class="sect"><h3>Steer</h3><dl class="grid2">' +
      '<div class="kv"><dt>Issuer</dt><dd>Marcus Bell · operator</dd></div>' +
      '<div class="kv"><dt>Authority</dt><dd class="mono">operator · steering position</dd></div>' +
      '<div class="kv"><dt>Requested mode</dt><dd class="mono">' + (st.requested_mode || "next_step") + '</dd></div>' +
      '<div class="kv"><dt>Delivery mode</dt><dd class="mono">' + (st.delivery_mode || "next_step") + '</dd></div>' +
      '<div class="kv"><dt>Interrupted</dt><dd class="mono">' + (st.interrupted ? "true" : "false") + '</dd></div>' +
      '<div class="kv"><dt>Interrupted step</dt><dd class="mono">' +
        (st.interrupted_step ? st.interrupted_step.kind + " @ seq " + st.interrupted_step.seq : "—") + '</dd></div>' +
      '<div class="kv"><dt>Degraded reason</dt><dd class="mono">' + (st.degraded_reason || "—") + '</dd></div>' +
      '<div class="kv"><dt>Status</dt><dd class="mono">' + (st.status || "queued") + '</dd></div>' +
      '<div class="kv"><dt>Delivered at seq</dt><dd class="mono">' + (st.delivered_at_seq != null ? st.delivered_at_seq : "pending") + '</dd></div>' +
      '<div class="kv"><dt>Text digest</dt><dd class="mono" style="overflow-wrap:anywhere">' + st.digest + '</dd></div>' +
      '</dl><div class="msg" style="margin-top:10px"><div class="role">Steer text</div><div class="txt">' + esc(st.text) + '</div></div>' +
      (st.degraded_reason
        ? '<div class="grantcheck deny" style="margin:10px 0 0"><span class="g-no"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>' +
          '<span><b>Interrupt degraded to next step.</b>An irreversible tool call was in flight and is never abandoned. The call completed; the steer rides the request after it.</span></div>'
        : "") +
      '<p style="margin:9px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5">' +
      'Governed action <span class="mono">dispatch_command</span>, audited. Oxagen never executes steering text; it enters the prompt as operator-authority context at the model request named above.</p></div>';
  }
  if (f.command){
    out += '<div class="sect"><h3>Command</h3><dl class="grid2">' +
      '<div class="kv"><dt>Command</dt><dd class="mono">' + f.command.cmd + '</dd></div>' +
      '<div class="kv"><dt>Issuer</dt><dd>Marcus Bell · operator</dd></div>' +
      '<div class="kv"><dt>Outcome</dt><dd class="mono">' + f.command.outcome + '</dd></div>' +
      '<div class="kv"><dt>Guarantee</dt><dd>' + esc(f.command.guarantee) + '</dd></div>' +
      '</dl><p style="margin:9px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5">Governed action <span class="mono">dispatch_command</span> · row in control.commands · receipt ' + f.command.receipt + '</p></div>';
  }
  if (f.body && !f.model && !f.usage && !f.tool && !f.policy && !f.steer && !f.command){
    out += '<div class="sect"><h3>Body</h3><pre class="code">' + esc(JSON.stringify(f.body, null, 2)) + '</pre></div>';
  }
  return out || '<p style="color:var(--muted);margin:0">No body recorded for this frame.</p>';
}

function bar(label, v, max, cls){
  const pct = Math.max(1, Math.min(100, (v / max) * 100));
  return '<div class="bar"><span class="bl">' + label + '</span>' +
    '<span class="btrack"><span class="bfill ' + cls + '" style="width:' + pct.toFixed(1) + '%"></span></span>' +
    '<span class="bv">' + v.toLocaleString() + '</span></div>';
}

const MODE_NOTE = {
  next_step: "<b>Next step</b> — the current step runs to its terminal frame, then the steer rides the first model request after it. A tool call in flight finishes and the steer travels in the same request that carries its result. Nothing is discarded.",
  interrupt: "<b>Interrupt</b> — the in-flight response is stopped and its partial output is recorded and billed; a pending tool call is abandoned and denied with reason <span class=\"mono\">interrupted</span>. An irreversible tool call in flight is never abandoned, so the steer degrades to next step and the frame says so. Interrupt redirects the run; it does not stop it — that is pause.",
  turn_boundary: "<b>Turn boundary</b> — the steer waits for <span class=\"mono\">turn_end</span> and enters on the first model request of the next turn. Nothing is cut short, but it may wait."
};

function renderRun(){

  const o = OPS[r.op];
  const head =
    '<div class="runhead"><div class="rh-top"><div style="min-width:0">' +
      '<p class="eyebrow">Run · live</p>' +
      '<h1>' + HERO + '</h1>' +
      '<div class="runmeta">' +
        '<span class="mono">' + r.agent + '</span><span class="sep">·</span>' +

      '<div class="cs"><div class="csv">' + money(state.cost) + '</div><div class="csk">Cost so far</div></div>' +

      '<div class="cs"><div class="csv num">82.4%</div><div class="csk">Cache hit rate</div></div>' +
      '<div class="cs"><div class="csv num">' + state.frames.length + '</div><div class="csk">Frames</div></div>' +

  const st = state.runState;

let clock = { h:14, m:3, s:26, ms:115 };
function tick(secs){
  clock.ms += Math.round(secs * 1000);
  while (clock.ms >= 1000){ clock.ms -= 1000; clock.s++; }
  while (clock.s >= 60){ clock.s -= 60; clock.m++; }
  while (clock.m >= 60){ clock.m -= 60; clock.h++; }
  return String(clock.h).padStart(2,"0") + ":" + String(clock.m).padStart(2,"0") + ":" +
         String(clock.s).padStart(2,"0") + "." + String(clock.ms).padStart(3,"0");
}

function appendFrame(f){
  f.t = tick(1.2 + Math.random() * 2.4);
  f.isNew = true;
  state.frames.forEach(x => { x.isNew = false; });
  state.frames.push(f);
  if (f.cost) { state.cost = Math.round((state.cost + f.cost) * 100) / 100; }
  if (state.following && !state.playing){ state.pos = f.seq; revealAt(f.seq); }
  return f;
}

let streamTimer = null;
function startStream(){
  if (streamTimer) return;
  streamTimer = setInterval(() => {
    if (state.runState !== "running") return;
    if (state.view !== "loaded") return;
    const last = state.frames[state.frames.length - 1];
    if (last && last.live){
      last.live = false;
      last.sum = "stop_reason tool_use · 1,204 output · $0.41 · gateway_observed";
      last.usage.output = 1204; last.usage.cost = "$0.41"; last.usage.latency = "4,118 ms";
      state.cost = Math.round((state.cost + 0.41) * 100) / 100;
      render(); return;
    }
    const seq = state.frames.length;
    if (state.pendingSteer){
      const ps = state.pendingSteer;
      const f = appendFrame(injectedRequest(seq, ps.text));
      f.model.messages[2].role = "operator steer · Marcus Bell · seq " + ps.seq + " · mode " + ps.mode;
      const sf = state.frames.filter(x => x.seq === ps.seq)[0];
      if (sf && sf.steer){
        sf.steer.status = "applied";
        sf.steer.delivered_at_seq = f.seq;
        sf.sum = "steer by Marcus Bell · mode " + ps.mode + " · status applied at seq " + f.seq;
      }
      state.pendingSteer = null;
      cursor = IDX_MODEL_RESPONSE;
      state.selFrame = f.seq;
      state.inspTab = "detail";
      render();
      const el = document.querySelector('[data-frame="' + f.seq + '"]');
      if (el) el.scrollIntoView({ block:"center", behavior: reduced() ? "auto" : "smooth" });
      toast("Steer delivered. Frame " + f.seq + " is the model call that received it.");
      return;
    }
    appendFrame(LIVE_SCRIPT[cursor](seq));
    cursor = (cursor + 1) % LIVE_SCRIPT.length;
    render();
  }, 2600);
}
function reduced(){ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }


/* =========================================================================
   Transcript: run -> turn -> step -> frame, at three zoom levels
   ========================================================================= */
const TURN_PROSE = {
  1: { you:"Cut the 2026.9.2 release candidate. Issue acme/platform#4182 has the scope.",
       agent:"I will take the open pull requests against main first, then look at what is already red on the branch before I cut anything." },
  3: { agent:"Both failures predate the release scope. payments-e2e has been red since 9f3c2ab and ingest-flake is intermittent; neither is caused by anything in the eleven release-scope pull requests, so cutting the branch is safe. I am recording the observation and moving on." }
};

function msOf(t){
  const m = /^(\d+):(\d+):(\d+)\.(\d+)$/.exec(t);
  if (!m) return 0;
  return ((+m[1]) * 3600 + (+m[2]) * 60 + (+m[3])) * 1000 + (+m[4]);
}
function frameCost(f){
  if (!f.usage || !f.usage.cost) return 0;
  const n = parseFloat(String(f.usage.cost).replace(/[^0-9.]/g, ""));
  return isNaN(n) ? 0 : n;
}
function costAt(seq){
  let c = 0;
  for (const f of state.frames){ if (f.seq > seq) break; c += frameCost(f); }
  return Math.round(c * 100) / 100;
}
function elapsedAt(seq){
  const f0 = state.frames[0];
  const f = state.frames[Math.min(seq, state.frames.length - 1)];
  return Math.max(0, msOf(f.t) - msOf(f0.t));
}
function fmtEl(ms){
  const s2 = Math.floor(ms / 1000);
  return Math.floor(s2 / 60) + ":" + String(s2 % 60).padStart(2, "0");
}

function buildTranscript(frames){
  const groups = [];
  let cur = { id:"g0", type:"pre", label:"Run start", frames:[] };
  groups.push(cur);
  frames.forEach(f => {
    if (f.kind === "turn_start"){
      cur = { id:"g" + groups.length, type:"turn", n:(f.body && f.body.turn) || 0, frames:[f] };
      groups.push(cur);
    } else { cur.frames.push(f); }
  });
  if (!groups[0].frames.length) groups.shift();
  groups.forEach(g => { g.steps = buildSteps(g.frames, g.id); });
  return groups;
}
function buildSteps(frames, gid){
  const steps = []; let i = 0;
  while (i < frames.length){
    const f = frames[i];
    if (f.kind === "model.request"){
      const grp = [f];
      if (frames[i+1] && frames[i+1].kind === "model.response"){ grp.push(frames[i+1]); i += 2; } else i += 1;
      steps.push({ kind:"model", frames:grp }); continue;
    }
    if (f.kind === "tool_requested"){
      const grp = [f]; let j = i + 1;
      while (j < frames.length && (frames[j].kind === "policy_decision" || frames[j].kind === "tool_call")){
        grp.push(frames[j]); j++;
        if (grp[grp.length-1].kind === "tool_call") break;
      }
      steps.push({ kind:"tool", frames:grp }); i = j; continue;
    }
    steps.push({ kind:"event", frames:[f] }); i += 1;
  }
  steps.forEach((st, k) => { st.id = gid + "s" + k; });
  return steps;
}

function stepDigest(st){
  const a = st.frames[0], last = st.frames[st.frames.length - 1];
  if (st.kind === "model"){
    const resp = st.frames.filter(f => f.kind === "model.response")[0];
    const inj = a.injected;
    return {
      node:"model", cls:"model",
      name:(a.model && a.model.model) || "model call",
      arg:(inj ? "operator steer injected at the steering position" : "stop " + (resp && resp.usage ? "tool_use" : "…")),
      chips:[
        resp && resp.usage ? resp.usage.latency : "in flight",
        (a.model ? a.model.input.toLocaleString() + " in" : ""),
        resp && resp.usage ? resp.usage.output.toLocaleString() + " out" : "",
        resp && resp.usage ? resp.usage.cost : ""
      ].filter(Boolean),
      warn:inj
    };
  }
  if (st.kind === "tool"){
    const res = st.frames.filter(f => f.kind === "tool_call")[0];
    const pol = st.frames.filter(f => f.kind === "policy_decision")[0];
    return {
      node:"tool", cls:"",
      name:(a.tool ? a.tool.pattern.split(":").pop().split("@")[0] : "tool call"),
      arg:(a.tool ? a.tool.pattern : ""),
      chips:[
        pol ? pol.policy.outcome : "",
        res ? res.tool.duration : "pending",
        res ? res.tool.bytes : "",
        a.tool ? a.tool.side_effect : ""
      ].filter(Boolean),
      warn:false
    };
  }
  const f = a;
  const isControl = f.kind.indexOf("control.") === 0 || f.kind === "agent_start";
  return {
    node:isControl ? "control" : (f.kind === "policy_decision" ? "policy" : "tool"),
    cls:isControl ? "control" : "",
    name:f.kind, arg:f.sum, chips:[], warn:false
  };
}

function frameDetail(f){
  const keep = state.inspTab;
  state.inspTab = "envelope"; const envHtml = inspectorBody(f);
  state.inspTab = "chain";    const chainHtml = inspectorBody(f);
  state.inspTab = keep;
  return '<div class="fhead"><span class="fk">' + f.kind + '</span>' +
    '<span class="fs">seq ' + f.seq + ' · ' + f.t + 'Z · fidelity gateway</span></div>' +
    '<div class="fbody">' + inspectorBodyFor(f) + '</div>' +
    '<details class="more"' + (state.openSet.has("env" + f.seq) ? " open" : "") + '>' +
    '<summary data-toggle="env' + f.seq + '">envelope and chain</summary><div class="fbody" style="padding-top:0">' +
      envHtml + '<div style="margin-top:12px">' + chainHtml + '</div>' +
    '</div></details>';
}
function inspectorBodyFor(f){
  const keep = state.inspTab; state.inspTab = "detail";
  const out = inspectorBody(f);
  state.inspTab = keep;
  return out;
}

function renderTranscript(){
  const groups = buildTranscript(state.frames);
  const head = state.frames.length - 1;
  const pos = Math.min(state.pos, head);

  const body = groups.map(g => {
    const gOpen = state.openSet.has(g.id);
    const gFrames = g.frames;
    const firstSeq = gFrames.length ? gFrames[0].seq : 0;
    const lastSeq = gFrames.length ? gFrames[gFrames.length - 1].seq : 0;
    const cost = Math.round((gFrames.reduce((a, f) => a + frameCost(f), 0)) * 100) / 100;
    const dur = gFrames.length > 1 ? fmtEl(msOf(gFrames[gFrames.length-1].t) - msOf(gFrames[0].t)) : "0:00";
    const done = lastSeq < head || state.runState !== "running";
    const title = g.type === "turn"
      ? '<span class="turnname"><span class="bar">▍</span>turn ' + g.n + '</span>' +
        (done ? '<span class="turnok">done</span>' : '<span class="turnok run">running</span>')
      : '<span class="turnname"><span class="bar">▍</span>' + g.label + '</span>';

    const prose = g.type === "turn" && TURN_PROSE[g.n] ? TURN_PROSE[g.n] : null;
    const roleYou = prose && prose.you
      ? '<div class="role you"><div class="rolegut"><span class="roletag">YOU</span></div>' +
        '<div class="prose">' + esc(prose.you) + '</div></div>' : "";
    const roleAgent = prose && prose.agent
      ? '<div class="role agent"><div class="rolegut"><span class="roletag">AGENT</span></div>' +
        '<div class="prose">' + esc(prose.agent) + '</div></div>' : "";

    const steps = g.steps.map(st => {
      const sOpen = state.openSet.has(st.id);
      const d = stepDigest(st);
      const sFirst = st.frames[0], sLast = st.frames[st.frames.length - 1];
      const isNow = pos >= sFirst.seq && pos <= sLast.seq;
      const isFuture = sFirst.seq > pos;
      return '<details class="step' + (isNow ? " now" : "") + (isFuture ? " future" : "") + '"' + (sOpen ? " open" : "") + '>' +
        '<summary data-toggle="' + st.id + '"><div class="stepgrid">' +
          '<span class="t">' + sFirst.t.slice(3,8) + '</span>' +
          '<span class="node"><span class="dot ' + d.node + '"></span></span>' +
          '<span class="digest"><span class="chev">▶</span>' +
            (d.node === "tool" && d.arg.indexOf("@") > 0
              ? TG.cell(d.arg, {sz:"sm"})
              : '<span class="dname ' + d.cls + '">' + esc(d.name) + '</span><span class="darg">' + esc(d.arg) + '</span>') +
            '<span class="chips">' +
              (d.warn ? '<span class="chip cost" style="color:var(--accent-text)">steer injected</span>' : "") +
              d.chips.map(c => c === "allow" || c === "deny" || c === "require_approval" ? TG.gate(c)
                : c === "read" || c === "write" || c === "irreversible" ? '<span class="tg-hz e-' + c + '">' + TG.effSvg(c) + '<span>' + c + '</span></span>'
                : '<span class="chip' + (String(c).indexOf("$") === 0 ? " cost" : "") + '">' + esc(c) + '</span>').join("") +
            '</span>' +
          '</span>' +
        '</div></summary>' +
        (sOpen ? '<div class="sbody"><div class="sbody-inner">' +
          st.frames.map(frameDetail).join("") +
        '</div></div>' : "") + '</details>';
    }).join("");

    return '<details class="turn"' + (gOpen ? " open" : "") + '>' +
      '<summary data-toggle="' + g.id + '"><div class="turnline">' +
        '<span class="chev">▶</span>' + title +
        '<span class="chips">' +
          '<span class="chip">' + g.steps.length + ' steps</span>' +
          '<span class="chip">seq ' + firstSeq + '–' + lastSeq + '</span>' +
          '<span class="chip">' + dur + '</span>' +
          (cost ? '<span class="chip cost">$' + cost.toFixed(2) + '</span>' : "") +
        '</span>' +
      '</div></summary>' + roleYou + steps + roleAgent + '</details>';
  }).join("");

  return '<section class="tx">' + renderTransport() + '<div class="tx-body" id="txBody">' + body + '</div>' +
    '<div class="tx-foot"><span class="live-dot' + (state.runState === "running" ? "" : " paused") + '"></span>' +
    (state.runState === "running"
      ? "Recording. Every frame is hash-chained to its predecessor as it arrives."
      : "Recording held at the boundary. Nothing was dropped; the chain is continuous.") +
    '</div></section>';
}

function renderTransport(){
  const head = state.frames.length - 1;
  const pos = Math.min(state.pos, head);
  const following = state.following && state.runState === "running";
  const sp = [1, 1.5, 2, 4].map(v =>
    '<button type="button" data-speed="' + v + '" class="' + (state.speed === v ? "on" : "") + '">×' + v + '</button>').join("");
  const zm = [["turns","Turns"],["steps","Steps"],["all","Everything"]].map(z =>
    '<button type="button" data-zoom="' + z[0] + '" class="' + (state.zoom === z[0] ? "on" : "") + '">' + z[1] + '</button>').join("");

  return '<div class="tp">' +
    (following
      ? '<span class="livebadge"><span class="live-dot"></span>live</span>'
      : '<button class="livebadge off" type="button" id="tpFollow">go live</button>') +
    '<button class="tp-btn" type="button" id="tpBack" ' + (pos <= 0 ? "disabled" : "") + ' aria-label="Step back">' +
      '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.4 3.2 4.6 8l6.8 4.8Z" fill="currentColor"/><rect x="3.2" y="3.2" width="1.6" height="9.6" fill="currentColor"/></svg></button>' +
    '<button class="tp-btn play" type="button" id="tpPlay" aria-label="' + (state.playing ? "Pause playback" : "Play") + '">' +
      (state.playing
        ? '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.6" y="3.4" width="2.4" height="9.2" fill="currentColor"/><rect x="9" y="3.4" width="2.4" height="9.2" fill="currentColor"/></svg>'
        : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 3.2 12.4 8l-7.8 4.8Z" fill="currentColor"/></svg>') + '</button>' +
    '<button class="tp-btn" type="button" id="tpFwd" ' + (pos >= head ? "disabled" : "") + ' aria-label="Step forward">' +
      '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 3.2 11.4 8l-6.8 4.8Z" fill="currentColor"/><rect x="11.2" y="3.2" width="1.6" height="9.6" fill="currentColor"/></svg></button>' +
    '<span class="tp-scrub"><input class="scrub" id="tpScrub" type="range" min="0" max="' + head + '" value="' + pos + '" aria-label="Scrub to frame"></span>' +
    '<span class="tp-read"><b>seq ' + pos + '</b> / ' + head + ' · ' + fmtEl(elapsedAt(pos)) + ' / ' + fmtEl(elapsedAt(head)) + ' · <b>' + money(costAt(pos)) + '</b></span>' +
    '<span class="seg speed">' + sp + '</span>' +
    '<span class="seg">' + zm + '</span>' +
    '<p class="tp-note">Replay grade <span class="mono">fork</span>: this run can be inspected, viewed and forked. The transport moves the viewer, never the run — idle longer than 2s is compressed, and true elapsed time is shown beside the position.</p>' +
  '</div>';
}

function seedZoom(){
  const groups = buildTranscript(state.frames);
  state.openSet = new Set();
  if (state.zoom === "turns") return;
  groups.forEach(g => {
    state.openSet.add(g.id);
    if (state.zoom === "all") g.steps.forEach(st => state.openSet.add(st.id));
  });
}
function revealAt(seq){
  const groups = buildTranscript(state.frames);
  groups.forEach(g => {
    g.steps.forEach(st => {
      const a = st.frames[0], b = st.frames[st.frames.length - 1];
      if (seq >= a.seq && seq <= b.seq){ state.openSet.add(g.id); state.openSet.add(st.id); }
    });
  });
}

let playTimer = null;
function stopPlay(){ if (playTimer){ clearTimeout(playTimer); playTimer = null; } state.playing = false; }
function stepPlay(){
  const head = state.frames.length - 1;
  if (state.pos >= head){
    if (state.runState === "running"){ playTimer = setTimeout(stepPlay, 400); return; }
    stopPlay(); render(); return;
  }
  state.pos += 1;
  state.following = state.pos >= head;
  revealAt(state.pos);
  render();
  const el = document.querySelector('.step.now');
  if (el) el.scrollIntoView({ block:"nearest", behavior: reduced() ? "auto" : "smooth" });
  const raw = Math.min(2000, Math.max(120, msOf(state.frames[state.pos].t) - msOf(state.frames[state.pos - 1].t)));
  playTimer = setTimeout(stepPlay, raw / state.speed);
}
