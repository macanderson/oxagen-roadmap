<title>The Toolbelt, Governed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   Oxagen house system. Dark-first: the full palette is declared on
   bare :root, and only the tokens are re-declared for light.
   Gold is identity and at most one action per screen. It never
   encodes a state; the state ramp below is entirely separate.
   ───────────────────────────────────────────────────────────── */
:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C;
  --border:#292722; --rule:#34322D; --panel-2:#1C1B18;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A; --accent-text:#D6962C;
  --gold-on:#10100F;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 18px 44px rgba(0,0,0,.5);
  --shadow-dlg:0 40px 90px rgba(0,0,0,.62);

  /* state ramp — separate from gold, consistent everywhere */
  --st-allow:#4F9E6E;   --st-allow-bg:rgba(79,158,110,.13);
  --st-approve:#6E93DA; --st-approve-bg:rgba(110,147,218,.14);
  --st-deny:#C4564B;    --st-deny-bg:rgba(196,86,75,.14);
  --st-proven:#3FA3A3;  --st-proven-bg:rgba(63,163,163,.14);
  --st-fail:#A8443A;    --st-fail-bg:rgba(168,68,58,.16);
  --st-crit:#E0574A;    --st-crit-bg:rgba(224,87,74,.16);
  --st-neutral:#9B958A; --st-neutral-bg:rgba(155,149,138,.12);

  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --r-lg:14px; --r:12px; --r-sm:10px; --r-xs:7px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
  --border:#D8CDBD; --rule:#C9BFAE; --panel-2:#F4F0E6;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --gold-on:#10100F;
  --shadow:0 1px 0 rgba(255,255,255,.7), 0 18px 44px rgba(16,16,15,.08);
  --shadow-dlg:0 40px 90px rgba(16,16,15,.22);
  --st-allow:#2E7350;   --st-allow-bg:rgba(46,115,80,.11);
  --st-approve:#2F5F9E; --st-approve-bg:rgba(47,95,158,.11);
  --st-deny:#A0362C;    --st-deny-bg:rgba(160,54,44,.11);
  --st-proven:#1F7272;  --st-proven-bg:rgba(31,114,114,.11);
  --st-fail:#8C2E25;    --st-fail-bg:rgba(140,46,37,.12);
  --st-crit:#B93326;    --st-crit-bg:rgba(185,51,38,.12);
  --st-neutral:#6B665C; --st-neutral-bg:rgba(107,102,92,.10);
}}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0;
  --border:#D8CDBD; --rule:#C9BFAE; --panel-2:#F4F0E6;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --gold-on:#10100F;
  --shadow:0 1px 0 rgba(255,255,255,.7), 0 18px 44px rgba(16,16,15,.08);
  --shadow-dlg:0 40px 90px rgba(16,16,15,.22);
  --st-allow:#2E7350;   --st-allow-bg:rgba(46,115,80,.11);
  --st-approve:#2F5F9E; --st-approve-bg:rgba(47,95,158,.11);
  --st-deny:#A0362C;    --st-deny-bg:rgba(160,54,44,.11);
  --st-proven:#1F7272;  --st-proven-bg:rgba(31,114,114,.11);
  --st-fail:#8C2E25;    --st-fail-bg:rgba(140,46,37,.12);
  --st-crit:#B93326;    --st-crit-bg:rgba(185,51,38,.12);
  --st-neutral:#6B665C; --st-neutral-bg:rgba(107,102,92,.10);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);
     font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}

/* ── shell ─────────────────────────────────────────────────── */
.appwrap{container-type:inline-size;container-name:app;width:100%;height:100vh;overflow:hidden}
body.phone .appwrap{width:400px;height:min(820px,94vh);margin:16px auto;
  border:1px solid var(--rule);border-radius:22px;box-shadow:var(--shadow-dlg);overflow:hidden}
body.phone{background:var(--void);padding-block:0}
.app{display:grid;grid-template-columns:248px 1fr;height:100%;background:var(--ink)}

.side{border-right:1px solid var(--border);background:var(--void);
      display:flex;flex-direction:column;min-height:0;min-width:0}
.side-top{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none}
.brand svg{height:19px;width:auto;display:block}
.switcher{width:100%;margin-top:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:7px 10px;display:flex;align-items:center;gap:9px;
  cursor:pointer;text-align:left;line-height:1.25}
.switcher:hover{border-color:var(--rule);background:var(--hl)}
.switcher .av{width:24px;height:24px;border-radius:6px;background:var(--gold);color:var(--gold-on);
  display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.switcher .av.ws{background:var(--hl);color:var(--fg);border:1px solid var(--rule);font-weight:600}
.switcher b{display:block;font-size:12.5px;font-weight:600}
.switcher span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.switcher .car{margin-left:auto;color:var(--dim);font-size:10px}
.nav{flex:1;overflow-y:auto;padding:12px 10px 18px;min-height:0}
.nav-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:600;padding:10px 8px 6px}
.nav a{display:flex;align-items:center;gap:9px;padding:6.5px 9px;border-radius:var(--r-xs);
  color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;position:relative}
.nav a:hover{background:var(--hl);color:var(--fg)}
.nav a.on{background:var(--panel);color:var(--fg);box-shadow:inset 2px 0 0 var(--gold)}
.nav a .ic{width:15px;flex:none;color:var(--dim);display:grid;place-items:center}
.nav a.on .ic{color:var(--gold)}
.nav a .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.nav a .pip{margin-left:auto;background:var(--st-approve-bg);color:var(--st-approve);
  font-size:10px;font-weight:600;border-radius:20px;padding:0 6px;font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:9px}
.side-foot .av{width:26px;height:26px;border-radius:50%;background:var(--hl);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.side-foot b{font-size:12.5px;font-weight:500;display:block}
.side-foot span{font-size:10.5px;color:var(--dim);display:block}

.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:52px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:10px;padding:0 18px;background:color-mix(in srgb,var(--ink) 92%,transparent)}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden}
.crumb a{color:var(--muted);text-decoration:none;white-space:nowrap}
.crumb a:hover{color:var(--fg)}
.crumb i{color:var(--dim);font-style:normal}
.crumb b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{margin-left:auto;display:flex;align-items:center;gap:7px;flex:none}
.cmdk{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-xs);padding:5px 9px;color:var(--dim);font-size:12.5px;cursor:pointer;min-width:180px}
.cmdk:hover{border-color:var(--rule);color:var(--muted)}
.cmdk kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);
  border-radius:4px;padding:0 4px;color:var(--dim);background:var(--hl)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-xs);
  background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--hl);color:var(--fg);border-color:var(--border)}
.iconbtn.on{background:var(--panel);border-color:var(--rule);color:var(--fg)}
.hamb{display:none}

.main{flex:1;overflow-y:auto;min-height:0;position:relative}
.pad{padding:22px 26px 80px;max-width:1440px}

/* ── type & bits ───────────────────────────────────────────── */
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:0 0 7px}
.eyebrow.gold{color:var(--accent-text)}
h1{font-size:26px;line-height:1.12;letter-spacing:-.015em;font-weight:700;margin:0}
h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.005em}
h3{font-size:13px;font-weight:600;margin:0}
p{margin:0;color:var(--body);max-width:74ch}
.lede{font-size:14.5px;color:var(--muted);margin-top:8px;max-width:78ch}
.head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.head .grow{flex:1;min-width:min(100%,320px)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-xs);
  padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--fg);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--hl);border-color:var(--rule)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-on);font-weight:600}
.btn.primary:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
.btn.danger{color:var(--st-deny);border-color:color-mix(in srgb,var(--st-deny) 40%,var(--border))}
.btn.danger:hover{background:var(--st-deny-bg)}
.btn.sm{padding:3.5px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent-text);cursor:pointer;
  font-size:inherit;font-weight:500;text-align:left;text-decoration:underline;
  text-decoration-color:color-mix(in srgb,var(--accent-text) 35%,transparent);text-underline-offset:2px}
.link:hover{text-decoration-color:var(--accent-text)}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1.5px 8px;
  font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
  background:var(--st-neutral-bg);color:var(--st-neutral);border:1px solid transparent}
.chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.c-allow{background:var(--st-allow-bg);color:var(--st-allow)}
.c-approve{background:var(--st-approve-bg);color:var(--st-approve)}
.c-deny{background:var(--st-deny-bg);color:var(--st-deny)}
.c-proven{background:var(--st-proven-bg);color:var(--st-proven)}
.c-fail{background:var(--st-fail-bg);color:var(--st-fail)}
.c-crit{background:var(--st-crit-bg);color:var(--st-crit)}
.chip.sq{border-radius:5px;font-family:var(--mono);font-weight:500;font-size:10.5px;padding:1px 6px}
.chip.out{background:transparent;border-color:var(--border);color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.panel.flat{background:transparent}
.p-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  flex-wrap:wrap}
.p-h .grow{flex:1;min-width:0}
.p-h p{font-size:12.5px;color:var(--muted);margin-top:3px}
.p-b{padding:16px}
.p-b.tight{padding:0}
.p-f{padding:10px 16px;border-top:1px solid var(--border);background:var(--panel-2);
  font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:min(100%,300px)}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid4{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;
  overflow-x:auto;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;
  color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--gold);font-weight:600}
.tabs .cnt{font-family:var(--mono);font-size:10.5px;color:var(--dim);
  background:var(--hl);border-radius:4px;padding:0 5px}
.tabs button.on .cnt{color:var(--muted)}

.tw{overflow-x:auto;scrollbar-width:thin}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:600px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
thead th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  font-weight:600;background:var(--panel-2);position:sticky;top:0;z-index:1;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hl)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td b{font-weight:600}
.sub{display:block;font-size:11px;color:var(--dim);margin-top:1px}

.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:9px 18px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;color:var(--fg);word-break:break-word}
.kv dd.mono{font-size:11.5px}

.meter{height:6px;border-radius:3px;background:var(--hl);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--st-allow)}
.meter i.warn{background:var(--st-approve)}
.meter i.hot{background:var(--st-deny)}

.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.stat .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .b{font-size:11.5px;color:var(--muted);margin-top:3px}

pre{margin:0;background:var(--void);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.6;
  color:var(--body);scrollbar-width:thin}
pre .k{color:var(--accent-text)} pre .s{color:var(--st-allow)} pre .c{color:var(--dim)}
pre .d{color:var(--st-deny)} pre .n{color:var(--st-approve)}

.note{border-left:2px solid var(--gold);background:var(--hl);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:11px 14px;font-size:12.5px;color:var(--body)}
.note b{color:var(--fg)}
.note.deny{border-left-color:var(--st-deny)}
.note.allow{border-left-color:var(--st-allow)}

.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:var(--r-sm);
  font-size:12.5px;border:1px solid;margin-bottom:16px}
.banner.crit{background:var(--st-crit-bg);border-color:color-mix(in srgb,var(--st-crit) 40%,transparent);color:var(--fg)}
.banner.info{background:var(--hl);border-color:var(--border);color:var(--body)}
.banner .grow{flex:1;min-width:0}
.banner b{display:block;color:var(--fg);margin-bottom:2px}

.empty{text-align:center;padding:52px 24px;color:var(--muted);max-width:52ch;margin:0 auto}
.empty .mk{width:46px;height:46px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--panel);display:grid;place-items:center;margin:0 auto 14px;color:var(--dim)}
.empty h2{margin-bottom:7px}
.empty p{margin:0 auto;font-size:13px}
.empty .acts{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.skel{background:linear-gradient(90deg,var(--hl) 25%,var(--panel-2) 37%,var(--hl) 63%);
  background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:5px;height:11px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.skel{animation:none;background:var(--hl)}}
.sk-row{display:flex;gap:14px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--border)}

.wire{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.wire .b{background:var(--hl);border:1px solid var(--border);border-radius:var(--r-xs);padding:3px 8px;color:var(--fg)}
.wire .op{color:var(--gold);font-weight:700}
.wire .eq{color:var(--dim)}
.wire .b.out{color:var(--st-allow);border-color:color-mix(in srgb,var(--st-allow) 40%,transparent);
  background:var(--st-allow-bg)}

.searchbox{display:flex;gap:8px;align-items:center;background:var(--void);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:8px 11px}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:none;font-family:var(--mono);font-size:12.5px}
.searchbox input::placeholder{color:var(--dim)}
.res{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--void)}
.res-i{display:flex;gap:11px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:flex-start}
.res-i:last-child{border-bottom:0}
.res-i .n{font-family:var(--mono);font-size:12px;color:var(--fg);font-weight:500}
.res-i .d{font-size:11.5px;color:var(--muted);margin-top:1px}
.res-i .rk{margin-left:auto;flex:none;display:flex;gap:5px;align-items:center}
.zero{padding:22px 16px;text-align:center;font-size:12.5px;color:var(--muted)}
.zero b{display:block;color:var(--fg);font-size:13px;margin-bottom:5px}

.seg{display:inline-flex;background:var(--void);border:1px solid var(--border);border-radius:var(--r-xs);padding:2px}
.seg button{background:none;border:0;padding:4px 11px;font-size:11.5px;font-weight:500;color:var(--muted);
  border-radius:5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}

.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer}
.sw i{width:34px;height:19px;border-radius:20px;background:var(--hl);border:1px solid var(--rule);
  position:relative;transition:background .15s,border-color .15s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--muted);transition:transform .15s,background .15s}
.sw.on i{background:var(--st-deny-bg);border-color:var(--st-deny)}
.sw.on i::after{transform:translateX(15px);background:var(--st-deny)}
@media (prefers-reduced-motion:reduce){.sw i,.sw i::after{transition:none}}

.chain{display:flex;flex-direction:column;gap:0;font-size:12.5px}
.chain .h{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.chain .h:last-child{border-bottom:0}
.chain .n{width:19px;height:19px;border-radius:50%;background:var(--hl);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted);flex:none;margin-top:1px}
.chain .l{color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(10,10,9,.72);backdrop-filter:blur(3px);z-index:200;
  display:grid;place-items:center;padding:20px;overflow-y:auto}
.dlg{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);
  box-shadow:var(--shadow-dlg);width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;
  margin:auto}
.dlg.wide{width:min(940px,100%)}
.dlg-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--border)}
.dlg-h .grow{flex:1;min-width:0}
.dlg-h p{font-size:12.5px;color:var(--muted);margin-top:3px}
.dlg-b{padding:18px;overflow-y:auto;flex:1;min-height:0}
.dlg-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;
  align-items:center;flex-wrap:wrap;background:var(--panel-2)}
.dlg-f .grow{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 5px;border-radius:5px}
.x:hover{background:var(--hl);color:var(--fg)}
.steps{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--dim);margin-bottom:15px;flex-wrap:wrap}
.steps b{color:var(--fg);font-weight:600}
.steps .s{display:flex;gap:6px;align-items:center}
.steps .s i{width:17px;height:17px;border-radius:50%;border:1px solid var(--rule);display:grid;
  place-items:center;font-size:9.5px;font-style:normal;color:var(--dim)}
.steps .s.on i{background:var(--gold);border-color:var(--gold);color:var(--gold-on);font-weight:700}
.steps .s.on{color:var(--fg)}
.steps .s.done i{border-color:var(--st-allow);color:var(--st-allow)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{background:var(--void);border:1px solid var(--border);
  border-radius:var(--r-xs);padding:8px 11px;font-family:var(--mono);font-size:12.5px;outline:none;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.fld .hint{font-size:11.5px;color:var(--dim)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--r-xs);background:var(--void);cursor:pointer}
.check:hover{border-color:var(--rule)}
.check input{margin-top:3px;accent-color:var(--gold);flex:none}
.check .n{font-family:var(--mono);font-size:12px;font-weight:500}
.check .d{font-size:11.5px;color:var(--muted);margin-top:1px}
.check .grow{flex:1;min-width:0}

/* state pad — mockup chrome, never product UI */
.pad-ctl{position:fixed;right:14px;bottom:14px;z-index:300;font-family:var(--mono);font-size:11px;
  background:#0A0A09;color:#9B958A;border:1px solid #34322D;border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.55);width:206px;overflow:hidden}
.pad-ctl h4{margin:0;padding:7px 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:#6E6A62;border-bottom:1px solid #292722;font-weight:600;display:flex;align-items:center;gap:7px;
  font-family:var(--mono)}
.pad-ctl h4 .g{width:6px;height:6px;border-radius:50%;background:#D6962C}
.pad-ctl .bd{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pad-ctl button{background:#181715;border:1px solid #292722;color:#9B958A;border-radius:6px;
  padding:5px 6px;cursor:pointer;font-family:var(--mono);font-size:10.5px;text-align:center}
.pad-ctl button:hover{border-color:#6E6A62;color:#F2EEE5}
.pad-ctl button.on{background:#D6962C;border-color:#D6962C;color:#10100F;font-weight:700}
.pad-ctl .ft{padding:6px 10px 9px;color:#6E6A62;font-size:9.5px;line-height:1.45;border-top:1px solid #292722}
.pad-ctl .min{position:fixed;right:14px;bottom:14px}
.pad-min{position:fixed;right:14px;bottom:14px;z-index:300;font-family:var(--mono);font-size:10.5px;
  background:#0A0A09;color:#9B958A;border:1px solid #34322D;border-radius:8px;padding:5px 9px;cursor:pointer}

/* container-query reflow: the same rules the phone state reaches */
@container app (max-width:900px){
  .pad{padding:18px 16px 70px}
  .kv{grid-template-columns:1fr;gap:3px 0}
  .kv dt{margin-top:8px}
}
@container app (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:absolute;inset:0 auto 0 0;width:262px;z-index:60;transform:translateX(-103%);
    transition:transform .18s ease;box-shadow:var(--shadow-dlg)}
  body.navopen .side{transform:none}
  .hamb{display:grid}
  .cmdk{min-width:0;padding:5px 7px}
  .cmdk span,.cmdk kbd{display:none}
  h1{font-size:20px}
  .head-actions{width:100%}
  .stat .v{font-size:19px}
  .crumb .hide{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.scrimnav{position:absolute;inset:0;background:rgba(10,10,9,.5);z-index:55;display:none}
body.navopen .scrimnav{display:block}

     category = what the tool ACTS ON   → icon badge, one hue per category (never gold, never a state hue)

     gate     = what the belt decided   → badge; a dashed border means a person still stands in the way */

.tg-read{--tc:var(--tg-read)} .tg-query{--tc:var(--tg-query)} .tg-record{--tc:var(--tg-record)} .tg-message{--tc:var(--tg-message)} .tg-file{--tc:var(--tg-file)}

/* ---------- Tool grammar (shared with mc.html) ----------
   TG.cell(id,{sz:"sm"|"lg",sub})  label + API name in a category-hued tile; TG.names="api" leads with the API name
   TG.cat(cat)                     category badge          TG.hazard(risk,effect)   risk mark + side-effect glyph
   TG.gate(g,note)                 allow · require_approval · deny · killed · mandate
   TG.legend()                     the ten categories with examples, plus the risk / effect / gate scales
   TG.chips(counts,sel,pick,total) category filter chips; `pick` is an onclick with %s where the category goes
   TG.seg(items)                   segmented control: [[label,pressed,onclick],…]
   A category says what a tool ACTS ON; it is orthogonal to hazard (how bad a wrong call is) and gate (what the belt decided). */
var TG=(function(){
 function h(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
 var ORDER=["read","query","record","message","file","exec","vcs","infra","access","finance"];
 var CAT={
  read:{l:"Read-only",s:"Observes and returns. Changes nothing anywhere.",eg:"github__get_file_contents · slack__get_thread · search_graph",
    i:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/>'},
  query:{l:"Data query",s:"Bulk read from a store. Read-only, but the result set is the exfiltration and the cost.",eg:"snowflake__run_query · aws_billing__get_cost_and_usage",
    i:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'},
  record:{l:"Record write",s:"Creates or updates a record in a system of work. Reversible by another write.",eg:"linear__update_issue · calendar__create_event · notion__update_page",
    i:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'},
  message:{l:"Messaging & authoring",s:"Speaks to people on the organization’s behalf. A sent message cannot be unsent.",eg:"slack__post_message · slack__upload_file · gmail__send_message",
    i:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/>'},
  file:{l:"File mutation",s:"Writes, edits, moves or deletes files in a workspace or a drive.",eg:"write__file · edit__file · drive__trash_file",
    i:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 15l2 2 4-4"/>'},
  exec:{l:"Code execution",s:"Runs a command or a program. Its effect is whatever the sandbox allows.",eg:"claude_code__Bash · bash__run · sandbox__run_python",
    i:'<path d="m4 17 6-5-6-5M12 19h8"/>'},
  vcs:{l:"Source control",s:"Changes code history: branches, pull requests, merges, releases, repositories.",eg:"github__create_pull_request · github__merge_pull_request · github__delete_repository",
    i:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-12 2-12 6"/>'},
  infra:{l:"Infrastructure",s:"Deploys, scales, pauses or reconfigures a running system.",eg:"vercel__deploy_to_vercel · vercel__pause_project · k8s__scale_deployment",
    i:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>'},
  access:{l:"Access & identity",s:"Grants, shares, rotates or revokes access. Widens what every later call can reach.",eg:"drive__share_file · iam__rotate_key · oxagen__grant_role",
    i:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/>'},
  finance:{l:"Financial control",s:"Moves funds or commits spend. Never callable without a mandate.",eg:"stripe__create_payment · stripe__create_refund · aws_billing__purchase_savings_plan",
    i:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>'}
 };
 var META={
  github__create_pull_request:["Create pull request","vcs"], github__merge_pull_request:["Merge pull request","vcs"],
  github__delete_repository:["Delete repository","vcs"], github__create_release:["Create release","vcs"], github__push_files:["Push files","vcs"],
  github__get_file_contents:["Get file contents","read"], github__list_pull_requests:["List pull requests","read"], github__get_pull_request:["Get pull request","read"],
  stripe__create_payment:["Create payment","finance"], stripe__create_refund:["Create refund","finance"], stripe__create_payout:["Create payout","finance"],
  aws_billing__purchase_savings_plan:["Purchase savings plan","finance"], aws_billing__get_cost_and_usage:["Get cost and usage","query"],
  linear__update_issue:["Update issue","record"], linear__get_issue:["Get issue","read"], linear__create_issue:["Create issue","record"],
  slack__post_message:["Post message","message"], slack__upload_file:["Upload file","message"],
  slack__list_channels:["List channels","read"], slack__get_thread:["Get thread","read"],
  snowflake__run_query:["Run SQL query","query"], claude_code__Bash:["Run shell command","exec"], bash__run:["Run shell command","exec"],
  write__file:["Write file","file"], edit__file:["Edit file","file"], read__file:["Read file","read"],
  search_graph:["Search the graph","read"], recall_context:["Recall context","read"]
 };
 function parts(id){var s=String(id||""),i=s.lastIndexOf("@");return i>0?{n:s.slice(0,i),v:s.slice(i+1)}:{n:s,v:""};}
 function meta(id){
  var p=parts(id), m=META[p.n];
  if(m) return {n:p.n,v:p.v,l:m[0],cat:m[1]};
  var local=p.n.split("__").pop(), verb=local.split("_")[0].toLowerCase(), cat="record";
  if(/^(get|list|search|read|fetch|find|recall|describe|show)$/.test(verb)) cat="read";
  else if(/^(query|select|aggregate|export)$/.test(verb)) cat="query";
  else if(/^(write|edit|move|copy|trash|mkdir)$/.test(verb)) cat="file";
  else if(/^(bash|run|exec|execute|eval)$/.test(verb)) cat="exec";
  else if(/^(post|send|reply|forward|publish|upload)$/.test(verb)) cat="message";
  else if(/^(pay|refund|purchase|charge|transfer|buy|payout)$/.test(verb)) cat="finance";
  else if(/^(deploy|scale|pause|restart|provision)$/.test(verb)) cat="infra";
  else if(/^(grant|share|rotate|revoke|invite)$/.test(verb)) cat="access";
  else if(/^(merge|rebase|tag|release|push|fork)$/.test(verb)) cat="vcs";
  return {n:p.n,v:p.v,l:local.replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase();}),cat:cat};
 }

  o=o||{}; var m=meta(id), api=TG.names==="api", d=CAT[m.cat];
  var apiHtml=h(m.n)+(m.v?'<span class="v">@'+h(m.v)+'</span>':''), sub=o.sub?' · '+h(o.sub):'';
  return '<span class="tg tg-'+m.cat+(o.sz?' '+o.sz:'')+(api?' api':'')+'" title="'+h(m.n+(m.v?'@'+m.v:''))+' — '+h(m.l)+' · '+h(d.l)+'">'+
   '<span class="i">'+svg(m.cat)+'</span>'+
   (api?'<span class="l">'+apiHtml+'</span><span class="a">'+h(m.l)+sub+'</span>'
       :'<span class="l">'+h(m.l)+'</span><span class="a">'+apiHtml+sub+'</span>')+'</span>';
 }
 function riskSvg(r){
  if(r==="critical") return SV2+'<path d="M12 3 2 20h20L12 3z" fill="currentColor"/><path d="M12 10v4M12 17.5v.5" style="stroke:var(--ink,#10100F)"/></svg>';
  if(r==="high") return SV2+'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>';
  if(r==="medium") return SV2+'<path d="M12 3l9 9-9 9-9-9z"/><path d="M12 12h.01"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M12 12h.01"/></svg>';
 }
 function effSvg(e){
  if(e==="irreversible") return SV2+'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  if(e==="write") return SV2+'<path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M12 8l4 4"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg>';
 }
 function hazard(r,e){
  return '<span class="tg-hz r-'+h(r)+'" title="risk '+h(r)+'">'+riskSvg(r)+'<span>'+h(r)+'</span></span>'+
   (e?'<span class="tg-hz e-'+h(e)+'" title="side effect '+h(e)+'">'+effSvg(e)+'<span>'+h(e)+'</span></span>':'');
 }
 var GL={allow:"allowed",require_approval:"needs approval",deny:"denied",killed:"kill switch",mandate:"mandate + approval"};
 function gateSvg(g){
  var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  if(g==="allow") return s+'<path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  if(g==="require_approval") return s+'<path d="M12 3l8 3.5v5c0 4.6-3.2 8.6-8 9.5-4.8-.9-8-4.9-8-9.5v-5z"/><path d="M12 8v4l2.5 1.5"/></svg>';
  if(g==="deny") return s+'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>';
  if(g==="killed") return s+'<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>';
  if(g==="mandate") return s+'<path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3S7.5 5.8 7.5 7.5s2 2.7 4.5 3.3 4.5 1.6 4.5 3.5-2 3.2-4.5 3.2-4.5-1.3-4.5-3"/></svg>';
  return s+'<path d="M5 12h14"/></svg>';
 }
 function gate(g,note){g=({allowed:"allow",approval:"require_approval",denied:"deny"})[g]||g;return '<span class="tg-gt g-'+h(g)+'"'+(note?' title="'+h(note)+'"':'')+'>'+gateSvg(g)+h(GL[g]||g)+'</span>';}
 function seg(items){return '<span class="tg-seg" role="group">'+items.map(function(it){return '<button type="button" aria-pressed="'+(!!it[1])+'" onclick="'+h(it[2])+'">'+h(it[0])+'</button>';}).join("")+'</span>';}
 function chips(counts,sel,pick,total){
  var out='<button type="button" aria-pressed="'+(!sel)+'" onclick="'+h(pick.replace("%s",""))+'">All <span class="n">'+total+'</span></button>';
  ORDER.forEach(function(c){ if(!counts[c])return;
   out+='<button type="button" class="tg-'+c+'" aria-pressed="'+(sel===c)+'" title="'+h(CAT[c].s)+'" onclick="'+h(pick.replace("%s",c))+'">'+svg(c)+h(CAT[c].l)+'<span class="n">'+counts[c]+'</span></button>';});
  return '<div class="tg-chips">'+out+'</div>';
 }
 function legend(){
  return '<div class="tg-leg">'+ORDER.map(function(c){var d=CAT[c];
    return '<div class="c tg-'+c+'"><div class="i">'+svg(c)+'</div><div style="min-width:0"><div class="l">'+h(d.l)+'</div><div class="s">'+h(d.s)+'</div><div class="eg">'+h(d.eg)+'</div></div></div>';}).join("")+'</div>'+
   '<div class="tg-axes">'+
   '<div><span class="k">Risk</span>'+hazard("low")+hazard("medium")+hazard("high")+hazard("critical")+'</div>'+

})();

function pageAgent(r){

  if(!a){ return `<div class="empty"><div class="mk">?</div><h2>No such agent in ${esc(r.ws)}</h2>
    <p>The key <span class="mono">${esc(r.ws)}.${esc(r.a)}</span> is not registered here.</p>
    <div class="acts"><button class="btn primary" onclick="go('${r.org}/${r.ws}/agents')">Back to Agents</button></div></div>`; }
  renderCrumb(r, a.name);
  const st = stateBlock(r, "This agent");
  if(st) return st;
  const tab = r.b || "toolbelt";
  const body = ({
    identity:aIdentity, toolbelt:aToolbelt, mandates:aMandates, budgets:aBudgets,
    enrollment:aEnrollment, incidents:aIncidents, definition:aDefinition
  })[tab] || aToolbelt;

  const counts = {toolbelt:a.belt, mandates:a.mandates, incidents:(INCIDENTS[a.slug]||[]).length};

  return `${S.killBanner||""}
  <div class="head">
    <div class="grow">
      <p class="eyebrow gold"><button class="link" onclick="go('${r.org}/${r.ws}/agents')" style="color:inherit;text-decoration:none">Agents</button> · ${esc(a.harness)}</p>
      <h1>${esc(a.name)}</h1>
      <div class="wire" style="margin-top:9px">
        <span class="b">${esc(a.key)}</span>
        ${statusChip(a.status)}
        ${tierChip(a.tierModel,"model")} ${tierChip(a.tierTools,"tools")} ${tierChip(a.tierNative,"native")}
        <span class="chip sq">replay ${esc(a.replay)}</span>
      </div>
      <p class="lede">${esc(a.desc)}</p>
    </div>
    <div class="head-actions">
      <button class="btn" onclick="openDlg('rotate')">Rotate credential</button>
      <button class="btn danger" onclick="openDlg('revoke')">Revoke</button>
      <button class="btn primary" onclick="go('${r.org}/${r.ws}/agents/${a.slug}/toolbelt')">See the belt as the model sees it</button>
    </div>
  </div>
  <div class="tabs">${ATABS.map(([k,l])=>`
    <button class="${tab===k?"on":""}" onclick="go('${r.org}/${r.ws}/agents/${a.slug}/${k}')">${l}
      ${counts[k]!==undefined&&counts[k]!==0?`<span class="cnt">${counts[k]}</span>`:""}</button>`).join("")}</div>
  ${body(a,r)}`;
}

function aToolbelt(a,r){
  const mode = S.beltMode;
  const pinned = BELT.filter(t=>t.pinned);
  const q = S.beltQuery.trim().toLowerCase();
  const hits = q ? BELT.filter(t =>
      (t.n+" "+t.d+" "+t.s).toLowerCase().includes(q)) : [];
  const outsideHit = q ? OUTSIDE.filter(t=>t.n.toLowerCase().includes(q)||q.split(/\s+/).some(w=>w.length>3&&t.n.includes(w))) : [];

  /* Per-tool decision rules: grouped by category (default) or flat; chips filter either layout. */
  const bcount = catCounts(BELT);
  const bsel = S.beltCat ? BELT.filter(t=>TG.meta(t.n).cat===S.beltCat) : BELT;
  const beltRow = t=>`
    <tr class="click ${toolRowCls(t)}" onclick="openTool('${t.n}@${t.v}')">
      <td>${TG.cell(t.n+"@"+t.v,{sub:t.meta?"meta-tool":""})}</td>
      <td>${TG.cat(TG.meta(t.n).cat)}</td>
      <td>${decChip(t.dec)}<span class="sub mono">${esc(t.rule)}</span></td>
      <td>${riskChip(t.risk)}${effChip(t.eff)}</td>
      <td><span class="chip sq">${esc(t.eg)}</span></td>
      <td>${finChip(t.fin)}</td>
      <td><span class="mono dim" style="font-size:11px">${esc(t.dig)}</span></td>
    </tr>`;
  const rows = S.beltView==="group"
    ? TG.ORDER.filter(c=>bsel.some(t=>TG.meta(t.n).cat===c)).map(c=>{
        const rs = bsel.filter(t=>TG.meta(t.n).cat===c);
        return `<tr class="tg-grp tg-${c}"><td colspan="6"><span class="i">${TG.svg(c)}</span><b>${esc(TG.CAT[c].l)}</b><span class="s">${esc(TG.CAT[c].s)}</span></td>
          <td class="dim" style="font-size:11px;white-space:nowrap">${rs.length} tool${rs.length>1?"s":""}</td></tr>` + rs.map(beltRow).join("");
      }).join("")
    : bsel.map(beltRow).join("");
  const hz = {critical:0,high:0,approve:0,deny:0};
  BELT.forEach(t=>{ if(hz[t.risk]!==undefined)hz[t.risk]++; if(hz[t.dec]!==undefined)hz[t.dec]++; });

  const searchResults = !S.beltRan ? "" :
    hits.length ? `<div class="res">${hits.slice(0,8).map(t=>`
        <div class="res-i">
          <div class="grow">${TG.cell(t.n+"@"+t.v,{sz:"sm"})}<div class="d">${esc(t.d)}</div></div>
          <div class="rk">${riskChip(t.risk)}${decChip(t.dec)}</div>
        </div>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin-top:8px">${hits.length} of ${BELT_TOTAL} belt members matched.
        <span class="mono">search_tools</span> returned names and one-line descriptions only; the model must call
        <span class="mono">load_tools</span> to see a schema, and both calls are recorded as frames.</p>`
    : `<div class="res"><div class="zero">
        <b>Zero results.</b>
        ${outsideHit.length ? `<span class="mono">${esc(outsideHit[0].n)}</span> exists in the registry, but it is not in this
          agent's belt: ${esc(outsideHit[0].why)}` : `Nothing in this agent's belt matches that.`}
        <div style="margin-top:10px;color:var(--st-proven)">A search never returns a tool outside the belt.
          What the model cannot call, it cannot find, and so cannot be prompt-injected into calling.</div>
      </div></div>`;

  return `<div class="stack">
  <div class="panel">
    <div class="p-h"><div class="grow"><h2>How this belt was computed</h2>
      <p>At run start, cached with the bundle version, recomputed on any deny-generation bump.</p></div>
      <span class="chip sq">bundle v${WS[r.ws].policyVersion} · deny gen ${S.denyGen}</span></div>
    <div class="p-b stack">
      <div class="wire">
        <span class="b">grants<br><span class="dim" style="font-size:10.5px">1,204 versions</span></span><span class="op">∩</span>
        <span class="b">delegation ceiling<br><span class="dim" style="font-size:10.5px">${esc(a.operator)}</span></span><span class="op">∩</span>
        <span class="b">policy bundle<br><span class="dim" style="font-size:10.5px">v${WS[r.ws].policyVersion}</span></span><span class="op">∩</span>
        <span class="b">kill switches<br><span class="dim" style="font-size:10.5px">2 flipped</span></span><span class="eq">=</span>
        <span class="b out">belt<br><span style="font-size:10.5px">${BELT_TOTAL} tool versions</span></span>
      </div>
      <p style="font-size:12.5px">The registry holds <b class="num">3,182</b> tool versions across eight servers.
        This agent's model is shown <b class="num">${BELT_TOTAL}</b> of them. A call by name to anything outside
        the belt is rejected before lookup, recorded as
        <span class="mono">unknown_tool</span>, and counted toward an automatic halt.</p>
    </div>
  </div>

  <div class="panel">
    <div class="p-h"><div class="grow"><h2>What the model receives</h2>
      <p>The belt is ${BELT_TOTAL} tools, over this workspace's full-belt limit of 40, so it is presented
        as a searchable belt.</p></div>
      <div class="seg">
        <button class="${mode==="searchable"?"on":""}" onclick="S.beltMode='searchable';render()">Searchable belt</button>
        <button class="${mode==="full"?"on":""}" onclick="S.beltMode='full';render()">Full belt</button>
      </div></div>
    <div class="p-b stack">
      ${mode==="searchable" ? `
        <div class="note"><b>Searchable belt.</b> The request carries two meta-tools plus the tools pinned as
          always-present — ${pinned.length} definitions instead of ${BELT_TOTAL}. Both meta-tools are themselves
          governed calls recorded as frames, so the record shows what the model looked for and what it was shown.</div>
        <pre><span class="c">// the tools block of the next model request, verbatim</span>
[
  { <span class="k">"name"</span>: <span class="s">"search_tools"</span>,
    <span class="k">"description"</span>: <span class="s">"Search this agent's belt by name and description. Returns names only.\\n[oxagen] risk=low approval=never ceiling=none schema=sha256:aa01f3…"</span> },
  { <span class="k">"name"</span>: <span class="s">"load_tools"</span>,
    <span class="k">"description"</span>: <span class="s">"Load full definitions for named tools from the belt.\\n[oxagen] risk=low approval=never ceiling=none schema=sha256:b52c09…"</span> },
${pinned.filter(t=>!t.meta).map(t=>`  { <span class="k">"name"</span>: <span class="s">"${esc(t.n)}"</span>,
    <span class="k">"description"</span>: <span class="s">"${esc(t.d)}\\n[oxagen] risk=${esc(t.risk)} approval=${t.dec==="approve"?"required":"never"} ceiling=${esc(t.scope.split("·")[0].trim())} schema=${esc(t.dig)}"</span> }`).join(",\n")}
]</pre>
        <p style="font-size:12.5px">Every definition carries a fixed, machine-readable trailer: the risk grade,
          whether the call will be held for approval, and any budget or mandate ceiling. A model that knows a
          call will be held plans differently than one that does not. The schema digest lets a run's frames
          prove exactly which schema the model saw.</p>
      ` : `
        <div class="note"><b>Full belt.</b> Under the limit, every definition is in the request. At
          ${BELT_TOTAL} tools this belt is over the workspace limit of 40 — this is the view a smaller belt gets,
          shown here for comparison. The tool-definition token count is measured on every model call, and the
          findings job flags belts wider than the agent uses.</p></div>
        <pre><span class="c">// 57 definitions · 18,412 tokens of tool definitions</span>
<span class="c">// over the 12k budget: the findings job flagged this belt on 2026-09-09</span>
[
${BELT.slice(0,6).map(t=>`  { <span class="k">"name"</span>: <span class="s">"${esc(t.n)}"</span>, <span class="k">"input_schema"</span>: { <span class="c">/* ${esc(t.dig)} */</span> },
    <span class="k">"description"</span>: <span class="s">"${esc(t.d)}\\n[oxagen] risk=${esc(t.risk)} approval=${t.dec==="approve"?"required":"never"}"</span> }`).join(",\n")},
  <span class="c">… 51 more</span>
]</pre>`}
    </div>
  </div>

  <div class="panel">
    <div class="p-h"><div class="grow"><h2>Try the belt search</h2>
      <p>This is <span class="mono">search_tools</span> running against the same index the model queries.</p></div></div>
    <div class="p-b stack">
      <div class="searchbox">
        <span class="dim mono">search_tools(</span>
        <input id="beltq" type="text" placeholder="release notes" value="${esc(S.beltQuery)}"
          aria-label="Search this agent's belt"
          oninput="S.beltQuery=this.value" onkeydown="if(event.key==='Enter'){S.beltRan=true;render();setTimeout(()=>{const e=document.getElementById('beltq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},0)}">
        <span class="dim mono">)</span>
        <button class="btn sm" onclick="S.beltRan=true;render()">Run</button>
      </div>
      <div class="head-actions" style="gap:6px">
        <span class="muted" style="font-size:11.5px">Try:</span>
        ${["pull request","context record","stripe payment","delete repository","graph"].map(x=>
          `<button class="btn sm" onclick="S.beltQuery='${x}';S.beltRan=true;render()">${x}</button>`).join("")}
      </div>
      ${searchResults}
    </div>
  </div>

  <div class="panel">
    <div class="p-h"><div class="grow"><h2>Per-tool decision rules</h2>
      <p>What the policy engine will answer for each member of the belt, before the call is ever made.
        Deterministic, versioned, replayable. No model participates.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${namesSeg()}
        ${TG.seg([["By category",S.beltView==="group","S.beltView='group';render()"],["Flat",S.beltView!=="group","S.beltView='flat';render()"]])}
        <span class="chip sq">${BELT.length} of ${BELT_TOTAL} shown</span></div></div>
    <div class="p-b" style="border-bottom:1px solid var(--border);display:grid;gap:10px">
      ${TG.chips(bcount,S.beltCat,"S.beltCat='%s';render()",BELT.length)}
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px">
        <span class="tg-hz r-critical">${TG.riskSvg("critical")}<span>${hz.critical} critical</span></span>
        <span class="tg-hz r-high">${TG.riskSvg("high")}<span>${hz.high} high</span></span>
        <span style="display:inline-flex;gap:5px;align-items:center">${TG.gate("require_approval")}<span class="dim">${hz.approve}</span></span>
        <span style="display:inline-flex;gap:5px;align-items:center">${TG.gate("deny")}<span class="dim">${hz.deny}</span></span>
        <button class="btn sm" style="margin-left:auto" onclick="openDlg('toolcats')">What the categories mean</button></div></div>
    <div class="p-b tight"><div class="tw"><table>
      <thead><tr><th>Tool</th><th>Category</th><th>Decision</th><th>Hazard</th><th>Egress</th><th>Financial</th>
        <th>Schema digest</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    <div class="p-f"><span>The remaining 35 are the same github and harness families at other versions.</span></div>
  </div>

  <div class="panel">
    <div class="p-h"><div class="grow"><h2>What this agent cannot see</h2>
      <p>A sample of the 3,125 registry versions outside the belt, and why each one is out.</p></div>
      <span class="chip c-deny"><span class="dot"></span>not visible to the model</span></div>
    <div class="p-b tight"><div class="tw"><table style="min-width:520px">
      <thead><tr><th>Tool</th><th>Why it is not in the belt</th></tr></thead>
      <tbody>${OUTSIDE.map(t=>`<tr><td>${TG.cell(t.n,{sz:"sm"})}</td><td class="muted">${esc(t.why)}</td></tr>`).join("")}</tbody>
    </table></div></div>
  </div>
  </div>`;
}

function aMandates(a,r){
  const mine = MANDATES.filter(m=>m.agent===a.key);
  if(!mine.length) return `<div class="stack">
    <div class="panel" style="border-color:color-mix(in srgb,var(--st-proven) 30%,var(--border))">
      <div class="p-h"><div class="grow"><h2>No mandate</h2>
        <p>Nothing in a grant, a role, or a bundle can substitute for one.</p></div>
        <span class="chip c-proven"><span class="dot"></span>cannot move money</span></div>
      <div class="p-b stack">
        <p style="font-size:13px">A financial tool call from this agent is denied before dispatch. That is true
          whether the tool is on its belt or not, and it is checked at step 5 of the call pipeline, before any
          credential is minted and before anything is sent to a tool server.</p>
        <div class="chain">
          <div class="h"><span class="n">1</span><div><span class="l">Call</span>
            <div class="mono">stripe__create_payment@5 · amount $1,204.18 USD</div></div></div>
          <div class="h"><span class="n">2</span><div><span class="l">Financial class</span>
            <div>moves_funds, read from the tool version's declared <span class="mono">amount_path</span></div></div></div>
          <div class="h"><span class="n">3</span><div><span class="l">Mandate lookup</span>
            <div>none for <span class="mono">${esc(a.key)}</span></div></div></div>
          <div class="h"><span class="n">4</span><div><span class="l">Decision</span>
            <div>${decChip("deny")} <span class="mono">no_mandate</span> · mandate ledger unchanged · no credential minted</div></div></div>
        </div>
        <div class="head-actions">
          <button class="btn" onclick="openDlg('mandate')">Request a mandate</button>
          <button class="link" onclick="go('${r.org}/${r.ws}/tools/mandates')">Open the mandates ledger →</button>
        </div>
      </div></div></div>`;
  return `<div class="stack">${mine.map(m=>mandateCard(m,r,true)).join("")}</div>`;
}

function aBudgets(a,r){
  const dayPct = Math.min(100, (parseFloat(a.usedDay)/parseFloat(a.budgetDay))*100);
  const cls = dayPct>80?"hot":dayPct>50?"warn":"";
  return `<div class="stack">
    <div class="grid2">
      <div class="panel"><div class="p-h"><div class="grow"><h2>Budgets</h2>
        <p>Enforced, not advisory. A breach issues the same commands policy does: a pause or a cancel.</p></div>
        <button class="btn sm" onclick="openDlg('budget')">Set budget</button></div>
        <div class="p-b stack">
          <div><div style="display:flex;justify-content:space-between;font-size:12.5px">
            <span class="muted">Per run</span><span>${money(a.budgetRun,"")} <span class="dim">ceiling</span></span></div>
            <div class="meter"><i style="width:38%"></i></div>
            <div class="dim" style="font-size:11.5px;margin-top:4px">Median run this month: ${usd((parseFloat(a.budgetRun)*0.38).toFixed(2))} USD · basis: price book 2026-09 at the provider's list rate</div></div>
          <div><div style="display:flex;justify-content:space-between;font-size:12.5px">
            <span class="muted">Per day</span><span>${usd(a.usedDay)} <span class="dim">of ${usd(a.budgetDay)}</span></span></div>
            <div class="meter"><i class="${cls}" style="width:${dayPct.toFixed(0)}%"></i></div>
            <div class="dim" style="font-size:11.5px;margin-top:4px">Resets 00:00 UTC · mode enforced · currency USD</div></div>
          <dl class="kv">
            <dt>Spend, 30 days</dt><dd>${money(a.spend30,"model calls + priced tool calls, reconciled to the provider statement")}</dd>

function tRegistry(r){
  if(S.view==="empty") return `<div class="panel"><div class="p-b"><div class="empty">
    <div class="mk">⬡</div><h2>No tool server is registered</h2>
    <p>Until a server is imported, no agent in this workspace has a belt, and every call by name is
      <span class="mono">unknown_tool</span>. Import an MCP server to pull its
      <span class="mono">tools/list</span>, version it, and store both schemas.</p>
    <div class="acts"><button class="btn primary" onclick="openDlg('import')">Import from an MCP server</button>
      <button class="btn" onclick="S.view='loaded';render()">Show the loaded state</button></div></div></div></div>`;

  const props = REGISTRY.filter(t=>t.proposal && !S.approved[t.n]);
  const srows = SERVERS.map(s=>`
    <tr>
      <td><b class="mono">${esc(s.name)}</b><span class="sub">${esc(s.url)}</span></td>
      <td><span class="chip sq">${esc(s.kind)}</span><span class="sub">${esc(s.transport)}</span></td>
      <td class="r"><span class="num">${s.tools}</span><span class="sub">${s.versions} versions</span></td>
      <td>${s.health==="ok"?`<span class="chip c-allow"><span class="dot"></span>ok</span>`
          :`<span class="chip c-approve"><span class="dot"></span>degraded</span>`}
        ${S.switches.ks_srv_slack&&s.id==="slack"?`<span class="chip c-deny"><span class="dot"></span>killed</span>`:""}</td>
      <td class="muted">${esc(s.schemas)}</td>
      <td class="muted">${esc(s.conn)}</td>
      <td class="muted">${esc(s.imported)}</td>
    </tr>`).join("");

  const rcount = catCounts(REGISTRY);
  const rsel = S.regCat ? REGISTRY.filter(t=>TG.meta(t.n).cat===S.regCat) : REGISTRY;
  const trows = rsel.map(t=>{
    const origin = S.approved[t.n] ? "observed_approved" : t.origin;
    const killed = (S.switches.ks_tv_del && t.n==="github__delete_repository") || (S.switches.ks_srv_slack && t.s==="slack");
    const gate = killed ? TG.gate("killed","a kill switch is on for this version or its server")
      : t.fin!=="none" ? TG.gate("mandate","financial effect "+t.fin+": a mandate is required, and its own rule decides when a person approves")
      : t.eff==="irreversible" ? TG.gate("require_approval","policy v41 · require_approval on side_effect:irreversible")
      : TG.gate("allow","policy v41 · allowed wherever a grant reaches this version");
    return `<tr class="click ${toolRowCls(t)}" onclick="openTool('${t.n}@${t.v}')">
      <td>${TG.cell(t.n+"@"+t.v)}</td><td>${TG.cat(TG.meta(t.n).cat)}</td>
      <td>${riskChip(t.risk)}${effChip(t.eff)}</td><td>${gate}</td>
      <td><span class="chip sq">${esc(t.eg)}</span></td><td>${finChip(t.fin)}</td>
      <td>${origin==="observed"?`<span class="chip c-approve"><span class="dot"></span>observed</span>`
          :origin==="observed_approved"?`<span class="chip c-allow"><span class="dot"></span>observed, approved</span>`
          :`<span class="chip sq out">${esc(origin)}</span>`}</td>
      <td><span class="mono dim" style="font-size:11px">${esc(S.approved[t.n]?"sha256:"+t.n.length.toString(16)+"c4f9…":t.dig)}</span></td>
      <td class="r num">${t.belts}</td><td class="r num">${t.calls30.toLocaleString()}</td>
    </tr>`;}).join("");

  return `<div class="stack">
    ${props.length?`<div class="banner info">
      <span class="chip c-approve" style="flex:none"><span class="dot"></span>${props.length} awaiting approval</span>
      <div class="grow"><b>Three output schemas were observed, not declared.</b>
        The <span class="mono">slack</span> server declares no <span class="mono">outputSchema</span> for these
        tools. The gateway recorded their outputs, inferred a schema, and filed it as a registry proposal.
        Until an admin approves, outputs are validated only for size and type, and every run that used them
        says so in its completeness record.</div>
      <button class="btn" onclick="openDlg('schema')">Review</button></div>`:""}

    <div class="panel"><div class="p-h"><div class="grow"><h2>Tool servers</h2>
      <p>Eight servers, 3,182 tool versions. The registry is the catalog; a belt is what one agent may reach.</p></div>
      <button class="btn sm" onclick="openDlg('import')">Import tools from an MCP server</button></div>
      <div class="p-b tight"><div class="tw"><table>
        <thead><tr><th>Server</th><th>Kind</th><th class="r">Tools</th><th>Health</th>
          <th>Schemas</th><th>Connection</th><th>Last import</th></tr></thead>
        <tbody>${srows}</tbody></table></div></div></div>

    <div class="panel"><div class="p-h"><div class="grow"><h2>Tool versions</h2>
      <p>RBAC reaches the version. A server shipping a new version does not silently widen a belt.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${namesSeg()}<span class="chip sq">${rsel.length} of 3,182 shown</span></div></div>
      <div class="p-b" style="border-bottom:1px solid var(--border)">${TG.chips(rcount,S.regCat,"S.regCat='%s';render()",REGISTRY.length)}</div>
      <div class="p-b tight"><div class="tw"><table>
        <thead><tr><th>Tool version</th><th>Category</th><th>Hazard</th><th>Gate today</th><th>Egress</th><th>Financial</th>
          <th>Schema origin</th><th>Digest</th><th class="r">On belts</th><th class="r">Calls 30d</th></tr></thead>
        <tbody>${trows}</tbody></table></div></div>
      <div class="p-f"><span>A financial tool whose schema does not expose an amount cannot be granted a
        mandate and is denied by construction. The gate shown is today's: the version's own kill switch, then its
        server's, then the mandate rule, then policy v41.</span></div></div>

    <div class="panel"><div class="p-h"><div class="grow"><h2>Tool categories</h2>
      <p>What a tool acts on. Assigned at import from the schema and the server's annotations; an admin can
        reclassify, and the change is a governed action. Orthogonal to hazard (how bad a wrong call is) and to the
        gate (what a belt decided). Ordered least to most consequential.</p></div></div>
      <div class="p-b">${TG.legend()}</div></div>
  </div>`;
}

${esc(x.t)}</pre>`).join("")}</div>

function openMandate(id){ LAST_FOCUS=document.activeElement; DLG={k:"mandate-detail",id}; paintDlg(); }
function openPolicy(v){ LAST_FOCUS=document.activeElement; DLG={k:"policy-detail",v}; paintDlg(); }
function closeDlg(){ DLG=null; paintDlg(); if(LAST_FOCUS&&LAST_FOCUS.focus) LAST_FOCUS.focus(); }

function paintDlg(){
  const root = $("#dlgroot");
  if(!DLG){ root.innerHTML=""; return; }
  root.innerHTML = `<div class="scrim" id="scrim" role="dialog" aria-modal="true">${dlgBody(DLG)}</div>`;
  $("#scrim").addEventListener("mousedown", e=>{ if(e.target.id==="scrim") closeDlg(); });
  const f = root.querySelector("input,button,select,textarea"); if(f) f.focus();
}
function shell(title, sub, body, foot, wide){
  return `<div class="dlg ${wide?"wide":""}">
    <div class="dlg-h"><div class="grow"><h2>${title}</h2><p>${sub}</p></div>
      <button class="x" onclick="closeDlg()" aria-label="Close">✕</button></div>
    <div class="dlg-b">${body}</div>
    <div class="dlg-f">${foot}</div></div>`;
}

function dlgBody(d){
  switch(d.k){

  case "import": return importDlg();

  case "schema": {
    const list = REGISTRY.filter(t=>t.proposal && !S.approved[t.n]);

  <span class="k">"type"</span>: <span class="s">"object"</span>,
  <span class="k">"additionalProperties"</span>: <span class="d">false</span>,
  <span class="k">"required"</span>: [<span class="s">"channels"</span>],
  <span class="k">"properties"</span>: {
    <span class="k">"channels"</span>: { <span class="k">"type"</span>: <span class="s">"array"</span>, <span class="k">"items"</span>: {
      <span class="k">"type"</span>: <span class="s">"object"</span>,

        <span class="k">"name"</span>:       { <span class="k">"type"</span>: <span class="s">"string"</span>, <span class="k">"maxLength"</span>: <span class="n">80</span> },
        <span class="k">"is_private"</span>: { <span class="k">"type"</span>: <span class="s">"boolean"</span> },

  case "kill": {

        <div class="fld"><label for="killwhy">Reason — recorded on every denied call and read by the model</label>

        <dl class="kv">
          <dt>Takes effect</dt><dd>next call boundary · deny generation bumps ${S.denyGen} → ${S.denyGen+1}</dd>

      `<span class="grow">${turningOn?"You can clear this switch at any time. Nothing is destroyed.":""}</span>
       <button class="btn" onclick="closeDlg()">Cancel</button>
       <button class="btn ${turningOn?"danger":"primary"}" onclick="doFlip('${d.id}')">
         ${turningOn?"Deny now":"Allow again"}</button>`);
  }

  case "toolcats":
    return shell("Tool categories", "A category says what a tool acts on. It is orthogonal to hazard and to the gate.",

      `<span class="grow" style="font-size:12.5px;color:var(--muted)">Category is a registry attribute, not a policy: a rule may reference it, but only risk, side effect, financial effect and egress carry a decision by themselves.</span><button class="btn" onclick="closeDlg()">Close</button>`, true);
  case "tool": {
    const t = REGISTRY.find(x=>`${x.n}@${x.v}`===d.id) || BELT.find(x=>`${x.n}@${x.v}`===d.id);

          <dt>Credential</dt><dd class="mono">${esc(t.cred||"minted by the broker per call")}<span class="sub">The agent never sees it.</span></dd>
          <dt>Price</dt><dd>${t.price!==undefined?money(t.price,"per call, from the price book"):"not priced"}</dd>

          ${t.rule?`<dt>Rule that decides</dt><dd class="mono">${esc(t.rule)}</dd>`:""}
          ${t.note?`<dt>Note</dt><dd>${esc(t.note)}</dd>`:""}
          ${fin?`<dt>amount_path</dt><dd class="mono">${esc(t.amount)}</dd>
                 <dt>currency_path</dt><dd class="mono">${esc(t.currency)}</dd>

        </dl>
        ${fin?`<div class="note deny"><b>Financial tool.</b> The amount is read from the call by
          <span class="mono">${esc(t.amount)}</span>, never from prose. A call without a mandate is denied

        <p class="eyebrow" style="margin:4px 0 0">Input schema</p>

  <span class="k">"$schema"</span>: <span class="s">"https://json-schema.org/draft/2020-12/schema"</span>,
  <span class="k">"type"</span>: <span class="s">"object"</span>,
  <span class="k">"additionalProperties"</span>: <span class="d">false</span>,
  <span class="k">"required"</span>: ${fin?`[<span class="s">"amount"</span>, <span class="s">"currency"</span>, <span class="s">"recipient"</span>, <span class="s">"idempotency_key"</span>]`:`[<span class="s">"repository"</span>, <span class="s">"head"</span>, <span class="s">"base"</span>, <span class="s">"title"</span>]`},

${fin?`    <span class="k">"amount"</span>:          { <span class="k">"type"</span>: <span class="s">"integer"</span>, <span class="k">"minimum"</span>: <span class="n">1</span>, <span class="k">"description"</span>: <span class="s">"minor units"</span> },

    <span class="k">"idempotency_key"</span>: { <span class="k">"type"</span>: <span class="s">"string"</span>, <span class="k">"maxLength"</span>: <span class="n">255</span> }`
:`    <span class="k">"repository"</span>: { <span class="k">"type"</span>: <span class="s">"string"</span>, <span class="k">"pattern"</span>: <span class="s">"^[\\\\w.-]+/[\\\\w.-]+$"</span> },
    <span class="k">"head"</span>:       { <span class="k">"type"</span>: <span class="s">"string"</span>, <span class="k">"maxLength"</span>: <span class="n">255</span> },

  case "conn": {

              <span class="k">"per_period_micros"</span>: <span class="n">${(parseFloat(m.perPeriod)*1e6).toFixed(0)}</span>,
              <span class="k">"period"</span>: <span class="s">"${esc(m.period)}"</span>, <span class="k">"calls_per_day"</span>: <span class="n">${m.callsDay}</span> },
  <span class="k">"counterparties"</span>: { <span class="k">"allow"</span>: [${m.allow.map(x=>`<span class="s">"${esc(x)}"</span>`).join(", ")}], <span class="k">"deny"</span>: [<span class="s">"*"</span>] },
  <span class="k">"tools"</span>: [${m.tools.map(x=>`<span class="s">"${esc(x)}"</span>`).join(", ")}],
  <span class="k">"approval"</span>: { <span class="k">"above_micros"</span>: <span class="n">${(parseFloat(m.above)*1e6).toFixed(0)}</span>,
                <span class="k">"always_for"</span>: [${m.always.map(x=>`<span class="s">"${esc(x)}"</span>`).join(", ")}],
                <span class="k">"approvers"</span>: [${m.approvers.map(x=>`<span class="s">"${esc(x)}"</span>`).join(", ")}] },
  <span class="k">"purpose"</span>: <span class="s">"${esc(m.purpose)}"</span>,

  }

  case "register": return shell("Register an agent",

          <option>claude-agent-sdk</option><option>custom</option></select></div>

acme/platform <span class="k">#2841</span>  <span class="s">"Register agent: changelog-writer"</span>

  case "wrap": return shell("Wrap a harness",

function approveSchema(n){
  S.approved[n] = true;
  S.proposals = REGISTRY.filter(t=>t.proposal && !S.approved[t.n]).length;
  closeDlg(); render();
}
function flip(id){ LAST_FOCUS=document.activeElement; DLG={k:"kill",id}; paintDlg(); }
function doFlip(id){
  const s = SWITCHES.find(x=>x.id===id);
  const on = !S.switches[id];
  S.switches[id] = on;
  S.denyGen += 1;
  S.killBanner = on ? `<div class="banner crit">
      <span class="chip c-deny" style="flex:none"><span class="dot"></span>switch flipped</span>
      <div class="grow"><b>${esc(s.target)} is denied, organization-wide.</b>
        ${esc(s.stops)}. Every affected call fails closed at its next boundary; the frame names this switch and
        the reason. Deny generation is now <span class="mono">${S.denyGen}</span>.</div>
      <button class="btn" onclick="flip('${id}')">Clear it</button></div>`
    : null;
  closeDlg(); render();
}
let SIM_T = null;
function runSim(){
  if(S.simRunning) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.simRunning = true; S.simRan = false; render();
  clearTimeout(SIM_T);
  SIM_T = setTimeout(()=>{ S.simRunning=false; S.simRan=true; render(); }, reduce?0:1300);
}

  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
  document.documentElement.setAttribute("data-theme", next);
};
$("#hamb").onclick = ()=>document.body.classList.toggle("navopen");
$("#scrimnav").onclick = ()=>document.body.classList.remove("navopen");
$("#orgsw").onclick = ()=>alert("Organization switcher. Acme Robotics is the only organization on this account. An organization is the tenant and the hard isolation boundary: its own Neo4j database, its own key-encryption key, its own Postgres partition.");
$("#wssw").onclick = ()=>{
  const r = parse();
  const next = r.ws==="core-platform" ? "finops" : "core-platform";
  go(`${r.org}/${next}/${r.page==="agents"?"agents":r.page}`);
};

if(!location.hash) location.hash = "#/acme/core-platform/agents";
render();

<!-- list-controls: search · sort · column filters · rows per page · pager -->
<style>
/* List controls: search, column filters, rows per page, sortable headers, pager.
   Colors derive from the page's own text color so the block reads correctly in
   every mockup theme; only the accent leans on --gold. */
.lt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));font-family:inherit;font-size:12.5px}
.lt.free{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:10px;margin-bottom:10px}
.lt .lt-q{flex:1 1 200px;min-width:140px;background:color-mix(in srgb,currentColor 5%,transparent);border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:8px;padding:6px 10px;font-size:12.5px;color:inherit;outline:none;font-family:inherit;transition:border-color .12s}
.lt .lt-q:focus{border-color:var(--gold,#D6962C)}
.lt .lt-q::placeholder{color:inherit;opacity:.5}
.lt select{appearance:auto;background:color-mix(in srgb,currentColor 5%,transparent);border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:8px;padding:5px 8px;font-size:12px;color:inherit;outline:none;font-family:inherit;max-width:220px;transition:border-color .12s}
.lt select:focus{border-color:var(--gold,#D6962C)}
.lt .lt-rows{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted,inherit);white-space:nowrap;margin-left:auto}
.lp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;font-size:11.5px;color:var(--muted,inherit);font-family:inherit}
.lp.free{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));border-radius:10px;margin-top:10px}
.lp .lp-n{font-family:var(--mono,ui-monospace,monospace);font-variant-numeric:tabular-nums;opacity:.85}
.lp .lp-pg{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lp .lp-b{border:1px solid var(--border,color-mix(in srgb,currentColor 16%,transparent));background:color-mix(in srgb,currentColor 5%,transparent);color:inherit;border-radius:7px;padding:2px 8px;min-width:28px;font-size:12px;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.5;transition:border-color .12s}
.lp .lp-b:hover{border-color:color-mix(in srgb,currentColor 35%,transparent)}
.lp .lp-b[aria-current="page"]{border-color:var(--gold,#D6962C);color:var(--gold,#D6962C)}
.lp .lp-b:disabled{opacity:.4;cursor:default}
.lp .lp-pg .el{padding:0 4px;opacity:.6}
th.sortable{cursor:pointer;user-select:none}
th.sortable::after{content:"↕";margin-left:5px;opacity:.35;font-size:10px}
th.sortable[aria-sort="ascending"]::after{content:"↑";color:var(--gold,#D6962C);opacity:1}
th.sortable[aria-sort="descending"]::after{content:"↓";color:var(--gold,#D6962C);opacity:1}
.lt-empty td{opacity:.6;text-align:center;padding:18px}
@media (max-width:520px){.lt .lt-q{flex-basis:100%}.lt .lt-rows{margin-left:0}}
</style>
<script>
/* ============================== List controls ============================== */
/* Self-contained: every table with a thead gets a search box, sortable column
   headers, a filter select for each column that is a small enumeration, a
   rows-per-page select and a pager. Installs itself through a DOM observer so
   it works with any render path; state is keyed by page + column signature so
   a full re-render lands back on the same page, sort and query. */
(function(){
"use strict";
if(window.__ltInstalled)return; window.__ltInstalled=true;
var STORE={}, PER=[5,10,25,50,0], BUSY=false, TIMER=null;
var FACET=/status|state|tier|kind|role|risk|severity|result|health|effect|mode|side|level|verdict|decision|origin|scope|period|basis|algorithm|trend|position|governance|two-factor|sso|replay|grade|outcome/i;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(s){
  s=String(s==null?"":s).trim();
  if(!s||/^\d{4}-\d{2}/.test(s))return null;
  var c=s.replace(/[$,%×]/g,""), m=c.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);
  if(!m)return null;
  var n=parseFloat(m[0]), u=c.slice(m[0].length).match(/^\s*([kKMB])(?![A-Za-z])/);
  if(u){ if(u[1]==="k"||u[1]==="K")n*=1e3; else if(u[1]==="M")n*=1e6; else n*=1e9; }
  return n;
}
function cmp(a,b,isNum,dir){
  if(isNum){var x=a.n,y=b.n; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; if(x!==y)return (x-y)*dir;}
  return a.t.localeCompare(b.t,undefined,{numeric:true,sensitivity:"base"})*dir;
}
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function pageCtx(){var h1=document.querySelector("main h1, .page h1, h1"); return location.hash+"|"+(h1?h1.textContent.trim().slice(0,40):"");}
function state(sig,ord){var key=pageCtx()+"|"+sig+"#"+ord; return STORE[key]||(STORE[key]={q:"",sort:null,dir:1,per:10,page:1,f:{}});}

function pager(st,total,onPage){
  var per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  var from=total?((st.page-1)*per+1):0, to=Math.min(total,st.page*per);
  var html='<div class="lp"><span class="lp-n">'+(total?from+'–'+to+' of '+total:'0 of 0')+'</span><span class="lp-pg">'+
   '<button type="button" class="lp-b" data-p="prev" aria-label="Previous page"'+(st.page<=1?' disabled':'')+'>‹</button>';
  var nums=[]; if(pages<=7){for(var i=1;i<=pages;i++)nums.push(i);} else {
    nums=[1]; var lo=Math.max(2,st.page-1), hi=Math.min(pages-1,st.page+1);
    if(lo>2)nums.push("…"); for(var j=lo;j<=hi;j++)nums.push(j); if(hi<pages-1)nums.push("…"); nums.push(pages);}
  nums.forEach(function(p){html+= p==="…"?'<span class="el">…</span>':'<button type="button" class="lp-b" data-p="'+p+'"'+(p===st.page?' aria-current="page"':'')+'>'+p+'</button>';});
  html+='<button type="button" class="lp-b" data-p="next" aria-label="Next page"'+(st.page>=pages?' disabled':'')+'>›</button></span></div>';
  var lp=el(html);
  lp.addEventListener("click",function(e){var b=e.target.closest("button[data-p]"); if(!b||b.disabled)return; e.stopPropagation(); var p=b.getAttribute("data-p");
    st.page = p==="prev"?st.page-1 : p==="next"?st.page+1 : +p; onPage();});
  return lp;
}
function bar(st,opts,apply){
  var html='<div class="lt"><input class="lt-q" type="search" placeholder="'+esc(opts.ph)+'" aria-label="'+esc(opts.ph)+'" value="'+esc(st.q)+'">';
  (opts.filters||[]).forEach(function(f){
    html+='<select class="lt-f" data-k="'+esc(f.key)+'" aria-label="Filter by '+esc(f.label)+'"><option value="">All · '+esc(f.label)+'</option>'+
      f.values.map(function(v){return '<option value="'+esc(v)+'"'+(st.f[f.key]===v?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';});
  html+='<label class="lt-rows">Rows<select class="lt-per">'+PER.map(function(p){return '<option value="'+p+'"'+(st.per===p?' selected':'')+'>'+(p||"All")+'</option>';}).join("")+'</select></label></div>';
  var b=el(html);
  b.addEventListener("click",function(e){e.stopPropagation();});
  b.querySelector(".lt-q").addEventListener("input",function(e){st.q=e.target.value;st.page=1;apply();});
  b.querySelectorAll(".lt-f").forEach(function(s){s.addEventListener("change",function(e){st.f[s.getAttribute("data-k")]=e.target.value;st.page=1;apply();});});
  b.querySelector(".lt-per").addEventListener("change",function(e){st.per=+e.target.value;st.page=1;apply();});
  return b;
}
/* A column earns a filter when it is a small enumeration: 2–8 distinct short
   values across at least 4 rows, and not unique per row. At most three per list. */
function facets(cols,vals,rows){
  if(rows<4)return [];
  var c=cols.filter(function(col){ if(!col.name||col.num)return false;
    var set={},n=0,ok=true; vals.forEach(function(v){var t=v[col.i].t; if(!t)return; if(t.length>28)ok=false; if(!set[t]){set[t]=1;n++;}});
    if(!ok||n<2||n>8||n>=rows)return false; col.values=Object.keys(set).sort(); return true;});
  c.sort(function(a,b){var pa=FACET.test(a.name)?0:1,pb=FACET.test(b.name)?0:1; return pa-pb||a.values.length-b.values.length;});
  return c.slice(0,3).map(function(col){return {key:String(col.i),label:col.name,values:col.values};});
}
function sigOf(table){return [].slice.call(table.tHead.rows[0].cells).map(function(c){return c.textContent.trim();}).join("/");}
function enhance(table,ord){
  var tbody=table.tBodies[0], rows=[].slice.call(tbody.rows);
  var ths=[].slice.call(table.tHead.rows[0].cells);
  var cols=ths.map(function(th,i){return {i:i,name:th.textContent.trim(),num:th.classList.contains("num")};});
  var st=state(sigOf(table),ord);
  var vals=rows.map(function(r){return cols.map(function(c){var cell=r.cells[c.i]; var t=cell?cell.textContent.replace(/\s+/g," ").trim():""; return {t:t,n:num(t)};});});
  cols.forEach(function(c){ if(c.num)return; var k=0,tot=0; vals.forEach(function(v){if(v[c.i].t){tot++; if(v[c.i].n!=null)k++;}}); if(tot&&k/tot>=.6)c.num=true; });
  var texts=rows.map(function(r){return r.textContent.replace(/\s+/g," ").toLowerCase();});
  var fs=facets(cols,vals,rows.length);
  var wrap=table.parentNode, host=wrap.parentNode, ph="Search this list";
  if(!host||wrap===document.body){wrap=table;host=table.parentNode;}
  /* A lone search box sitting directly above the table becomes the list's search. */
  var prev=wrap.previousElementSibling;
  if(prev&&!prev.matches("table,thead,tbody")){
    var ins=prev.querySelectorAll("input,select,button,a,textarea");
    var inp=prev.matches("input")?prev:prev.querySelector("input[placeholder^='Search']");
    if(inp&&inp.placeholder&&/^Search/.test(inp.placeholder)&&ins.length<=1&&!prev.textContent.trim()){ph=inp.placeholder;prev.remove();}
  }
  var free=!/panel|card|box/.test(host.className||"");
  var b=bar(st,{ph:ph,filters:fs},apply), lp=document.createElement("div");
  if(free)b.classList.add("free");
  host.insertBefore(b,wrap); host.insertBefore(lp,wrap.nextSibling);
  ths.forEach(function(th,i){ if(!cols[i].name)return; th.classList.add("sortable"); th.tabIndex=0; th.setAttribute("role","button");
    function tog(e){ if(e)e.stopPropagation(); if(st.sort===i){ if(st.dir===1)st.dir=-1; else {st.sort=null;st.dir=1;} } else {st.sort=i;st.dir=1;} st.page=1; apply(); }
    th.addEventListener("click",tog); th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog(e);}}); });
  function apply(){
    ths.forEach(function(th,i){ if(!cols[i].name)return; th.setAttribute("aria-sort",st.sort===i?(st.dir===1?"ascending":"descending"):"none"); });
    var q=st.q.trim().toLowerCase();
    var idx=rows.map(function(_,i){return i;}).filter(function(i){
      if(q&&texts[i].indexOf(q)<0)return false;
      for(var k in st.f){ if(st.f[k]&&vals[i][+k]&&vals[i][+k].t!==st.f[k])return false; } return true; });
    if(st.sort!=null&&cols[st.sort]){var c=cols[st.sort]; idx.sort(function(a,b){return cmp(vals[a][c.i],vals[b][c.i],c.num,st.dir)||(a-b);});}
    var total=idx.length, per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per)); if(st.page>pages)st.page=pages;
    var slice=st.per?idx.slice((st.page-1)*st.per,st.page*st.per):idx;
    BUSY=true;
    while(tbody.firstChild)tbody.removeChild(tbody.firstChild);
    if(!slice.length){var tr=document.createElement("tr"),td=document.createElement("td");tr.className="lt-empty";td.colSpan=cols.length;td.textContent="No rows match.";tr.appendChild(td);tbody.appendChild(tr);}
    slice.forEach(function(i){tbody.appendChild(rows[i]);});
    var nlp=pager(st,total,apply); lp.replaceWith(nlp); lp=nlp; if(free)lp.classList.add("free");
    BUSY=false;
  }
  apply();
}
function run(){
  BUSY=true;
  try{
    var ords={};
    [].slice.call(document.querySelectorAll("table")).forEach(function(t){
      if(!t.tHead||!t.tHead.rows[0]||!t.tBodies[0]||t.closest("[data-lt-skip]"))return;
      if([].slice.call(t.tHead.rows[0].cells).some(function(c){return c.colSpan>1;}))return;
      var sig=sigOf(t), ord=ords[sig]||0; ords[sig]=ord+1;
      if(t.getAttribute("data-lt"))return;
      t.setAttribute("data-lt","1"); enhance(t,ord);
    });
  } finally { BUSY=false; }
}
new MutationObserver(function(muts){
  if(BUSY)return;
  for(var i=0;i<muts.length;i++){ if(muts[i].addedNodes.length){ clearTimeout(TIMER); TIMER=setTimeout(run,0); return; } }
}).observe(document.documentElement,{childList:true,subtree:true});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run); else run();
window.listify=run;
})();
</script>
