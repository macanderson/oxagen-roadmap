<title>The Ten Pages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>

:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C; --border:#292722; --rule:#34322D;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A; --accent-text:#D6962C;
  --on-gold:#10100F;
  --st-allowed:#57A97C; --st-approval:#5B93D6; --st-denied:#C66A4A;
  --st-proven:#3FA2A2; --st-failed:#C0453C; --st-critical:#D6455E; --st-observe:#9B958A;
  --k-rule:#9D8BE3;
  --fk-model:#3987E5; --fk-tool:#D95926; --fk-gov:#199E70; --fk-ctx:#9085E9; --fk-op:#D55181; --k-constraint:#D677B5; --k-procedure:#A6B95E; --k-fact:#5CB5D6; --k-memory:#94A3C2; --k-preference:#D08FA0;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 44px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --side-w:236px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --st-allowed:#2F7D52; --st-approval:#2E6BA8; --st-denied:#9B4526;
  --st-proven:#1F7676; --st-failed:#992F28; --st-critical:#AE2540; --st-observe:#6B665C;
  --k-rule:#5D4AB5;
  --fk-model:#2A78D6; --fk-tool:#EB6834; --fk-gov:#1BAF7A; --fk-ctx:#4A3AA7; --fk-op:#E87BA4; --k-constraint:#A0397F; --k-procedure:#5F7A1F; --k-fact:#1E7392; --k-memory:#4E6280; --k-preference:#98485E;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 2px rgba(16,16,15,.06);
}}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --st-allowed:#2F7D52; --st-approval:#2E6BA8; --st-denied:#9B4526;
  --st-proven:#1F7676; --st-failed:#992F28; --st-critical:#AE2540; --st-observe:#6B665C;
  --k-rule:#5D4AB5;
  --fk-model:#2A78D6; --fk-tool:#EB6834; --fk-gov:#1BAF7A; --fk-ctx:#4A3AA7; --fk-op:#E87BA4; --k-constraint:#A0397F; --k-procedure:#5F7A1F; --k-fact:#1E7392; --k-memory:#4E6280; --k-preference:#98485E;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 2px rgba(16,16,15,.06);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono);font-size:.92em}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);font-weight:600;margin:0 0 10px}
.eyebrow.q{color:var(--muted)}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em}
h1{font-size:24px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
h4{font-size:13px;font-weight:600}
p{margin:0 0 10px;color:var(--body)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
#viewport{min-height:100vh;background:var(--ink)}
#viewport.phone{max-width:400px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);min-height:100vh}
.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
#viewport.phone .app{grid-template-columns:minmax(0,1fr)}

/* ---------- sidebar ---------- */
.side{background:var(--void);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:55}
#viewport.phone .side{display:none}
#viewport.phone .side.open{display:flex;position:fixed;z-index:80;width:250px;height:100vh;box-shadow:var(--shadow)}
.side-top{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.brandmark{display:flex;align-items:center;gap:9px;color:var(--fg);margin-bottom:14px}
.brandmark svg{height:22px;width:auto;display:block}
.switcher{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:left;display:flex;align-items:center;gap:9px;margin-bottom:7px;transition:border-color .15s}
.switcher:hover{border-color:var(--rule)}
.switcher .av{width:24px;height:24px;border-radius:6px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.switcher .av.ws{background:var(--hl);color:var(--fg);border:1px solid var(--rule);font-family:var(--mono)}
.switcher .tx{min-width:0;flex:1}
.switcher .tx b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher .tx span{display:block;font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.switcher .cv{color:var(--dim);font-size:10px;flex:none}
.side nav{padding:12px 10px;flex:1}
.navlabel{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:12px 8px 6px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:8px;border:0;background:none;color:var(--muted);font-size:13.5px;font-weight:500;text-align:left;margin-bottom:1px;transition:background .13s,color .13s}
.navitem:hover{background:var(--hl);color:var(--fg)}
.navitem[aria-current="page"]{background:var(--hl);color:var(--fg);box-shadow:inset 2px 0 0 var(--gold)}
.navitem .ic{width:16px;flex:none;display:grid;place-items:center;opacity:.85}
.navitem .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.navitem .ct.hot{color:var(--st-approval);border-color:color-mix(in srgb,var(--st-approval) 40%,transparent)}
.side-foot{padding:10px;border-top:1px solid var(--border)}

/* ---------- topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--dim)}
.crumbs b{color:var(--fg);font-weight:600}
.top .sp{margin-left:auto}
.kbtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:6px 10px;color:var(--muted);font-size:12.5px;min-width:190px;transition:border-color .15s}
.kbtn:hover{border-color:var(--rule);color:var(--fg)}
.kbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--hl);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--dim)}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);display:grid;place-items:center;position:relative;transition:border-color .15s,color .15s}
.iconbtn:hover{border-color:var(--rule);color:var(--fg)}
.iconbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.iconbtn .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--st-approval)}
.hamburger{display:none}
#viewport.phone .hamburger{display:grid}

/* ---------- page body ---------- */
.page{padding:22px 24px 80px;max-width:1500px;width:100%}
#viewport.phone .page{padding:16px}
.phead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.phead .t{min-width:0}
.phead h1{margin-bottom:4px}
.phead p{margin:0;font-size:13px;color:var(--muted);max-width:70ch}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#viewport.phone .phead .acts{margin-left:0;width:100%}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--rule);background:var(--hl)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.primary:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--st-failed);border-color:color-mix(in srgb,var(--st-failed) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--st-failed) 12%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none}
.btn.sel{background:var(--hl);border-color:var(--rule);color:var(--fg);font-weight:600}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.panel.pad{padding:16px 18px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:13.5px}
.panel-h .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0}
.panel-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.grid>*,.split>*,.panel,.panel-b,.tw,.main,.stat,.act-card{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:minmax(0,1fr)}}
#viewport.phone .split{grid-template-columns:minmax(0,1fr)}

/* ---------- stat ---------- */
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.stat .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;display:block;margin-bottom:5px}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.stat .s{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}
.stat .s .basis{font-family:var(--mono);font-size:10.5px;color:var(--dim)}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5}
.b .d{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-allowed{color:var(--st-allowed);border-color:color-mix(in srgb,var(--st-allowed) 42%,transparent);background:color-mix(in srgb,var(--st-allowed) 11%,transparent)}
.b-approval{color:var(--st-approval);border-color:color-mix(in srgb,var(--st-approval) 42%,transparent);background:color-mix(in srgb,var(--st-approval) 11%,transparent)}
.b-denied{color:var(--st-denied);border-color:color-mix(in srgb,var(--st-denied) 42%,transparent);background:color-mix(in srgb,var(--st-denied) 11%,transparent)}
.b-proven{color:var(--st-proven);border-color:color-mix(in srgb,var(--st-proven) 42%,transparent);background:color-mix(in srgb,var(--st-proven) 11%,transparent)}
.b-failed{color:var(--st-failed);border-color:color-mix(in srgb,var(--st-failed) 42%,transparent);background:color-mix(in srgb,var(--st-failed) 11%,transparent)}
.b-critical{color:var(--st-critical);border-color:color-mix(in srgb,var(--st-critical) 42%,transparent);background:color-mix(in srgb,var(--st-critical) 12%,transparent)}
.b-q{color:var(--muted);border-color:var(--border);background:var(--hl)}
.b-tier{font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:lowercase}
/* Context records. The statement is the record; kind is the second thing you see.
   Structural rule: an icon badge is a KIND, a dot badge is a STATE. Kind hues never reuse a state hue and never use gold. */
.k-rule{--kc:var(--k-rule)} .k-constraint{--kc:var(--k-constraint)} .k-procedure{--kc:var(--k-procedure)}
.k-fact{--kc:var(--k-fact)} .k-memory{--kc:var(--k-memory)} .k-preference{--kc:var(--k-preference)}
.kb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5;color:var(--kc);border-color:color-mix(in srgb,var(--kc) 45%,transparent);background:color-mix(in srgb,var(--kc) 12%,transparent)}
.kb svg{width:12px;height:12px}
.kg{display:inline-grid;place-items:center;width:16px;height:16px;vertical-align:-3px;margin-right:6px;color:var(--kc)}
.kg svg{width:12px;height:12px}
.recs{display:grid;gap:0}
.rec{display:grid;grid-template-columns:auto 1fr;gap:0 14px;padding:14px 16px 14px 13px;border-top:1px solid var(--border);border-left:3px solid var(--kc);min-width:0}
.rec:first-child{border-top:0}
.rec.archived{opacity:.6}
.rec .kt{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);border:1px solid color-mix(in srgb,var(--kc) 32%,transparent)}
.rec .kt svg{width:17px;height:17px}
.rec .rm{min-width:0}
.rec .r-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.rec .r-top .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.rec .r-st{font-size:15px;line-height:1.45;color:var(--fg);font-weight:500;margin:0;max-width:78ch;overflow-wrap:anywhere}
.rec .r-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:11.5px;color:var(--dim)}
.rec .r-meta .mono{font-size:11px}
.rec .r-meta b{font-weight:600;color:var(--muted)}
.kf{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border)}
.kf .btn svg{width:12px;height:12px;color:var(--kc)}
.kf .btn[aria-pressed="true"]{background:var(--hl);border-color:var(--rule);color:var(--fg)}
@media (max-width:640px){.rec{grid-template-columns:1fr}.rec .kt{display:none}.rec .r-top .sp{margin-left:0}}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;color:var(--muted);padding:8px 13px;font-size:13px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;transition:color .13s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.tab .n{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:5px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.narrow{min-width:0}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;white-space:nowrap;background:var(--panel);position:sticky;top:0}
tbody tr{transition:background .12s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hl)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tid{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tkey{font-family:var(--mono);font-size:12px;color:var(--fg)}

/* ---------- tools ----------
   Three orthogonal axes, three visual grammars, never mixed:
     category = what the tool ACTS ON   → monochrome icon badge; the Lucide glyph carries the category, the fill is the house neutral scale (never gold, never a state hue)
     hazard   = how bad a wrong call is → risk mark (circle · diamond · triangle · filled triangle) + side-effect glyph, in state hues
     gate     = what the belt decided   → dot-style badge; a dashed border means a person still stands in the way */
/* .t-<cat> stays on the markup as a hook for tests and filters; it no longer sets a colour */
.tc{display:inline-grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;min-width:0;max-width:100%;text-align:left;vertical-align:middle}
.tc .ti{grid-row:1/3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--fg);background:var(--hl);border:1px solid var(--border)}
.tc .ti svg{width:15px;height:15px}
.tc .tl{font-weight:600;font-size:13px;color:var(--fg);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tc .ta{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tc .ta .v{color:var(--dim)}
.tw .tc:not(.sm){min-width:220px}
.tc.sm{column-gap:8px}.tc.sm .ti{width:22px;height:22px;border-radius:6px}.tc.sm .ti svg{width:12px;height:12px}.tc.sm .tl{font-size:12.5px}.tc.sm .ta{font-size:10.5px}
.tc.lg{column-gap:12px}.tc.lg .ti{width:42px;height:42px;border-radius:11px}.tc.lg .ti svg{width:21px;height:21px}.tc.lg .tl{font-size:18px;letter-spacing:-.015em}.tc.lg .ta{font-size:12px}
.tc.api .tl{font-family:var(--mono);font-weight:500;font-size:12.5px}.tc.api .ta{font-family:var(--font);font-weight:500}
.tc.lg.api .tl{font-size:15px}
.tcb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5;color:var(--body);border-color:var(--rule);background:var(--hl)}
.tcb svg{width:12px;height:12px;flex:none}
.hz{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5;letter-spacing:.02em}
.hz svg{width:14px;height:14px;flex:none}
.hz+.hz{margin-left:10px}
.hz-low{color:var(--muted)} .hz-medium{color:var(--st-approval)} .hz-high{color:var(--st-denied)} .hz-critical{color:var(--st-critical)}
.he-read{color:var(--muted)} .he-write{color:var(--st-approval)} .he-irreversible{color:var(--st-denied)}
.gt{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5}
.gt svg{width:12px;height:12px;flex:none}
.gt-allow{color:var(--st-allowed);border-color:color-mix(in srgb,var(--st-allowed) 42%,transparent);background:color-mix(in srgb,var(--st-allowed) 11%,transparent)}
.gt-require_approval,.gt-mandate{color:var(--st-approval);border-style:dashed;border-color:color-mix(in srgb,var(--st-approval) 65%,transparent);background:color-mix(in srgb,var(--st-approval) 11%,transparent)}
.gt-deny{color:var(--st-denied);border-color:color-mix(in srgb,var(--st-denied) 42%,transparent);background:color-mix(in srgb,var(--st-denied) 11%,transparent)}
.gt-killed{color:var(--st-critical);border-color:color-mix(in srgb,var(--st-critical) 65%,transparent);background:color-mix(in srgb,var(--st-critical) 14%,transparent)}
tr.hz-row-critical>td:first-child{box-shadow:inset 3px 0 0 var(--st-critical)}
tr.hz-row-high>td:first-child{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--st-denied) 65%,transparent)}
tr.tgrp td{background:var(--hl);padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
tr.tgrp .ti{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;vertical-align:middle;margin-right:9px;color:var(--fg);background:var(--ink);border:1px solid var(--rule)}
tr.tgrp .ti svg{width:12px;height:12px}
tr.tgrp b{font-size:12.5px;margin-right:9px;color:var(--fg)}
tr.tgrp .muted{font-size:11.5px}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--void)}
.seg .btn{border-color:transparent;background:transparent}
.seg .btn[aria-pressed="true"],.tcs .btn[aria-pressed="true"]{background:var(--hl);border-color:var(--rule);color:var(--fg)}
.tcs .btn svg{width:12px;height:12px;color:var(--muted)} .tcs .btn[aria-pressed="true"] svg{color:var(--fg)}
.tleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tleg .c{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--void);min-width:0}
.tleg .ti{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--fg);background:var(--hl);border:1px solid var(--border)}
.tleg .ti svg{width:17px;height:17px}
.tleg .l{font-weight:600;font-size:13px;color:var(--fg)} .tleg .s{font-size:12px;color:var(--muted);margin-top:2px} .tleg .eg{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px;word-break:break-word}
.axes{display:grid;gap:8px;font-size:12px}
.axes>div{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.axes .k{min-width:96px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
#viewport.phone .tleg,#layer.phone .tleg{grid-template-columns:1fr}
#viewport.phone .tc .tl,#viewport.phone .tc .ta{white-space:normal}

/* ---------- code ---------- */
pre{background:var(--void);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow-x:auto;font-size:12px;line-height:1.55;color:var(--body);font-family:var(--mono);margin:0}
pre .c{color:var(--dim)}
pre .k{color:var(--gold)}
pre .s{color:var(--st-allowed)}
code{font-family:var(--mono);font-size:.9em;background:var(--hl);padding:.12em .38em;border-radius:4px}

/* ---------- misc ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--dim);white-space:nowrap}
.kv dd{margin:0;color:var(--body);min-width:0;overflow-wrap:anywhere}
.hr{height:1px;background:var(--border);margin:14px 0;border:0}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chain{display:grid;gap:0;margin:0;padding:0;list-style:none}
.chain li{position:relative;padding:0 0 14px 22px;border-left:1px solid var(--rule);margin-left:5px}
.chain li:last-child{border-left-color:transparent;padding-bottom:0}
.chain li::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--rule)}
.chain li.on::before{border-color:var(--gold);background:var(--gold)}
.chain .h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.bar{height:7px;border-radius:4px;background:var(--hl);overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--st-allowed)}
.meter{display:grid;gap:5px}
.meter .lab{display:flex;font-size:11.5px;color:var(--muted)}
.meter .lab b{margin-left:auto;color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.note{border-left:2px solid var(--gold);padding:2px 0 2px 12px;font-size:12.5px;color:var(--muted)}
.warn{border:1px solid color-mix(in srgb,var(--st-critical) 45%,transparent);background:color-mix(in srgb,var(--st-critical) 9%,transparent);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--body)}
.warn b{color:var(--st-critical)}
.sub{display:block;font-size:11px;color:var(--dim);margin-top:2px;font-weight:400;white-space:normal}
.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:10px;font-size:12.5px;border:1px solid var(--border);background:var(--hl);color:var(--body);flex-wrap:wrap}
.banner b{display:block;color:var(--fg);margin-bottom:2px}
.banner .grow{flex:1;min-width:24ch}

/* ---------- context window ---------- */
.compbar{display:flex;height:30px;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--hl)}
.compbar button{border:0;padding:0;min-width:3px;position:relative;transition:filter .13s}
.compbar button:hover{filter:brightness(1.25)}
.compbar button[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.compbar button .lb{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--on-gold);font-weight:700;opacity:.82;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:5px 15px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{font-family:var(--mono);font-size:10.5px;color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.stack{padding:7px;max-height:560px;overflow-y:auto}
.ctxi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:var(--muted);text-align:left;padding:7px 9px;border-radius:8px;font-size:12.5px;font-weight:500;transition:background .13s,color .13s}
.ctxi:hover{background:var(--hl);color:var(--fg)}
.ctxi[aria-current="true"]{background:var(--hl);color:var(--fg);box-shadow:inset 2px 0 0 var(--gold)}
.ctxi .sw{width:8px;height:8px;border-radius:2px;flex:none}
.ctxi .nm{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxi .tk{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.ctxi.sub{padding-left:22px;font-size:12px}
.ctxi.sub .nm{font-family:var(--mono);font-size:11.5px}
.ctxi.off .nm{text-decoration:line-through;text-decoration-color:var(--dim)}
.ctxg{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:12px 9px 5px;display:flex;gap:8px;align-items:center}
.ctxg .n{margin-left:auto;font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctxd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.readout{background:var(--void);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:11px 0}
.readout .rh{padding:7px 12px;border-bottom:1px solid var(--border);background:var(--hl);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:flex;gap:9px;align-items:center}
.readout .rh .sp{margin-left:auto;text-transform:none;letter-spacing:0}
.readout pre{border:0;border-radius:0;background:none}
.readout .rb{padding:12px 14px;font-size:12.5px;color:var(--body)}

/* ---------- state surfaces ---------- */
.state-wrap{display:grid;place-items:center;padding:60px 20px;text-align:center}
.state-wrap .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border);background:var(--panel);margin-bottom:14px}
.state-wrap h2{margin-bottom:7px}
.state-wrap p{max-width:52ch;margin:0 auto 16px;color:var(--muted);font-size:13px}
.state-wrap .acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.sk{background:linear-gradient(90deg,var(--hl) 25%,var(--panel) 50%,var(--hl) 75%);background-size:220% 100%;animation:shim 1.5s linear infinite;border-radius:6px;height:11px}
@keyframes shim{0%{background-position:130% 0}100%{background-position:-30% 0}}
.sk.t{height:22px;border-radius:7px}
.sk.b{height:64px;border-radius:11px}
.sk.r{height:38px;border-radius:9px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--st-allowed)}
.live .p{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

/* ---------- the flip: fail on the left, pass on the right. Proven teal only; gold never encodes a state. ---------- */
.flip-stage{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:10px;align-items:stretch}
@media(max-width:640px){.flip-stage{grid-template-columns:minmax(0,1fr)}.flip-arrow svg{transform:rotate(90deg)}}
#viewport.phone .flip-stage{grid-template-columns:minmax(0,1fr)}
#viewport.phone .flip-arrow svg{transform:rotate(90deg)}
.flip-box{position:relative;border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--ink);overflow:hidden;min-width:0}
.flip-box .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flip-box .k .n{margin-left:auto;font-family:var(--mono);letter-spacing:0;text-transform:none;font-weight:500}
.flip-box .w{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:8px}
.flip-box .r{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.flip-box .m{margin-top:11px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:11.5px;color:var(--dim)}
.flip-box .m .v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--body);overflow-wrap:anywhere}
.flip-box.fail{border-color:color-mix(in srgb,var(--st-failed) 45%,transparent)}
.flip-box.fail .w{color:var(--st-failed)}
.flip-box.pass .w{color:var(--st-proven)}
.flip-box.miss{border-style:dashed}
.flip-box.miss .w{color:var(--dim)}
.flip-stage.on .flip-box.pass{border-color:color-mix(in srgb,var(--st-proven) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--st-proven) 22%,transparent),0 0 34px color-mix(in srgb,var(--st-proven) 16%,transparent)}
.flip-stage.on .flip-box.fail{animation:flipin .55s cubic-bezier(.2,.8,.2,1) both}
.flip-stage.on .flip-box.pass{animation:flipin .55s cubic-bezier(.2,.8,.2,1) .28s both,flipglow 3.4s ease-in-out 1.1s infinite}
.flip-stage.on .flip-box.pass::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,color-mix(in srgb,var(--st-proven) 26%,transparent) 50%,transparent 65%);background-size:260% 100%;animation:flipsheen 1.6s ease-in-out .7s 1 both}
@keyframes flipin{0%{transform:perspective(900px) rotateY(-80deg);opacity:0}100%{transform:perspective(900px) rotateY(0);opacity:1}}
@keyframes flipsheen{0%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes flipglow{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--st-proven) 22%,transparent),0 0 34px color-mix(in srgb,var(--st-proven) 16%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--st-proven) 48%,transparent),0 0 56px color-mix(in srgb,var(--st-proven) 32%,transparent)}}
.flip-arrow{display:grid;place-items:center;color:var(--dim)}
.flip-arrow.on{color:var(--st-proven)}
.flip-arrow svg{width:44px;height:44px;overflow:visible}
.flip-arrow.on .ln{stroke-dasharray:6 5;animation:flipmarch 1.1s linear infinite}
@keyframes flipmarch{to{stroke-dashoffset:-22}}
/* the rail: turn opened → each attempt → the flip → agent ended its turn → sealed */
.flip-rail{position:relative;display:grid;gap:8px;margin-top:6px}
.flip-rail::before{content:"";position:absolute;left:7px;right:7px;top:7px;height:2px;background:var(--rule)}
.flip-rail .pt{position:relative;padding-top:20px;font-size:11.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.flip-rail .pt::before{content:"";position:absolute;left:0;top:1px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--rule);box-sizing:content-box}
.flip-rail .pt.fail::before{border-color:var(--st-failed)}
.flip-rail .pt.pass::before{border-color:var(--st-proven);background:var(--st-proven);box-shadow:0 0 0 5px color-mix(in srgb,var(--st-proven) 24%,transparent)}
.flip-rail.on .pt.pass::before{animation:pulse 1.8s ease-in-out infinite}
.flip-rail .pt.end::before{border-color:var(--fg)}
.flip-rail .pt.seal::before{border-radius:2px;border-color:var(--fg);background:var(--fg)}
.flip-rail .pt b{display:block;color:var(--fg);font-weight:600;font-size:12px}
.flip-rail .pt.pass b{color:var(--st-proven)}
.flip-rail .pt.fail b{color:var(--st-failed)}
.flip-rail .pt .t{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:block;font-variant-numeric:tabular-nums}
.fr{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-decoration:underline dotted;background:none;border:0;padding:0;cursor:pointer}
.fr:hover{color:var(--fg)}
.flip-rail .lead{position:absolute;top:-6px;right:0;font-family:var(--mono);font-size:10.5px;color:var(--st-proven);white-space:nowrap;background:var(--panel);padding:0 4px}
#viewport.phone .flip-rail{grid-template-columns:1fr!important}
#viewport.phone .flip-rail::before{left:7px;right:auto;top:7px;bottom:7px;width:2px;height:auto}
#viewport.phone .flip-rail .pt{padding:0 0 0 22px}
#viewport.phone .flip-rail .lead{position:static;display:block;margin-bottom:6px}
/* hero band under the header of a proven run */
.flip-hero{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--st-proven) 50%,transparent);border-radius:12px;padding:13px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,color-mix(in srgb,var(--st-proven) 13%,var(--panel)),var(--panel) 70%)}
.flip-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,color-mix(in srgb,var(--st-proven) 18%,transparent) 50%,transparent 60%);background-size:300% 100%;animation:flipsheen 2.2s ease-in-out .3s 1 both}
.flip-hero>*{position:relative}
.flip-hero .fp{font-size:22px;font-weight:700;letter-spacing:-.03em;display:inline-flex;align-items:center;gap:8px;flex:none;animation:flipin .55s cubic-bezier(.2,.8,.2,1) both}
.flip-hero .fp .f{color:var(--st-failed)}.flip-hero .fp .p{color:var(--st-proven)}.flip-hero .fp .a{color:var(--dim);font-weight:400}
.flip-hero .tx{font-size:12.5px;color:var(--muted);min-width:0;flex:1 1 260px}
.flip-hero .tx b{color:var(--fg);font-weight:600}
.flip-hero .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* attempts ladder */
tbody tr.att-pass td{background:color-mix(in srgb,var(--st-proven) 9%,transparent)}
tbody tr.att-pass td:first-child{box-shadow:inset 3px 0 0 var(--st-proven)}
/* W5 · a tampered head on the flip stage, the pass/fail airlock, the witness ladder */
.flip-box.crit{border-color:color-mix(in srgb,var(--st-critical) 55%,transparent)}
.flip-box.crit .w{color:var(--st-critical);font-size:30px}
.flip-rail .pt.excluded::before{border-color:var(--st-critical)}
.flip-rail .pt.excluded b{color:var(--st-critical)}
.airlock{display:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);align-items:stretch}
.chamber{padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.chamber.sealed{background:var(--void)}
.membrane{position:relative;display:grid;place-items:center;min-height:120px;border-left:1px dashed var(--rule);border-right:1px dashed var(--rule);background:repeating-linear-gradient(-45deg,transparent 0 5px,var(--hl) 5px 6px)}
.membrane .grain{background:var(--panel);border:1px solid var(--st-proven);color:var(--st-proven);border-radius:999px;padding:3px 9px;font-family:var(--mono);font-size:11px;font-weight:700}
.membrane .grain.bad{border-color:var(--st-failed);color:var(--st-failed)}
.membrane .ml{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap;font-weight:600}
.redact{display:grid;gap:7px;font-family:var(--mono);font-size:12px}
.redact .rr{display:grid;grid-template-columns:minmax(72px,auto) minmax(0,1fr);gap:12px;align-items:baseline}
.redact .rk{color:var(--dim)}
.redact .rv{color:var(--fg);overflow-wrap:anywhere}
.redact .rv.x{color:var(--rule);letter-spacing:.08em;user-select:none;overflow:hidden;white-space:nowrap}
.oneword{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:20px 16px;display:grid;place-items:center;gap:8px}
.oneword .w{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--st-proven);line-height:1}
.oneword .w.bad{color:var(--st-failed)}
.oneword .c{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
pre .bad{color:var(--st-failed)}
@media(max-width:760px){.airlock{grid-template-columns:minmax(0,1fr)}.membrane{min-height:64px;border:0;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule)}}
#viewport.phone .airlock{grid-template-columns:minmax(0,1fr)}
#viewport.phone .membrane{min-height:64px;border:0;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule)}
.ladder{list-style:none;margin:0;padding:0;display:grid}
.ladder li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--border)}
.ladder li:last-child{border-bottom:0}
.ladder .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;border:1px solid color-mix(in srgb,var(--st-proven) 45%,transparent);color:var(--st-proven);background:color-mix(in srgb,var(--st-proven) 11%,transparent)}
.ladder .st{display:grid;gap:3px;min-width:0}
.ladder .st b{font-size:13px;font-weight:600;color:var(--fg)}
.ladder .st span{font-size:12px;color:var(--muted);line-height:1.5}
.ladder .st .mono{font-size:11.5px;color:var(--body);overflow-wrap:anywhere}
#viewport.phone .ladder li{grid-template-columns:26px minmax(0,1fr)}
#viewport.phone .ladder li>.b{grid-column:2;justify-self:start}
/* proven rows in any runs list */
tbody tr.flipped td:first-child{box-shadow:inset 3px 0 0 var(--st-proven)}
tbody tr.flipped{background:linear-gradient(90deg,color-mix(in srgb,var(--st-proven) 8%,transparent),transparent 58%)}
tbody tr.click.flipped:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--st-proven) 14%,transparent),var(--hl) 58%)}
.b-flip .d{animation:pulse 1.8s ease-in-out infinite;box-shadow:0 0 0 3px color-mix(in srgb,var(--st-proven) 22%,transparent)}
.b-flip .fx{font-family:var(--mono);font-weight:500;color:var(--muted);border-left:1px solid color-mix(in srgb,var(--st-proven) 35%,transparent);padding-left:6px;margin-left:1px}
.b-flip .fx i{font-style:normal;color:var(--st-failed)}.b-flip .fx em{font-style:normal;color:var(--st-proven)}
.flipsub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px;white-space:nowrap}

/* ---------- assistant: a flyout from the sidebar ----------
   The in-app agent belongs to the workspace rail, so it leaves from there.
   The launcher sits at the foot of the sidebar and the panel slides out of
   the rail's right edge, tucked fully behind it when closed (.side paints at
   z-index 55, the panel at 50). It overlays the page instead of reflowing it:
   an operator opens the agent to ask about what is already on screen, so the
   screen must not move underneath them.
   The host div (#asst, next to #layer) is permanent and render() only rewrites
   its contents when the engine state changes - that is what lets the CSS
   transition survive a re-render, and what keeps a half-typed message alive. */
.asst{position:fixed;top:0;bottom:0;left:var(--side-w);width:min(430px,calc(100vw - var(--side-w) - 56px));
  background:var(--panel);border-right:1px solid var(--border);z-index:50;display:flex;flex-direction:column;
  box-shadow:18px 0 44px rgba(0,0,0,.44);padding-bottom:env(safe-area-inset-bottom);
  translate:-100% 0;opacity:0;visibility:hidden;
  transition:translate .34s cubic-bezier(.32,.72,0,1),opacity .18s ease,visibility 0s .34s}
.asst.open{translate:0 0;opacity:1;visibility:visible;
  transition:translate .34s cubic-bezier(.32,.72,0,1),opacity .18s ease,visibility 0s 0s}
/* on a phone the rail is itself a left drawer, so the panel flies in over the
   whole column; translate composes with the centring transform, not over it */
.asst.phone{left:50%;width:100%;max-width:400px;transform:translateX(-50%);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);box-shadow:var(--shadow)}
@media(prefers-reduced-motion:reduce){
  .asst{translate:0 0;transition:opacity .12s ease,visibility 0s .12s}
  .asst.open{translate:0 0;transition:opacity .12s ease,visibility 0s 0s}
}
/* the launcher at the foot of the rail - the point the panel flies out of */
.asst-launch{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;margin-bottom:9px;
  border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--muted);
  text-align:left;transition:border-color .15s,color .15s}
.asst-launch:hover{border-color:var(--rule);color:var(--fg)}
.asst-launch[aria-expanded="true"]{border-color:var(--gold)}
.asst-launch .tx{min-width:0;flex:1}
.asst-launch .tx b{display:block;font-size:12.5px;font-weight:600;color:var(--fg)}
.asst-launch .tx span{display:block;font-size:10.5px;color:var(--dim);font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asst-launch .tx span.down{color:var(--st-failed)}
.asst-launch .cv{flex:none;color:var(--dim);display:grid;place-items:center;
  transition:transform .3s cubic-bezier(.32,.72,0,1)}
.asst-launch[aria-expanded="true"] .cv{transform:rotate(180deg);color:var(--gold)}
@media(prefers-reduced-motion:reduce){.asst-launch .cv{transition:none}}
.asst-g{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--gold);color:var(--on-gold)}
.asst-launch .asst-g{width:24px;height:24px;border-radius:7px}
.asst-k{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--dim);flex:none}
.asst-h{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex:none}
.asst-b{flex:1;min-height:0;overflow-y:auto;padding:15px}
.asst-f{border-top:1px solid var(--border);padding:11px 13px;flex:none}
.asst-f .box{background:var(--ink);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:flex;gap:9px;align-items:flex-end}
.asst-f textarea{flex:1;background:none;border:0;resize:none;outline:none;font-size:13px;line-height:1.5;min-height:38px;color:var(--fg)}
.msg{margin-bottom:16px;font-size:13px;line-height:1.6}
.msg .who{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:5px;display:flex;gap:8px;align-items:center}
.msg.op .bub{background:var(--hl);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--body)}
.msg .bub{color:var(--body)}
.act-card{background:var(--ink);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin:9px 0;font-size:12.5px}
.act-card .t{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.act-card .t code{font-size:11.5px}

/* ---------- spend findings: savings hero, ranked cards, evidence and fix dialogs ---------- */
.sv-hero{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.5fr);gap:18px 30px;align-items:end;padding:18px 20px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:14px}
.sv-hero>*{min-width:0}
.sv-amt{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.sv-sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.sv-strip{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:9px}
.sv-strip i{display:block;height:100%;background:var(--st-approval);min-width:3px}
.sv-legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--muted)}
.sv-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--st-approval);margin-right:5px;vertical-align:-1px}
.sv-legend .mono{color:var(--dim);font-size:10.5px}
.sv-facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.sv-facts b{color:var(--fg)}
.fnd{display:grid;grid-template-columns:30px minmax(0,1fr) 210px;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--panel);transition:border-color .15s}
.fnd>*{min-width:0}
.fnd:hover{border-color:var(--rule)}
.fnd .rank{font-family:var(--mono);font-size:12px;color:var(--dim);padding-top:4px}
.fnd .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.fnd .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:6px 0 8px;flex-wrap:wrap}
.fnd .who .av{width:20px;height:20px;border-radius:50%;background:var(--hl);border:1px solid var(--border);display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--body);flex:none}
.fnd .why{margin:0 0 8px;font-size:12.5px;color:var(--body)}
.fnd .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.fnd .amt{text-align:right;display:grid;gap:5px;align-content:start}
.fnd .amt .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.fnd .amt .s{font-size:11px;color:var(--muted)}
.fnd .amt .bar i{background:var(--st-approval)}
.fnd .acts{display:flex;gap:7px;justify-content:flex-end;margin-top:4px}
@media(max-width:640px){.fnd{grid-template-columns:minmax(0,1fr)}.fnd .rank{display:none}.fnd .amt{text-align:left}.fnd .acts{justify-content:flex-start}.sv-hero{grid-template-columns:minmax(0,1fr)}.sv-amt{font-size:34px}}
/* ---------- spend drill-down: back bar, entity head, sparkline, cross-cut links ---------- */
.drill-bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:0 0 10px;min-width:0}
.drill-bar a{color:var(--muted);text-decoration:none;flex:none}.drill-bar a:hover{color:var(--fg);text-decoration:underline}
.drill-bar .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drill-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;overflow-wrap:anywhere}
.drill-head h2.mono{font-size:19px;letter-spacing:0}
.spark{display:block;width:100%;height:72px;color:var(--fg)}
.drill-lnk{color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px dotted var(--rule)}
.drill-lnk:hover{border-bottom-style:solid}
tbody tr.click:hover .drill-lnk{border-bottom-style:solid}
.sv-amt.dim{color:var(--dim)}
#viewport.phone .drill-head .acts{width:100%}
#viewport.phone .fnd{grid-template-columns:minmax(0,1fr)}#viewport.phone .fnd .rank{display:none}#viewport.phone .fnd .amt{text-align:left}#viewport.phone .fnd .acts{justify-content:flex-start}#viewport.phone .sv-hero{grid-template-columns:minmax(0,1fr)}#viewport.phone .sv-amt{font-size:34px}
.ev-claim{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.ev-claim .stat{padding:10px 12px;background:var(--ink)}
.ev-claim .stat .v{font-size:19px;overflow-wrap:anywhere}
.ev-who{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--ink)}
.ev-who .avat{width:38px;height:38px;font-size:13px}
/* ---- code pair: two source panes read across, not down. Two columns are guaranteed, not
   inherited from .g2's 320px floor, which silently stacks as soon as a dialog narrows. ---- */
.cpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 14px}
.cpair.one{grid-template-columns:minmax(0,1fr)}
.cpair-t{margin-top:14px}
.cpair>*{min-width:0;display:flex;flex-direction:column}
.cpair .lab{display:flex;gap:8px;align-items:baseline;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px}
.cpair .lab .sp{margin-left:auto;flex:none;letter-spacing:0;text-transform:none;font-weight:400;font-family:var(--mono);color:var(--muted)}
.cpair pre{flex:1;max-height:300px;overflow:auto}
#layer.phone .cpair{grid-template-columns:minmax(0,1fr)}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,9,.68);backdrop-filter:blur(3px);z-index:90;display:grid;place-items:start center;padding:70px 18px 30px;overflow-y:auto}
.dlg{background:var(--panel);border:1px solid var(--rule);border-radius:14px;width:100%;max-width:600px;box-shadow:var(--shadow);overflow:hidden}
.dlg.wide{max-width:820px}
.dlg-h{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.dlg-h h2{font-size:16px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:17px 18px;max-height:62vh;overflow-y:auto}
.dlg-f{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--ink);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field .hint{font-size:11.5px;color:var(--dim);margin-top:5px}
.dlg-h.sub{align-items:flex-start}
.dlg-h .grow{flex:1;min-width:0}
.dlg-h p{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.dlg-f .grow{flex:1;min-width:0;font-size:12px;color:var(--muted);align-self:center}
/* account dialog (from W11): tabs sit between header and body; list, avatar, two-up rows */
.dlg .tabs{margin:0;padding:0 18px}
.dlg .tab{margin-bottom:-1px}
.avat{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--hl);border:1px solid var(--border);font-size:17px;font-weight:600;letter-spacing:.02em;color:var(--body);flex:none}
/* avatars — people are round, agents are squircles; the kind (icon, initials, photo) and the tone live on the record.
   Three tones, all from the house scale and nothing else: solid · soft · line. No free colour, no gradient.
   Every tone is relative to the theme (solid = the foreground ink as a disc, soft = a lifted panel, line = a hairline), so the
   three stay distinct on ink and on paper alike and the glyph always has full contrast against its ground. */
.avx{display:inline-grid;place-items:center;flex:none;overflow:hidden;box-sizing:border-box;vertical-align:middle;font-weight:600;line-height:1;letter-spacing:.02em;text-decoration:none;border:1px solid transparent}
.avx svg{width:56%;height:56%}
.avx.tn-solid{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.avx.tn-soft{background:var(--hl);color:var(--fg);border-color:var(--border)}
.avx.tn-line{background:transparent;color:var(--fg);border-color:var(--rule)}
.avx.person{border-radius:50%}
.avx.agent{border-radius:27%}
.avx img{width:100%;height:100%;object-fit:cover;display:block}
.avx.f-sans{font-family:var(--font)}
.avx.f-serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:500}
.avx.f-mono{font-family:var(--mono);font-weight:600}
.inv{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.inv-i{display:inline-flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--border);border-radius:999px;background:var(--ink);color:var(--fg);font-size:12.5px;text-decoration:none;max-width:100%;min-width:0}
a.inv-i:hover{border-color:var(--rule);text-decoration:none}
.inv-i .tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.inv-i .tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-i .tx span{font-size:10.5px;color:var(--dim);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-arrow{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
.sumry{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:16px 18px;margin-bottom:16px}
.sumry .lede{font-size:15px;line-height:1.55;color:var(--fg);margin:12px 0 10px;max-width:78ch}
.sumry .touched{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.sumry .gen{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--dim);font-family:var(--mono);border-top:1px solid var(--border);padding-top:11px;margin-top:13px}
.sumry .gen .grow{flex:1;min-width:0}
.sumry .gen b{color:var(--muted);font-weight:600}
/* avatar builder */
.avb{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
.avb-prev{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--ink)}
.avb-prev .sizes{display:flex;align-items:center;gap:8px}
.avb-prev .cap{font-size:10.5px;color:var(--dim);font-family:var(--mono);text-align:center;line-height:1.4;word-break:break-word}
.av-seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--ink);max-width:100%}
.av-seg button{border:0;background:none;color:var(--muted);padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;border-right:1px solid var(--border);border-radius:0}
.av-seg button:last-child{border-right:0}
.av-seg button[aria-pressed="true"]{background:var(--hl);color:var(--fg);font-weight:600}
.av-seg button.f-serif{font-family:Georgia,"Times New Roman",serif}
.av-seg button.f-mono{font-family:var(--mono)}
.av-ico{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;margin-top:8px}
.av-ico button{border:1px solid transparent;background:var(--ink);border-radius:8px;height:36px;cursor:pointer;padding:0;color:var(--muted);display:grid;place-items:center}
.av-ico button svg{width:18px;height:18px}
.av-ico button:hover{border-color:var(--rule);color:var(--fg)}
.av-ico button[aria-pressed="true"]{border-color:var(--fg);background:var(--hl);color:var(--fg)}
.av-tone{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.av-tone button{border:1px solid transparent;background:none;border-radius:11px;padding:3px;cursor:pointer;display:grid;place-items:center}
.av-tone button:hover{border-color:var(--rule)}
.av-tone button[aria-pressed="true"]{border-color:var(--fg)}
.av-drop{border:1px dashed var(--rule);border-radius:10px;padding:14px;text-align:center;background:var(--ink);font-size:12.5px;color:var(--muted)}
.av-drop input[type=file]{display:block;margin:8px auto 0;font-size:12px;width:auto;max-width:100%}
.avb .field{margin-bottom:12px}
.avb .field input.short{width:120px;font-size:15px;letter-spacing:.08em}
#layer.phone .avb{grid-template-columns:1fr}
#viewport.phone .inv-i .tx b,#viewport.phone .inv-i .tx span{max-width:150px}
.sc{font-family:var(--mono);font-size:11px;color:var(--dim)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.row2>*{min-width:0}
.kv.code dd{font-family:var(--mono);font-size:11.5px}
.lst{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lst>*{border-bottom:1px solid var(--border)}
.lst>*:last-child{border-bottom:0}
.li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--ink)}
.li .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;margin-top:1px}
.li .ic svg{width:12px;height:12px}
.li .bd2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t1{font-size:12.5px;color:var(--fg);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li .t2{font-size:11.5px;color:var(--muted);line-height:1.45}
.li time{font-family:var(--mono);font-size:10px;color:var(--dim);flex:none;white-space:nowrap;margin-top:4px}
.li .btn{flex:none}
.dlg-b .field .hint{color:var(--muted);line-height:1.5}
.dlg-b .field>.hint{margin-top:0}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields>.field{min-width:0}
#layer.phone .fields{grid-template-columns:minmax(0,1fr)}
#layer.phone .dlg-f .grow{flex-basis:100%}
@media(max-width:560px){.fields{grid-template-columns:minmax(0,1fr)}.dlg-f .grow{flex-basis:100%}}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--ink);cursor:pointer;margin-bottom:14px}
.check:hover{border-color:var(--rule)}
.check input{margin:3px 0 0;accent-color:var(--gold);flex:none}
.check .grow{flex:1;min-width:0}
.check .n{font-family:var(--mono);font-size:12.5px;font-weight:500}
.check .d{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- command menu ---------- */
.cmd{background:var(--panel);border:1px solid var(--rule);border-radius:14px;width:100%;max-width:620px;box-shadow:var(--shadow);overflow:hidden}
.cmd-in{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.cmd-in input{flex:1;background:none;border:0;outline:none;font-size:15px}
.cmd-l{max-height:400px;overflow-y:auto;padding:7px}
.cmd-g{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:9px 10px 5px}
.cmd-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;width:100%;border:0;background:none;text-align:left;color:var(--body);font-size:13px}
.cmd-i:hover,.cmd-i.on{background:var(--hl);color:var(--fg)}
.cmd-i .r{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

/* ---------- notifications ---------- */
/* a bordered list of items — the notifications dialog, reusable elsewhere */
.lst{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lst>*{border-bottom:1px solid var(--border)}
.lst>*:last-child{border-bottom:0}
.li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--ink);width:100%;text-align:left}
.li:hover{background:var(--hl)}
.li .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px;background:var(--hl);color:var(--dim)}
.li .ic svg{display:block}
.li .ic.t-approval{background:color-mix(in srgb,var(--st-approval) 14%,transparent);color:var(--st-approval)}
.li .ic.t-failed{background:color-mix(in srgb,var(--st-failed) 14%,transparent);color:var(--st-failed)}
.li .ic.t-critical{background:color-mix(in srgb,var(--st-critical) 14%,transparent);color:var(--st-critical)}
.li .ic.t-allowed{background:color-mix(in srgb,var(--st-allowed) 14%,transparent);color:var(--st-allowed)}
.li .ic.t-gold{background:color-mix(in srgb,var(--gold) 13%,transparent);color:var(--accent-text)}
.li .bd2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t1{font-size:12.5px;color:var(--fg);font-weight:500}
.li .t2{font-size:11.5px;color:var(--muted);line-height:1.45}
.li time{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto;white-space:nowrap}
.li.unread{background:color-mix(in srgb,var(--gold) 5%,var(--ink))}
.li.unread .t1::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:middle}
.menu{position:absolute;top:42px;right:0;width:250px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);z-index:70;padding:6px;overflow:hidden}
.menu-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--body);font-size:13px;text-align:left}
.menu-i:hover{background:var(--hl);color:var(--fg)}
.menu-hd{padding:10px 11px 9px;border-bottom:1px solid var(--border);margin-bottom:5px}
.menu-hd b{display:block;font-size:13px}
.menu-hd span{display:block;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.rel{position:relative}

/* ---------- mockup chrome (never product UI) ---------- */
/* sits above the in-app agent dock, which owns the bottom edge */
#chrome{position:fixed;right:12px;bottom:12px;z-index:200;font-family:var(--mono);font-size:11px}
#chrome .cbar{background:#0A0A09;border:1px solid #34322D;border-radius:10px;padding:7px;display:flex;gap:5px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6);flex-wrap:wrap;max-width:min(92vw,660px);color:#9B958A}
#chrome .lab{color:#6E6A62;letter-spacing:.08em;text-transform:uppercase;font-size:9.5px;padding:0 3px}
#chrome button{background:#181715;border:1px solid #292722;color:#9B958A;border-radius:6px;padding:3px 8px;font-family:inherit;font-size:11px}
#chrome button:hover{border-color:#6E6A62;color:#F2EEE5}
#chrome button[aria-pressed="true"]{background:#D6962C;border-color:#D6962C;color:#10100F;font-weight:700}
#chrome .tog{margin-left:4px}
#chrome .rule{width:1px;height:16px;background:#34322D}
@media(max-width:640px){#chrome .cbar{max-width:94vw}}
/* -------- kill switches (ported from W9 · the toolbelt, governed) -------- */
.ks-stack{display:flex;flex-direction:column;gap:16px}
.ks-stack>*{min-width:0}
.panel-h .ks-grow{flex:1 1 28ch;min-width:0}
.panel-h .ks-grow p{font-size:12.5px;color:var(--muted);margin:3px 0 0;max-width:none}
.ks-sub{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.ks-wire{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ks-wire span{background:var(--hl);border:1px solid var(--border);border-radius:5px;padding:3px 8px;color:var(--fg)}
.ks-wire span.out{color:var(--st-allowed);border-color:color-mix(in srgb,var(--st-allowed) 40%,transparent);background:color-mix(in srgb,var(--st-allowed) 11%,transparent)}
.ks-sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:0;background:none;padding:0;flex:none;margin-left:auto}
.ks-sw i{width:34px;height:19px;border-radius:20px;background:var(--hl);border:1px solid var(--rule);position:relative;transition:background .15s,border-color .15s;flex:none}
.ks-sw i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.ks-sw.on i{background:color-mix(in srgb,var(--st-denied) 14%,transparent);border-color:var(--st-denied)}
.ks-sw.on i::after{transform:translateX(15px);background:var(--st-denied)}
.ks-sw .lbl{font-size:12px;color:var(--muted)}
.ks-sw.on .lbl{color:var(--st-denied)}
.ks-sw.int.on i{background:color-mix(in srgb,var(--st-approval) 16%,transparent);border-color:var(--st-approval)}
.ks-sw.int.on i::after{background:var(--st-approval)}
.ks-sw.int.on .lbl{color:var(--st-approval);font-weight:600}
.steer-list .check{display:flex;margin-bottom:7px;padding:8px 11px;align-items:center;font-size:inherit;font-weight:inherit;color:inherit}
.steer-list .check .d{margin-top:1px;font-weight:500}
.steer-list .check input{width:auto;flex:none;margin:0;padding:0}
.steer-list .check>.b{flex:none;margin-left:6px}
.steer-list .check>.b .d{margin-top:0}
.steer-mode{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--ink);transition:border-color .15s,background .15s}
.steer-mode.on{border-color:color-mix(in srgb,var(--st-approval) 55%,transparent);background:color-mix(in srgb,var(--st-approval) 8%,transparent)}
.steer-mode .grow{flex:1;min-width:0}
.steer-mode b{display:block;font-size:12.5px}
.steer-mode .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
.ks-banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:10px;font-size:12.5px;border:1px solid;margin-bottom:16px;flex-wrap:wrap}
.ks-banner.crit{background:color-mix(in srgb,var(--st-critical) 12%,transparent);border-color:color-mix(in srgb,var(--st-critical) 40%,transparent);color:var(--fg)}
.ks-banner.info{background:var(--hl);border-color:var(--border);color:var(--body)}
.ks-banner .g{flex:1;min-width:0;min-inline-size:16ch}
.ks-banner b{display:block;color:var(--fg);margin-bottom:2px}
.note.deny{border-left-color:var(--st-denied)}
/* ---- audit (ported from W10, the CIO's console) ---- */
.rg{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rg+.rg{margin-top:12px}
.rg>h4{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:8px 13px;background:var(--hl);border-bottom:1px solid var(--border);margin:0;font-weight:600}
.rg>.rb{padding:11px 13px}
.t-main{color:var(--fg);font-weight:500}
.t-sub{color:var(--muted);font-size:12px;margin-top:2px}
.callout{border:1px solid var(--border);border-left:2px solid var(--gold);background:var(--hl);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--body);line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.bar i.hold{background:var(--st-approval)}
.sel-sm{background:var(--ink);border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:12px;color:var(--fg);outline:none}
.sel-sm:focus{border-color:var(--gold)}

/* ---- guided scenario rail ------------------------------------------------
   A scenario does not get its own screens. It steps the real ones and says
   what to look at, so the demo and the product cannot drift apart. The rail
   is the only thing the scenario adds, and it sits above the page. */
.scn{border:1px solid color-mix(in srgb,var(--gold) 40%,var(--border));border-radius:12px;
  background:color-mix(in srgb,var(--gold) 5%,var(--panel));padding:13px 15px;margin-bottom:16px;display:grid;gap:9px}
.scn-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.scn-eb{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.scn-h b{font-size:14px;font-weight:600}
.scn-ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.scn-say{font-size:14.5px;line-height:1.5;color:var(--fg);margin:0;max-width:82ch}
.scn-note{font-size:12px;color:var(--muted);margin:0;max-width:82ch}
.scn-f{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:2px}
.scn-dots{display:flex;gap:5px;margin-left:auto}
.scn-dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
.scn-dots i.on{background:var(--gold)}
.scn-card{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:11px 13px;display:grid;gap:6px}
.scn-card b{font-size:13px}
.scn-card p{margin:0;font-size:12.5px;color:var(--muted)}
@media(max-width:640px){.scn-ct{margin-left:0}.scn-dots{margin-left:0}}
#viewport.phone .scn-ct,#viewport.phone .scn-dots{margin-left:0}

/* ---- small approval card ------------------------------------------------
   The same anatomy as the full card below (eyebrow, amount or tool, agent,
   countdown, hazard badges, two decisions) at a size that reads as a row in a
   list. An approval is urgent, which is not the same as being the subject of
   the page, so this is what every list and rail uses. The full card is reached
   deliberately, in a dialog. */
.apsm{border:1px solid color-mix(in srgb,var(--st-approval) 34%,var(--border));border-radius:10px;background:var(--ink);
  padding:10px 11px;display:grid;gap:8px;min-width:0}
.apsm.crit{border-color:color-mix(in srgb,var(--st-critical) 40%,var(--border))}
.apsm.done{border-color:var(--border);opacity:.72}
.apsm-h{display:flex;gap:9px;align-items:center;min-width:0}
.apsm-h .g{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  color:var(--st-approval);background:color-mix(in srgb,var(--st-approval) 13%,transparent)}
.apsm.crit .apsm-h .g{color:var(--st-critical);background:color-mix(in srgb,var(--st-critical) 13%,transparent)}
.apsm-h .tt{min-width:0;flex:1}
.apsm-h .tt b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apsm-h .tt span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apsm-clk{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--st-approval);font-variant-numeric:tabular-nums;flex:none}
.apsm-clk.warn{color:var(--st-critical)}
.apsm-clk.done{color:var(--dim);font-weight:500}
.apsm-m{display:flex;gap:5px;flex-wrap:wrap}
.apsm-t{display:grid;gap:2px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.apsm-t i{font-style:normal;color:var(--body)}
.apsm-a{display:flex;gap:6px;flex-wrap:wrap}
.apsm-a .btn{flex:0 1 auto;justify-content:center;min-width:92px}
.apwrap{display:grid;gap:10px}
@media(min-width:900px){.apwrap.two{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.apsm-a .btn{flex:1 1 auto}}
.apwrap.two>.apfull{grid-column:1/-1}
#viewport.phone .apwrap.two{grid-template-columns:1fr}
#viewport.phone .apsm-a .btn{flex:1 1 auto}

/* ---- approval card (presentation ported from W3 money-asked) ---- */
.apcard{border:1px solid color-mix(in srgb,var(--st-approval) 34%,var(--border));border-radius:12px;background:var(--panel);overflow:hidden;min-width:0}
.apcard.crit{border-color:color-mix(in srgb,var(--st-critical) 40%,var(--border))}
.apcard.done{border-color:var(--border)}
.aphead{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:color-mix(in srgb,var(--st-approval) 6%,transparent);flex-wrap:wrap}
.apcard.crit .aphead{background:color-mix(in srgb,var(--st-critical) 6%,transparent)}
.apcard.done .aphead{background:transparent}
.aphead .amt{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.03em;color:var(--fg);line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.aphead .amt .cur{font-size:13px;font-weight:500;color:var(--muted);margin-left:5px}
.aphead .r{margin-left:auto;text-align:right;display:grid;gap:5px;justify-items:end}
.clock{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--st-approval);font-variant-numeric:tabular-nums}
.clock.warn{color:var(--st-critical)}
.clock.done{color:var(--muted)}
.chain4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.hop{padding:13px 16px;border-right:1px solid var(--border);min-width:0;position:relative}
.hop:last-child{border-right:0}
.hop .hn{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.hop .hn i{font-style:normal;font-family:var(--mono);color:var(--accent-text);font-size:10px}
.hop b{display:block;font-size:13px;font-weight:600;color:var(--fg);overflow-wrap:anywhere;margin-bottom:3px}
.hop .hm{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.hop::after{content:"›";position:absolute;right:-7px;top:50%;transform:translateY(-50%);z-index:2;width:14px;height:14px;display:grid;place-items:center;background:var(--panel);color:var(--dim);font-size:12px}
.hop:last-child::after{content:none}
.apwrap{container-type:inline-size}
@container (max-width:720px){.chain4{grid-template-columns:1fr 1fr}.hop:nth-child(2){border-right:0}.hop:nth-child(2)::after{content:none}.hop:nth-child(-n+2){border-bottom:1px solid var(--border)}}
@container (max-width:430px){.chain4{grid-template-columns:1fr}.hop{border-right:0;border-bottom:1px solid var(--border)}.hop::after{content:none}.hop:last-child{border-bottom:0}.aphead .r{margin-left:0;justify-items:start;text-align:left}.aphead .r .dim{text-align:left!important}}
.apbody{padding:14px 16px;border-top:1px solid var(--border);display:grid;gap:16px}
.mbar{height:12px;border-radius:999px;background:var(--hl);border:1px solid var(--border);display:flex;overflow:hidden}
.mbar i{display:block;height:100%}
.mbar .used{background:color-mix(in srgb,var(--st-allowed) 62%,transparent)}
.mbar .res{background:repeating-linear-gradient(45deg,var(--st-approval) 0 4px,color-mix(in srgb,var(--st-approval) 45%,transparent) 4px 8px)}
.mlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{width:9px;height:9px;border-radius:3px;display:block}
.mlegend i.used{background:color-mix(in srgb,var(--st-allowed) 62%,transparent)}
.mlegend i.res{background:var(--st-approval)}
.mlegend i.left{background:var(--hl);border:1px solid var(--rule)}
.taint{border:1px solid color-mix(in srgb,var(--st-critical) 32%,var(--border));background:color-mix(in srgb,var(--st-critical) 7%,transparent);border-radius:10px;padding:12px 14px}
.srcrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--st-critical) 26%,transparent);font-size:12px;flex-wrap:wrap}
.srcrow:first-of-type{border-top:0}
.rulerow{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--border);align-items:flex-start}
.rulerow .b{flex:none;min-width:74px;justify-content:center}
.apfoot{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--void)}
.apfoot .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* toast stack — one row per event, newest at the bottom */
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:300;display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--panel);border:1px solid var(--rule);border-radius:11px;padding:11px 16px;box-shadow:var(--shadow);font-size:12.5px;display:flex;align-items:center;gap:10px;max-width:min(560px,92vw);color:var(--fg)}
.toast .d{width:7px;height:7px;border-radius:50%;flex:none}
#toast.phone{max-width:368px}
#toast.phone .toast{max-width:368px}

@media (prefers-reduced-motion:reduce){.ks-sw i,.ks-sw i::after{transition:none}}
/* List controls: search, column filters, rows per page, sortable headers, pager */
.lt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.lt.free{border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.lt .lt-q{flex:1 1 200px;min-width:140px;background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--fg);outline:none;font-family:var(--font);transition:border-color .12s}
.lt .lt-q:focus{border-color:var(--gold)}
.lt .lt-q::placeholder{color:var(--dim)}
.lt select{background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--fg);outline:none;font-family:var(--font);max-width:220px;transition:border-color .12s}
.lt select:focus{border-color:var(--gold)}
.lt .lt-rows,.lt .lt-sort{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.lt .lt-rows{margin-left:auto}
.lp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;font-size:11.5px;color:var(--muted);background:var(--panel)}
.lp.free{border:1px solid var(--border);border-radius:10px;margin-top:10px}
.lp .lp-n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.lp .lp-pg{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lp .lp-pg .btn{padding:2px 8px;min-width:28px;justify-content:center;font-variant-numeric:tabular-nums}
.lp .lp-pg .btn[aria-current="page"]{border-color:var(--gold);color:var(--gold)}
.lp .lp-pg .btn:disabled{opacity:.4;cursor:default}
.lp .lp-pg .el{padding:0 4px;color:var(--dim)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--muted)}
th.sortable::after{content:"↕";margin-left:5px;color:var(--rule);font-size:10px}
th.sortable[aria-sort="ascending"],th.sortable[aria-sort="descending"]{color:var(--fg)}
th.sortable[aria-sort="ascending"]::after{content:"↑";color:var(--gold)}
th.sortable[aria-sort="descending"]::after{content:"↓";color:var(--gold)}
.lt-empty td{color:var(--dim);text-align:center;padding:18px}
.lt-none{padding:18px 16px;color:var(--dim);font-size:12.5px;text-align:center}
#viewport.phone .lt .lt-q{flex-basis:100%}
#viewport.phone .lt .lt-rows{margin-left:0}
/* ---- definition form (the file is the record; the form is a view of it) ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--ink);border:1px solid var(--border);border-radius:9px;padding:6px 8px;min-height:38px;transition:border-color .15s}
.chips:focus-within{border-color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 4px 2px 8px;border:1px solid var(--border);border-radius:6px;background:var(--hl);color:var(--fg);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:var(--dim);font-size:14px;line-height:1;padding:0 3px;cursor:pointer;border-radius:4px}
.chip button:hover{color:var(--st-failed);background:color-mix(in srgb,var(--st-failed) 12%,transparent)}
.field .chips input{width:auto;flex:1;min-width:110px;border:0;background:none;padding:2px 4px;font-size:12px;border-radius:0}
.field input[readonly]{color:var(--muted);background:var(--hl);cursor:default}
.fxl{display:grid;gap:8px}
.fxl .check{display:flex;margin:0;font-weight:400;color:var(--fg);font-size:13px;margin-bottom:0}
.fxl .check input{width:auto;margin-top:4px}
.fxl .check.off{opacity:.55;cursor:not-allowed}
.def-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border:1px solid color-mix(in srgb,var(--st-approval) 42%,transparent);background:color-mix(in srgb,var(--st-approval) 8%,transparent);border-radius:10px;margin-bottom:14px;font-size:12.5px;color:var(--body)}
.def-bar.pend{border-color:color-mix(in srgb,var(--st-proven) 42%,transparent);background:color-mix(in srgb,var(--st-proven) 8%,transparent)}
.def-bar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.def-bar .err{color:var(--st-failed)}
.srclink{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--ink);color:var(--fg);font-family:var(--mono);font-size:12px;text-decoration:none;transition:border-color .15s;min-width:0}
.srclink:hover{border-color:var(--rule)}
.srclink .ic{color:var(--dim);flex:none}
.srclink .p{min-width:0;overflow-wrap:anywhere}
.srclink .ar{margin-left:auto;color:var(--accent-text);font-family:var(--font);font-size:11.5px;white-space:nowrap;flex:none}
#viewport.phone .srclink .ar{display:none}
.def-form .panel{margin-bottom:14px}
.def-form textarea.mono{font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical}

/* ---- source editor: three stacked layers in one scroll container ----
   ed-mk (find marks, transparent text) < ed-hl (coloured text) < ed-t (real textarea, transparent text, live caret).
   All three share font, padding, line-height and white-space:pre so the glyphs sit on top of each other. */
.ed{--ed-lh:20px;--ed-pad:12px}
.ed-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);background:var(--panel);flex-wrap:wrap}
.ed-sp{flex:1}
.ed-dot{width:8px;height:8px;border-radius:50%;background:transparent;border:1px solid var(--rule);flex:none}
.ed-dot[data-on]{background:var(--st-approval);border-color:var(--st-approval)}
.ed-find{display:flex;align-items:center;gap:6px}
.ed-find input{background:var(--ink);border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:12px;width:170px;max-width:100%;outline:none;color:var(--fg);font-family:var(--mono)}
.ed-find input:focus{border-color:var(--gold)}
.ed-scroll{display:grid;grid-template-columns:max-content minmax(max-content,1fr);overflow:auto;max-height:calc(100vh - 300px);min-height:320px;background:var(--void);font-family:var(--mono);font-size:12.5px;line-height:var(--ed-lh);tab-size:2;scrollbar-width:thin}
