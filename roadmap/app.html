<title>Oxagen Roadmap</title>
<meta name="description" content="The living roadmap for Oxagen Mission Control: the gaps between the mockups and the build, the witness, the definition of done, the decisions, and the GitHub issues, live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Oxagen house tokens (dark first, parchment light). Source: oxagen-brand assets/tokens.css */
:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C; --border:#292722; --rule:#34322D;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A; --accent-text:#D6962C; --on-gold:#10100F;
  --st-allowed:#57A97C; --st-approval:#5B93D6; --st-denied:#C66A4A;
  --st-proven:#3FA2A2; --st-failed:#C0453C; --st-critical:#D6455E; --st-observe:#9B958A;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 44px rgba(0,0,0,.5);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:"Aeonik","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --radius:12px; --side-w:212px; --drawer-w:400px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C; --accent-text:#8B5E1A; --on-gold:#10100F;
  --st-allowed:#2F7D52; --st-approval:#2E6BA8; --st-denied:#9B4526;
  --st-proven:#1F7676; --st-failed:#992F28; --st-critical:#AE2540; --st-observe:#6B665C;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C; --accent-text:#8B5E1A; --on-gold:#10100F;
  --st-allowed:#2F7D52; --st-approval:#2E6BA8; --st-denied:#9B4526;
  --st-proven:#1F7676; --st-failed:#992F28; --st-critical:#AE2540; --st-observe:#6B665C;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:600}
h2{font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.9em}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.eyebrow.gold{color:var(--gold)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
[hidden]{display:none!important}

/* shell */
#app{display:grid;grid-template-columns:var(--side-w) 1fr;grid-template-rows:52px 1fr;height:100%;min-height:0}
#app.drawer-open{grid-template-columns:var(--side-w) 1fr var(--drawer-w)}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.mark{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark b{color:var(--gold);font-weight:700}
.mark .tag{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-weight:400}
.pills{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:var(--hl)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.pill.on i{background:var(--st-allowed)} .pill.warn i{background:var(--st-approval)} .pill.off i{background:var(--st-denied)}
.btn{border:1px solid var(--rule);background:var(--hl);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;line-height:1.3;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--border)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.gold:hover{background:var(--gold-bright)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
nav.side{border-right:1px solid var(--border);background:var(--panel);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav.side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--body);font-size:13.5px}
nav.side a:hover{background:var(--hl);text-decoration:none}
nav.side a.active{background:var(--hl);color:var(--fg);font-weight:600}
nav.side a .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--ink);border:1px solid var(--border);border-radius:5px;padding:0 5px}
nav.side .sep{margin:10px 10px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
main{overflow:auto;padding:22px 24px 60px;min-width:0}
.wrap{max-width:1120px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;margin-bottom:18px}
.page-head .lead{flex:1 1 380px;max-width:64ch;color:var(--body)}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

/* cards + state by shape */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.clickable{cursor:pointer} .card.clickable:hover{background:var(--hl)}
.card.built{border:3px double var(--rule)}
.card.partial,.card.fixtures-only,.card.open{border:1px dashed var(--rule)}
.card.not-started,.card.cut{border:1px solid var(--border)}
.card .title{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.card .title h3{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--border);color:var(--muted);background:var(--ink);white-space:nowrap}
.chip.p0{color:var(--st-critical);border-color:var(--st-critical)} .chip.p1{color:var(--st-denied)} .chip.p2{color:var(--st-approval)}
.chip.built{color:var(--st-allowed)} .chip.partial,.chip.fixtures-only{color:var(--st-approval)} .chip.not-started{color:var(--muted)} .chip.cut,.chip.defer{color:var(--dim);text-decoration:line-through}
.chip.open{color:var(--st-approval)} .chip.decided{color:var(--st-allowed)} .chip.unbacked{color:var(--st-denied);border-color:var(--st-denied)}
.chip.lbl{color:var(--body)}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat .v{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat .s{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.bar{height:6px;background:var(--hl);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b{background:var(--st-allowed)} .bar .p{background:var(--st-approval)} .bar .f{background:var(--st-observe)} .bar .n{background:transparent}
.section{margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
.section h2{margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.filters input[type=search]{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:200px;flex:1 1 200px}
.filters select{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
.tog{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.tog.on{color:var(--fg);border-color:var(--rule);background:var(--hl)}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--hl);text-align:left;padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--hl)}
td.num{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--rule);padding:8px 12px;color:var(--body);background:var(--panel);border-radius:0 8px 8px 0}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--body)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.detail{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.detail .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.milestone{display:grid;grid-template-columns:70px 1fr 160px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.milestone:first-child{border-top:0}
.milestone .id{font-family:var(--mono);color:var(--muted)}
.decision-q{font-size:15px;color:var(--fg)}
.banner{border:1px dashed var(--rule);border-radius:var(--radius);padding:10px 14px;color:var(--body);background:var(--panel);margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
textarea.field,input.field,select.field{width:100%;background:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--fg)}
textarea.field{min-height:90px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.frame-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--void);position:relative}
.frame-wrap iframe{width:100%;height:min(78vh,900px);border:0;display:block;background:var(--void)}
.frame-wrap.phone{display:flex;justify-content:center;padding:20px;background:var(--hl)}
.frame-wrap.phone iframe{width:390px;height:844px;border-radius:26px;border:8px solid var(--void);max-width:100%}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar select{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 8px}

/* Claude drawer */
aside.drawer{border-left:1px solid var(--border);background:var(--panel);display:none;flex-direction:column;min-height:0}
#app.drawer-open aside.drawer{display:flex}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.drawer .dh h3{flex:1}
.drawer .ctx{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drawer .ctx .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.drawer .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:100%;padding:8px 11px;border-radius:10px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.msg.user{background:var(--hl);align-self:flex-end;border:1px solid var(--border)}
.msg.ai{background:var(--ink);border:1px solid var(--border);align-self:stretch}
.msg.ai.thinking{color:var(--muted);font-style:italic}
.msg .tools{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px;border-top:1px dashed var(--border);padding-top:4px}
.drawer .quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.drawer .compose{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.drawer .compose textarea{min-height:64px}
.drawer .compose .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drawer .compose select{background:var(--ink);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px}

dialog{background:var(--panel);color:var(--fg);border:1px solid var(--rule);border-radius:var(--radius);padding:0;max-width:min(680px,94vw);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .db{padding:18px 20px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
dialog .db .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--hl);border:1px solid var(--rule);border-radius:10px;padding:8px 14px;font-size:13px;z-index:50;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent-text);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

@media (max-width: 980px){
  #app,#app.drawer-open{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  nav.side{flex-direction:row;overflow-x:auto;padding:6px 10px;border-right:0;border-bottom:1px solid var(--border);gap:4px}
  nav.side .sep{display:none}
  nav.side a{white-space:nowrap;padding:5px 10px}
  nav.side a .ct{display:none}
  main{padding:16px 16px 60px}
  aside.drawer{position:fixed;inset:52px 0 0 0;z-index:20;border-left:0}
  .kv{grid-template-columns:1fr}
  .milestone{grid-template-columns:60px 1fr;} .milestone .m3{grid-column:1/-1}
  header.top .mark .tag{display:none}
}
</style>

<div id="app">
  <header class="top">
    <div class="mark">oxagen <span class="tag">roadmap</span></div>
    <div class="pills">
      <span class="pill" id="pill-gh" title="GitHub issues"><i></i>GitHub: connecting</span>
      <span class="pill" id="pill-db" title="Shared roadmap state"><i></i>store</span>
      <span class="pill" id="pill-ai" title="Claude"><i></i>Claude</span>
      <button class="btn sm ghost" id="theme-btn" title="Theme">Theme</button>
      <button class="btn gold sm" id="ask-btn">Ask Claude</button>
    </div>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"><div class="wrap"><div class="empty">Loading the roadmap.</div></div></main>
  <aside class="drawer" id="drawer">
    <div class="dh"><h3>Claude</h3><select id="tier" title="Model tier"><option value="complex">Opus-class (complex)</option><option value="default">Default</option><option value="quick">Quick</option></select><button class="btn sm ghost" id="clear-chat" title="Clear the conversation">Clear</button><button class="btn sm ghost" id="close-drawer">Close</button></div>
    <div class="ctx" id="ctx"></div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick"></div>
    <div class="compose">
      <textarea class="field" id="chat-in" placeholder="Ask about the roadmap, or tell Claude what to change. It can update items, record decisions, link issues, and draft GitHub issues for you to confirm."></textarea>
      <div class="row"><span class="small muted" id="chat-status"></span><span style="flex:1"></span><button class="btn sm ghost" id="stop-btn" hidden>Stop</button><button class="btn sm" id="send-btn">Send</button></div>
    </div>
  </aside>
  <dialog id="dlg"><div class="db" id="dlg-body"></div></dialog>
  <div id="toast" role="status"></div>
</div>

<script type="application/json" id="roadmap-data">/*__DATA__*/</script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("roadmap-data").textContent || "{}");
const ORG = D.repos?.owner || "oxageninc";
const ROADMAP_REPO = D.repos?.roadmap || "product-roadmap";
const REPOS = D.repos?.tracked || ["product-roadmap", "oxagen", "stella"];
let GH = "GitHub";              // connector display name; confirmed against listTools() at boot
const BLOB = `https://github.com/${ORG}/${ROADMAP_REPO}/blob/main/`;
const MOCKUP = "mockups/missioncontrol.html";
const DOCS = "docs/missioncontrol-docs.html";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const fmtDate = s => s ? new Date(s).toLocaleDateString(undefined, {month:"short", day:"numeric"}) : "";
const ago = s => { if (!s) return ""; const d = (Date.now() - new Date(s)) / 864e5; return d < 1 ? "today" : d < 2 ? "yesterday" : `${Math.floor(d)}d ago`; };
const toast = (t) => { const x = $("#toast"); x.textContent = t; x.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => x.classList.remove("show"), 2600); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------- unified items ---------- */
const ITEMS = [];
for (const s of D.surfaces || []) ITEMS.push({ ...s, kind: "surface" });
for (const f of D.witness?.features || []) ITEMS.push({ ...f, kind: "witness", area: "witness", spec_path: f.spec_ref || "docs/witness-spec.md", priority: f.priority || "P1" });
for (const f of D.dod?.features || []) ITEMS.push({ ...f, kind: "dod", area: "dod", spec_path: f.spec_ref || "docs/dod-spec.md", priority: f.priority || "P1" });
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const DECISIONS = (D.decisions || []).map(d => ({ ...d }));
const CATALOG = D.catalog || { pages: [], scenarios: [] };
const ANN = D.issue_annotations || {};   // "repo#number" -> triage snapshot

/* ---------- state ---------- */
const S = {
  overrides: {},      // db: overrides/<itemId>
  decided: {},        // db: decisions/<id>
  activity: [],       // db: activity
  issues: {},         // repo -> {items:[], storedAt, error, total}
  prs: {},
  caps: { db: null, mcp: null, sample: null, comments: null, user: null, ready: false },
  uid: null,
  route: "now",
  arg: null,
  ui: lsGet("rm.ui", { filters: {} }),
};
const itemState = (it) => ({ ...it, ...(S.overrides[it.id] || {}) });
const statusOf = it => itemState(it).built_status || "not-started";
const prioOf = it => itemState(it).priority || "P2";
const decState = d => ({ ...d, ...(S.decided[d.id] || {}) });
const issueKey = (repo, n) => `${repo}#${n}`;
const liveIssue = (repo, n) => (S.issues[repo]?.items || []).find(i => i.number === n);
const ghLive = () => !!S.caps.mcp && !S.ghDown && Object.values(S.issues).some(r => r && !r.error);
const linksOf = (it) => (itemState(it).linked_issues || []).concat((it.issue_links || []).filter(l => !(itemState(it).linked_issues || []).some(x => x.repo === l.repo && x.number === l.number)));

/* ---------- router ---------- */
const NAV = [
  ["now", "Now"], ["gaps", "Gaps"], ["witness", "Witness"], ["done", "Done"], ["decisions", "Decisions"], ["issues", "Issues"], ["wireframes", "Wireframes"], ["docs", "Specs"],
];
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  const [route, ...rest] = path.split("/");
  S.route = NAV.some(n => n[0] === route) ? route : "now";
  S.arg = rest.join("/") || null;
  S.q = Object.fromEntries(new URLSearchParams(qs || ""));
}
function go(route, arg, q) { location.hash = "#/" + route + (arg ? "/" + arg : "") + (q ? "?" + new URLSearchParams(q) : ""); }
window.addEventListener("hashchange", () => { parseHash(); render(); });

/* ---------- nav ---------- */
function renderNav() {
  const counts = {
    gaps: ITEMS.filter(i => i.kind === "surface" && ["not-started","partial","fixtures-only"].includes(statusOf(i)) && !["cut","defer"].includes(i.scope_verdict)).length,
    witness: ITEMS.filter(i => i.kind === "witness" && statusOf(i) !== "built").length,
    done: ITEMS.filter(i => i.kind === "dod" && statusOf(i) !== "built").length,
    decisions: DECISIONS.filter(d => decState(d).status !== "decided").length,
    issues: Object.values(S.issues).reduce((a, r) => a + (r.total || r.items?.length || 0), 0) || null,
  };
  $("#nav").innerHTML = `<div class="sep">Roadmap</div>` + NAV.slice(0, 5).map(([r, t]) => `<a href="#/${r}" class="${S.route === r ? "active" : ""}">${t}${counts[r] != null ? `<span class="ct">${counts[r]}</span>` : ""}</a>`).join("") +
    `<div class="sep">Work</div>` + NAV.slice(5).map(([r, t]) => `<a href="#/${r}" class="${S.route === r ? "active" : ""}">${t}${counts[r] != null ? `<span class="ct">${counts[r]}</span>` : ""}</a>`).join("") +
    `<div class="sep">Links</div><a href="https://github.com/${ORG}/${ROADMAP_REPO}" target="_blank" rel="noopener">Repository ↗</a><a href="https://github.com/${ORG}" target="_blank" rel="noopener">${ORG} on GitHub ↗</a>`;
}

/* ---------- shared renderers ---------- */
const chip = (t, cls = "") => `<span class="chip ${cls}">${esc(t)}</span>`;
function statusChips(it) {
  const s = itemState(it);
  return chip(statusOf(it).replace("-", " "), statusOf(it)) + chip(prioOf(it), prioOf(it).toLowerCase()) + (it.scope_verdict && it.scope_verdict !== "keep" ? chip(it.scope_verdict, it.scope_verdict) : "") + (it.plan_lane ? chip(it.plan_lane) : "") + (s.owner ? chip("@" + s.owner) : "");
}
function itemCard(it) {
  const links = linksOf(it);
  return `<div class="card clickable ${statusOf(it)}" data-item="${esc(it.id)}" tabindex="0" role="button">
    <div class="title"><h3>${esc(it.title)}</h3>${it.route ? `<button class="btn sm ghost wf" data-wf="${esc(it.id)}" title="Open the wireframe">Wireframe</button>` : ""}</div>
    <div class="chips">${statusChips(it)}</div>
    <div class="small" style="color:var(--body)">${esc(it.gap_summary || it.summary || "")}</div>
    ${links.length ? `<div class="chips">${links.map(l => issueChip(l.repo, l.number)).join("")}</div>` : ""}
  </div>`;
}
function issueChip(repo, n) {
  const live = liveIssue(repo, n);
  const st = live ? (live.state === "OPEN" ? "open" : "closed") : (S.caps.mcp ? "loaded?" : "snapshot");
  const title = live?.title || ANN[issueKey(repo, n)]?.title || "";
  return `<a class="chip ${live ? (live.state === "OPEN" ? "open" : "decided") : ""}" href="https://github.com/${ORG}/${repo}/issues/${n}" target="_blank" rel="noopener" title="${esc(title)}">${esc(repo)}#${n} · ${st}</a>`;
}
function ghLabelChips(labels) { return (labels || []).slice(0, 5).map(l => chip(typeof l === "string" ? l : l.name, "lbl")).join(""); }

/* ---------- pages ---------- */
const PAGES = {
  now() {
    const surf = ITEMS.filter(i => i.kind === "surface" && !["cut"].includes(i.scope_verdict));

    const openDec = DECISIONS.filter(d => decState(d).status !== "decided");
    const live = Object.entries(S.issues).filter(([, r]) => r && !r.error);
    const liveOpen = live.reduce((a, [, r]) => a + (r.total ?? r.items?.length ?? 0), 0);
    const ghOn = ghLive();
    const unbacked = Object.entries(ANN).filter(([, a]) => (a.kind === "feature" || a.kind === "epic") && !a.has_spec_backing);

      </div>
      <div class="section" style="margin-top:0;border-top:0;padding-top:0"><h2>Build progress</h2>

      <div class="section"><h2>Milestones</h2><div class="card" style="gap:0">${ms.map(m => {

        return `<div class="milestone"><div class="id">${esc(m.id)}</div><div><div style="font-weight:600">${esc(m.title)}</div><div class="small muted">${its.length} surfaces · ${esc(m.weeks || "")}${m.summary ? " · " + esc(m.summary) : ""}</div></div><div class="m3"><div class="bar"><i class="b" style="width:${its.length ? 100*b/its.length : 0}%"></i><i class="p" style="width:${its.length ? 100*p/its.length : 0}%"></i></div><div class="small mono muted" style="margin-top:4px">${b} built · ${p} partial · ${its.length - b - p} to go</div></div></div>`;

      <div class="section"><h2>Next up</h2><div class="grid">${next.map(itemCard).join("") || '<div class="empty">Nothing is queued. Every P0 and P1 surface is built.</div>'}</div></div>

  },

  gaps() {

  witness() { return featurePage("witness", "The witness", D.witness?.summary, "docs/witness-spec.md"); },
  done() { return featurePage("dod", "Definition of done", D.dod?.summary, "docs/dod-spec.md"); },

  decisions() {

      ${(D.feedback || []).length ? `<div class="section"><h2>Maintainer feedback on the mockups</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>Feedback</th><th>Status</th></tr></thead><tbody>${D.feedback.map(f => `<tr><td class="num">${f.n}</td><td>${esc(f.text)}</td><td>${chip(f.status, f.status === "in" ? "built" : f.status === "open" ? "not-started" : "partial")}</td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
  },

  issues() {
    const f = S.ui.filters;
    const repo = f.repo || "oxagen";
    const r = S.issues[repo];
    const live = !!S.caps.mcp && !S.ghDown && !(r?.error && !r.items?.length);
    let rows = live ? (r?.items || []) : Object.entries(ANN).filter(([k]) => k.startsWith(repo + "#")).map(([k, a]) => ({ number: +k.split("#")[1], title: a.title, labels: a.labels || [], updated_at: a.updatedAt, state: "OPEN", snapshot: true }));
    const themes = [...new Set(Object.values(ANN).map(a => a.theme).filter(Boolean))].sort();
    rows = rows.map(i => ({ ...i, ann: ANN[issueKey(repo, i.number)] }));
    if (f.theme) rows = rows.filter(i => i.ann?.theme === f.theme);
    if (f.unbacked) rows = rows.filter(i => i.ann && (i.ann.kind === "feature" || i.ann.kind === "epic") && !i.ann.has_spec_backing);
    if (f.decision) rows = rows.filter(i => i.ann?.kind === "decision" || (i.labels || []).some(l => (l.name || l) === "needs:decision"));
    if (f.iq) { const q = f.iq.toLowerCase(); rows = rows.filter(i => (i.title || "").toLowerCase().includes(q) || String(i.number).includes(q)); }
    const linkedTo = {}; for (const it of ITEMS) for (const l of linksOf(it)) if (l.repo === repo) (linkedTo[l.number] ||= []).push(it);
    return `<div class="page-head"><div><div class="eyebrow">${live ? "Live from GitHub" : "Snapshot"}</div><h1>Issues</h1></div>
      <p class="lead">${live ? `Open issues in ${esc(ORG)}/${esc(repo)}, the 100 most recently updated, refreshed every two minutes through your GitHub connector. ${r?.storedAt ? "Last updated " + ago(new Date(r.storedAt).toISOString()) + "." : ""}` : ((S.ghDown || r?.error) ? ghErrorCopy(S.ghDown || r.error) + " Until then this is the triage snapshot" : "Open this page in claude.ai with the GitHub connector for live status. This is the triage snapshot") + (D.issue_snapshot_date ? " from " + esc(D.issue_snapshot_date) : "") + "."}</p>

      <div class="filters">
        ${REPOS.map(x => `<button class="tog ${repo === x ? "on" : ""}" data-repo="${x}">${x}${S.issues[x]?.total != null ? ` · ${S.issues[x].total}` : ""}</button>`).join("")}
        <input type="search" id="f-iq" placeholder="Search title or number" value="${esc(f.iq || "")}">
        <select id="f-theme"><option value="">Any theme</option>${themes.map(t => `<option ${f.theme === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
        <button class="tog ${f.unbacked ? "on" : ""}" id="f-unbacked">no spec backing</button>

      ${rows.map(i => `<tr class="clickable" data-issue="${repo}#${i.number}"><td class="num"><a href="https://github.com/${ORG}/${repo}/issues/${i.number}" target="_blank" rel="noopener">#${i.number}</a></td><td>${esc(i.title)}</td><td><div class="chips">${ghLabelChips(i.labels)}</div></td><td><div class="chips">${i.ann ? chip(i.ann.theme) + chip(i.ann.kind) + (["feature","epic"].includes(i.ann.kind) && !i.ann.has_spec_backing ? chip("no spec", "unbacked") : "") : '<span class="dim small">new since triage</span>'}</div></td><td><div class="chips">${(linkedTo[i.number] || []).map(it => `<a class="chip" href="#/${it.kind === "surface" ? "gaps" : it.kind === "witness" ? "witness" : "done"}/${esc(it.id)}">${esc(it.title)}</a>`).join("")}</div></td><td class="num">${ago(i.updated_at)}</td></tr>`).join("") || `<tr><td colspan="6"><div class="empty">${live && !r ? '<span class="spin"></span> Loading from GitHub' : "No issues match."}</div></td></tr>`}

  },

  wireframes() {

        ${page?.id ? `<a class="btn ghost sm" href="${BLOB}mockups/pages/${esc(page.id)}.md" target="_blank" rel="noopener">Page spec ↗</a>` : ""}
      </div>
      <div class="frame-wrap ${mobile ? "phone" : ""}"><iframe id="wf" src="${esc(url)}" title="Mission Control mockup"></iframe></div>
      ${item ? `<div class="section"><h2>What the build is missing here</h2>${itemCard(item)}</div>` : ""}`;

  docs() {
    const docs = D.docs || [];
    const cur = S.arg ? docs.find(d => d.id === S.arg) : null;
    return `<div class="page-head"><div><div class="eyebrow">Specs and plans</div><h1>Specs</h1></div>
      <p class="lead">The documents the roadmap is built from. Each opens on GitHub; the rendered set is framed below.</p></div>
      <div class="grid" style="margin-bottom:18px">${docs.map(d => `<div class="card"><div class="title"><h3>${esc(d.title)}</h3></div><div class="small" style="color:var(--body)">${esc(d.summary || "")}</div><div class="row" style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn sm" href="${BLOB}${esc(d.path)}" target="_blank" rel="noopener">GitHub ↗</a>${d.anchor ? `<a class="btn sm ghost" href="#/docs/${esc(d.id)}">Read here</a>` : ""}<button class="btn sm ghost" data-ask="Summarize ${esc(d.path)} in five bullets and list what it says is still undecided.">Ask Claude</button></div></div>`).join("")}</div>
      <div class="frame-wrap"><iframe src="${DOCS}${cur?.anchor ? "#" + esc(cur.anchor) : ""}" title="Mission Control documents"></iframe></div>`;
  },
};
const statusRank = it => ({ "not-started": 0, "fixtures-only": 1, partial: 2, built: 3 })[statusOf(it)] ?? 0;
function groupOptions(pages, sel) {
  const groups = [...new Set(pages.map(p => p.group))];
  return groups.map(g => `<optgroup label="${esc(g)}">${pages.filter(p => p.group === g).map(p => `<option value="${esc(p.id)}" ${sel === p.id ? "selected" : ""}>${esc(p.title)}</option>`).join("")}</optgroup>`).join("");
}
function mockupUrl({ state, mobile, theme, hash }) {
  const q = new URLSearchParams(); q.set("product", "1"); if (state) q.set("state", state); q.set("mobile", mobile ? "1" : "0"); if (theme) q.set("theme", theme);
  return `${MOCKUP}?${q}${hash || ""}`;
}
function featurePage(kind, title, summary, spec) {
  if (S.arg && byId[S.arg]) return itemDetail(byId[S.arg]);
  const list = ITEMS.filter(i => i.kind === kind);
  const need = list.filter(i => itemState(i).decision_needed);
  return `<div class="page-head"><div><div class="eyebrow">${kind === "witness" ? "Proven, not claimed" : "A gate, not a badge"}</div><h1>${esc(title)}</h1></div>
    <p class="lead">${esc(summary || "")}</p>
    <div class="actions"><a class="btn" href="${BLOB}${spec}" target="_blank" rel="noopener">Read the spec ↗</a><button class="btn" data-ask="For the ${kind === "witness" ? "witness" : "definition of done"} features, propose a build order that ships a first usable version fastest, and name the decision each step needs.">Ask for a build order</button></div></div>
    ${need.length ? `<div class="banner">${need.length} feature${need.length > 1 ? "s" : ""} here need a decision before they can be built. They are marked below.</div>` : ""}
    <div class="grid">${list.map(itemCard).join("") || '<div class="empty">No features in the data.</div>'}</div>`;
}
function decisionCard(d) {
  const s = decState(d);
  return `<div class="card ${s.status === "decided" ? "built" : "open"}" data-decision="${esc(d.id)}">
    <div class="title"><h3>${esc(d.title)}</h3><span class="chip mono">${esc(d.id)}</span></div>
    <div class="decision-q">${esc(d.question)}</div>
    ${d.recommendation ? `<div class="note small"><b>Recommendation.</b> ${esc(d.recommendation)}</div>` : ""}
    ${s.status === "decided" ? `<div class="note small" style="border-left-color:var(--st-allowed)"><b>Decided${s.decided_on ? " " + esc(s.decided_on) : ""}.</b> ${esc(s.decided || "")}</div>` : ""}
    <div class="chips">${chip(s.status || "open", s.status || "open")}${(d.blocks || []).map(b => chip("blocks " + b)).join("")}${d.source ? chip(d.source) : ""}</div>
    <div class="row" style="display:flex;gap:6px;flex-wrap:wrap">
      ${s.status !== "decided" ? `<button class="btn sm" data-decide="${esc(d.id)}">Decide</button>` : `<button class="btn sm ghost" data-reopen="${esc(d.id)}">Reopen</button>`}
      <button class="btn sm ghost" data-ask="Argue both sides of decision ${esc(d.id)} (${esc(d.title)}): ${esc(d.question)} Then recommend one option and say what it unblocks.">Argue both sides</button>
      <button class="btn sm ghost" data-issue-decision="${esc(d.id)}">Open as issue</button>
      <button class="btn sm ghost" data-comment="${esc(d.id)}">Comment</button>
    </div></div>`;
}
function itemDetail(it) {
  const s = itemState(it);
  const back = it.kind === "surface" ? "gaps" : it.kind === "witness" ? "witness" : "done";

function ghErrorCopy(e) {

/* ---------- GitHub live data ---------- */
const watches = [];
function startGitHub() {
  const mcp = S.caps.mcp; if (!mcp) { setPill("gh", "off", "GitHub: snapshot"); return; }
  if (S.ghDown) { setPill("gh", "off", S.ghDown.code === "server_not_connected" ? "GitHub: add the connector" : "GitHub: " + S.ghDown.code.replace(/_/g, " ")); return; }
  setPill("gh", "warn", "GitHub: loading");
  for (const repo of REPOS) {
    const input = { owner: ORG, repo, state: "OPEN", perPage: 100, orderBy: "UPDATED_AT", direction: "DESC", fields: ["number","title","state","labels","assignees","comments","created_at","updated_at","user"] };
    const un = mcp.watchTool(GH, "list_issues", input, (ev) => {
      if (ev.type === "data") {
        const p = payloadOf(ev.result);
        S.issues[repo] = { items: p.issues || [], total: p.totalCount ?? (p.issues || []).length, hasNext: !!p.pageInfo?.hasNextPage, cursor: p.pageInfo?.endCursor, storedAt: ev.result.cache?.storedAt || Date.now(), error: null };
        S.ghDown = null; setPill("gh", "on", "GitHub: live");
      } else {
        const e = ev.error; const had = !!S.issues[repo]?.storedAt; S.issues[repo] = { ...(S.issues[repo] || { items: [] }), error: e };
        const authz = ["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"].includes(e.code);
        if (authz || !had) {
          // A first round that fails (no connector, consent not given, upstream down) stops every watch: each call would re-ask the viewer. The Issues page offers a retry.
          if (authz) S.issues[repo].items = [];
          S.ghDown = e; setPill("gh", "off", "GitHub: " + (e.code === "server_not_connected" ? "add the connector" : authz ? e.code.replace(/_/g, " ") : "unreachable, snapshot shown"));
          watches.splice(0).forEach(un => { try { un(); } catch {} });
        } else setPill("gh", "warn", "GitHub: retrying, last data shown");
      }
      if (["now","issues","gaps","witness","done","wireframes"].includes(S.route)) render(); else renderNav();
    }, { refetchInterval: 120000, cache: { staleTime: 60000 } });
    watches.push(un);
  }
}
function payloadOf(r) { if (r.payload && typeof r.payload === "object") return r.payload; try { return JSON.parse(r.content?.[0]?.text || "{}"); } catch { return {}; } }
async function loadOlder(repo) {
  const mcp = S.caps.mcp, r = S.issues[repo]; if (!mcp || !r?.cursor) return;
  try {
    const res = await mcp.callTool(GH, "list_issues", { owner: ORG, repo, state: "OPEN", perPage: 100, orderBy: "UPDATED_AT", direction: "DESC", after: r.cursor, fields: ["number","title","state","labels","assignees","comments","created_at","updated_at","user"] });
    const p = payloadOf(res); const seen = new Set(r.items.map(i => i.number));
    r.items = r.items.concat((p.issues || []).filter(i => !seen.has(i.number))); r.hasNext = !!p.pageInfo?.hasNextPage; r.cursor = p.pageInfo?.endCursor; render();
  } catch (err) { toast(ghErrorCopy(err)); }
}
function setPill(which, cls, text) { const p = $("#pill-" + which); p.className = "pill " + cls; p.innerHTML = `<i></i>${esc(text)}`; }

function renderCtx() {

async function askClaude(text) {

  const bubble = el(`<div class="msg ai thinking">Thinking…</div>`); $("#msgs").append(bubble); $("#msgs").scrollTop = 1e9;
