<title>The shape of your business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ───────────────────────────────────────────────────────────────
   Oxagen Mission Control · Ontology
   House system: oxagen-house-brand/tokens/house-tokens.css
   Dark-first: :root carries the dark palette; light overrides follow.
   ─────────────────────────────────────────────────────────────── */

:root{
  /* house tokens, dark */
  --ox-gold:#D6962C; --ox-gold-bright:#F1C364; --ox-gold-deep:#8B5E1A;

  --bg:#10100F;
  --bg-deep:#0A0A09;
  --panel:#181715;
  --panel-2:#201F1C;
  --hl:#201F1C;
  --border:#292722;
  --rule:#34322D;

  --fg:#F2EEE5;
  --body:#DDD8CD;
  --muted:#9B958A;
  --dim:#6E6A62;

  --gold:#D6962C;          /* identity + the one primary action */
  --gold-text:#D6962C;
  --gold-hover:#F1C364;
  --on-gold:#10100F;

  /* semantic states — separate from gold, gold never encodes state */
  --ok:#48A98A;            /* allowed · proven · healthy · confirmed */
  --wait:#6E9DE0;          /* needs approval · proposed · in progress */
  --bad:#DB625A;           /* denied · failed · critical */
  --drift:#A98AD0;         /* drift · unverified · stale */
  --neutral:#9B958A;       /* unmoved · waived · not applicable */

  --focus:#F1C364;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --font:"Space Grotesk","Helvetica Neue",Arial,sans-serif;

  --r-panel:12px;
  --r-lg:14px;
  --r-sm:6px;
  --r-btn:8px;

  --sidebar-w:246px;
  --topbar-h:52px;
}

@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2EEE5;
    --bg-deep:#E8E2D5;
    --panel:#F8F5EE;
    --panel-2:#FDFBF6;
    --hl:#EDE7DA;
    --border:#D8CDBD;
    --rule:#C9BFAE;

    --fg:#10100F;
    --body:#2A2823;
    --muted:#6B665C;
    --dim:#8C877C;

    --gold-text:#8B5E1A;
    --gold-hover:#A87424;
    --on-gold:#10100F;

    --ok:#1F6E52;
    --wait:#2C5BA0;
    --bad:#A53229;
    --drift:#6A4B96;
    --neutral:#6B665C;

    --focus:#8B5E1A;
  }
}

:root[data-theme="light"]{
  --bg:#F2EEE5;
  --bg-deep:#E8E2D5;
  --panel:#F8F5EE;
  --panel-2:#FDFBF6;
  --hl:#EDE7DA;
  --border:#D8CDBD;
  --rule:#C9BFAE;

  --fg:#10100F;
  --body:#2A2823;
  --muted:#6B665C;
  --dim:#8C877C;

  --gold-text:#8B5E1A;
  --gold-hover:#A87424;
  --on-gold:#10100F;

  --ok:#1F6E52;
  --wait:#2C5BA0;
  --bad:#A53229;
  --drift:#6A4B96;
  --neutral:#6B665C;

  --focus:#8B5E1A;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--body);
  font-family:var(--font);
  font-weight:400;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--fg);text-wrap:balance;letter-spacing:-0.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
code,kbd,.mono,pre{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ── mockup chrome (never product UI) ─────────────────────────── */
#statebar{
  position:fixed;right:14px;bottom:14px;z-index:900;
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;
  background:#0A0A09;color:#9B958A;
  border:1px solid #34322D;border-radius:8px;
  padding:7px 8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
  max-width:min(92vw,420px);
  box-shadow:0 8px 28px rgba(0,0,0,.45);
}
#statebar .sb-label{color:#6E6A62;padding-right:4px;text-transform:uppercase;letter-spacing:.12em}
#statebar button{
  background:#181715;border:1px solid #292722;color:#9B958A;
  border-radius:4px;padding:3px 7px;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;
}
#statebar button:hover{border-color:#6E6A62;color:#F2EEE5}
#statebar button[aria-pressed="true"]{background:#F2EEE5;color:#10100F;border-color:#F2EEE5}

/* ── viewport (container for the whole app; phone state shrinks it) ── */
.viewport{
  container-type:inline-size;
  container-name:app;
  background:var(--bg);
}
.viewport.phone{
  width:400px;max-width:100%;
  height:820px;
  margin:26px auto;
  overflow-y:auto;overflow-x:hidden;
  border:1px solid var(--rule);
  border-radius:24px;
  box-shadow:0 30px 70px rgba(0,0,0,.4);
}
body:has(.viewport.phone){background:var(--bg-deep)}

/* ── app shell ────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.viewport.phone .shell{min-height:0}

/* sidebar */
.side{
  border-right:1px solid var(--border);
  background:var(--panel);
  position:sticky;top:0;align-self:start;
  height:100vh;overflow:auto;
  display:flex;flex-direction:column;
}
.viewport.phone .side{height:auto}
.side-top{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.lockup{display:block;width:118px;height:auto;color:var(--fg)}
.orgswitch{
  margin-top:12px;width:100%;display:flex;align-items:center;gap:8px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-btn);
  padding:7px 9px;cursor:pointer;text-align:left;
}
.orgswitch:hover{border-color:var(--rule)}
.orgswitch .ini{
  width:22px;height:22px;border-radius:5px;flex:0 0 auto;
  background:var(--gold);color:var(--on-gold);
  display:grid;place-items:center;font-weight:700;font-size:11px;
}
.orgswitch .txt{min-width:0;flex:1}
.orgswitch .txt b{display:block;font-size:12.5px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgswitch .txt span{display:block;font-size:11px;color:var(--muted);font-family:var(--mono)}
.orgswitch .chev{color:var(--dim);font-size:10px}

.navgroup{padding:12px 10px 4px}
.navgroup .eyebrow{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600;padding:0 6px 8px;
}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{
  display:flex;align-items:center;gap:9px;
  padding:7px 9px;border-radius:var(--r-btn);
  text-decoration:none;color:var(--body);font-size:13.5px;font-weight:500;
  border:1px solid transparent;
}
.nav a:hover{background:var(--hl);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--hl);color:var(--fg);border-color:var(--border)}
.nav a[aria-current="page"] .ico{color:var(--gold-text)}
.nav .ico{width:15px;height:15px;flex:0 0 auto;color:var(--dim)}
.nav .tail{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.nav .tail.alert{color:var(--wait)}
.side-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--rule);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--fg);flex:0 0 auto}
.side-foot .who b{display:block;font-size:12.5px;color:var(--fg);font-weight:600}
.side-foot .who span{display:block;font-size:11px;color:var(--muted)}

/* main */
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--topbar-h);flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);
}
.hamburger{display:none;background:none;border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 7px;cursor:pointer;color:var(--body)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0;overflow:hidden}
.crumbs a{color:var(--muted);text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--dim)}
.crumbs b{color:var(--fg);font-weight:600;white-space:nowrap}
.topbar .spacer{flex:1}
.cmdk{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-btn);
  padding:5px 9px;cursor:pointer;color:var(--muted);font-size:12.5px;min-width:190px;
}
.cmdk:hover{border-color:var(--rule);color:var(--body)}
.cmdk kbd{
  margin-left:auto;font-size:10.5px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--dim);
}
.iconbtn{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-btn);
  padding:6px 8px;cursor:pointer;color:var(--body);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
}
.iconbtn:hover{border-color:var(--rule);color:var(--fg)}
.iconbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-text)}
.iconbtn svg{width:14px;height:14px}

/* page */
.page{padding:20px 22px 90px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pagehead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pagehead .ph-title{min-width:0;flex:1 1 320px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);font-weight:600;margin-bottom:7px}
.pagehead h1{font-size:24px;line-height:1.15}
.pagehead .sub{color:var(--muted);font-size:13px;margin-top:5px;max-width:66ch}
.headtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{
  background:var(--panel);border:1px solid var(--border);color:var(--body);
  border-radius:var(--r-btn);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{border-color:var(--rule);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:0 0 auto}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn-primary:hover{background:var(--gold-hover);border-color:var(--gold-hover);color:#10100F}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn-quiet:hover{background:var(--hl);color:var(--fg);border-color:var(--border)}
.btn-danger{border-color:color-mix(in srgb,var(--bad) 45%,var(--border));color:var(--bad)}

/* select */
.sel{
  background:var(--panel);border:1px solid var(--border);color:var(--body);
  border-radius:var(--r-btn);padding:6px 10px;font-size:12.5px;cursor:pointer;
}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.input{
  background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-btn);
  padding:8px 10px;font-size:13px;color:var(--fg);width:100%;
}
.input::placeholder{color:var(--dim)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.tabs a{
  padding:9px 13px;text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px;
}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--gold)}
.tabs .cnt{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-panel);min-width:0}
.panel-hd{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 14px;border-bottom:1px solid var(--border);
}
.panel-hd h3{font-size:14px}
.panel-hd .hint{color:var(--muted);font-size:12px}
.panel-hd .right{margin-left:auto;display:flex;align-items:center;gap:7px}
.panel-bd{padding:14px}
.panel-bd.flush{padding:0}
.panel-ft{padding:10px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.split-l{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;background:var(--panel)}
.stat{padding:11px 14px;border-right:1px solid var(--border);min-width:0}
.stat:last-child{border-right:none}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-size:19px;font-weight:600;color:var(--fg);margin-top:3px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.stat .v small{font-size:11.5px;font-weight:500;color:var(--muted);font-family:var(--mono)}
.stat .b{font-size:11.5px;color:var(--dim);margin-top:2px;font-family:var(--mono)}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:100px;padding:2px 8px;font-size:11.5px;font-weight:500;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.badge.wait{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 40%,transparent);background:color-mix(in srgb,var(--wait) 11%,transparent)}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.badge.drift{color:var(--drift);border-color:color-mix(in srgb,var(--drift) 40%,transparent);background:color-mix(in srgb,var(--drift) 11%,transparent)}
.badge.mono{font-family:var(--mono);font-size:11px}
.badge.plain{background:var(--panel-2)}

.tag{
  display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:1px 6px;color:var(--muted);
}
.tag.gold{color:var(--gold-text);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.tbl th{
  text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);
  white-space:nowrap;background:var(--panel);
}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--body)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:var(--hl)}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
table.tbl td b{color:var(--fg);font-weight:600}
.rowlink{cursor:pointer}

/* code */
pre.code{
  background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.6;color:var(--body);margin:0;
}
pre.code .kw{color:var(--gold-text);font-weight:500}
pre.code .lbl{color:var(--ok)}
pre.code .str{color:var(--drift)}
pre.code .cmt{color:var(--dim)}
pre.code .inj{color:var(--wait)}
pre.code .bad{color:var(--bad);text-decoration:underline wavy}
pre.code mark{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--fg);border-radius:3px;padding:0 2px}
pre.code mark.ins{background:color-mix(in srgb,var(--wait) 20%,transparent)}

/* diff */
.diff{background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-family:var(--mono);font-size:12px;line-height:1.65}
.diff .fname{padding:7px 12px;border-bottom:1px solid var(--border);color:var(--fg);background:var(--panel-2);display:flex;gap:8px;align-items:center}
.diff .lines{overflow-x:auto;padding:8px 0}
.diff .ln{display:block;padding:0 12px;white-space:pre}
.diff .ln.add{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.diff .ln.del{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.diff .ln.hunk{color:var(--muted);background:var(--hl)}

/* map */
.mapwrap{overflow-x:auto;background:var(--bg-deep);border-bottom:1px solid var(--border)}
.map{display:block;min-width:790px;width:100%;height:auto}
.map .node rect{fill:var(--panel);stroke:var(--border);stroke-width:1;transition:stroke .12s,fill .12s}
.map .node:hover rect,.map .node.sel rect{stroke:var(--gold);fill:var(--panel-2)}
.map .node.proposed rect{stroke:var(--wait);stroke-dasharray:4 3}
.map .node{cursor:pointer}
.map .nm{fill:var(--fg);font-size:14px;font-weight:600;font-family:var(--font)}
.map .ct{fill:var(--muted);font-size:12px;font-family:var(--mono)}
.map .edge{stroke:var(--rule);stroke-width:1.2;fill:none;opacity:.7}
.map .edge.lit{stroke:var(--gold);opacity:1;stroke-width:1.6}
.map .edge.dim{opacity:.16}
.map .elabel{fill:var(--gold-text);font-size:10px;font-family:var(--mono);opacity:0}
.map .elabel.lit{opacity:1}
.map .schema-box{fill:none;stroke:var(--border);stroke-dasharray:3 4;rx:12}
.map .schema-lbl{fill:var(--dim);font-size:10.5px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.map .node:focus{outline:none}
.map .node:focus-visible rect{stroke:var(--focus);stroke-width:2}

.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;font-size:11.5px;color:var(--muted);align-items:center}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{width:9px;height:9px;border-radius:50%}
.legend .swbox{width:16px;height:11px;border-radius:3px;border:1px dashed var(--wait)}

/* rail */
.rail{display:flex;flex-direction:column;gap:0}
.rail .sec{padding:12px 14px;border-bottom:1px solid var(--border)}
.rail .sec:last-child{border-bottom:none}
.rail .sec h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px}
.kv .k{color:var(--muted);white-space:nowrap}
.kv .v{color:var(--fg);text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.kv .v.mono{font-family:var(--mono);font-size:12px}

.list{display:flex;flex-direction:column}
.list .it{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.list .it:last-child{border-bottom:none}
.list .it:hover{background:var(--hl)}
.list .it.sel{background:var(--hl);box-shadow:inset 2px 0 0 var(--gold)}
.list .it .mainc{min-width:0;flex:1}
.list .it b{display:block;color:var(--fg);font-size:13px;font-weight:600}
.list .it span{display:block;color:var(--muted);font-size:11.5px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}

/* frames (context frames) */
.frame{border:1px solid var(--border);border-radius:10px;background:var(--panel-2);overflow:hidden}
.frame .fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 11px;border-bottom:1px solid var(--border);background:var(--panel)}
.frame .fb{padding:10px 11px;font-size:12.5px;color:var(--body)}
.frame .fm{padding:8px 11px;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* meters */
.meter{height:5px;border-radius:100px;background:var(--hl);overflow:hidden;border:1px solid var(--border)}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.wait{background:var(--wait)}
.meter i.bad{background:var(--bad)}
.meter i.drift{background:var(--drift)}

/* severity stripe rows */
.sev{border-left:3px solid var(--border);padding-left:11px}
.sev.bad{border-left-color:var(--bad)}
.sev.drift{border-left-color:var(--drift)}
.sev.wait{border-left-color:var(--wait)}
.sev.ok{border-left-color:var(--ok)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(10,10,9,.62);backdrop-filter:blur(2px);z-index:200;display:grid;place-items:center;padding:20px}
.dialog{
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);
  width:min(660px,100%);max-height:86vh;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.dialog .dh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dialog .dh h3{font-size:15px}
.dialog .dh .x{margin-left:auto}
.dialog .db{padding:16px;display:flex;flex-direction:column;gap:14px}
.dialog .df{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* command menu */
.cmdpal{width:min(600px,100%);align-self:start;margin-top:9vh}
.cmdpal .cinput{width:100%;border:none;background:transparent;padding:14px 16px;font-size:15px;color:var(--fg);outline:none}
.cmdrow{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;border-top:1px solid var(--border)}
.cmdrow:hover,.cmdrow.on{background:var(--hl)}
.cmdrow .cg{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* assistant */
.assistant{
  border-left:1px solid var(--border);background:var(--panel);
  width:340px;flex:0 0 340px;position:sticky;top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h));overflow:auto;display:flex;flex-direction:column;
}
.withassist{display:grid;grid-template-columns:minmax(0,1fr) auto}
.assistant[hidden]{display:none}
.msg{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px}
.msg .who{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;display:flex;gap:7px;align-items:center}
.msg.agent .who{color:var(--gold-text)}

/* states */
.skel{background:linear-gradient(90deg,var(--hl) 25%,var(--panel-2) 50%,var(--hl) 75%);background-size:220% 100%;animation:sh 1.3s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-220% 0}}
.statebox{
  border:1px solid var(--border);border-radius:var(--r-panel);background:var(--panel);
  padding:34px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
}
.statebox .icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--border);background:var(--panel-2)}
.statebox h3{font-size:16px}
.statebox p{color:var(--muted);font-size:13px;max-width:52ch}
.statebox .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.statebox.err .icon{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.statebox.denied .icon{border-color:color-mix(in srgb,var(--wait) 45%,transparent);color:var(--wait)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:800;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;
  padding:10px 14px;font-size:13px;color:var(--fg);display:flex;gap:10px;align-items:center;
  box-shadow:0 14px 34px rgba(0,0,0,.4);max-width:min(92vw,540px);
}
.toast .tg{font-family:var(--mono);font-size:11px;color:var(--muted)}

hr.rule{border:none;border-top:1px solid var(--border);margin:0}
.muted{color:var(--muted)}
.dimtx{color:var(--dim)}
.small{font-size:12px}
.xsmall{font-size:11.5px}
.mono-sm{font-family:var(--mono);font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowb{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nowrap{white-space:nowrap}
.right{margin-left:auto}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

function freshBadge(mins){
  if (mins===null) return ['wait','not materialized'];
  if (mins<15) return ['ok', mins+'m ago'];
  if (mins<60) return ['drift', mins+'m ago'];
  return ['drift', Math.round(mins/60)+'h ago'];
}

function parseHash(){
  const raw = location.hash.replace(/^#/,"") || "/"+ORG.slug+"/"+WS.slug+"/ontology/model";
  const [path, qs] = raw.split("?");
  const segs = path.split("/").filter(Boolean);
  const tab = segs[3] && TABS.some(t=>t[0]===segs[3]) ? segs[3] : "model";
  route = { tab, params:new URLSearchParams(qs||"") };
}
function go(tab, params){
  const p = new URLSearchParams(params||{});
  const q = p.toString();
  location.hash = "/"+ORG.slug+"/"+WS.slug+"/ontology/"+tab + (q? "?"+q : "");
}
function setParam(k,v){
  const p = new URLSearchParams(route.params);
  if (v===null || v===undefined) p.delete(k); else p.set(k,v);
  go(route.tab, p);
}

const NODE_W = 150, NODE_H = 52;
const VER_SCALE = { v14:1, v13:0.93, v12:0.45, v11:0.21, v1:0.066 };

function activeVersion(){ return route.params.get("as_of") || "v14"; }
function versionRec(v){ return VERSIONS.find(x=>x.v===v) || VERSIONS[0]; }
function visibleClasses(){
  const vr = versionRec(activeVersion());
  return CLASSES.filter(c=>!vr.absent.includes(c.id));
}
function scaledCount(c){
  const v = activeVersion();
  if (v==="v14") return c.n;
  return Math.round(c.n * (VER_SCALE[v]||1));
}

function anchorPoint(from,to){
  const dx = to.x-from.x, dy = to.y-from.y;
  const hw = NODE_W/2+7, hh = NODE_H/2+7;
  const sx = dx===0 ? Infinity : Math.abs(hw/dx);
  const sy = dy===0 ? Infinity : Math.abs(hh/dy);
  const s = Math.min(sx,sy);
  return { x:from.x+dx*s, y:from.y+dy*s };
}

function renderMap(selId){
  const vis = visibleClasses();
  const ids = new Set(vis.map(c=>c.id));
  const rels = RELATIONS.filter(r=>ids.has(r[0]) && ids.has(r[1]));

  // schema cluster boxes
  const boxes = Object.keys(SCHEMAS).map(sc=>{
    const ns = vis.filter(c=>c.schema===sc);
    if (!ns.length) return "";
    const pad = 20;
    const x1 = Math.min(...ns.map(n=>n.x))-NODE_W/2-pad;
    const x2 = Math.max(...ns.map(n=>n.x))+NODE_W/2+pad;
    const y1 = Math.min(...ns.map(n=>n.y))-NODE_H/2-pad-12;
    const y2 = Math.max(...ns.map(n=>n.y))+NODE_H/2+pad;
    return '<rect class="schema-box" x="'+x1+'" y="'+y1+'" width="'+(x2-x1)+'" height="'+(y2-y1)+'" rx="12"/>'+
           '<text class="schema-lbl" x="'+(x1+11)+'" y="'+(y1+15)+'">'+esc(SCHEMAS[sc].label)+'</text>';
  }).join("");

  const edges = rels.map((r,i)=>{
    const a = CLS[r[0]], b = CLS[r[1]];
    const p1 = anchorPoint(a,b), p2 = anchorPoint(b,a);
    const lit = selId && (r[0]===selId || r[1]===selId);
    const dim = selId && !lit;
    const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
    const w = r[2].length*5.6+10;
    return '<g data-edge="'+i+'">'+
      '<path class="edge'+(lit?' lit':'')+(dim?' dim':'')+'" d="M'+p1.x.toFixed(1)+' '+p1.y.toFixed(1)+' L'+p2.x.toFixed(1)+' '+p2.y.toFixed(1)+'"/>'+
      (lit? '<rect x="'+(mx-w/2)+'" y="'+(my-8)+'" width="'+w+'" height="16" rx="4" fill="var(--bg-deep)" stroke="var(--border)"/>'+
            '<text class="elabel lit" x="'+mx+'" y="'+(my+4)+'" text-anchor="middle">'+esc(r[2])+'</text>' : '')+
    '</g>';
  }).join("");

  const nodes = vis.map(c=>{
    const [fc, ftxt] = freshBadge(c.proposed? null : c.fresh);
    const sel = c.id===selId;
    const x = c.x-NODE_W/2, y = c.y-NODE_H/2;
    const pips = c.sources.map((s,i)=>
      '<rect x="'+(x+NODE_W-16-i*11)+'" y="'+(y+NODE_H-16)+'" width="8" height="8" rx="2" fill="var(--dim)"><title>'+SRCNAME[s]+'</title></rect>').join("");
    return '<g class="node'+(c.proposed?' proposed':'')+(sel?' sel':'')+'" data-class="'+c.id+'" tabindex="0" role="button" aria-label="'+esc(c.id)+', '+nf(scaledCount(c))+' entities">'+
      '<rect x="'+x+'" y="'+y+'" width="'+NODE_W+'" height="'+NODE_H+'" rx="9"/>'+
      '<circle cx="'+(x+13)+'" cy="'+(y+15)+'" r="3.6" fill="var(--'+fc+')"><title>'+ftxt+'</title></circle>'+
      '<text class="nm" x="'+(x+24)+'" y="'+(y+19)+'">'+esc(c.id)+'</text>'+
      '<text class="ct" x="'+(x+13)+'" y="'+(y+39)+'">'+(c.proposed? 'proposed · 1,402' : nf(scaledCount(c))+' entities')+'</text>'+
      pips+
    '</g>';
  }).join("");

  return '<svg class="map" viewBox="0 0 900 712" role="img" aria-label="Ontology class map for core-platform, '+vis.length+' classes">'+
    boxes + edges + nodes + '</svg>';
}

  const vis = visibleClasses();
  const sel = route.params.get("cls");

  const activeCount = vis.filter(c=>!c.proposed).length;
  const proposedCount = vis.filter(c=>c.proposed).length;
  const visRels = RELATIONS.filter(r=>vis.some(c=>c.id===r[0]) && vis.some(c=>c.id===r[1])).length;
  const asOfBanner = v!=="v14" ? '<div class="panel" style="border-color:color-mix(in srgb,var(--drift) 45%,var(--border))"><div class="panel-bd" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+

      '<span class="small">You are looking at ontology <b>'+esc(v)+'</b>, activated by PR #'+vr.pr+'. '+esc(vr.absent.length)+' classes that exist today did not exist yet; counts are what the graph held then.</span>'+

    '</div></div>' : "";

  return asOfBanner +

function cypherHTML(text, badLine){
  const kws = /\b(MATCH|OPTIONAL MATCH|WHERE|WITH|RETURN|ORDER BY|SKIP|LIMIT|UNWIND|AND|OR|AS|COLLECT|COUNT|DISTINCT|DETACH DELETE|DELETE|CREATE|SET|MERGE|REMOVE)\b/g;
  return text.split("\n").map((ln,i)=>{
    let h = esc(ln)
      .replace(kws, m=>'<span class="kw">'+m+'</span>')
      .replace(/:([A-Z][A-Za-z]+)/g, ':<span class="lbl">$1</span>')
      .replace(/'([^']*)'/g, "'<span class=\"str\">$1</span>'");
    if (badLine && i===badLine) h = '<mark>'+h+'</mark>';
    return h;
  }).join("\n");
}

           VERSIONS.map(v=>'<option value="'+v.v+'"'+(v.v===activeVersion()?' selected':'')+'>'+

     TABS.map(t=>'<a href="#/'+ORG.slug+'/'+WS.slug+'/ontology/'+t[0]+'"'+(t[0]===route.tab?' aria-current="page"':'')+'>'+
       t[1]+'<span class="cnt">'+TAB_COUNTS[t[0]]+'</span></a>').join("")+
   '</nav>';

  let body;
  if (uiState==="loading") body = loadingView();

  else body = { model:modelTab, graph:graphTab, sources:sourcesTab,
                repositories:repositoriesTab, versions:versionsTab }[route.tab]();

  $("#page").innerHTML = head + body;

      ["Open the ontology map","Ontology · Model","model"],
      ["Show the open ontology proposal","acme/platform#1188","versions"],

      ["Link a repository","governed action","link"],
      ["Add a source","governed action","source"],

  const d = DIALOGS[name];

  '</div></div>';
}

  renderPage();

  wirePage();

function wirePage(){
  const asof = $("#asof");
  if (asof) asof.addEventListener("change", e=>{
    const v = e.target.value;
    const p = new URLSearchParams(route.params);
    if (v==="v14") p.delete("as_of"); else p.set("as_of", v);
    p.delete("cls");
    go(route.tab, p);
  });

  // map: hover lights relations, click pins the rail
  const wrap = $("#mapwrap");
  if (wrap){
    let pinned = route.params.get("cls");
    wrap.addEventListener("mouseover", e=>{
      const g = e.target.closest("[data-class]");
      if (!g) return;
      const id = g.dataset.class;
      if (id === currentHover) return;
      currentHover = id;
      wrap.innerHTML = renderMap(id);
      const rail = $(".split .panel:last-child");
      if (rail) rail.innerHTML = railFor(CLS[id]);
    });
    wrap.addEventListener("mouseleave", ()=>{
      currentHover = null;
      wrap.innerHTML = renderMap(pinned);
      const rail = $(".split .panel:last-child");
      if (rail) rail.innerHTML = railFor(pinned? CLS[pinned] : null);
    });
    wrap.addEventListener("focusin", e=>{
      const g = e.target.closest("[data-class]");
      if (!g) return;
      const rail = $(".split .panel:last-child");
      if (rail) rail.innerHTML = railFor(CLS[g.dataset.class]);
    });
  }
}
let currentHover = null;

document.addEventListener("click", e=>{
  const t = e.target;

  // close a dialog
  if (t.closest("[data-close]")){ e.preventDefault(); closeDialog(); return; }

  // command menu rows
  const cmd = t.closest("[data-cmd]");
  if (cmd){
    const k = cmd.dataset.cmd;
    const map = { graph:"graph", model:"model", versions:"versions", repositories:"repositories" };
    if (map[k]) { history.back(); setTimeout(()=>go(map[k]),0); }
    else if (k==="sync") { history.back(); setTimeout(()=>openDialog("sync-repo"),0); }
    else if (k==="link") { history.back(); setTimeout(()=>openDialog("link-repo"),0); }
    else if (k==="source"){ history.back(); setTimeout(()=>openDialog("add-source"),0); }
    else if (k==="branch"){ history.back(); setTimeout(()=>openDialog("set-branch"),0); }
    else { history.back(); setTimeout(()=>toast("Fleet and Spend are their own pages — this mockup covers Ontology.","W7"),0); }
    return;
  }

  // dialog confirm → governed action + receipt
  const conf = t.closest("[data-confirm]");
  if (conf){
    const d = DIALOGS[conf.dataset.confirm];
    closeDialog();
    if (d && d.primary) setTimeout(()=>toast(d.primary[1], d.primary[2]), 60);
    return;
  }

  // map node / table row → pin a class
  const node = t.closest("[data-class]");
  if (node && route.tab==="model"){ setParam("cls", node.dataset.class); return; }

  const act = t.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;

  switch(a){
    case "ask": {
      const q = act.dataset.q || "q1";
      setParam("q", q);
      break;
    }
    case "entity": {
      const p = new URLSearchParams(route.params);
      p.set("entity", act.dataset.entity);
      p.delete("dialog"); p.delete("expand");
      if (route.tab!=="graph") { go("graph", p); } else { go("graph", p); }
      break;
    }
    case "expand": setParam("expand", route.params.get("expand")==="1" ? null : "1"); break;
    case "explore": {
      const p = new URLSearchParams(); p.set("q","q1");
      go("graph", p);
      break;
    }
    case "as-of": {
      const p = new URLSearchParams(route.params);
      const v = act.dataset.v;
      p.delete("pr"); p.delete("cls");
      if (v==="v14") p.delete("as_of"); else p.set("as_of", v);
      go("model", p);
      toast(v==="v14" ? "Map back to now — ontology v14" : "Map as of "+versionRec(v).at.slice(0,10)+" — ontology "+v, "as_of");
      break;
    }
    case "as-now": { const p=new URLSearchParams(route.params); p.delete("as_of"); go("model",p); break; }
    case "open-pr": setParam("pr","1188"); break;
    case "close-pr": setParam("pr", route.params.get("pr")? null : "1188"); break;
    case "review-pr": toast("GitHub is where the review happens — merge is the activation event.","acme/platform#1188"); break;
    case "fit": { const w=$("#mapwrap"); if(w) w.scrollLeft=0; toast("Map fitted · 19 active classes, 19 relation types","v14"); break; }
    case "open-graph": go("graph", {q:"q1", entity:ENTITY.id}); break;
    case "retry": setState("loaded"); toast("Graph service answered · ontology v14 read at 15:14:31 UTC","req_01K5F2M9"); break;
    case "status": toast("org_acme · Neo4j 5.26 · one database per organization","status"); break;
    case "copy-req": toast("Copied req_01K5F2M8QT","clipboard"); break;
    case "switch-ws": toast("finops is Dana Okafor's workspace — this mockup is core-platform.","W7"); break;
    case "docs": toast("The profiler is deterministic first; a model only names what it already found.","§11.2"); break;
    case "assist-send": toast("Queued as a turn on run run_01K5F0QW","in-app agent"); break;
    case "src-settings": toast("Connector settings are a governed action — schedule, tables, redaction classes.","§11.2"); break;

    case "link-repo": case "add-source": case "propose": case "set-branch":
    case "resolve": case "upgrade-index": case "sync-repo": case "sync-source":
    case "propose-drift": case "pick-entity": case "request-access":
      openDialog(a, act.dataset.cls? {cls:act.dataset.cls} : null);
      break;
  }
});

/* keyboard */
document.addEventListener("keydown", e=>{
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openDialog("cmdk"); return; }
  if (e.key==="Escape" && route.params.get("dialog")){ e.preventDefault(); closeDialog(); return; }
  if (e.key==="Enter"){
    const it = e.target.closest && e.target.closest("[data-act='entity']");
    if (it){ e.preventDefault(); it.click(); }
  }
});
