*{box-sizing:border-box}

body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.9em}

/* shell */
#app{display:grid;grid-template-columns:var(--side-w) 1fr;grid-template-rows:52px 1fr;height:100%;min-height:0}
#app.drawer-open{grid-template-columns:var(--side-w) 1fr var(--drawer-w)}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}

.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:var(--hl)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.pill.on i{background:var(--st-allowed)} .pill.warn i{background:var(--st-approval)} .pill.off i{background:var(--st-denied)}

.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}

nav.side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--body);font-size:13.5px}

nav.side .sep{margin:10px 10px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
main{overflow:auto;padding:22px 24px 60px;min-width:0}
.wrap{max-width:1120px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;margin-bottom:18px}
.page-head .lead{flex:1 1 380px;max-width:64ch;color:var(--body)}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

.section{margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}

.tog{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}

.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--hl);text-align:left;padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--hl)}
td.num{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--rule);padding:8px 12px;color:var(--body);background:var(--panel);border-radius:0 8px 8px 0}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--body)}

val_rule.* contracts and migration 20260916120200; app half (#2970) still open."},{"id":"D6","title":"Record kinds: six or twelve","question":"The spec says twelve record kinds; the mockup and Stella have six.","recommendation":"Six, and correct the spec.","source":"docs/implementation-plan.md §6 Q5 / §2.2 W3","blocks":["L1","steering"],"status":"decided","decided_on":"2026-09-15","decided":"Six: apps/app/src/data/contracts/steering.ts RECORD_KINDS ('the six kinds of context-record/v0.1, spec §10.2')."},{"id":"D7","title":"Base UI and motion versions","question":"Bump packages/ui to Base UI 1.8 and motion 13 with the app, or keep the kit's versions?","recommendation":"Keep the kit's versions; bump the kit in its own PR.","source":"docs/implementation-plan.md §6 Q6","blocks":["L2"],"status":"decided","decided_on":"2026-09-17","decided":"App pins @base-ui/react 1.5.0 matching packages/ui; motion removed from the app (WL-02)."},{"id":"D8","title":"Vocabulary drift (W3)","question":"Replay grade, egress, schema origin, agent status and verdict enums: mockup strings or spec App. A?","recommendation":"View-model enums follow the spec; the adapter maps mockup values once.","source":"docs/implementation-plan.md §2.2 W3","blocks":["L1"],"status":"decided","decided_on":"2026-09-13","decided":"Spec vocabulary in src/data/contracts; enforced by the trust-values arch test (apps/app/src/test/arch/trust-values.test.ts)."},{"id":"D9","title":"Fixture adapter and fixture integrity (W4, W5)","question":"Should the app carry a typed fixture adapter seeded from mockups/fixtures/*.json with an integrity test?","recommendation":"Yes (plan §4.5), with a unit test that fails on a dangling id.","source":"docs/implementation-plan.md §2.2 W4, W5","blocks":["L1"],"status":"decided","decided_on":"2026-09-13","decided":"Overridden by ARCHITECTURE.md §5: the runtime fixture adapter (12,942 lines) was deleted; pages read live contracts and render <NotRecorded> for unbacked slices; an e2e seed repl const fmtDate = s => s ? new Date(s).toLocaleDateString(undefined, {month:"short", day:"numeric"}) : "";
const ago = s => { if (!s) return ""; const d = (Date.now() - new Date(s)) / 864e5; return d < 1 ? "today" : d < 2 ? "yesterday" : `${Math.floor(d)}d ago`; };
const toast = (t) => { const x = $("#toast"); x.textContent = t; x.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => x.classList.remove("show"), 2600); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------- unified items ---------- */
const ITEMS = [];
for (const s of D.surfaces || []) ITEMS.push({ ...s, kind: "surface" });
for (const f of D.witness?.features || []) ITEMS.push({ ...f, kind: "witness", area: "witness", spec_path: f.spec_ref || "docs/witness-spec.md", priority: f.priority || "P1" });
for (const f of D.dod?.features || []) ITEMS.push({ ...f, kind: "dod", area: "dod", spec_path: f.spec_ref || "docs/dod-spec.md", priority: f.priority || "P1" });
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const DECISIONS = (D.decisions || []).map(d => ({ ...d }));
const CATALOG = D.catalog || { pages: [], scenarios: [] };
const ANN = D.issue_annotations || {};   // "repo#number" -> triage snapshot

/* ---------- state ---------- */
const S = {
  overrides: {},      // db: overrides/<itemId>
  decided: {},        // db: decisions/<id>
  activity: [],       // db: activity
  issues: {},         // repo -> {items:[], storedAt, error, total}
  prs: {},
  caps: { db: null, mcp: null, sample: null, comments: null, user: null, ready: false },
  uid: null,
  route: "now",
  arg: null,
  ui: lsGet("rm.ui", { filters: {} }),
};
const itemState = (it) => ({ ...it, ...(S.overrides[it.id] || {}) });
const statusOf = it => itemState(it).built_status || "not-started";
const prioOf = it => itemState(it).priority || "P2";
const decState = d => ({ ...d, ...(S.decided[d.id] || {}) });
const issueKey = (repo, n) => `${repo}#${n}`;
const liveIssue = (repo, n) => (S.issues[repo]?.items || []).find(i => i.number === n);
const ghLive = () => !!S.caps.mcp && !S.ghDown && Object.values(S.issues).some(r => r && !r.error);
const linksOf = (it) => (itemState(it).linked_issues || []).concat((it.issue_links || []).filter(l => !(itemState(it).linked_issues || []).some(x => x.repo === l.repo && x.number === l.number)));

/* ---------- router ---------- */
const NAV = [
  ["now", "Now"], ["gaps", "Gaps"], ["witness", "Witness"], ["done", "Done"], ["decisions", "Decisions"], ["issues", "Issues"], ["wireframes", "Wireframes"], ["docs", "Specs"],
];
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  const [route, ...rest] = path.split("/");
  S.route = NAV.some(n => n[0] === route) ? route : "now";
  S.arg = rest.join("/") || null;
  S.q = Object.fromEntries(new URLSearchParams(qs || ""));
}
function go(route, arg, q) { location.hash = "#/" + route + (arg ? "/" + arg : "") + (q ? "?" + new URLSearchParams(q) : ""); }
window.addEventListener("hashchange", () => { parseHash(); render(); });

/* ---------- nav ---------- */
function renderNav() {
  const counts = {
    gaps: ITEMS.filter(i => i.kind === "surface" && ["not-started","partial","fixtures-only"].includes(statusOf(i)) && !["cut","defer"].includes(i.scope_verdict)).length,
    witness: ITEMS.filter(i => i.kind === "witness" && statusOf(i) !== "built").length,
    done: ITEMS.filter(i => i.kind === "dod" && statusOf(i) !== "built").length,
    decisions: DECISIONS.filter(d => decState(d).status !== "decided").length,
    issues: Object.values(S.issues).reduce((a, r) => a + (r.total || r.items?.length || 0), 0) || null,
  };
  $("#nav").innerHTML = `<div class="sep">Roadmap</div>` + NAV.slice(0, 5).map(([r, t]) => `<a href="#/${r}" class="${S.route === r ? "active" : ""}">${t}${counts[r] != null ? `<span class="ct">${counts[r]}</span>` : ""}</a>`).join("") +
    `<div class="sep">Work</div>` + NAV.slice(5).map(([r, t]) => `<a href="#/${r}" class="${S.route === r ? "active" : ""}">${t}${counts[r] != null ? `<span class="ct">${counts[r]}</span>` : ""}</a>`).join("") +
    `<div class="sep">Links</div><a href="https://github.com/${ORG}/${ROADMAP_REPO}" target="_blank" rel="noopener">Repository ↗</a><a href="https://github.com/${ORG}" target="_blank" rel="noopener">${ORG} on GitHub ↗</a>`;
}

/* ---------- shared renderers ---------- */
const chip = (t, cls = "") => `<span class="chip ${cls}">${esc(t)}</span>`;
function statusChips(it) {
  const s = itemState(it);
  return chip(statusOf(it).replace("-", " "), statusOf(it)) + chip(prioOf(it), prioOf(it).toLowerCase()) + (it.scope_verdict && it.scope_verdict !== "keep" ? chip(it.scope_verdict, it.scope_verdict) : "") + (it.plan_lane ? chip(it.plan_lane) : "") + (s.owner ? chip("@" + s.owner) : "");
}
function itemCard(it) {
  const links = linksOf(it);
  return `<div class="card clickable ${statusOf(it)}" data-item="${esc(it.id)}" tabindex="0" role="button">
    <div class="title"><h3>${esc(it.title)}</h3>${it.route ? `<button class="btn sm ghost wf" data-wf="${esc(it.id)}" title="Open the wireframe">Wireframe</button>` : ""}</div>
    <div class="chips">${statusChips(it)}</div>
    <div class="small" style="color:var(--body)">${esc(it.gap_summary || it.summary || "")}</div>
    ${links.length ? `<div class="chips">${links.map(l => issueChip(l.repo, l.number)).join("")}</div>` : ""}
  </div>`;
}
function issueChip(repo, n) {
  const live = liveIssue(repo, n);
  const st = live ? (live.state === "OPEN" ? "open" : "closed") : (S.caps.mcp ? "loaded?" : "snapshot");
  const title = live?.title || ANN[issueKey(repo, n)]?.title || "";
  return `<a class="chip ${live ? (live.state === "OPEN" ? "open" : "decided") : ""}" href="https://github.com/${ORG}/${repo}/issues/${n}" target="_blank" rel="noopener" title="${esc(title)}">${esc(repo)}#${n} · ${st}</a>`;
}
function ghLabelChips(labels) { return (labels || []).slice(0, 5).map(l => chip(typeof l === "string" ? l : l.name, "lbl")).join(""); }

/* ---------- pages ---------- */
const PAGES = {
  now() {
    const surf = ITEMS.filter(i => i.kind === "surface" && !["cut"].includes(i.scope_verdict));
    const n = (st) => surf.filter(i => statusOf(i) === st).length;
    const built = n("built"), partial = n("partial"), fix = n("fixtures-only"), ns = n("not-started");
    const openDec = DECISIONS.filter(d => decState(d).status !== "decided");
    const live = Object.entries(S.issues).filter(([, r]) => r && !r.error);
    const liveOpen = live.reduce((a, [, r]) => a + (r.total ?? r.items?.length ?? 0), 0);
    const ghOn = ghLive();
    const unbacked = Object.entries(ANN).filter(([, a]) => (a.kind === "feature" || a.kind === "epic") && !a.has_spec_backing);
    const next = surf.filter(i => ["not-started","partial","fixtures-only"].includes(statusOf(i)) && ["P0","P1"].includes(prioOf(i))).sort((a, b) => prioOf(a).localeCompare(prioOf(b))).slice(0, 8);
    const ms = D.milestones || [];
    return `<div class="page-head"><div><div class="eyebrow gold">Mission Control</div><h1>What we build next</h1></div>
      <p class="lead">${esc(D.thesis || "The mockups are the spec. This page is the distance between them and the build, the witness and the definition of done that make a run provable, and the decisions that unblock the work. GitHub status is live; everything else is editable here and by Claude.")}</p>
      <div class="actions"><button class="btn" data-ask="Suggest the five most valuable things to build next, with a one-line reason each, using the roadmap overview.">Ask what to build next</button></div></div>
      <div class="stats">
        <div class="stat"><div class="v">${surf.length}</div><div class="l">surfaces in the mockups</div><div class="s">${(D.catalog?.pages || []).length} pages · ${(D.catalog?.scenarios || []).length} scenarios</div></div>
        <div class="stat"><div class="v">${built}</div><div class="l">built</div><div class="s">${partial} partial · ${fix} on fixtures</div></div>
        <div class="stat"><div class="v">${ns}</div><div class="l">not started</div><div class="s">${surf.filter(i => prioOf(i) === "P0" && statusOf(i) !== "built").length} are P0</div></div>
        <div class="stat"><div class="v">${openDec.length}</div><div class="l">decisions open</div><div class="s">${DECISIONS.length - openDec.length} decided</div></div>
        <div class="stat"><div class="v">${ghOn ? liveOpen : (S.caps.mcp && !S.ghDown && !Object.keys(S.issues).length ? '<span class="spin"></span>' : Object.keys(ANN).length)}</div><div class="l">open issues${ghOn ? "" : " (snapshot)"}</div><div class="s">${(ghOn && live.map(([r, x]) => `${r} ${x.total ?? x.items?.length ?? "…"}`).join(" · ")) || (D.issue_snapshot_date ? "as of " + D.issue_snapshot_date : "")}</div></div>
        <div class="stat"><div class="v">${unbacked.length}</div><div class="l">features without a spec</div><div class="s">need a design doc first</div></div>
      </div>
      <div class="section" style="margin-top:0;border-top:0;padding-top:0"><h2>Build progress</h2>
        <div class="bar" style="height:10px;margin-bottom:8px"><i class="b" style="width:${100*built/surf.length}%"></i><i class="p" style="width:${100*(partial+fix)/surf.length}%"></i></div>
        <div class="small muted">Double border is built. Dashed is partial or on fixtures. Single is not started. State by shape, never by colour alone.</div></div>
      <div class="section"><h2>Milestones</h2><div class="card" style="gap:0">${ms.map(m => {
        const its = (m.surfaces || []).map(id => byId[id]).filter(Boolean);
        const b = its.filter(i => statusOf(i) === "built").length, p = its.filter(i => ["partial","fixtures-only"].includes(statusOf(i))).length;
        return `<div class="milestone"><div class="id">${esc(m.id)}</div><div><div style="font-weight:600">${esc(m.title)}</div><div class="small muted">${its.length} surfaces · ${esc(m.weeks || "")}${m.summary ? " · " + esc(m.summary) : ""}</div></div><div class="m3"><div class="bar"><i class="b" style="width:${its.length ? 100*b/its.length : 0}%"></i><i class="p" style="width:${its.length ? 100*p/its.length : 0}%"></i></div><div class="small mono muted" style="margin-top:4px">${b} built · ${p} partial · ${its.length - b - p} to go</div></div></div>`;
      }).join("") || '<div class="empty">No milestones in the data.</div>'}</div></div>
      <div class="section"><h2>Next up</h2><div class="grid">${next.map(itemCard).join("") || '<div class="empty">Nothing is queued. Every P0 and P1 surface is built.</div>'}</div></div>
      <div class="section"><h2>Decisions blocking work</h2><div class="grid">${openDec.slice(0, 6).map(decisionCard).join("") || '<div class="empty">No open decisions.</div>'}</div></div>
      <div class="section"><h2>Recent activity</h2>${activityList()}</div>`;
  },

  gaps() {
    if (S.arg && byId[S.arg]) return itemDetail(byId[S.arg]);
    const f = S.ui.filters;
    const areas = [...new Set(ITEMS.filter(i => i.kind === "surface").map(i => i.area))];
    let list = ITEMS.filter(i => i.kind === "surface");
    if (f.area) list = list.filter(i => i.area === f.area);
    if (f.status) list = list.filter(i => statusOf(i) === f.status);
    if (f.prio) list = list.filter(i => prioOf(i) === f.prio);
    if (!f.showCut) list = list.filter(i => i.scope_verdict !== "cut");
    if (f.q) { const q = f.q.toLowerCase(); list = list.filter(i => JSON.stringify(i).toLowerCase().includes(q)); }
    list.sort((a, b) => prioOf(a).localeCompare(prioOf(b)) || statusRank(a) - statusRank(b));
    return `<div class="page-head"><div><div class="eyebrow">Mockups vs build</div><h1>Gaps</h1></div>
      <p class="lead">Every page and wizard in the master mockup, and what the build does today. Open one for the concrete gaps, the backend gaps, the spec, the wireframe, and the live issues. Create an issue from any gap; ask Claude for a plan.</p></div>
      <div class="filters">
        <input type="search" id="f-q" placeholder="Search surfaces" value="${esc(f.q || "")}">
        <select id="f-area"><option value="">All areas</option>${areas.map(a => `<option ${f.area === a ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
        <select id="f-status"><option value="">Any status</option>${["not-started","fixtures-only","partial","built"].map(s => `<option value="${s}" ${f.status === s ? "selected" : ""}>${s.replace("-"," ")}</option>`).join("")}</select>
        <select id="f-prio"><option value="">Any priority</option>${["P0","P1","P2","P3"].map(s => `<option ${f.prio === s ? "selected" : ""}>${s}</option>`).join("")}</select>
        <button class="tog ${f.showCut ? "on" : ""}" id="f-cut">show cut</button>
        <span class="small muted">${list.length} shown</span></div>
      <div class="grid">${list.map(itemCard).join("") || '<div class="empty">Nothing matches.</div>'}</div>`;
  },

  witness() { return featurePage("witness", "The witness", D.witness?.summary, "docs/witness-spec.md"); },
  done() { return featurePage("dod", "Definition of done", D.dod?.summary, "docs/dod-spec.md"); },

  decisions() {
    const open = DECISIONS.filter(d => decState(d).status !== "decided"), done = DECISIONS.filter(d => decState(d).status === "decided");
    return `<div class="page-head"><div><div class="eyebrow">Open questions with a recommendation each</div><h1>Decisions</h1></div>
      <p class="lead">Each one blocks a named lane. Decide it here and the record is shared; ask Claude to argue both sides first; or open it as a GitHub issue with the <span class="mono">needs:decision</span> label so the team sees it.</p>
      <div class="actions"><button class="btn" data-ask="Rank the open decisions by how much work each one unblocks, and say which one to make first and why.">Which decision first?</button></div></div>
      <h2 style="margin-bottom:12px">Open · ${open.length}</h2><div class="grid">${open.map(decisionCard).join("") || '<div class="empty">Every decision is made.</div>'}</div>
      <div class="section"><h2>Decided · ${done.length}</h2><div class="grid">${done.map(decisionCard).join("")}</div></div>
      ${(D.feedback || []).length ? `<div class="section"><h2>Maintainer feedback on the mockups</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>Feedback</th><th>Status</th></tr></thead><tbody>${D.feedback.map(f => `<tr><td class="num">${f.n}</td><td>${esc(f.text)}</td><td>${chip(f.status, f.status === "in" ? "built" : f.status === "open" ? "not-started" : "partial")}</td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
  },

  issues() {
    const f = S.ui.filters;
    const repo = f.repo || "oxagen";
    const r = S.issues[repo];
    const live = !!S.caps.mcp && !S.ghDown && !(r?.error && !r.items?.length);
    let rows = live ? (r?.items || []) : Object.entries(ANN).filter(([k]) => k.startsWith(repo + "#")).map(([k, a]) => ({ number: +k.split("#")[1], title: a.title, labels: a.labels || [], updated_at: a.updatedAt, state: "OPEN", snapshot: true }));
    const themes = [...new Set(Object.values(ANN).map(a => a.theme).filter(Boolean))].sort();
    rows = rows.map(i => ({ ...i, ann: ANN[issueKey(repo, i.number)] }));
    if (f.theme) rows = rows.filter(i => i.ann?.theme === f.theme);
    if (f.unbacked) rows = rows.filter(i => i.ann && (i.ann.kind === "feature" || i.ann.kind === "epic") && !i.ann.has_spec_backing);
    if (f.decision) rows = rows.filter(i => i.ann?.kind === "decision" || (i.labels || []).some(l => (l.name || l) === "needs:decision"));
    if (f.iq) { const q = f.iq.toLowerCase(); rows = rows.filter(i => (i.title || "").toLowerCase().includes(q) || String(i.number).includes(q)); }
    const linkedTo = {}; for (const it of ITEMS) for (const l of linksOf(it)) if (l.repo === repo) (linkedTo[l.number] ||= []).push(it);
    return `<div class="page-head"><div><div class="eyebrow">${live ? "Live from GitHub" : "Snapshot"}</div><h1>Issues</h1></div>
      <p class="lead">${live ? `Open issues in ${esc(ORG)}/${esc(repo)}, the 100 most recently updated, refreshed every two minutes through your GitHub connector. ${r?.storedAt ? "Last updated " + ago(new Date(r.storedAt).toISOString()) + "." : ""}` : ((S.ghDown || r?.error) ? ghErrorCopy(S.ghDown || r.error) + " Until then this is the triage snapshot" : "Open this page in claude.ai with the GitHub connector for live status. This is the triage snapshot") + (D.issue_snapshot_date ? " from " + esc(D.issue_snapshot_date) : "") + "."}</p>
      <div class="actions"><button class="btn" id="new-issue">New issue</button>${live ? `<button class="btn ghost" id="refresh-issues">Refresh</button>` : ""}</div></div>
      ${(S.ghDown || r?.error) && S.caps.mcp ? `<div class="banner"><span style="flex:1">${esc(ghErrorCopy(S.ghDown || r.error))}</span><button class="btn sm" id="retry-gh">Retry GitHub</button></div>` : ""}
      <div class="filters">
        ${REPOS.map(x => `<button class="tog ${repo === x ? "on" : ""}" data-repo="${x}">${x}${S.issues[x]?.total != null ? ` · ${S.issues[x].total}` : ""}</button>`).join("")}
        <input type="search" id="f-iq" placeholder="Search title or number" value="${esc(f.iq || "")}">
        <select id="f-theme"><option value="">Any theme</option>${themes.map(t => `<option ${f.theme === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
        <button class="tog ${f.unbacked ? "on" : ""}" id="f-unbacked">no spec backing</button>
        <button class="tog ${f.decision ? "on" : ""}" id="f-decision">needs a decision</button>
        <span class="small muted">${rows.length} shown</span></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Title</th><th>Labels</th><th>Triage</th><th>Roadmap</th><th>Updated</th></tr></thead><tbody>
      ${rows.map(i => `<tr class="clickable" data-issue="${repo}#${i.number}"><td class="num"><a href="https://github.com/${ORG}/${repo}/issues/${i.number}" target="_blank" rel="noopener">#${i.number}</a></td><td>${esc(i.title)}</td><td><div class="chips">${ghLabelChips(i.labels)}</div></td><td><div class="chips">${i.ann ? chip(i.ann.theme) + chip(i.ann.kind) + (["feature","epic"].includes(i.ann.kind) && !i.ann.has_spec_backing ? chip("no spec", "unbacked") : "") : '<span class="dim small">new since triage</span>'}</div></td><td><div class="chips">${(linkedTo[i.number] || []).map(it => `<a class="chip" href="#/${it.kind === "surface" ? "gaps" : it.kind === "witness" ? "witness" : "done"}/${esc(it.id)}">${esc(it.title)}</a>`).join("")}</div></td><td class="num">${ago(i.updated_at)}</td></tr>`).join("") || `<tr><td colspan="6"><div class="empty">${live && !r ? '<span class="spin"></span> Loading from GitHub' : "No issues match."}</div></td></tr>`}
      </tbody></table></div>
      ${live && r?.hasNext ? `<div style="margin-top:10px"><button class="btn" id="more-issues">Load older issues</button></div>` : ""}`;
  },

  wireframes() {
    const pages = CATALOG.pages || [], sc = CATALOG.scenarios || [];
    const q = S.q || {};
    const pid = S.arg || q.page || pages[0]?.id;
    const page = pages.find(p => p.id === pid) || pages[0];
    const scen = sc.find(s => s.id === q.scenario);
    const state = q.state || "loaded", mobile = q.mobile === "1", theme = q.theme || "";
    const hash = scen ? `#/${CATALOG.org || "a-intel"}/${scen.ws}/scenarios/${scen.id}/1` : (page?.hash || "");
    const url = mockupUrl({ state: scen ? null : state, mobile, theme, hash });
    const item = page && byId[page.id];
    return `<div class="page-head"><div><div class="eyebrow">The master mockup, framed</div><h1>Wireframes</h1></div>
      <p class="lead">Every page in every state, desktop and mobile, straight from <span class="mono">mockups/missioncontrol.html</span>. Pick a page or a guided scenario. The roadmap card for the page is linked below the frame.</p>
      <div class="actions"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open full size ↗</a></div></div>
      <div class="toolbar">
        <select id="wf-page">${groupOptions(pages, page?.id)}</select>
        <select id="wf-scenario"><option value="">No scenario</option>${sc.map(s => `<option value="${esc(s.id)}" ${scen?.id === s.id ? "selected" : ""}>W${s.n} · ${esc(s.title)}</option>`).join("")}</select>
        <select id="wf-state" ${scen ? "disabled" : ""}>${(page?.states || ["loaded"]).map(s => `<option value="${s}" ${state === s ? "selected" : ""}>${s}</option>`).join("")}</select>
        <button class="tog ${mobile ? "on" : ""}" id="wf-mobile">phone</button>
        <select id="wf-theme"><option value="">viewer theme</option><option value="dark" ${theme === "dark" ? "selected" : ""}>dark</option><option value="light" ${theme === "light" ? "selected" : ""}>light</option></select>
        ${item ? `<a class="btn ghost sm" href="#/gaps/${esc(item.id)}">Roadmap card: ${esc(item.title)}</a>` : ""}
        ${page?.id ? `<a class="btn ghost sm" href="${BLOB}mockups/pages/${esc(page.id)}.md" target="_blank" rel="noopener">Page spec ↗</a>` : ""}
      </div>
      <div class="frame-wrap ${mobile ? "phone" : ""}"><iframe id="wf" src="${esc(url)}" title="Mission Control mockup"></iframe></div>
      ${item ? `<div class="section"><h2>What the build is missing here</h2>${itemCard(item)}</div>` : ""}`;
  },

  docs() {
    const docs = D.docs || [];
    const cur = S.arg ? docs.find(d => d.id === S.arg) : null;
    return `<div class="page-head"><div><div class="eyebrow">Specs and plans</div><h1>Specs</h1></div>
      <p class="lead">The documents the roadmap is built from. Each opens on GitHub; the rendered set is framed below.</p></div>
      <div class="grid" style="margin-bottom:18px">${docs.map(d => `<div class="card"><div class="title"><h3>${esc(d.title)}</h3></div><div class="small" style="color:var(--body)">${esc(d.summary || "")}</div><div class="row" style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn sm" href="${BLOB}${esc(d.path)}" target="_blank" rel="noopener">GitHub ↗</a>${d.anchor ? `<a class="btn sm ghost" href="#/docs/${esc(d.id)}">Read here</a>` : ""}<button class="btn sm ghost" data-ask="Summarize ${esc(d.path)} in five bullets and list what it says is still undecided.">Ask Claude</button></div></div>`).join("")}</div>
      <div class="frame-wrap"><iframe src="${DOCS}${cur?.anchor ? "#" + esc(cur.anchor) : ""}" title="Mission Control documents"></iframe></div>`;
  },
};
const statusRank = it => ({ "not-started": 0, "fixtures-only": 1, partial: 2, built: 3 })[statusOf(it)] ?? 0;
function groupOptions(pages, sel) {
  const groups = [...new Set(pages.map(p => p.group))];

function ghErrorCopy(e) {
  const c = e?.code || "";
  if (c === "needs_reauth") return "GitHub needs to be reconnected. Open claude.ai Settings → Connectors and reconnect GitHub.";
  if (c === "server_not_connected") return "Add the GitHub MCP server as a connector named GitHub in claude.ai (Settings → Connectors → Add custom, URL https://api.githubcopilot.com/mcp/) to see live issues and create them from here.";
  if (c === "not_in_manifest") return "This page was not allowed to use GitHub for this view. Allow it from the page's connector prompt.";
  if (c === "server_unavailable") return "GitHub did not answer in time. Showing the last good data; it will retry.";
  return "GitHub could not be read: " + (e?.message || c);
}

document.addEventListener("click", async (e) => {
  // In-page routes: drive the hash ourselves so a host that intercepts anchor clicks cannot swallow them.
  const a = e.target.closest('a[href^="#/"]');
  if (a) { e.preventDefault(); const h = a.getAttribute("href"); if (location.hash !== h) location.hash = h; else { parseHash(); render(); } return; }
  const t = e.target.closest("[data-ask],[data-item],[data-wf],[data-decide],[data-reopen],[data-issue-item],[data-issue-decision],[data-comment],[data-link-item],[data-repo],[data-issue],#new-issue,#refresh-issues,#retry-gh,#more-issues,#f-cut,#f-unbacked,#f-decision,#wf-mobile,#ask-btn,#close-drawer,#theme-btn,#clear-chat");
  if (!t) return;
  if (t.matches("[data-wf]")) { e.stopPropagation(); go("wireframes", t.dataset.wf); return; }
  if (t.matches("[data-ask]")) { openDrawer(); askClaude(t.dataset.ask); return; }
  if (t.matches("[data-item]")) { const it = byId[t.dataset.item]; go(it.kind === "surface" ? "gaps" : it.kind === "witness" ? "witness" : "done", it.id); return; }
  if (t.matches("[data-decide]")) return decideDialog(t.dataset.decide);
  if (t.matches("[data-reopen]")) { await writeDecision(t.dataset.reopen, { status: "open", decided: null, decided_on: null }); return; }
  if (t.matches("[data-issue-item]")) return issueDialog(draftFromItem(byId[t.dataset.issueItem]));
  if (t.matches("[data-issue-decision]")) return issueDialog(draftFromDecision(DECISIONS.find(d => d.id === t.dataset.issueDecision)));
  if (t.matches("#new-issue")) return issueDialog({ repo: S.ui.filters.repo || "oxagen", title: "", body: "", labels: [] });
  if (t.matches("[data-comment]")) return openComment(t);
  if (t.matches("[data-link-item]")) return linkDialog(t.dataset.linkItem);
  if (t.matches("[data-repo]")) { S.ui.filters.repo = t.dataset.repo; saveUi(); render(); return; }
  if (t.matches("[data-issue]")) { if (e.target.closest("a")) return; const [repo, n] = t.dataset.issue.split("#"); window.open(`https://github.com/${ORG}/${repo}/issues/${n}`, "_blank", "noopener"); return; }
  if (t.matches("#refresh-issues")) { await S.caps.mcp?.invalidate(GH, "list_issues").catch(() => {}); toast("Refreshing"); return; }
  if (t.matches("#retry-gh")) { S.ghDown = null; S.issues = {}; startGitHub(); render(); return; }
  if (t.matches("#more-issues")) return loadOlder(S.ui.filters.repo || "oxagen");
  if (t.matches("#f-cut")) { S.ui.filters.showCut = !S.ui.filters.showCut; saveUi(); render(); return; }
  if (t.matches("#f-unbacked")) { S.ui.filters.unbacked = !S.ui.filters.unbacked; saveUi(); render(); return; }
  if (t.matches("#f-decision")) { S.ui.filters.decision = !S.ui.filters.decision; saveUi(); render(); return; }
  if (t.matches("#wf-mobile")) { const q = { ...(S.q || {}) }; q.mobile = q.mobile === "1" ? "0" : "1"; go("wireframes", S.arg, q); return; }
  if (t.matches("#ask-btn")) { toggleDrawer(true); $("#chat-in").focus(); return; }
  if (t.matches("#close-drawer")) { toggleDrawer(false); return; }
  if (t.matches("#theme-btn")) { const r = document.documentElement; const cur = r.getAttribute("data-theme"); const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark"; if (next) r.setAttribute("data-theme", next); else r.removeAttribute("data-theme"); lsSet("rm.theme", next); return; }
  if (t.matches("#clear-chat")) { CHAT.turns = []; saveChat(); renderChat(); return; }
});

/* ---------- db writes ---------- */
async function writeOverride(id, patch, activityText) {
  S.overrides[id] = { ...(S.overrides[id] || {}), ...patch };
  if (!S.caps.db) { toast("Saved for this browser only. Open in claude.ai to share."); lsSet("rm.overrides", S.overrides); renderNav(); return; }
  try {
    await S.caps.db.doc("overrides/" + id).set({ ...S.overrides[id], updated_at: new Date().toISOString(), updated_by: S.uid });
    if (activityText) logActivity(`${byId[id]?.title || id}: ${activityText}`, id);
    toast("Saved");
  } catch (err) { toast("Could not save: " + (err.code || err.message)); }
}
async function writeDecision(id, patch) {
  S.decided[id] = { ...(S.decided[id] || {}), ...patch };
  if (!S.caps.db) { lsSet("rm.decided", S.decided); render(); toast("Saved for this browser only."); return; }
  try { await S.caps.db.doc("decisions/" + id).set({ ...S.decided[id], updated_at: new Date().toISOString(), updated_by: S.uid }); logActivity(`Decision ${id} ${patch.status === "decided" ? "decided: " + (patch.decided || "").slice(0, 120) : "reopened"}`); toast(patch.status === "decided" ? "Decided" : "Reopened"); }
  catch (err) { toast("Could not save: " + (err.code || err.message)); }
  render();
}
async function logActivity(text, item) {
  if (!S.caps.db) return;
  try { await S.caps.db.collection("activity").add({ ts: new Date().toISOString(), text, item: item || null, route: item ? (byId[item]?.kind === "surface" ? "gaps" : byId[item]?.kind === "witness" ? "witness" : "done") : null, who: S.uid }); } catch {}
}

async function createIssue({ repo, title, body, labels }) {
  const mcp = S.caps.mcp; if (!mcp) throw { code: "not_granted", message: "GitHub connector unavailable" };

  const p = r.payload && typeof r.payload === "object" ? r.payload : (() => { try { return JSON.parse(r.content?.[0]?.text || "{}"); } catch { return {}; } })();
  await mcp.invalidate(GH, "list_issues").catch(() => {});
  logActivity(`Created ${repo}#${p.number}: ${title}`);
  return p;
}

/* ---------- GitHub live data ---------- */
const watches = [];
function startGitHub() {
  const mcp = S.caps.mcp; if (!mcp) { setPill("gh", "off", "GitHub: snapshot"); return; }
  if (S.ghDown) { setPill("gh", "off", S.ghDown.code === "server_not_connected" ? "GitHub: add the connector" : "GitHub: " + S.ghDown.code.replace(/_/g, " ")); return; }
  setPill("gh", "warn", "GitHub: loading");
  for (const repo of REPOS) {

function payloadOf(r) { if (r.payload && typeof r.payload === "object") return r.payload; try { return JSON.parse(r.content?.[0]?.text || "{}"); } catch { return {}; } }
async function loadOlder(repo) {

}

    counts: { built: surf.filter(i => statusOf(i) === "built").length, partial: surf.filter(i => ["partial","fixtures-only"].includes(statusOf(i))).length, not_started: surf.filter(i => statusOf(i) === "not-started").length, open_decisions: DECISIONS.filter(d => decState(d).status !== "decided").length, live_open_issues: Object.fromEntries(Object.entries(S.issues).map(([r, x]) => [r, x.total ?? x.items?.length])) },

const TOOLS = () => [
  { name: "get_roadmap_overview", description: "Returns the whole roadmap in compact form: counts, every item with id, kind, status and priority, every decision with status, the milestones, and live open-issue counts. Call it first when a question needs the big picture.", execute: () => overview() },
  { name: "get_item", description: "Returns one roadmap item in full (gap summary, gaps, backend gaps, spec path, wireframe route, evidence, shared notes, linked issues with live state). Input: {id}.", inputSchema: { type: "object", properties: { id: { type: "string" } }, required: ["id"] },

    execute: async ({ id, status, priority, owner, note }) => { const it = byId[String(id)]; if (!it) throw new Error("No item " + id); const patch = {}; if (status) patch.built_status = String(status); if (priority) patch.priority = String(priority); if (owner != null) patch.owner = String(owner); if (note != null) patch.note = String(note); await writeOverride(it.id, patch, "updated by Claude: " + Object.keys(patch).join(", ")); render(); return { ok: true, item: itemState(it) }; } },
  { name: "record_decision", description: "Records the outcome of a decision by id (from get_roadmap_overview) and marks it decided. Input: {id, decision}. Use only when the viewer asked to record it.", inputSchema: { type: "object", properties: { id: { type: "string" }, decision: { type: "string" } }, required: ["id","decision"] },
    execute: async ({ id, decision }) => { const d = DECISIONS.find(x => x.id === String(id)); if (!d) throw new Error("No decision " + id); await writeDecision(d.id, { status: "decided", decided: String(decision), decided_on: new Date().toISOString().slice(0, 10) }); return { ok: true }; } },
  { name: "list_open_issues", description: "Returns open GitHub issues already loaded on the page for a repo (roadmap, oxagen or stella): number, title, labels, triage theme, whether a spec backs it, updated date. Optional text filter. Up to 60 results, no network call.", inputSchema: { type: "object", properties: { repo: { type: "string" }, filter: { type: "string" } }, required: ["repo"] },

  { name: "link_issue", description: "Links an existing GitHub issue to a roadmap item so it shows on the card. Input: {item_id, repo, number}.", inputSchema: { type: "object", properties: { item_id: { type: "string" }, repo: { type: "string" }, number: { type: "number" } }, required: ["item_id","repo","number"] },

    execute: ({ repo, title, body, labels, item_id }) => new Promise((resolve) => {
      const before = (S.overrides[item_id]?.linked_issues || []).length;
      issueDialog({ repo: String(repo), title: String(title), body: String(body), labels: Array.isArray(labels) ? labels.map(String) : [], item: item_id ? String(item_id) : undefined });

function instructions() {
  const it = S.arg && byId[S.arg];
  return `You are the product-management partner bound to the Oxagen Roadmap page. Oxagen is Mission Control for an autonomous agent workforce; this page tracks the gap between the Mission Control mockups (the spec) and the oxagen build, plus the witness (proof) and definition-of-done features, open decisions, and live GitHub issues in ${ORG}/oxagen, ${ORG}/stella and ${ORG}/product-roadmap.
