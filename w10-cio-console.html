<title>The CIO's Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ── House tokens. Dark-first: bare :root IS the dark palette. ───────────── */
:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C;
  --border:#292722; --rule:#34322D;
  --text:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-hi:#F1C364; --gold-text:#D6962C; --on-gold:#10100F;
  --sheen:linear-gradient(45deg,#8B5E1A 0%,#D6962C 38%,#F1C364 56%,#D6962C 74%,#8B5E1A 100%);
  /* semantic state — a separate family from gold, never interchangeable */
  --pass:#62A97C;  --pass-bg:rgba(98,169,124,.13);  --pass-br:rgba(98,169,124,.34);
  --hold:#7AA2DB;  --hold-bg:rgba(122,162,219,.13); --hold-br:rgba(122,162,219,.34);
  --deny:#D6635C;  --deny-bg:rgba(214,99,92,.13);   --deny-br:rgba(214,99,92,.34);
  --crit:#E2555C;  --crit-bg:rgba(226,85,92,.20);   --crit-br:rgba(226,85,92,.50);
  --idle:#9B958A;  --idle-bg:rgba(155,149,138,.12); --idle-br:rgba(155,149,138,.30);
  --focus:#F1C364;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.35);
  --font:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:14px; --r-md:12px; --r-sm:10px; --r-xs:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ink:#F2EEE5; --void:#EAE4D7; --panel:#F8F5EE; --hl:#EDE7DA;
    --border:#D8CDBD; --rule:#C9BFAE;
    --text:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
    --gold-text:#8B5E1A; --gold-hi:#8B5E1A;
    --pass:#2F6B48;  --pass-bg:rgba(47,107,72,.10);  --pass-br:rgba(47,107,72,.30);
    --hold:#2F5C99;  --hold-bg:rgba(47,92,153,.10);  --hold-br:rgba(47,92,153,.30);
    --deny:#9A3630;  --deny-bg:rgba(154,54,48,.10);  --deny-br:rgba(154,54,48,.30);
    --crit:#B02A31;  --crit-bg:rgba(176,42,49,.14);  --crit-br:rgba(176,42,49,.44);
    --idle:#6B665C;  --idle-bg:rgba(107,102,92,.10); --idle-br:rgba(107,102,92,.28);
    --focus:#8B5E1A;
    --shadow:0 1px 0 rgba(255,255,255,.6), 0 8px 20px rgba(40,34,24,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#EAE4D7; --panel:#F8F5EE; --hl:#EDE7DA;
  --border:#D8CDBD; --rule:#C9BFAE;
  --text:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --gold-text:#8B5E1A; --gold-hi:#8B5E1A;
  --pass:#2F6B48;  --pass-bg:rgba(47,107,72,.10);  --pass-br:rgba(47,107,72,.30);
  --hold:#2F5C99;  --hold-bg:rgba(47,92,153,.10);  --hold-br:rgba(47,92,153,.30);
  --deny:#9A3630;  --deny-bg:rgba(154,54,48,.10);  --deny-br:rgba(154,54,48,.30);
  --crit:#B02A31;  --crit-bg:rgba(176,42,49,.14);  --crit-br:rgba(176,42,49,.44);
  --idle:#6B665C;  --idle-bg:rgba(107,102,92,.10); --idle-br:rgba(107,102,92,.28);
  --focus:#8B5E1A;
  --shadow:0 1px 0 rgba(255,255,255,.6), 0 8px 20px rgba(40,34,24,.10);
  color-scheme:light;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--body);font-family:var(--font);font-weight:400;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;color:var(--text);font-weight:600;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--gold-text);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:.86em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--muted);margin:0}

/* ── App shell ──────────────────────────────────────────────────────────── */
.stage{padding:0;min-height:100vh;background:var(--void)}
.stage.phone{padding:22px 16px 90px;display:flex;justify-content:center}
.app{container-type:inline-size;background:var(--ink);min-height:100vh;
  display:grid;grid-template-columns:248px 1fr;width:100%}
.stage.phone .app{max-width:400px;min-height:760px;height:760px;overflow-y:auto;overflow-x:hidden;
  border:1px solid var(--rule);border-radius:26px;box-shadow:var(--shadow);position:relative}
.stage.phone .main{min-height:0}

/* sidebar */
.side{border-right:1px solid var(--border);background:var(--ink);display:flex;flex-direction:column;
  min-height:100vh;position:sticky;top:0;height:100vh}
.side-top{padding:16px 14px 10px;display:flex;align-items:center;gap:10px}
.lockup{height:20px;width:auto;color:var(--text);display:block}
.switcher{margin:6px 10px 2px;display:flex;flex-direction:column;gap:6px}
.sw{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 9px;cursor:pointer}
.sw:hover{background:var(--hl);border-color:var(--rule)}
.sw-mark{width:22px;height:22px;border-radius:var(--r-xs);flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--on-gold);background:var(--sheen)}
.sw-mark.ws{background:var(--hl);color:var(--muted);border:1px solid var(--rule)}
.sw-txt{min-width:0;flex:1}
.sw-k{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);line-height:1.3}
.sw-v{display:block;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-c{color:var(--dim);flex:none}
nav{padding:12px 10px;overflow-y:auto;flex:1}
.nav-h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  padding:12px 8px 6px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r-sm);
  color:var(--muted);font-weight:500;font-size:13.5px;border-left:2px solid transparent;cursor:pointer}
.nav-i:hover{background:var(--hl);color:var(--text);text-decoration:none}
.nav-i.on{background:var(--panel);color:var(--text);border-left-color:var(--gold)}
.nav-i.sub{margin-left:22px;font-size:12.5px;padding:5px 9px}
.nav-i svg{width:15px;height:15px;flex:none;opacity:.85}
.nav-tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.side-foot{padding:10px;border-top:1px solid var(--border)}

/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:0 20px;height:52px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--ink) 88%,transparent);
  backdrop-filter:blur(8px)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0;flex:1;color:var(--muted)}
.crumbs b{font-weight:500;color:var(--text)}
.crumbs span{color:var(--dim)}
.cmdk{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:5px 9px;color:var(--muted);cursor:pointer;font-size:12.5px;min-width:190px}
.cmdk:hover{border-color:var(--rule);color:var(--text)}
.cmdk kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule);
  border-radius:4px;padding:1px 4px;color:var(--dim)}
.icon-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-xs);
  background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--hl);color:var(--text);border-color:var(--border)}
.icon-btn.on{background:var(--panel);border-color:var(--rule);color:var(--text)}
.icon-btn svg{width:16px;height:16px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--hl);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--text);cursor:pointer}

/* content */
.content{padding:22px 20px 72px;min-width:0;flex:1}
.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.page-head h1{font-size:24px;line-height:1.15}
.page-sub{color:var(--muted);font-size:13px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.page-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:18px 0 20px;overflow-x:auto;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 11px;font-size:13.5px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold)}
.tab .n{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:5px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);
  color:var(--text);border-radius:var(--r-sm);padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--hl);border-color:var(--rule)}
.btn svg{width:14px;height:14px}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:var(--r-xs)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.primary:hover{background:var(--gold-hi);border-color:var(--gold-hi);color:#10100F}
.btn.ghost{background:transparent}
.btn.danger{color:var(--deny);border-color:var(--deny-br)}
.btn.danger:hover{background:var(--deny-bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* panels */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.panel + .panel{margin-top:16px}
.ph{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ph h3{font-size:14.5px}
.ph .ph-sub{font-size:12.5px;color:var(--muted)}
.ph .ph-act{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.pb{padding:16px}
.pb.flush{padding:0}
.store{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px;white-space:nowrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* stat tiles */
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-size:23px;font-weight:600;color:var(--text);margin-top:6px;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.stat .m{font-size:12px;color:var(--muted);margin-top:4px}

/* fact rows */
.facts{display:flex;flex-direction:column}
.fact{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--border)}
.fact:last-child{border-bottom:0}
.fact dt{flex:none;width:186px;color:var(--muted);font-size:12.5px}
.fact dd{margin:0;flex:1;min-width:0;color:var(--body);font-size:13px;overflow-wrap:anywhere}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hl)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.t-main{color:var(--text);font-weight:500}
.t-sub{color:var(--muted);font-size:12px;margin-top:2px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;
  font-size:11.5px;font-weight:500;border:1px solid var(--idle-br);background:var(--idle-bg);color:var(--idle);white-space:nowrap}
.chip.pass{border-color:var(--pass-br);background:var(--pass-bg);color:var(--pass)}
.chip.hold{border-color:var(--hold-br);background:var(--hold-bg);color:var(--hold)}
.chip.deny{border-color:var(--deny-br);background:var(--deny-bg);color:var(--deny)}
.chip.crit{border-color:var(--crit-br);background:var(--crit-bg);color:var(--crit);font-weight:600}
.chip.tier{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.kv{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* misc */
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.callout{border:1px solid var(--border);border-left:2px solid var(--gold);background:var(--hl);
  border-radius:var(--r-sm);padding:11px 13px;font-size:12.5px;color:var(--body)}
pre.code{background:var(--ink);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;
  overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--body);margin:0}
.bar{height:5px;border-radius:3px;background:var(--hl);overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--pass)}
.bar i.hold{background:var(--hold)}
.sep{height:1px;background:var(--border);margin:14px 0}
.modes{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.mode{text-align:left;background:var(--ink);border:1px solid var(--border);border-radius:var(--r-md);
  padding:12px 13px;cursor:pointer}
.mode:hover{border-color:var(--rule)}
.mode[aria-pressed="true"]{border-color:var(--gold);background:var(--hl)}
.mode .mt{font-weight:600;color:var(--text);font-size:13.5px;display:flex;align-items:center;gap:7px}
.mode .md{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.seg{display:inline-flex;background:var(--ink);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px}
.seg button{background:none;border:0;border-radius:var(--r-xs);padding:5px 11px;font-size:12.5px;
  font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:9px;background:var(--ink);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:8px 11px}
.search input{background:none;border:0;outline:none;flex:1;font-size:13px;font-family:var(--mono);min-width:0}
.search svg{width:15px;height:15px;color:var(--dim);flex:none}
select.inp,input.inp{background:var(--ink);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:7px 10px;font-size:13px;width:100%;outline:none}
select.inp:focus,input.inp:focus{border-color:var(--gold)}
label.fld{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fldset{display:grid;gap:13px}

/* skeleton / error / denied */
@keyframes sk{0%{opacity:.45}50%{opacity:.8}100%{opacity:.45}}
.sk{background:var(--hl);border-radius:var(--r-xs);animation:sk 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.blank{display:grid;place-items:center;text-align:center;padding:56px 22px;gap:12px}
.blank .bi{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;
  border:1px solid var(--border);background:var(--hl);color:var(--muted)}
.blank h3{font-size:16px}
.blank p{margin:0;max-width:48ch;color:var(--muted);font-size:13px}

/* assistant */
.assist{width:344px;flex:none;border-left:1px solid var(--border);background:var(--panel);
  display:flex;flex-direction:column;position:sticky;top:52px;height:calc(100vh - 52px)}
.assist-h{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.assist-b{padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:13px}
.msg{font-size:13px;line-height:1.55}
.msg .who{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:5px}
.msg.op .bub{background:var(--hl);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px}
.assist-f{padding:12px 14px;border-top:1px solid var(--border)}
.shell{display:flex;min-width:0}

/* dialogs */
dialog{border:1px solid var(--rule);background:var(--panel);color:var(--body);border-radius:var(--r-lg);
  padding:0;max-width:min(760px,calc(100vw - 32px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(6,6,5,.66);backdrop-filter:blur(2px)}
dialog.wide{max-width:min(920px,calc(100vw - 32px))}
.dh{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border)}
.dh h3{font-size:16px}
.dh .dsub{font-size:12.5px;color:var(--muted);margin-top:3px}
.db{padding:18px;max-height:min(66vh,620px);overflow-y:auto}
.df{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.cmd-list{max-height:340px;overflow-y:auto}
.cmd{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
  padding:9px 18px;cursor:pointer;color:var(--body);font-size:13.5px}
.cmd:hover,.cmd.hi{background:var(--hl);color:var(--text)}
.cmd .cg{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

/* receipt groups */
.rg{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.rg + .rg{margin-top:12px}
.rg > h4{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  padding:9px 13px;background:var(--hl);border-bottom:1px solid var(--border)}
.rg > .rb{padding:11px 13px}

/* mockup chrome — deliberately not product UI */
.chrome{position:fixed;right:14px;bottom:14px;z-index:120;font-family:var(--mono);font-size:11px;
  background:#0A0A09;color:#9B958A;border:1px dashed #4A4740;border-radius:8px;padding:8px 10px;
  max-width:calc(100vw - 28px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
:root[data-theme="light"] .chrome,
.chrome{color:#9B958A}
.chrome .ch-t{color:#6E6A62;letter-spacing:.12em;text-transform:uppercase;font-size:9.5px;margin-bottom:6px;
  display:flex;gap:8px;align-items:center}
.chrome .ch-t b{color:#9B958A;font-weight:400}
.chrome-row{display:flex;gap:5px;flex-wrap:wrap}
.chrome button{background:#181715;border:1px solid #34322D;color:#9B958A;border-radius:5px;
  padding:3px 7px;font-family:var(--mono);font-size:11px;cursor:pointer}
.chrome button:hover{border-color:#6E6A62;color:#F2EEE5}
.chrome button[aria-pressed="true"]{background:#292722;color:#F2EEE5;border-color:#6E6A62}

/* ── container-query reflow (serves narrow viewport AND the 400px frame) ── */
@container (max-width:1180px){ .assist{display:none} .assist.pinned{display:flex} }
@container (max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container (max-width:900px){

/* ---------- tool grammar (shared with mc.html) ----------
   Three orthogonal axes, three visual grammars, never mixed:
     category = what the tool ACTS ON   → icon badge, one hue per category (never gold, never a state hue)
     hazard   = how bad a wrong call is → risk mark (circle · diamond · triangle · filled triangle) + side-effect glyph
     gate     = what the belt decided   → badge; a dashed border means a person still stands in the way */
:root{--tg-ok:#57A97C;--tg-appr:#5B93D6;--tg-deny:#C66A4A;--tg-crit:#D6455E;
  --tg-read:#6FB1DA;--tg-query:#5FBFB0;--tg-record:#E08BA6;--tg-message:#E39A6E;--tg-file:#9FBE62;--tg-exec:#B48EE0;--tg-vcs:#8A96E8;--tg-infra:#6E9E8F;--tg-access:#A3B1C6;--tg-finance:#C97AD0}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--tg-ok:#2F7D52;--tg-appr:#2E6BA8;--tg-deny:#9B4526;--tg-crit:#AE2540;
  --tg-read:#1E6F99;--tg-query:#1E7A6E;--tg-record:#A63F62;--tg-message:#A8532A;--tg-file:#5A7A1C;--tg-exec:#6A46B5;--tg-vcs:#4553B0;--tg-infra:#2F6656;--tg-access:#4F6075;--tg-finance:#8B3E96}}
:root[data-theme="light"]{--tg-ok:#2F7D52;--tg-appr:#2E6BA8;--tg-deny:#9B4526;--tg-crit:#AE2540;
  --tg-read:#1E6F99;--tg-query:#1E7A6E;--tg-record:#A63F62;--tg-message:#A8532A;--tg-file:#5A7A1C;--tg-exec:#6A46B5;--tg-vcs:#4553B0;--tg-infra:#2F6656;--tg-access:#4F6075;--tg-finance:#8B3E96}
.tg-read{--tc:var(--tg-read)} .tg-query{--tc:var(--tg-query)} .tg-record{--tc:var(--tg-record)} .tg-message{--tc:var(--tg-message)} .tg-file{--tc:var(--tg-file)}
.tg-exec{--tc:var(--tg-exec)} .tg-vcs{--tc:var(--tg-vcs)} .tg-infra{--tc:var(--tg-infra)} .tg-access{--tc:var(--tg-access)} .tg-finance{--tc:var(--tg-finance)}
.tg{display:inline-grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;min-width:0;max-width:100%;text-align:left;vertical-align:middle;font-family:var(--font,inherit)}
.tg .i{grid-row:1/3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 34%,transparent)}
.tg .i svg{width:15px;height:15px}
.tg .l{font-weight:600;font-size:13px;color:var(--fg,inherit);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tg .a{font-family:var(--mono,ui-monospace,monospace);font-size:11px;color:var(--muted,#9B958A);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tg .a .v{color:var(--dim,#6E6A62)}
table .tg:not(.sm){min-width:220px}
.tg.sm{column-gap:8px}.tg.sm .i{width:22px;height:22px;border-radius:6px}.tg.sm .i svg{width:12px;height:12px}.tg.sm .l{font-size:12.5px}.tg.sm .a{font-size:10.5px}
.tg.lg{column-gap:12px}.tg.lg .i{width:42px;height:42px;border-radius:11px}.tg.lg .i svg{width:21px;height:21px}.tg.lg .l{font-size:18px;letter-spacing:-.015em}.tg.lg .a{font-size:12px}
.tg.api .l{font-family:var(--mono,ui-monospace,monospace);font-weight:500;font-size:12.5px}.tg.api .a{font-family:var(--font,inherit);font-weight:500}
.tg.lg.api .l{font-size:15px}
.tg-cat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5;color:var(--tc);border-color:color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.tg-cat svg{width:12px;height:12px;flex:none}
.tg-hz{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5;letter-spacing:.02em}
.tg-hz svg{width:14px;height:14px;flex:none}
.tg-hz+.tg-hz{margin-left:10px}
.tg-hz.r-low{color:var(--muted,#9B958A)} .tg-hz.r-medium{color:var(--tg-appr)} .tg-hz.r-high{color:var(--tg-deny)} .tg-hz.r-critical{color:var(--tg-crit)}
.tg-hz.e-read{color:var(--muted,#9B958A)} .tg-hz.e-write{color:var(--tg-appr)} .tg-hz.e-irreversible{color:var(--tg-deny)}
.tg-gt{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5}
.tg-gt svg{width:12px;height:12px;flex:none}
.tg-gt.g-allow{color:var(--tg-ok);border-color:color-mix(in srgb,var(--tg-ok) 42%,transparent);background:color-mix(in srgb,var(--tg-ok) 11%,transparent)}
.tg-gt.g-require_approval,.tg-gt.g-mandate{color:var(--tg-appr);border-style:dashed;border-color:color-mix(in srgb,var(--tg-appr) 65%,transparent);background:color-mix(in srgb,var(--tg-appr) 11%,transparent)}
.tg-gt.g-deny{color:var(--tg-deny);border-color:color-mix(in srgb,var(--tg-deny) 42%,transparent);background:color-mix(in srgb,var(--tg-deny) 11%,transparent)}
.tg-gt.g-killed{color:var(--tg-crit);border-color:color-mix(in srgb,var(--tg-crit) 65%,transparent);background:color-mix(in srgb,var(--tg-crit) 14%,transparent)}
tr.tg-row-critical>td:first-child{box-shadow:inset 3px 0 0 var(--tg-crit)}
tr.tg-row-high>td:first-child{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--tg-deny) 65%,transparent)}
tr.tg-grp td{background:var(--hl,rgba(127,127,127,.08));padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--border,rgba(127,127,127,.25))}
tr.tg-grp .i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;vertical-align:middle;margin-right:9px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 34%,transparent)}
tr.tg-grp .i svg{width:12px;height:12px}
tr.tg-grp b{font-size:12.5px;margin-right:9px;color:var(--fg,inherit)}
tr.tg-grp .s{font-size:11.5px;color:var(--muted,#9B958A)}
.tg-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border,rgba(127,127,127,.25));border-radius:8px;background:var(--void,transparent)}
.tg-seg button,.tg-chips button{font:inherit;font-size:12px;font-weight:500;color:var(--muted,#9B958A);background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.5}
.tg-chips button{border-color:var(--border,rgba(127,127,127,.25))}
.tg-seg button[aria-pressed="true"],.tg-chips button[aria-pressed="true"]{background:var(--hl,rgba(127,127,127,.08));border-color:var(--rule,rgba(127,127,127,.4));color:var(--fg,inherit)}
.tg-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg-chips button svg{width:12px;height:12px;color:var(--tc)}
.tg-chips button .n{color:var(--dim,#6E6A62);font-variant-numeric:tabular-nums}
.tg-leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tg-leg .c{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border:1px solid var(--border,rgba(127,127,127,.25));border-left:3px solid var(--tc);border-radius:10px;background:var(--void,transparent);min-width:0}
.tg-leg .i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 32%,transparent)}
.tg-leg .i svg{width:17px;height:17px}
.tg-leg .l{font-weight:600;font-size:13px;color:var(--fg,inherit)} .tg-leg .s{font-size:12px;color:var(--muted,#9B958A);margin-top:2px} .tg-leg .eg{font-family:var(--mono,ui-monospace,monospace);font-size:10.5px;color:var(--dim,#6E6A62);margin-top:6px;word-break:break-word}
.tg-axes{display:grid;gap:8px;font-size:12px;margin-top:14px}
.tg-axes>div{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tg-axes .k{min-width:96px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted,#9B958A);font-weight:600}
.tg-axes .note{font-size:11.5px;color:var(--dim,#6E6A62)}
@media(max-width:520px){.tg-leg{grid-template-columns:1fr}}

<script>
/* ---------- Tool grammar (shared with mc.html) ----------
   TG.cell(id,{sz:"sm"|"lg",sub})  label + API name in a category-hued tile; TG.names="api" leads with the API name
   TG.cat(cat)                     category badge          TG.hazard(risk,effect)   risk mark + side-effect glyph
   TG.gate(g,note)                 allow · require_approval · deny · killed · mandate
   TG.legend()                     the ten categories with examples, plus the risk / effect / gate scales
   TG.chips(counts,sel,pick,total) category filter chips; `pick` is an onclick with %s where the category goes
   TG.seg(items)                   segmented control: [[label,pressed,onclick],…]
   A category says what a tool ACTS ON; it is orthogonal to hazard (how bad a wrong call is) and gate (what the belt decided). */
var TG=(function(){
 function h(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
 var ORDER=["read","query","record","message","file","exec","vcs","infra","access","finance"];
 var CAT={
  read:{l:"Read-only",s:"Observes and returns. Changes nothing anywhere.",eg:"github__get_file_contents · slack__get_thread · search_graph",
    i:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/>'},
  query:{l:"Data query",s:"Bulk read from a store. Read-only, but the result set is the exfiltration and the cost.",eg:"snowflake__run_query · aws_billing__get_cost_and_usage",
    i:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'},
  record:{l:"Record write",s:"Creates or updates a record in a system of work. Reversible by another write.",eg:"linear__update_issue · calendar__create_event · notion__update_page",
    i:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'},
  message:{l:"Messaging & authoring",s:"Speaks to people on the organization’s behalf. A sent message cannot be unsent.",eg:"slack__post_message · slack__upload_file · gmail__send_message",
    i:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/>'},
  file:{l:"File mutation",s:"Writes, edits, moves or deletes files in a workspace or a drive.",eg:"write__file · edit__file · drive__trash_file",
    i:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 15l2 2 4-4"/>'},
  exec:{l:"Code execution",s:"Runs a command or a program. Its effect is whatever the sandbox allows.",eg:"claude_code__Bash · bash__run · sandbox__run_python",
    i:'<path d="m4 17 6-5-6-5M12 19h8"/>'},
  vcs:{l:"Source control",s:"Changes code history: branches, pull requests, merges, releases, repositories.",eg:"github__create_pull_request · github__merge_pull_request · github__delete_repository",
    i:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-12 2-12 6"/>'},
  infra:{l:"Infrastructure",s:"Deploys, scales, pauses or reconfigures a running system.",eg:"vercel__deploy_to_vercel · vercel__pause_project · k8s__scale_deployment",
    i:'<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/>'},
  access:{l:"Access & identity",s:"Grants, shares, rotates or revokes access. Widens what every later call can reach.",eg:"drive__share_file · iam__rotate_key · oxagen__grant_role",
    i:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/>'},
  finance:{l:"Financial control",s:"Moves funds or commits spend. Never callable without a mandate.",eg:"stripe__create_payment · stripe__create_refund · aws_billing__purchase_savings_plan",
    i:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>'}
 };
 var META={
  github__create_pull_request:["Create pull request","vcs"], github__merge_pull_request:["Merge pull request","vcs"],
  github__delete_repository:["Delete repository","vcs"], github__create_release:["Create release","vcs"], github__push_files:["Push files","vcs"],
  github__get_file_contents:["Get file contents","read"], github__list_pull_requests:["List pull requests","read"], github__get_pull_request:["Get pull request","read"],
  stripe__create_payment:["Create payment","finance"], stripe__create_refund:["Create refund","finance"], stripe__create_payout:["Create payout","finance"],
  aws_billing__purchase_savings_plan:["Purchase savings plan","finance"], aws_billing__get_cost_and_usage:["Get cost and usage","query"],
  linear__update_issue:["Update issue","record"], linear__get_issue:["Get issue","read"], linear__create_issue:["Create issue","record"],
  slack__post_message:["Post message","message"], slack__upload_file:["Upload file","message"],
  slack__list_channels:["List channels","read"], slack__get_thread:["Get thread","read"],
  snowflake__run_query:["Run SQL query","query"], claude_code__Bash:["Run shell command","exec"], bash__run:["Run shell command","exec"],
  write__file:["Write file","file"], edit__file:["Edit file","file"], read__file:["Read file","read"],
  search_graph:["Search the graph","read"], recall_context:["Recall context","read"]
 };
 function parts(id){var s=String(id||""),i=s.lastIndexOf("@");return i>0?{n:s.slice(0,i),v:s.slice(i+1)}:{n:s,v:""};}
 function meta(id){
  var p=parts(id), m=META[p.n];
  if(m) return {n:p.n,v:p.v,l:m[0],cat:m[1]};
  var local=p.n.split("__").pop(), verb=local.split("_")[0].toLowerCase(), cat="record";
  if(/^(get|list|search|read|fetch|find|recall|describe|show)$/.test(verb)) cat="read";
  else if(/^(query|select|aggregate|export)$/.test(verb)) cat="query";
  else if(/^(write|edit|move|copy|trash|mkdir)$/.test(verb)) cat="file";
  else if(/^(bash|run|exec|execute|eval)$/.test(verb)) cat="exec";
  else if(/^(post|send|reply|forward|publish|upload)$/.test(verb)) cat="message";
  else if(/^(pay|refund|purchase|charge|transfer|buy|payout)$/.test(verb)) cat="finance";
  else if(/^(deploy|scale|pause|restart|provision)$/.test(verb)) cat="infra";
  else if(/^(grant|share|rotate|revoke|invite)$/.test(verb)) cat="access";
  else if(/^(merge|rebase|tag|release|push|fork)$/.test(verb)) cat="vcs";
  return {n:p.n,v:p.v,l:local.replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase();}),cat:cat};
 }
 var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
 var SV2='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
 function svg(c){var d=CAT[c]||CAT.record;return SV+d.i+'</svg>';}
 function cat(c){var d=CAT[c]||CAT.record;return '<span class="tg-cat tg-'+h(c)+'" title="'+h(d.s)+'">'+svg(c)+h(d.l)+'</span>';}
 function cell(id,o){
  o=o||{}; var m=meta(id), api=TG.names==="api", d=CAT[m.cat];
  var apiHtml=h(m.n)+(m.v?'<span class="v">@'+h(m.v)+'</span>':''), sub=o.sub?' · '+h(o.sub):'';
  return '<span class="tg tg-'+m.cat+(o.sz?' '+o.sz:'')+(api?' api':'')+'" title="'+h(m.n+(m.v?'@'+m.v:''))+' — '+h(m.l)+' · '+h(d.l)+'">'+
   '<span class="i">'+svg(m.cat)+'</span>'+
   (api?'<span class="l">'+apiHtml+'</span><span class="a">'+h(m.l)+sub+'</span>'
       :'<span class="l">'+h(m.l)+'</span><span class="a">'+apiHtml+sub+'</span>')+'</span>';
 }
 function riskSvg(r){
  if(r==="critical") return SV2+'<path d="M12 3 2 20h20L12 3z" fill="currentColor"/><path d="M12 10v4M12 17.5v.5" style="stroke:var(--ink,#10100F)"/></svg>';
  if(r==="high") return SV2+'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>';
  if(r==="medium") return SV2+'<path d="M12 3l9 9-9 9-9-9z"/><path d="M12 12h.01"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M12 12h.01"/></svg>';
 }
 function effSvg(e){
  if(e==="irreversible") return SV2+'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  if(e==="write") return SV2+'<path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M12 8l4 4"/></svg>';
  return SV2+'<circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg>';
 }
 function hazard(r,e){
  return '<span class="tg-hz r-'+h(r)+'" title="risk '+h(r)+'">'+riskSvg(r)+'<span>'+h(r)+'</span></span>'+
   (e?'<span class="tg-hz e-'+h(e)+'" title="side effect '+h(e)+'">'+effSvg(e)+'<span>'+h(e)+'</span></span>':'');
 }
 var GL={allow:"allowed",require_approval:"needs approval",deny:"denied",killed:"kill switch",mandate:"mandate + approval"};
 function gateSvg(g){
  var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  if(g==="allow") return s+'<path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  if(g==="require_approval") return s+'<path d="M12 3l8 3.5v5c0 4.6-3.2 8.6-8 9.5-4.8-.9-8-4.9-8-9.5v-5z"/><path d="M12 8v4l2.5 1.5"/></svg>';
  if(g==="deny") return s+'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>';
  if(g==="killed") return s+'<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>';
  if(g==="mandate") return s+'<path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3S7.5 5.8 7.5 7.5s2 2.7 4.5 3.3 4.5 1.6 4.5 3.5-2 3.2-4.5 3.2-4.5-1.3-4.5-3"/></svg>';
  return s+'<path d="M5 12h14"/></svg>';
 }
 function gate(g,note){g=({allowed:"allow",approval:"require_approval",denied:"deny"})[g]||g;return '<span class="tg-gt g-'+h(g)+'"'+(note?' title="'+h(note)+'"':'')+'>'+gateSvg(g)+h(GL[g]||g)+'</span>';}
 function seg(items){return '<span class="tg-seg" role="group">'+items.map(function(it){return '<button type="button" aria-pressed="'+(!!it[1])+'" onclick="'+h(it[2])+'">'+h(it[0])+'</button>';}).join("")+'</span>';}
 function chips(counts,sel,pick,total){
  var out='<button type="button" aria-pressed="'+(!sel)+'" onclick="'+h(pick.replace("%s",""))+'">All <span class="n">'+total+'</span></button>';
  ORDER.forEach(function(c){ if(!counts[c])return;
   out+='<button type="button" class="tg-'+c+'" aria-pressed="'+(sel===c)+'" title="'+h(CAT[c].s)+'" onclick="'+h(pick.replace("%s",c))+'">'+svg(c)+h(CAT[c].l)+'<span class="n">'+counts[c]+'</span></button>';});
  return '<div class="tg-chips">'+out+'</div>';
 }
 function legend(){
  return '<div class="tg-leg">'+ORDER.map(function(c){var d=CAT[c];

<script>
/* ============================== List controls ============================== */
/* Self-contained: every table with a thead gets a search box, sortable column
   headers, a filter select for each column that is a small enumeration, a
   rows-per-page select and a pager. Installs itself through a DOM observer so
   it works with any render path; state is keyed by page + column signature so
   a full re-render lands back on the same page, sort and query. */
(function(){
"use strict";
if(window.__ltInstalled)return; window.__ltInstalled=true;
var STORE={}, PER=[5,10,25,50,0], BUSY=false, TIMER=null;
var FACET=/status|state|tier|kind|role|risk|severity|result|health|effect|mode|side|level|verdict|decision|origin|scope|period|basis|algorithm|trend|position|governance|two-factor|sso|replay|grade|outcome/i;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(s){
  s=String(s==null?"":s).trim();
  if(!s||/^\d{4}-\d{2}/.test(s))return null;
  var c=s.replace(/[$,%×]/g,""), m=c.match(/^[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);
  if(!m)return null;
  var n=parseFloat(m[0]), u=c.slice(m[0].length).match(/^\s*([kKMB])(?![A-Za-z])/);
  if(u){ if(u[1]==="k"||u[1]==="K")n*=1e3; else if(u[1]==="M")n*=1e6; else n*=1e9; }
  return n;
}
function cmp(a,b,isNum,dir){
  if(isNum){var x=a.n,y=b.n; if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; if(x!==y)return (x-y)*dir;}
  return a.t.localeCompare(b.t,undefined,{numeric:true,sensitivity:"base"})*dir;
}
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function pageCtx(){var h1=document.querySelector("main h1, .page h1, h1"); return location.hash+"|"+(h1?h1.textContent.trim().slice(0,40):"");}
function state(sig,ord){var key=pageCtx()+"|"+sig+"#"+ord; return STORE[key]||(STORE[key]={q:"",sort:null,dir:1,per:10,page:1,f:{}});}

function pager(st,total,onPage){
  var per=st.per||total||1, pages=Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  var from=total?((st.page-1)*per+1):0, to=Math.min(total,st.page*per);
  var html='<div class="lp"><span class="lp-n">'+(total?from+'–'+to+' of '+total:'0 of 0')+'</span><span class="lp-pg">'+
   '<button type="button" class="lp-b" data-p="prev" aria-label="Previous page"'+(st.page<=1?' disabled':'')+'>‹</button>';
  var nums=[]; if(pages<=7){for(var i=1;i<=pages;i++)nums.push(i);} else {

  html+='<button type="button" class="lp-b" data-p="next" aria-label="Next page"'+(st.page>=pages?' disabled':'')+'>›</button></span></div>';

    html+='<select class="lt-f" data-k="'+esc(f.key)+'" aria-label="Filter by '+esc(f.label)+'"><option value="">All · '+esc(f.label)+'</option>'+
      f.values.map(function(v){return '<option value="'+esc(v)+'"'+(st.f[f.key]===v?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';});

  b.querySelectorAll(".lt-f").forEach(function(s){s.addEventListener("change",function(e){st.f[s.getAttribute("data-k")]=e.target.value;st.page=1;apply();});});

/* A column earns a filter when it is a small enumeration: 2–8 distinct short
   values across at least 4 rows, and not unique per row. At most three per list. */
function facets(cols,vals,rows){
  if(rows<4)return [];
  var c=cols.filter(function(col){ if(!col.name||col.num)return false;
    var set={},n=0,ok=true; vals.forEach(function(v){var t=v[col.i].t; if(!t)return; if(t.length>28)ok=false; if(!set[t]){set[t]=1;n++;}});
    if(!ok||n<2||n>8||n>=rows)return false; col.values=Object.keys(set).sort(); return true;});
  c.sort(function(a,b){var pa=FACET.test(a.name)?0:1,pb=FACET.test(b.name)?0:1; return pa-pb||a.values.length-b.values.length;});

  cols.forEach(function(c){ if(c.num)return; var k=0,tot=0; vals.forEach(function(v){if(v[c.i].t){tot++; if(v[c.i].n!=null)k++;}}); if(tot&&k/tot>=.6)c.num=true; });
