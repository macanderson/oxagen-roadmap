#viewport.phone .reg-foot .sp{margin-left:0;width:100%}

/* ---- Transcript tab: the stella-transcript / arenabench grammar on house tokens ---- */
.txs{--tx-inspect:var(--muted);--tx-mutate:var(--fg);--tx-execute:var(--fg);--tx-verify:var(--st-proven);--tx-repo:var(--muted);--tx-delegate:var(--muted);
  --tx-you:var(--muted);--tx-agent:var(--fg);
  font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--fg)}
.tx-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 0 10px}
.tx-tools input{background:var(--void);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:12px;color:var(--fg);width:220px;max-width:100%}
.tx-kinds{display:flex;flex-wrap:wrap;gap:2px}
.tx-kind{border:0;background:none;padding:3px 7px;border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tx-kind[aria-pressed="true"]{background:var(--hl);color:var(--fg);box-shadow:inset 0 0 0 1px var(--rule)}
.tx-kind[aria-pressed="false"]{text-decoration:line-through;color:var(--dim)}
.tx-kind.err[aria-pressed="true"]{color:var(--st-failed)}
/* ---- frame player transport + paused run ---- */
.fp-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-bottom:14px}
.fp-bar .btn.sm{padding:3px 8px;font-family:var(--mono);font-size:11.5px;min-width:30px;justify-content:center}
.fp-bar .btn.sm[aria-pressed="true"]{background:var(--hl);border-color:var(--rule);color:var(--fg)}
.fp-bar .play{min-width:82px}
.fp-scrub{flex:1;min-width:180px;display:grid;gap:3px;margin:0 6px}
.fp-range{width:100%;margin:0;accent-color:var(--fg);cursor:pointer}
.fp-ticks{position:relative;height:6px;margin:0 7px}
.fp-ticks i{position:absolute;top:0;width:4px;height:6px;border-radius:2px;margin-left:-2px}
.fp-cnt{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.fp-cnt b{color:var(--fg);font-weight:600}
.fp-bar kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--muted);background:var(--void)}
.fp-keys{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--dim);margin-left:auto}
.fp-dot{width:6px;height:6px;border-radius:50%;flex:none}
.fp-item[aria-current="true"] .fp-dot{box-shadow:0 0 0 2px var(--hl)}
.pause-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border:1px dashed color-mix(in srgb,var(--st-approval) 65%,transparent);background:color-mix(in srgb,var(--st-approval) 9%,transparent);border-radius:10px;margin-bottom:16px;font-size:12.5px;color:var(--body)}
.pause-banner .g{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--st-approval);background:color-mix(in srgb,var(--st-approval) 14%,transparent);font-weight:700;flex:none}
.pause-banner .q{font-style:italic;color:var(--fg)}
#viewport.phone .fp-scrub{flex-basis:100%}
.tx-play{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.tx-play .btn.sm{padding:3px 8px;font-family:var(--mono);font-size:11.5px;min-width:30px;justify-content:center}
.tx-play .btn.sm[aria-pressed="true"]{background:var(--hl);border-color:var(--rule);color:var(--fg)}
.tx-play .cnt{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:4px;white-space:nowrap}
.tx-frame{background:var(--void);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tx-runbar{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
.tx-runbar .name{font-weight:700;letter-spacing:.05em}
.tx-runbar .meta{color:var(--dim);font-size:11px}
.tx-burn{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-burn .bar{width:120px;height:4px;border-radius:2px;background:var(--hl);overflow:hidden}
.tx-burn .bar i{display:block;height:100%;width:0;background:var(--st-approval);transition:width .2s}
.tx-burn b{color:var(--fg);font-weight:600}
.tx-feed{max-height:640px;overflow-y:auto;padding:6px 0 10px}
.tx-row{display:grid;grid-template-columns:82px 30px minmax(0,1fr);align-items:baseline;padding:1px 12px 1px 0}
.tx-row[hidden]{display:none}
.tx-clock{color:var(--dim);font-size:10.5px;text-align:right;padding-right:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-node{position:relative;text-align:center;align-self:stretch}
.tx-node::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)}
.tx-dot{position:relative;z-index:1;display:inline-block;width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--void);border:2px solid currentColor}
.tx-dot.solid{background:currentColor}
.tx-role{display:grid;grid-template-columns:72px minmax(0,1fr);padding:9px 0;border-bottom:1px solid var(--border)}
.tx-rolegut{text-align:right;padding-right:14px}
.tx-roletag{font-size:10px;font-weight:700;letter-spacing:.14em;padding:1px 7px;border-radius:4px;color:var(--ink);background:var(--muted)}
.tx-role.you .tx-roletag{background:var(--tx-you)}
.tx-role.agent .tx-roletag{background:var(--tx-agent)}
.tx-role.steer .tx-roletag{background:var(--gold);color:var(--on-gold)}
.tx-prose{max-width:72ch;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--body)}
.tx-role.you .tx-prose{color:var(--fg)}
.tx-answer{border-left:2px solid var(--tx-agent);padding-left:14px;color:var(--fg)}
.tx-sub{font-size:10.5px;color:var(--dim);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.tx-stage{display:flex;align-items:center;gap:10px;padding:8px 0 4px;color:var(--muted);font-weight:600}
.tx-stage::after{content:"";flex:1;height:1px;background:var(--border)}
.tx-think{color:var(--dim);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.tx-fold{border:0;background:none;padding:0;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tx-fold:hover{color:var(--muted)}
.tx-call{display:flex;align-items:baseline;gap:8px;min-width:0}
.tx-call .g{color:var(--dim);user-select:none;flex:none}
.tx-call .g.bad{color:var(--st-failed)}
.tx-call .nm{font-weight:600;flex:none;min-width:8.5rem}
.tx-call .arg{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tx-call .nm.inspect{color:var(--tx-inspect)}.tx-call .nm.mutate{color:var(--tx-mutate)}.tx-call .nm.execute{color:var(--tx-execute)}
.tx-call .nm.verify{color:var(--tx-verify)}.tx-call .nm.repo{color:var(--tx-repo)}.tx-call .nm.delegate{color:var(--tx-delegate)}.tx-call .nm.bad{color:var(--st-failed)}
.tx-chips{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;flex:none;align-items:baseline}
.tx-chip{font-size:10.5px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:0 6px;white-space:nowrap;line-height:1.6;font-variant-numeric:tabular-nums}
.tx-chip.ok{color:var(--st-allowed)}.tx-chip.warn{color:var(--st-approval)}.tx-chip.err{color:var(--st-failed)}
.tx-chip.cost{color:var(--fg);border-color:var(--rule)}
.tx-chip.burn{color:var(--dim)}
.tx-chip.gov{color:var(--st-approval);cursor:pointer;border-color:color-mix(in srgb,var(--st-approval) 40%,transparent)}
.tx-chip.gov.appr{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.tx-chip.gov:hover{color:var(--fg)}
.tx-out{margin:2px 0 4px 20px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.55;background:none;border:0;padding:0;border-radius:0}
.tx-out.err{color:var(--st-failed)}
.tx-args{margin:2px 0 4px 20px;color:var(--dim);font-size:11px;background:none;border:0;padding:0;border-radius:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tx-diffwrap{margin:4px 0 6px 20px}
.tx-diffwrap .path{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);padding:4px 10px;background:var(--panel);border:1px solid var(--border);border-bottom:0;border-radius:9px 9px 0 0}
.tx-diffwrap .path b{color:var(--fg);font-weight:600;font-family:var(--mono)}
.tx-diffwrap .path .dstat{margin-left:auto}
.tx-diffwrap .diff{border-radius:0 0 9px 9px;max-height:320px}
.tx-usage{font-size:10.5px;color:var(--dim);display:flex;gap:8px;align-items:baseline;min-width:0}
.tx-usage .u{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-proof{color:var(--st-proven);font-weight:600}
.tx-proof.bad{color:var(--st-approval)}
.tx-recall{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;font-size:11px;margin:3px 0 2px 20px;align-items:baseline}
.tx-recall .k{color:var(--dim)}.tx-recall .l{color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx-recall .n{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.tx-empty{padding:18px 16px;color:var(--dim)}
.txs mark{background:var(--gold);color:var(--on-gold);border-radius:2px;padding:0 1px}
#viewport.phone .tx-row{grid-template-columns:0 22px minmax(0,1fr)}
#viewport.phone .tx-clock{display:none}
#viewport.phone .tx-role{grid-template-columns:1fr;gap:4px}
#viewport.phone .tx-rolegut{text-align:left;padding:0}
#viewport.phone .tx-call .nm{min-width:0}
#viewport.phone .tx-feed{max-height:70vh}
#viewport.phone .tx-play{margin-left:0}
/* ---- Linked work: what the graph holds on the run node ---- */
.lw{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:14px}
.lw>*{min-width:0}
.lw .panel-b{padding:8px 14px 10px}
.lw-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);font-size:12.5px;min-width:0}
.lw-item:first-child{border-top:0}
.lw-item .ic{flex:none;width:18px;color:var(--dim);text-align:center;padding-top:1px;font-family:var(--mono)}
.lw-item .t{min-width:0;flex:1}
.lw-item .t b{display:block;color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw-item .t .sub{display:block;color:var(--muted);font-size:11.5px;line-height:1.5}
.lw-item .ev{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.edge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;padding:0 6px;border-radius:5px;border:1px solid var(--border);color:var(--muted);line-height:1.7;white-space:nowrap;background:none}
.edge.observed{color:var(--st-proven);border-color:color-mix(in srgb,var(--st-proven) 40%,transparent)}
.edge.stated{color:var(--st-approval);border-color:color-mix(in srgb,var(--st-approval) 40%,transparent)}
.edge.inferred{color:var(--k-rule);border-color:color-mix(in srgb,var(--k-rule) 40%,transparent)}
button.edge{cursor:pointer}
button.edge:hover{color:var(--fg)}
.lw-files details{border-top:1px solid var(--border)}
.lw-files details:first-child{border-top:0}
.lw-files summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;padding:8px 0;font-size:12.5px;min-width:0}
.lw-files summary::-webkit-details-marker{display:none}
.lw-files summary::before{content:"▸";color:var(--dim);flex:none}
.lw-files details[open] summary::before{content:"▾"}
.lw-files summary .p{font-family:var(--mono);font-size:11.5px;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw-files summary .dstat{margin-left:auto;font-family:var(--mono);font-size:11px;flex:none}
.lw-files .diff{margin-bottom:10px;max-height:360px}
.lw-note{font-size:11px;color:var(--dim);margin:0 0 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---- agent scores: trust and spend, 0–1000, traffic-lit by band ---- */
.sc{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px 2px 6px;border-radius:6px;border:1px solid;white-space:nowrap;line-height:1.5;font-variant-numeric:tabular-nums}
.sc i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 22%,transparent)}
.sc b{font-family:var(--mono);font-weight:700}
.sc em{font-style:normal;font-weight:500;opacity:.7;font-size:10px}
.sc.sm{font-size:10px;padding:0 5px 0 4px;gap:4px}
.sc-good{color:var(--st-allowed);border-color:color-mix(in srgb,var(--st-allowed) 42%,transparent);background:color-mix(in srgb,var(--st-allowed) 11%,transparent)}
.sc-avg{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.sc-bad{color:var(--st-failed);border-color:color-mix(in srgb,var(--st-failed) 42%,transparent);background:color-mix(in srgb,var(--st-failed) 11%,transparent)}
.scs{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.steer-list .check>.scs{flex:none;margin-left:6px}
.scm{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.scm-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.scm-h .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
.scm-h .dim{margin-left:auto;font-family:var(--mono);font-size:10.5px}
.scm-bar{position:relative;height:8px;border-radius:5px;overflow:visible;display:flex;gap:2px}
.scm-bar .z{height:100%;border-radius:3px;opacity:.5}
.scm-bar .z.bad{flex:0 0 40%;background:var(--st-failed)}
.scm-bar .z.avg{flex:0 0 30%;background:var(--gold)}
.scm-bar .z.good{flex:1;background:var(--st-allowed)}
.scm-bar .mk{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--fg);transform:translateX(-50%);box-shadow:0 0 0 2px var(--panel)}
.scm-lg{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:6px}
.scm .kv{margin-top:10px;font-size:12px}
.scm .kv dd{font-family:var(--mono);font-size:11.5px}
.scm .kv dd .up{color:var(--st-allowed)} .scm .kv dd .dn{color:var(--st-failed)}
.sc-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
/* ---- roles editor and rule editor ---- */
.perm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.perm-grid .pg{border:1px solid var(--border);border-radius:9px;background:var(--ink);padding:9px 11px}
.perm-grid .pg .h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px}
.perm-grid .check{display:flex;margin:0 0 4px;padding:4px 2px;border:0;background:none;align-items:center;font-size:inherit;font-weight:inherit;color:inherit;gap:8px}
.perm-grid .check input{width:auto;flex:none;margin:0;padding:0}
.perm-grid .check .n{font-size:11.5px;font-weight:500}
.rl-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:2px 4px 2px 8px;border-radius:6px;border:1px solid var(--border);background:var(--hl);color:var(--body);margin:0 4px 4px 0;max-width:100%}
.rl-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-chip button{border:0;background:none;color:var(--dim);font-size:13px;line-height:1;padding:0 4px;cursor:pointer;border-radius:4px}
.rl-chip button:hover{color:var(--st-failed);background:color-mix(in srgb,var(--st-failed) 12%,transparent)}
.rl-tog{position:relative;width:34px;height:20px;border-radius:12px;border:1px solid var(--border);background:var(--ink);cursor:pointer;padding:0;flex:none}
.rl-tog::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.rl-tog[aria-checked="true"]{background:color-mix(in srgb,var(--st-allowed) 25%,transparent);border-color:color-mix(in srgb,var(--st-allowed) 50%,transparent)}
.rl-tog[aria-checked="true"]::after{transform:translateX(14px);background:var(--st-allowed)}
.rule-th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rng{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:10px;align-items:center}
.rng input[type=range]{width:100%;accent-color:var(--gold);margin:0}
.rng input[type=number]{width:100%}
.rng-prev{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.rowacts{white-space:nowrap}
.rowacts .btn{margin-right:4px}
#viewport.phone .perm-grid{grid-template-columns:minmax(0,1fr)}
.field label.check{display:flex;font-size:inherit;font-weight:inherit;color:inherit;margin-bottom:8px}
.field .check input{width:auto;flex:none;margin:3px 0 0}
.field .check .d{font-weight:400}
/* ---- run instruments: three tiles, each value + basis + a small chart ---- */
.inst-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
#viewport.phone .inst-grid{grid-template-columns:minmax(0,1fr)}
.inst{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px 12px;display:grid;gap:8px;min-width:0;align-content:start}
.inst .ih{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.inst .ih .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.inst .ih .basis{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.inst .iv{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--fg)}
.inst .iv small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.inst .iv .sep{color:var(--dim);font-weight:400;margin:0 5px}
.inst .is{font-size:11.5px;color:var(--muted);line-height:1.45}
.inst .is b{color:var(--fg);font-weight:600}
.inst .delta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.inst .delta.up{color:var(--st-allowed)} .inst .delta.down{color:var(--st-denied)} .inst .delta.flat{color:var(--muted)}
.inst .leg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.inst .leg span{display:inline-flex;align-items:center;gap:5px}
.inst .leg i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.inst .leg b{color:var(--fg);font-weight:600}
/* column chart: <=24px thick, 4px rounded data-end, square baseline, 2px surface gap */
.cols{display:flex;align-items:flex-end;gap:2px;height:46px;padding-top:14px;position:relative}
.cols .c{flex:1;max-width:24px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:0}
.cols .c i{display:block;width:100%;background:var(--c);border-radius:4px 4px 0 0;min-height:2px;transition:filter .12s}
.cols .c i+i{border-radius:0}
.cols .c i:first-child{border-radius:4px 4px 0 0}
.cols .c:hover i,.cols .c:focus-visible i{filter:brightness(1.18)}
.cols .c .lab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 3px);font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* the quarantine box — the promise that research data stays research data */
.quar{border:1px solid color-mix(in srgb,var(--sk-res) 50%,transparent);border-radius:12px;background:color-mix(in srgb,var(--sk-res) 7%,var(--panel));padding:14px 16px}

.quar ol{margin:0;padding-left:18px;color:var(--body);font-size:12.8px;line-height:1.7}
.quar li{margin-bottom:5px}
.quar li b{color:var(--fg)}
.quar .cons{margin-top:12px;padding-top:11px;border-top:1px solid color-mix(in srgb,var(--sk-res) 30%,transparent);display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* two-path compare */
.paths{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#viewport.phone .paths{grid-template-columns:1fr}
.path{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:9px}
.path.on{border-color:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 30%,transparent)}
.path h3{display:flex;align-items:center;gap:8px}
.path .dl{display:grid;gap:5px;margin:0}
.path .dl .li{display:grid;grid-template-columns:14px 1fr;gap:8px;font-size:12.4px;color:var(--body);align-items:start}
.path .dl .li .s{font-family:var(--mono);font-size:12px;line-height:1.5}
.path .dl .li .s.add{color:var(--sk-on)} .path .dl .li .s.rem{color:var(--sk-held)} .path .dl .li .s.same{color:var(--dim)}

/* config / diff */
.cfg{border:1px solid var(--border);border-radius:11px;background:var(--void);overflow:hidden}
.cfg-h{padding:8px 12px;border-bottom:1px solid var(--border);background:var(--hl);font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cfg pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:11.7px;line-height:1.65;color:var(--body)}
.cfg pre .c{color:var(--dim)} .cfg pre .k{color:var(--accent-text)} .cfg pre .s{color:var(--st-proven)} .cfg pre .n{color:var(--fk-model)}

.cfg pre .rm{background:color-mix(in srgb,var(--sk-held) 14%,transparent);display:block}

/* mini stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.stat{border:1px solid var(--border);border-radius:11px;background:var(--panel);padding:12px 13px}
.stat .sl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}

.stat.res .sv{color:var(--sk-res)}
.stat.on .sv{color:var(--sk-on)}
.stat.held .sv{color:var(--sk-held)}

function toast(msg,tone){
  var host=el("toast"); if(!host) return;
  var col={approval:"var(--st-approval)",denied:"var(--st-denied)",failed:"var(--st-failed)",
           critical:"var(--st-critical)",gold:"var(--gold)",res:"var(--sk-res)"}[tone]||"var(--st-allowed)";
  var t=document.createElement("div"); t.className="toast";
  t.innerHTML='<span class="d" style="background:'+col+'"></span><span>'+h(msg)+'</span>';
  host.appendChild(t); setTimeout(function(){t.remove();},4600);
}
function act(msg,tone){toast(msg,tone);}

function badge(cls,txt){return '<span class="b b-'+cls+'">'+txt+'</span>';}
function tierBadge(t){
  var m={allowed:["allowed","allowed"],approval:["approval","needs approval"],denied:["denied","denied"]};
  var x=m[t]||["q",t]; return '<span class="b b-tier b-'+x[0]+'">'+x[1]+'</span>';
}
function frameDot(c){
  var m={model:"var(--fk-model)",tool:"var(--fk-tool)",gov:"var(--fk-gov)",ctx:"var(--fk-ctx)",op:"var(--fk-op)"};

/* ============================== Skills ============================== */
function pSkills(){
  var w=ws();
  if(S.state==="loading") return skeleton();
  if(S.state==="error") return errorState("Skills","503 skill_registry_unavailable");
  if(S.state==="denied") return deniedState("the skills of this workspace","skills.read on core-platform");

  if(!wsSkills(w)) return gateOff(w);
  if(S.state==="empty") return head(w)+emptyState("Skills are on, and there is nothing to resolve",
    "The config names five sources and none of them holds a skill yet. An agent that calls <span class=\"mono\">search_skills</span> in this workspace gets an empty result and the reason, which is a different thing from an error. Nothing is broken; nothing has been written.",
    '<button class="btn primary" onclick="openDialog(\'add\')">Add a skill to '+h(w.main)+'</button>'+
    '<button class="btn" onclick="openDialog(\'cfg\')">Open the config</button>');

  var t=tab("skills","catalog");
  var tabs=[["catalog","Catalog",SKILLS.filter(inScope).length],["search","Search",""],
            ["loop","In the loop",S.answered?"":"1"],["reflect","Reflection",REFLECT.axes.length],
            ["versions","Versions",HIST.length]];
  var bar='<div class="tabs" role="tablist">'+tabs.map(function(x){
    var on=t===x[0];
    return '<button role="tab" aria-selected="'+(on?"true":"false")+'" onclick="go(\'#/'+ORG.slug+'/'+w.slug+'/skills/'+x[0]+'\')">'+
      h(x[1])+(x[2]?'<span class="ct">'+x[2]+'</span>':'')+'</button>';}).join("")+'</div>';

  var body = t==="search"?tSearch(w) : t==="loop"?tLoop(w) : t==="reflect"?tReflect(w) :
             t==="versions"?tVersions(w) : tCatalog(w);
  return head(w)+bar+body;
}

function head(w){
  return '<p class="eyebrow">Workspace · '+h(w.name)+'</p><h1>Skills</h1>'+
   '<p class="lede">A skill is procedure written down: a file, in a repo, with a version and a digest. '+
   'Oxagen does not run it — the harness does. What Oxagen governs is <b>resolution</b>: which skills this workspace’s config '+
   'lets an agent find, which it may load, what that cost, and what was held back and why.</p>';
}

/* ---- the default state of every workspace ever created ---- */
function gateOff(w){
  return '<p class="eyebrow">Workspace · '+h(w.name)+'</p><h1>Skills</h1>'+
   '<div class="gate">'+
    '<div class="gh"><div class="gi">'+icon("lock")+'</div><div>'+
      '<h2>Skills are off in '+h(w.name)+'</h2>'+
      '<p class="sub">Every workspace ships this way. <span class="mono">skills.enabled = false</span> is the value a workspace is created with, not a value somebody set afterwards.</p>'+
    '</div><div style="margin-left:auto">'+badge("q","off")+'</div></div>'+

    '<div class="gbody">'+
     '<div class="gcol"><h4>'+icon("proc")+'What turning it on does</h4><ul>'+
      '<li>Adds one tool to every agent’s belt in this workspace: <span class="mono">search_skills</span>. Not a list of skills — a door.</li>'+
      '<li>Lets the harness load a skill file into the agent’s context, at a token cost this page prices to the cent.</li>'+
      '<li>Starts a <span class="mono">skills.searched</span> and a <span class="mono">skills.loaded</span> frame on every run that uses one, so a sealed run says exactly what procedure it was carrying.</li>'+
      '<li>Makes <span class="mono">.oxagen/skills.toml</span> a governed file. Changing it is a Context PR, not a settings screen.</li>'+
     '</ul></div>'+
     '<div class="gcol"><h4>'+icon("ask")+'What it does not do</h4><ul>'+
      '<li>It grants no tool. A skill that describes a deploy still cannot deploy; the governed action underneath it decides that.</li>'+
      '<li>It raises no tier. A skill loaded at <span class="mono">gateway</span> tier is still served through Oxagen call by call.</li>'+
      '<li>It does not reach into an unbound repo. If an agent starts a run somewhere this workspace does not own, the loop <b>stops and asks</b> rather than guessing.</li>'+
      '<li>It does not turn on reflection. That is a second switch, with its own consent, on the Reflection tab.</li>'+
     '</ul></div>'+
    '</div>'+

/* ---- catalog ---- */
function tCatalog(w){

  return '<div class="stats" style="margin:14px 0">'+
    stat("In scope here",live.length,"of "+SKILLS.length+" the sources hold","on")+
    stat("Held back",held.length,"scope, or an unapproved digest","held")+
    stat("If all loaded",tok.toLocaleString(),"tokens · $"+(tok*0.000003).toFixed(4)+" a turn")+
    stat("Actually loaded","1.4","skills a run, median · the belt is searchable")+
   '</div>'+

   '<div class="note" style="margin-bottom:12px">The belt is <b>searchable</b>, so an agent carries none of these until it asks. '+
    'Before <span class="mono">skl_v4</span> the belt was pinned and every agent carried seven skills into every run, '+
    'which cost 9,650 tokens a turn and was cited in under a fifth of them.</div>'+

   '<div class="panel"><div class="panel-h"><h3>Resolved by <span class="mono">'+h(CFG.ver)+'</span></h3>'+
     '<button class="btn sm ghost" onclick="openDialog(\'cfg\')">Open '+h(CFG.file)+'</button></div>'+

   '<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Held back</h3>'+
     '<span class="mono dim" style="font-size:11px">these do not appear in a search, at any rank</span></div>'+
    '<div class="panel-b"><div class="skl">'+held.map(skillRow).join("")+'</div>'+
    '<div class="hint" style="margin-top:10px">A held skill is not a low-scoring result. It is not a result. '+
    'The agent is told the count of what was withheld and the reason class, never the name — otherwise the withholding leaks the thing it withholds.</div>'+
    '</div></div>';

function stat(l,v,d,cls){
  return '<div class="stat'+(cls?" "+cls:"")+'"><div class="sl">'+h(l)+'</div><div class="sv">'+v+'</div><div class="sd">'+h(d)+'</div></div>';

function skillRow(s){

   '<div class="ki">'+icon(s.kind==="constraint"?"cons":"proc")+'</div>'+
   '<div><div class="nm">'+h(s.id)+' <span class="dim">@'+h(s.ver)+'</span></div>'+
    '<div class="st">'+h(s.st)+'</div>'+
    (s.note?'<div class="hint" style="margin:0 0 6px">'+s.note+'</div>':'')+
    (s.why?'<div class="hint" style="margin:0 0 6px;color:var(--body)"><b>Why it is held: </b>'+s.why+'</div>':'')+
    '<div class="meta">'+
     '<span class="chip src">'+h(s.srcLabel)+'</span>'+
     '<span class="chip">'+h(s.kind)+'</span>'+
     '<span class="chip">'+s.tokens.toLocaleString()+' tok</span>'+
     '<span class="chip">'+h(s.digest.slice(0,18))+'…</span>'+
     (s.twoPerson?'<span class="chip held">two-person</span>':'')+
     (s.cited?'<span class="chip">cited in '+s.cited+' of '+s.runs+' runs</span>':'')+
     (s.proofAfter!=null?'<span class="chip ok">proof rate '+pct(s.proofBefore)+' → '+pct(s.proofAfter)+'</span>':'')+

function tSearch(w){

  return '<div class="note" style="margin:14px 0"><b>This is not a search box for you.</b> It is the tool the agent holds, '+

    'What you type is what the model would have typed.</div>'+

   '<div class="sbox">'+
    '<div class="sq"><span class="lbl">search_skills(</span>'+
      '<input id="q" value="'+h(q)+'" aria-label="Query" autocomplete="off" '+

      '<span class="lbl">)</span>'+
      '<button class="btn sm primary" onclick="runQuery()">Ask as the agent</button></div>'+

   '</div>'+

   '<div class="row" style="gap:6px;flex-wrap:wrap;margin:12px 0">'+
    '<span class="mono dim" style="font-size:11px">try:</span>'+
    keys.map(function(k){return '<button class="btn sm ghost" onclick="S.q=\''+k+'\';render()">'+h(k)+'</button>';}).join("")+
   '</div>'+

   '<div class="grid g2" style="gap:12px">'+
    '<div class="panel"><div class="panel-h"><h3>What decided this</h3></div><div class="panel-b">'+
     '<div class="kv">'+
      '<dt>Config</dt><dd><span class="mono">'+h(CFG.ver)+'</span> · merged as '+h(CFG.pr)+' by '+h(PEOPLE[CFG.by].name)+'</dd>'+
      '<dt>Sources on</dt><dd>'+CFG.sources.filter(function(x){return x.on;}).length+' of '+CFG.sources.length+' · <span class="mono">acme/mobile</span> is linked but off</dd>'+
      '<dt>Belt mode</dt><dd><span class="mono">searchable</span> · nothing is carried until it is asked for</dd>'+
      '<dt>Cut-off</dt><dd>top <span class="mono">'+CFG.search.k+'</span>, minimum score <span class="mono">'+CFG.search.minScore+'</span></dd>'+
      '<dt>Load budget</dt><dd><span class="mono">'+CFG.search.budget.toLocaleString()+'</span> tokens a turn · a skill past the budget is refused, not truncated</dd>'+
      '<dt>Unbound repo</dt><dd><span class="mono">ask</span> · the loop stops and a person answers</dd>'+
     '</div></div></div>'+

    '<div class="panel"><div class="panel-h"><h3>The frame this wrote</h3></div><div class="panel-b">'+
     '<div class="cfg"><div class="cfg-h">skills.searched · frame 4 · run '+h(RUN.id)+'</div><pre>'+
      '<span class="k">query</span>        <span class="s">"'+h(q)+'"</span>\n'+
      '<span class="k">config</span>       <span class="s">"'+h(CFG.ver)+'"</span>\n'+
      '<span class="k">returned</span>     <span class="n">'+(r?r.hits.length:0)+'</span>\n'+
      '<span class="k">withheld</span>     <span class="n">'+(r?r.held.length:0)+'</span>  <span class="c"># count and reason class reach the model; names do not</span>\n'+
      '<span class="k">reasons</span>      ['+(r?r.held.map(function(id){var s=skill(id);return '<span class="s">"'+(s.state==="scope"?"out_of_scope":"unapproved_digest")+'"</span>';}).join(", "):'')+']\n'+
      '<span class="k">cost</span>         <span class="n">0.0002</span>  <span class="c"># the search itself, before anything is loaded</span>\n'+
      '<span class="k">grade</span>        <span class="s">"full"</span>'+
     '</pre></div>'+
     '<div class="hint" style="margin-top:9px">Replaying this run replays the search against <span class="mono">'+h(CFG.ver)+'</span>, not against today’s config. '+
      'A skill added tomorrow cannot appear in yesterday’s run.</div>'+
     '</div></div>'+
   '</div>';
}
function noQ(q){
  return '<div class="sres-h">No canned answer for <span class="mono">'+h(q)+'</span> in this mockup.</div>'+
   '<p class="muted" style="font-size:12.5px;margin:0">Pick one of the queries below. Each is a real shape: a hit, an empty result, '+
   'a scope withholding, and a digest withholding.</p>';
}
function sres(r,q){
  var out='<div class="sres-h">'+
    '<span class="b b-allowed"><span class="d"></span>'+r.hits.length+' returned</span>'+
    (r.held.length?'<span class="b b-denied">'+r.held.length+' withheld</span>':'')+
    '<span class="grow"></span>'+
    '<span class="mono">'+h(CFG.ver)+' · top '+CFG.search.k+' · min '+CFG.search.minScore+'</span></div>';

  if(!r.hits.length){
    out+='<div class="withheld" style="border-style:solid;border-color:var(--border);background:var(--ink)">'+
      '<div class="nm" style="text-decoration:none;color:var(--body)">[]</div>'+
      '<div class="why">'+h(r.none||"")+'</div></div>';
  }
  out+=r.hits.map(function(x){
    var s=skill(x[0]); if(!s) return "";
    return '<div class="hit"><div><div class="nm">'+h(s.id)+' <span class="dim">@'+h(s.ver)+'</span></div>'+
     '<div class="d">'+h(s.st)+'</div>'+
     '<div class="meta" style="margin-top:5px"><span class="chip src">'+h(s.srcLabel)+'</span>'+
      '<span class="chip">'+s.tokens.toLocaleString()+' tok</span>'+tierBadge(s.tier)+'</div></div>'+
     '<div class="sc">'+x[1].toFixed(2)+'</div></div>';
  }).join("");

  out+=r.held.map(function(id){
    var s=skill(id); if(!s) return "";
    var scope=s.state==="scope";
    return '<div class="withheld"><div class="row" style="gap:8px;align-items:center">'+
      '<span class="nm">'+h(s.id)+'</span><span class="grow"></span>'+
      '<span class="chip held">'+(scope?"out_of_scope":"unapproved_digest")+'</span></div>'+
     '<div class="why">'+(scope?
      'Published with <span class="mono">scope = workspace:finops</span>. It matched the query and was dropped before ranking.':
      'The served digest is not the approved digest. It matched the query and was dropped before ranking.')+'</div>'+
     '<div class="hint" style="margin-top:5px">The agent is told <span class="mono">withheld: 1</span> and the reason class. It is not told this name.</div></div>';
  }).join("");
  return out;
}
function runQuery(){
  var i=el("q"); if(i) S.q=i.value.trim();
  render();
  var r=QUERIES[S.q];
  if(!r) act("No canned answer for that query in this mockup.","gold");
  else if(!r.hits.length) act("Empty result, with a reason. Not an error — the agent carries on knowing it has no procedure for this.","gold");
  else act(r.hits.length+" returned, "+r.held.length+" withheld. Recorded as a skills.searched frame.","allowed");
}

/* ---- in the loop: the seat, and what it is used for ---- */
function tLoop(w){
  var open=!S.answered;
  return '<div class="note" style="margin:14px 0"><b>Oxagen sits between the harness and the model.</b> Every model call and every tool call '+
   'passes through it at <span class="mono">gateway</span> tier. That position is what makes the rest of this page enforceable: '+
   'a default nobody can stop is a suggestion.</div>'+

   '<div class="stats" style="margin-bottom:14px">'+
    stat("Interjections, 30 days",18,"14 answered, 3 timed out, 1 open")+
    stat("Median answer",'4m 12s',"the run waits; nothing is charged while it waits")+
    stat("On timeout",'deny',"the run continues with no skills and is told so")+
    stat("Open now",open?1:0,open?"run "+RUN.id.slice(0,12)+"…":"nothing is waiting",open?"held":"")+
   '</div>'+

   (open?
    '<div class="panel" style="border-color:color-mix(in srgb,var(--gold) 45%,transparent);margin-bottom:14px">'+
     '<div class="panel-h" style="background:color-mix(in srgb,var(--gold) 9%,var(--hl))"><h3>A run is waiting on you</h3>'+
      '<span class="live"><span class="p"></span>paused mid-loop</span></div>'+
     '<div class="panel-b">'+
      '<p style="margin-bottom:10px"><span class="mono">'+h(RUN.agent)+'</span> started in <span class="mono">'+h(RUN.repo)+'</span>, '+
       'a repository no workspace in <b>'+h(ORG.name)+'</b> owns. Skills are on here, so there is a config to resolve — and nothing to resolve it against. '+
       'The gateway stopped before the first model call and put the question to you <b>through the agent</b>.</p>'+
      '<button class="btn primary" onclick="go(\'#/'+ORG.slug+'/'+w.slug+'/runs/'+RUN.id+'\')">Open the run and answer it</button>'+
     '</div></div>'
    :
    '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Nothing is waiting</h3>'+
      badge("allowed","answered")+'</div><div class="panel-b">'+
     '<p style="margin:0">You answered <span class="mono">'+h(RUN.id)+'</span> with '+
      '<b>'+(S.answered==="link"?"link to core-platform":"create the workspace edge")+'</b>. '+
      '<a href="#/'+ORG.slug+'/'+w.slug+'/runs/'+h(RUN.id)+'">Open the run</a> to see the frames it wrote, '+
      'or <button class="btn sm ghost" onclick="resetDemo()">reset the demo</button> to be asked again.</p>'+
     '</div></div>')+

   '<div class="grid g2" style="gap:12px">'+
    '<div class="panel"><div class="panel-h"><h3>What the seat is allowed to do</h3></div><div class="panel-b">'+
     '<div class="skl">'+[
      ["ask","Ask a person a question","The loop pauses at a boundary and the question reaches the operator in the agent’s own voice. The agent is not told what to say; it is handed the answer as evidence."],
      ["cons","Stop before a guess","An unbound repo, a skill past the load budget, a digest that changed. Each one is a stop, not a fallback."],
      ["mirror","Ask the agent to reflect","An out-of-band turn, after the work is sealed. Its output is quarantined; see the Reflection tab."],
      ["proc","Record what it did","Every one of the above is a frame with a time, an author and a digest. Nothing above happens off the record."]
     ].map(function(x){
      return '<div class="skl-row"><div class="ki">'+icon(x[0])+'</div><div><div class="nm">'+h(x[1])+'</div>'+
       '<div class="st">'+h(x[2])+'</div></div><div class="rt"></div></div>';}).join("")+'</div></div></div>'+

    '<div class="panel"><div class="panel-h"><h3>What it is not allowed to do</h3></div><div class="panel-b">'+
     '<div class="skl">'+[
      ["Rewrite what the agent said","An interjection is a new frame beside the agent’s turn. The agent’s own output is never edited, and a replay shows both."],
      ["Answer on the operator’s behalf","No default answer, no remembered answer, no “last time you chose…”. On timeout the run continues with nothing, which is the conservative end."],
      ["Feed a reflection back into the work","A self-grade cannot become steering, cannot become a Context PR, and cannot change a later run’s context. The Reflection tab states it in five lines and the file enforces it."],
      ["Hide that it happened","There is no silent interjection. A run that was asked something carries the question, the pause, the answer and the wait in its frames."]
     ].map(function(x){

   '</div>';
}

/* ---- reflection: captured, and then fenced ---- */
function tReflect(w){
  var R=REFLECT;
  return '<div class="note" style="margin:14px 0"><b>Research only, and the file says so.</b> '+
   '<span class="mono">use = "research"</span> is the only value <span class="mono">'+h(CFG.file)+'</span> accepts for reflection. '+
   'There is no setting that turns a self-grade into steering, because the thing a model says about its own work is evidence about the model, not about the work.</div>'+

   '<div class="stats" style="margin-bottom:14px">'+
    stat("Sampled",pct(CFG.reflect.sample),"plus every failing and tampered run","res")+
    stat("Captured, 30 days",127,"out of 611 sealed runs","res")+
    stat("Cost",'$1.79',"0.09% of the month’s spend · billed as overhead, never as productive")+
    stat("Calibration gap",'2 of 4',"axes where the agent scored itself above the record","held")+
   '</div>'+

   '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>The turn that was injected</h3>'+
     '<span class="mono dim" style="font-size:11px">'+h(R.when)+'</span></div><div class="panel-b">'+
    '<div class="fr" style="margin-bottom:12px">'+
     frameRow({k:"run.sealed",c:"gov",t:"14:22:09.440Z",d:"run "+R.run+" · verdict failing · chain sealed, attestation key atk_7"})+
     frameRow({k:"control.reflect",c:"gov",t:"14:22:41.002Z",d:"rubric "+R.rubric+" · "+h(R.why),oob:true})+
     frameRow({k:"model.request",c:"model",t:"14:22:41.118Z",d:R.model+" · the sealed run is the evidence; the agent is asked four questions",oob:true})+
     frameRow({k:"reflection.captured",c:"gov",t:"14:22:44.870Z",d:R.tokens.toLocaleString()+" tokens · $"+R.cost+" · quarantined on write",oob:true})+
    '</div>'+
    '<div class="hint">Dashed frames are <b>out of band</b>. They sit after the seal, they are excluded from the chain the seal covers, '+
     'and they are not replayed when the run is forked. A fork of this run re-runs the work and not the grading.</div>'+
   '</div></div>'+

   '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>What it said about itself</h3>'+
     '<span class="grow"></span><span class="chip res">self</span><span class="chip" style="color:var(--st-proven);border-color:color-mix(in srgb,var(--st-proven) 45%,transparent)">the record</span></div>'+
    '<div class="panel-b"><div class="rub">'+R.axes.map(function(a,i){
      return '<div class="rax'+(a.gap?" gap":"")+'">'+
       '<div class="rq">'+h(a.q)+(a.gap?'<span class="gp">calibration gap</span>':'')+'</div>'+
       '<div class="rbar"><span class="rlab">self</span><span class="rtrack"><span class="rfill self" style="width:'+(a.self*20)+'%"></span></span><span class="rn">'+a.self+' / 5</span></div>'+
       '<div class="rbar"><span class="rlab">the record</span><span class="rtrack"><span class="rfill obs" style="width:'+(a.obs*20)+'%"></span></span><span class="rn">'+a.obs+' / 5</span></div>'+
       '<div class="rsay">“'+h(a.say)+'”</div>'+
       '<div class="hint" style="margin-top:6px">the record says: '+h(a.obsLab)+'</div>'+
      '</div>';}).join("")+'</div>'+

    '<div style="margin-top:12px">'+R.contra.map(function(c){
      return '<div class="withheld" style="border-style:solid;border-color:color-mix(in srgb,var(--st-failed) 42%,transparent);background:color-mix(in srgb,var(--st-failed) 5%,transparent)">'+
       '<div class="row" style="gap:8px;align-items:center"><span class="nm" style="text-decoration:none;color:var(--fg)">Axis '+(c.ax+1)+'</span>'+
       '<span class="grow"></span><span class="chip held">'+h(c.ev)+'</span></div>'+
       '<div class="why">'+c.what+'</div></div>';}).join("")+'</div>'+
   '</div></div>'+

   '<div class="quar">'+
    '<h3>'+icon("lock")+'Quarantine</h3>'+
    '<p style="margin-bottom:8px;font-size:12.8px">A captured reflection is written to a store that five rules fence off. '+
     'These are not preferences on this screen; they are the reason the feature was allowed to exist.</p>'+
    '<ol>'+
     '<li><b>It never enters a context frame.</b> No later run of this agent, or any agent, can cite it. It is not in the ontology and it is not a context record.</li>'+
     '<li><b>It cannot be promoted.</b> There is no path from a reflection to a proposal, to a Context PR, or to steering. The promote action does not exist for this kind.</li>'+
     '<li><b>It does not price the work.</b> Its tokens are billed as overhead on the Spend page and excluded from the productive ratio, so a run cannot look better by grading itself.</li>'+
     '<li><b>It is not evidence about a person.</b> It carries the agent, the run and the rubric. Reading it is <span class="mono">research.read</span>, an organization grant that '+h(PEOPLE.priya.name)+' holds and no workspace role inherits.</li>'+
     '<li><b>It expires.</b> '+h(CFG.reflect.retain)+' from capture, then crypto-shredded with the run’s research key. An erasure request takes it with the run.</li>'+
    '</ol>'+
    '<div class="cons">'+
     '<span class="chip res">use = research</span>'+
     '<span class="chip res">consent: organization · recorded by '+h(PEOPLE.priya.name)+' on 2026-09-02</span>'+
     '<span class="chip res">retain '+h(CFG.reflect.retain)+'</span>'+
     '<span class="grow"></span>'+
     '<button class="btn sm" onclick="act(\'Reflection capture turned off for core-platform. 127 captured reflections remain under their retention clock.\',\'res\')">Turn capture off</button>'+
     '<button class="btn sm ghost" onclick="act(\'Export requires research.read. Priya Natarajan holds it; you do not.\',\'denied\')">Export for research</button>'+
    '</div>'+
   '</div>';
}

/* ============================== Fleet ============================== */
function pFleet(){
  var w=ws();
  if(S.state==="loading") return skeleton();
  if(S.state==="error") return errorState("Fleet","503 fleet_unavailable");
  if(S.state==="denied") return deniedState("the fleet","runs.read on core-platform");
  var open=!S.answered;
  return '<p class="eyebrow">Workspace · '+h(w.name)+'</p><h1>Fleet</h1>'+
   (S.state==="empty"?emptyState("No run is in flight",
     "Runs are not started here — agents start them. When one starts in a repository this workspace does not own, it appears in this queue before it appears in the table, because it has stopped and is waiting on a person.",""):
   '<div class="panel" style="'+(open?'border-color:color-mix(in srgb,var(--gold) 45%,transparent);':'')+'margin-bottom:14px">'+
    '<div class="panel-h"'+(open?' style="background:color-mix(in srgb,var(--gold) 9%,var(--hl))"':'')+'><h3>Waiting on a person</h3>'+
     (open?'<span class="b b-approval">1 interjection</span>':badge("allowed","clear"))+'</div>'+
    '<div class="panel-b">'+(open?
     '<div class="skl"><div class="skl-row" style="border-color:color-mix(in srgb,var(--gold) 40%,transparent)">'+
      '<div class="ki" style="color:var(--accent-text);border-color:color-mix(in srgb,var(--gold) 45%,transparent)">'+icon("ask")+'</div>'+
      '<div><div class="nm">'+h(RUN.agent)+'</div>'+
       '<div class="st">Started in <span class="mono">'+h(RUN.repo)+'</span>, which no workspace owns. '+

        '<span class="chip">gateway</span><span class="chip held">waiting 3m 36s</span><span class="chip">$'+RUN.cost+' so far</span></div></div>'+
      '<div class="rt"><span class="b b-approval">paused</span>'+
       '<button class="btn sm primary" onclick="go(\'#/'+ORG.slug+'/'+w.slug+'/runs/'+RUN.id+'\')">Answer</button></div></div></div>'
     :'<p class="muted" style="margin:0;font-size:12.5px">Nothing is waiting. '+
       '<button class="btn sm ghost" onclick="resetDemo()">Reset the demo</button> to be asked again.</p>')+
    '</div></div>')+

   '<div class="panel"><div class="panel-h"><h3>Runs</h3>'+
     '<span class="mono dim" style="font-size:11px">1 in flight · 38 agents in this workspace</span></div>'+
    '<div class="panel-b"><table><thead><tr><th>Run</th><th>Agent</th><th>Repo</th><th>Step</th><th>Cost</th><th>Skills</th><th>Status</th></tr></thead><tbody>'+
     '<tr><td><a class="mono" href="#/'+ORG.slug+'/'+w.slug+'/runs/'+RUN.id+'">'+h(RUN.id)+'</a></td>'+

      '<td>'+(S.answered?'<span class="live"><span class="p"></span>live</span>':'<span class="b b-approval">paused</span>')+'</td></tr>'+
    '</tbody></table></div></div>';
}

/* ============================== the run, from three sides ============================== */
function pRun(){
  var w=ws();
  if(S.state==="loading") return skeleton();
  if(S.state==="error") return errorState("This run","503 run_unavailable");
  if(S.state==="denied") return deniedState("this run","runs.read on core-platform");
  var ans=S.answered;

  return '<p class="eyebrow">Run · '+h(RUN.id)+'</p>'+
   '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px">'+
    '<div><h1>'+h(RUN.taskTitle)+'</h1>'+
     '<p class="muted" style="margin:4px 0 0;font-size:12.5px"><span class="mono">'+h(RUN.agent)+'</span> · '+h(RUN.harness)+' · '+
      h(PEOPLE[RUN.op].name)+' · gateway tier · <span class="mono">'+h(RUN.remote)+'@'+h(RUN.sha)+'</span></p></div>'+
    '<div class="row" style="gap:7px">'+(ans?'<span class="live"><span class="p"></span>live</span>':'<span class="b b-approval">paused · waiting on a person</span>')+'</div>'+
   '</div>'+

   (ans?
    '<div class="note" style="margin:12px 0"><b>Answered.</b> '+
     (ans==="link"?'<span class="mono">acme/edge-proxy</span> is a linked repo of <b>core-platform</b>, the run resolved '+h(CFG.ver)+', and one skill is loaded.'
                  :'The workspace <b>edge</b> exists, <span class="mono">acme/edge-proxy</span> is its main repo, and — because that is what a new workspace ships as — <b>skills are off in it</b>. The run carries none, and the agent was told so in one line.')+
     ' <button class="btn sm ghost" onclick="resetDemo()">Ask again</button></div>'
    :
    '<div class="note" style="margin:12px 0;border-color:color-mix(in srgb,var(--gold) 42%,transparent);background:color-mix(in srgb,var(--gold) 7%,var(--panel))">'+
     '<b>The loop is stopped.</b> Not failed, not queued, not continuing on a default. The harness is holding at the boundary before its first model call, '+
     'the clock on this run is not running, and nothing has been charged since 09:14:02Z.</div>')+

   '<div class="tript">'+
    '<div class="pane"><div class="pane-h"><span class="eb">What the agent shows '+h(PEOPLE[RUN.op].name.split(" ")[0])+'</span><span class="who">harness</span></div>'+
     '<div class="pane-b">'+trAgent(ans)+'</div></div>'+
    '<div class="pane hot"><div class="pane-h"><span class="eb">What Oxagen put to a person</span><span class="who">gateway</span></div>'+
     '<div class="pane-b">'+trOperator(ans)+'</div></div>'+
    '<div class="pane"><div class="pane-h"><span class="eb">What was written down</span><span class="who">frames</span></div>'+
     '<div class="pane-b"><div class="fr">'+(ans?AFTER[ans]:FRAMES).map(frameRow).join("")+'</div>'+
      '<div class="hint" style="margin-top:9px">'+(ans?
        'Nothing here is reconstructed. The pause, the question, the wait and the answer are frames in the same chain as the work.':
        'The three greyed frames have not happened. A run that is waiting is a run that has written down that it is waiting.')+
      '</div></div></div>'+
   '</div>'+

   (ans?afterPanel(ans):'');
}

function trAgent(ans){
  var out='<div class="tr">'+
   '<div class="msg op"><div class="mh"><b>'+h(PEOPLE[RUN.op].name)+'</b><span class="tm">09:14:01Z</span></div>'+
    '<p>Cut the first release notes for edge-proxy. Everything since the repo was created.</p></div>'+
   '<div class="msg gw"><div class="mh"><b>Oxagen</b><span class="chip">interjection</span><span class="tm">09:14:02Z</span></div>'+
    '<p>Before I start: this repository is not bound to a workspace, so I have no skills config to work from. I am not going to guess which one applies.</p>'+
    '<p style="color:var(--muted);font-size:12px">Two ways forward, and they are not the same:</p>'+
    (ans?'':'<div class="picks">'+
      pick("link","Link it to core-platform","Becomes a linked repo. Inherits "+CFG.ver+", the belt, the budget and the gateway tier of that workspace.")+
      pick("create","Create a new workspace","Called edge, with acme/edge-proxy as its main repo. Ships with skills off, like every workspace does.")+
     '</div>'+
     '<div class="row" style="gap:7px;margin-top:9px"><button class="btn primary sm"'+(S.picked?'':' disabled')+' onclick="answer()">Send this answer</button>'+
      '<span class="mono dim" style="font-size:10.5px">'+(S.picked?'answers as '+h(PEOPLE[RUN.op].name):'pick one')+'</span></div>')+
   '</div>';

  if(ans){
    out+='<div class="msg op"><div class="mh"><b>'+h(PEOPLE[RUN.op].name)+'</b><span class="tm">09:17:38Z</span></div>'+
      '<p>'+(ans==="link"?"Link it to core-platform.":"Make a new workspace. Call it edge.")+'</p></div>'+
     '<div class="msg agent"><div class="mh"><b>'+h(RUN.agent)+'</b><span class="chip">turn 1</span><span class="tm">09:17:39Z</span></div>'+
      (ans==="link"
       ? '<p>Bound. I have <span class="mono">acme.release-notes-from-prs@2.1.0</span> and I am following it: group the merged pull requests, write the draft to a release branch, publish nothing.</p>'+
         '<p style="color:var(--muted);font-size:12px">2 skills were withheld from my search. I am told the count and the reason class, not the names.</p>'
       : '<p>Working in <b>edge</b>. I have no skills in this workspace — skills are off here — so I will do this from the commit history directly and write the draft to a branch.</p>'+
         '<p style="color:var(--muted);font-size:12px">I will say so in the pull request, because a reviewer should know this was done without the release-notes procedure.</p>')+
     '</div>';
  }
  return out+'</div>'+
   '<div class="hint" style="margin-top:9px">The question reaches '+h(PEOPLE[RUN.op].name.split(" ")[0])+' <b>where they already are</b> — '+
   'in the agent’s own surface. There is no second inbox to check, and the agent is not the author of the question.</div>';
}
function pick(k,n,d){
  var on=S.picked===k;
  return '<button class="pick" aria-pressed="'+(on?"true":"false")+'" onclick="S.picked=\''+k+'\';render()">'+
   '<span class="pk">'+(on?"✓":"")+'</span><span><span class="pn">'+h(n)+'</span><span class="pd">'+h(d)+'</span></span></button>';
}

function trOperator(ans){
  if(ans) return '<div class="tr"><div class="msg gw"><div class="mh"><b>Answered</b>'+badge("allowed","closed")+'<span class="tm">09:17:38Z</span></div>'+
   '<p>'+h(PEOPLE[RUN.op].name)+' chose <b>'+(ans==="link"?"link to core-platform":"create the workspace edge")+'</b>. '+
   'Receipt <span class="mono">'+(ans==="link"?"rcp_01K6QW44":"rcp_01K6QW45")+'</span>, waited 3m 36s.</p>'+
   '<p style="font-size:12px;color:var(--muted)">Binding a repository is a governed action, so this answer went through the same path as approving a payment: '+
   'a rule, a grant, a receipt, and a name that stays on it.</p></div></div>';

  return '<div class="tr">'+
   '<div class="msg gw"><div class="mh"><b>control.interject</b><span class="chip held">the loop is held</span><span class="tm">09:14:02Z</span></div>'+
    '<p><span class="mono">repo.unknown</span> — <span class="mono">'+h(RUN.remote)+'</span> resolves to no workspace in <span class="mono">'+h(ORG.slug)+'</span>.</p>'+
    '<p><span class="mono">skills.enabled = true</span> and <span class="mono">unbound_repo = ask</span>, so the gateway put it to a person instead of resolving nothing quietly.</p>'+
   '</div>'+
   '<div class="paths">'+
    '<div class="path'+(S.picked==="link"?" on":"")+'"><h3>'+icon("git")+'Link</h3>'+
     '<p class="muted" style="font-size:12px;margin:0">to <b>core-platform</b></p>'+
     '<div class="dl">'+
      dl("add","Inherits <span class=\"mono\">"+CFG.ver+"</span> — 7 skills in scope, 1 withheld")+
      dl("add","Inherits the belt, the $2.00 run budget and gateway tier")+
      dl("add","Becomes the third linked repo · indexed into the code graph")+
      dl("same","Marcus already owns this workspace, so no new grant")+
      dl("rem","Everything in edge-proxy is now in core-platform’s spend and audit")+
     '</div></div>'+
    '<div class="path'+(S.picked==="create"?" on":"")+'"><h3>'+icon("skills")+'Create</h3>'+
     '<p class="muted" style="font-size:12px;margin:0">a workspace called <b>edge</b></p>'+
     '<div class="dl">'+
      dl("rem","<b>Skills ship off.</b> 0 in scope, and <span class=\"mono\">search_skills</span> is not on the belt")+
      dl("rem","No belt, no budget, no price book until somebody sets them")+
      dl("add","Its own spend, its own audit, its own owner")+
      dl("add","<span class=\"mono\">acme/edge-proxy</span> becomes its main repo, branch <span class=\"mono\">main</span>")+
      dl("same","This run continues either way — with a procedure, or without one")+
     '</div></div>'+
   '</div>'+
   '<div class="hint" style="margin-top:10px">Notice what the second path does: a brand new workspace comes up with skills <b>off</b>, '+
    'in the middle of a run that was asking for skills. The default is not a first-run nicety — it holds every time a workspace is made.</div>'+
   '<div class="withheld" style="margin-top:10px;border-style:solid;border-color:var(--border);background:var(--ink)">'+
    '<div class="nm" style="text-decoration:none;color:var(--fg)">If nobody answers</div>'+
    '<div class="why">At 30 minutes this times out to <span class="mono">deny</span>. The run continues with no skills and the agent is told why, '+
    'because the safe end of an unanswered question is fewer skills, not more.</div></div>'+
   '</div>';
}
function dl(k,t){return '<div class="li"><span class="s '+k+'">'+(k==="add"?"+":k==="rem"?"−":"·")+'</span><span>'+t+'</span></div>';}

function afterPanel(ans){
  if(ans==="link") return '<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>The skill it loaded</h3>'+
    '<span class="mono dim" style="font-size:11px">1,840 tokens · $0.0055 · priced on the Spend page as context, not as output</span></div>'+
   '<div class="panel-b">'+skillRow(skill("acme.release-notes-from-prs"))+

  return '<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>The workspace that was created</h3>'+
    badge("q","skills off")+'</div><div class="panel-b">'+
   '<div class="cfg"><div class="cfg-h">acme/edge-proxy · .oxagen/workspace.toml <span class="grow"></span>committed by the gateway, 09:17:39Z</div><pre>'+
   '<span class="k">slug</span>    = <span class="s">"edge"</span>\n'+
   '<span class="k">name</span>    = <span class="s">"Edge"</span>\n'+
   '<span class="k">owner</span>   = <span class="s">"marcus"</span>\n'+
   '<span class="k">main</span>    = <span class="s">"acme/edge-proxy"</span>\n'+
   '<span class="k">branch</span>  = <span class="s">"main"</span>\n\n'+

   '<div class="row" style="gap:7px;margin-top:11px">'+

   '</div></div></div>';
}

function answer(){
  if(!S.picked) return;
  S.answered=S.picked;
  render();
  act(S.answered==="link"
    ? "Answered. acme/edge-proxy is linked to core-platform; the run resolved skl_v7 and loaded one skill."
    : "Answered. Workspace edge created — with skills off, which is what every workspace ships as.",
    S.answered==="link"?"allowed":"gold");
}
function resetDemo(){
  S.answered=null;S.picked=null;S.on=true;S.ws="core-platform";S.q="cut the first release notes";
  render();act("Reset. The repo is unbound again and the run is waiting.","gold");
}

/* ============================== dialogs ============================== */
function openDialog(kind,arg){S.dlg=kind;S.dlgArg=arg;render();}

function dialog(){

    title="Turn skills on for "+ws().name; sub="This is a governed action. It writes a file, opens a pull request, and puts your name on both.";
    body='<div class="ga" style="margin-bottom:12px"><div class="grow"><div class="n">skills.enabled</div>'+
      '<div class="d">false → true in <span class="mono">'+h(CFG.file)+'</span></div></div>'+
      '<button class="sw" role="switch" aria-checked="true" aria-label="Enabled" onclick="act(\'The switch is the outcome, not the control. The pull request is the control.\',\'gold\')"><i></i></button></div>'+
     '<div class="field"><label>What this writes</label>'+cfgFile()+'</div>'+
     '<div class="field"><label>What happens to runs already in flight</label>'+
      '<div class="hint">Nothing. A run resolves its config once, at the start. The three runs in flight right now finish without skills; '+
      'the next run each agent starts picks this up.</div></div>'+
     '<div class="note">Every agent in '+h(ws().name)+' gains <span class="mono">search_skills</span> and nothing else. '+

  else if(k==="cfg"){

    body=cfgFile()+'<div style="margin-top:14px"><h4 style="margin-bottom:8px">Sources, and what each contributes</h4>'+
     '<div class="skl">'+CFG.sources.map(function(x){
      return '<div class="skl-row'+(x.on?"":" held")+'"><div class="ki">'+icon(x.k==="registry"?"organization":x.k==="market"?"tools":"git")+'</div>'+
       '<div><div class="nm">'+h(x.label)+'</div><div class="st">'+h(x.d)+'</div></div>'+
       '<div class="rt">'+(x.on?badge("allowed",x.n+" skills"):badge("q","not a source"))+'</div></div>';}).join("")+'</div></div>';
    foot='<span class="grow">changing this is a pull request, not a save button</span><button class="btn" onclick="closeDialog()">Close</button>';
  }
  else if(k==="skill"){
    var s=skill(S.dlgArg)||SKILLS[0]; wide=true;
    title=s.id; sub=s.srcLabel+" · "+s.path;
    body='<div class="kv" style="margin-bottom:14px">'+
      '<dt>Version</dt><dd><span class="mono">'+h(s.ver)+'</span></dd>'+
      '<dt>Digest</dt><dd><span class="mono">'+h(s.digest)+'</span></dd>'+
      '<dt>Kind</dt><dd>'+h(s.kind)+'</dd>'+
      '<dt>Load cost</dt><dd><span class="mono">'+s.tokens.toLocaleString()+'</span> tokens · $'+(s.tokens*0.000003).toFixed(4)+' a turn it is loaded into</dd>'+
      '<dt>Decision</dt><dd>'+tierBadge(s.tier)+(s.twoPerson?' · two people, and not the one who ran it':'')+'</dd>'+
      '<dt>Owner</dt><dd>'+(s.owner?h(PEOPLE[s.owner].name):'<span class="muted">nobody — which is why it is held</span>')+'</dd>'+
      '<dt>Cited</dt><dd>'+(s.cited?s.cited+' of '+s.runs+' runs that searched for it':'never')+'</dd>'+
      (s.proofAfter!=null?'<dt>Proof rate</dt><dd>'+pct(s.proofBefore)+' before it existed → <b>'+pct(s.proofAfter)+'</b> after · measured over '+s.runs+' runs</dd>':'')+
     '</div>'+
     (s.why?'<div class="note" style="border-color:color-mix(in srgb,var(--sk-held) 45%,transparent)"><b>Held: </b>'+s.why+'</div>':'')+
     '<div class="cfg"><div class="cfg-h">'+h(s.path)+'</div><pre>'+skillBody(s)+'</pre></div>'+
     '<div class="hint" style="margin-top:9px">This is the whole of it. A skill has no code to run and no credential to hold — '+
      'it is prose an agent reads, and every action it describes still goes through the toolbelt and the policy that governs it.</div>';
    foot='<span class="grow">'+h(s.srcLabel)+'</span>'+
     (s.state==="unapproved"
      ?'<button class="btn" onclick="closeDialog()">Close</button><button class="btn primary" onclick="closeDialog();act(\'Digest diff sent to Priya Natarajan. It stays held until she approves it.\',\'approval\')">Send the digest for approval</button>'
      :'<button class="btn" onclick="closeDialog()">Close</button>');
  }
  else if(k==="add"){
    title="Add a skill"; sub="Skills are files. This opens a pull request against "+ws().main+".";
    body='<div class="field"><label>Path</label><div class="cfg"><pre><span class="k">.oxagen/skills/</span><span class="s">&lt;name&gt;</span><span class="k">/SKILL.md</span></pre></div>'+
      '<div class="hint">The directory name is the skill’s id inside this workspace. The digest is taken at merge.</div></div>'+
     '<div class="note">There is no upload here, and no editor that writes to a database. A skill an agent can find is a skill somebody merged.</div>';
    foot='<button class="btn" onclick="closeDialog()">Cancel</button><button class="btn primary" onclick="closeDialog();act(\'Branch skills/new-skill created. Nothing resolves until it merges.\',\'gold\')">Create the branch</button>';
  }
  else if(k==="cmd"){
    return '<div class="scrim" onclick="if(event.target===this)closeDialog()"><div class="cmd" role="dialog" aria-label="Screens">'+
     '<div class="cmd-in">'+icon("skills")+'<input placeholder="Every screen in W13" aria-label="Screens" autofocus></div>'+
     '<div class="cmd-l">'+
      SCREENS.map(function(g){
        return '<div class="cmd-g">'+h(g[0])+'</div>'+g[1].map(function(x){
          return '<button class="cmd-i" onclick="closeDialog();'+x[1]+'"><span class="ic">'+icon(x[2]||"skills")+'</span>'+
           '<span class="grow">'+h(x[0])+'</span><span class="mono dim" style="font-size:10.5px">'+h(x[3]||"")+'</span></button>';}).join("");
      }).join("")+
     '</div></div></div>';
  }

  return '<div class="scrim" onclick="if(event.target===this)closeDialog()">'+
   '<div class="dlg'+(wide?" wide":"")+'" role="dialog" aria-modal="true" aria-label="'+h(title)+'">'+
    '<div class="dlg-h'+(sub?" sub":"")+'"><div class="grow"><h2>'+h(title)+'</h2>'+(sub?'<p>'+h(sub)+'</p>':'')+'</div>'+
     '<button class="iconbtn x" onclick="closeDialog()" aria-label="Close">✕</button></div>'+
    '<div class="dlg-b">'+body+'</div>'+(foot?'<div class="dlg-f">'+foot+'</div>':'')+
   '</div></div>';
}
function skillBody(s){
  var m={
   "acme.release-notes-from-prs":'<span class="c">---</span>\n<span class="k">name</span>: release-notes-from-prs\n<span class="k">scope</span>: workspace:core-platform\n<span class="c">---</span>\n\n<span class="k"># Cutting release notes</span>\n\n1. List the pull requests merged into <span class="s">main</span> since the last tag.\n2. Group them under <span class="s">Features</span>, <span class="s">Fixes</span>, <span class="s">Breaking</span>. A PR with no label goes to Fixes.\n3. Read CHANGELOG.md <span class="k">once</span>. It is 40k tokens; re-reading it is the single largest\n   waste in this task’s history.\n4. Write the draft to <span class="s">release/&lt;version&gt;-notes</span>. Open a PR.\n5. <span class="k">Never</span> publish the release. That is github__create_release, it needs approval,\n   and it is not yours to ask for.',
   "acme.rollback-a-bad-release":'<span class="c">---</span>\n<span class="k">name</span>: rollback-a-bad-release\n<span class="k">scope</span>: workspace:core-platform\n<span class="c">---</span>\n\n<span class="k"># Pulling a release back</span>\n\n<span class="k">Do not</span> revert the merge commit first. <span class="k">Do not</span> force-push main. Both of those\nhave cost us a day each, on 2025-03-11 and on 2025-11-02.\n\n1. Flip the feature flag. This is the only step that is fast.\n2. Cut a revert PR against main and let the ladder run on it.\n3. Only once the witness flips, tag and deploy.',
   "acme.postgres-safe-migration":'<span class="c">---</span>\n<span class="k">name</span>: postgres-safe-migration\n<span class="k">scope</span>: workspace:core-platform, workspace:finops\n<span class="c">---</span>\n\n<span class="k"># Expand, backfill, contract</span>\n\nNever in one deploy. The four outages in 2025 were all one deploy.\n\n1. <span class="k">Expand</span>: add the column, nullable, no default on a large table.\n2. <span class="k">Backfill</span>: in batches, off the request path, resumable.\n3. <span class="k">Contract</span>: drop the old column, in a later deploy, after a week of dual reads.',
   "acme.invoice-reconciliation":'<span class="c">---</span>\n<span class="k">name</span>: invoice-reconciliation\n<span class="k">scope</span>: workspace:finops\n<span class="c">---</span>\n\n<span class="c"># You are reading this because you opened it from Mission Control.</span>\n<span class="c"># An agent in core-platform cannot: scope says finops, and scope is</span>\n<span class="c"># checked before ranking, not after.</span>\n\n<span class="k"># Matching a statement line</span>\n\n1. Find the purchase order. No PO, no payment.\n2. Find the receipt. Amounts must agree to the cent.\n3. Anything above the mandate parks. That is not your call to make.',
   "oxagen.pdf-extract":'<span class="c">---</span>\n<span class="k">name</span>: pdf-extract\n<span class="k">publisher</span>: oxagen-marketplace\n<span class="c">---</span>\n\n<span class="c"># Held. The body below is the 0.9.3 the marketplace served on 2026-09-09.</span>\n<span class="c"># The digest Priya approved on 2026-08-21 was sha256:b78e...0c14, and this</span>\n<span class="c"># one is sha256:f41c...593a. No agent has seen either.</span>\n\n<span class="k"># Extracting tables</span>\n\n1. Detect ruled regions. 2. Read cells left to right. 3. Return rows.'
  };
  return m[s.id]||'<span class="c">---</span>\n<span class="k">name</span>: '+h(s.id.split(".").pop())+'\n<span class="c">---</span>\n\n'+h(s.st);
}

/* ============================== routing and render ============================== */
function route(){
  var hs=location.hash.replace(/^#\/?/,"");
  var p=hs?hs.split("/"):[];
  if(p.length>=2){S.ws=p[1];}
  if(p[2]==="runs") return {page:"loop",id:p[3]};
  if(p[2]==="fleet") return {page:"fleet"};
  if(p[2]==="skills"){ if(p[3])S.tab.skills=p[3]; return {page:"skills"}; }
  return {page:"skills"};
}
function render(){
  var r=route();
  var page = r.page==="loop"?pRun() : r.page==="fleet"?pFleet() : pSkills();
  el("app").innerHTML='<div class="app">'+sidebar(r)+'<div class="main">'+topbar(r)+
    '<main class="page" id="pg">'+page+'</main></div></div>';
  el("layer").innerHTML=dialog();
  var vp=el("viewport");
  vp.className=S.phone?"phone":"";
  el("layer").className=S.phone?"phone":"";
  el("toast").className=S.phone?"phone":"";
  document.querySelectorAll("#chrome [data-st]").forEach(function(b){
    b.setAttribute("aria-pressed",b.getAttribute("data-st")===S.state?"true":"false");});
  el("cPhone").setAttribute("aria-pressed",S.phone?"true":"false");
}
function setTheme(v){
  if(v==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",v);
  S.theme=v;
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  setTheme(cur==="light"?"dark":cur==="dark"?"system":"light");
  render();
}
window.addEventListener("hashchange",function(){S.side=false;render();});
document.querySelectorAll("#chrome [data-st]").forEach(function(b){
  b.addEventListener("click",function(){S.state=b.getAttribute("data-st");render();});});
el("cPhone").addEventListener("click",function(){S.phone=!S.phone;render();});
el("cTheme").addEventListener("click",toggleTheme);
el("cIndex").addEventListener("click",function(){openDialog("cmd");});
el("cReset").addEventListener("click",function(){S.state="loaded";S.on=true;S.tab.skills="catalog";resetDemo();go("#/acme/core-platform/skills/catalog");});
document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openDialog("cmd");}
  if(e.key==="Escape"&&S.dlg)closeDialog();
});
if(!location.hash)location.hash="#/acme/core-platform/skills/catalog";
render();
